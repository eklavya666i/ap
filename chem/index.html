.","big":"The coefficients of a balanced equation are mole ratios. Grams can't go straight through an equation: convert to moles, use the ratio, then convert back.","keys":[["Mole ratio","\\f{\\text{mol wanted}}{\\text{mol given}}"],["The path","\\text{g A → mol A → mol B → g B}"]],"how":["Make sure the equation is balanced.","Convert the given grams to moles (÷ molar mass).","Multiply by the mole ratio: the wanted coefficient over the given coefficient.","Convert moles to grams of the wanted substance (× its molar mass)."],"ex":[{"t":"Mole-to-mole","q":"In $\\ce{2KClO3 -> 2KCl + 3O2}$, how many moles of $\\ce{O2}$ form from $4.71$ mol of $\\ce{KClO3}$?","s":[["4.71\\text{ mol}\\times\\f{3\\text{ mol O_2}}{2\\text{ mol KClO_3}}=7.06\\text{ mol}","Mole ratio from the coefficients."]],"a":"$7.06$ mol"},{"t":"Mass-to-mass","q":"In $\\ce{Cl2 + 2NaBr -> 2NaCl + Br2}$, what mass of $\\ce{NaCl}$ forms from $43.56$ g of $\\ce{Cl2}$? (Cl = 35.45, Na = 22.99)","s":[["\\f{43.56\\text{ g}}{70.90\\text{ g/mol}}=0.614\\text{ mol}","Grams to moles."],["0.614\\times\\f{2\\text{ mol NaCl}}{1\\text{ mol Cl_2}}=1.23\\text{ mol}","Mole ratio."],["1.23\\times58.44=71.8\\text{ g}","Moles to grams."]],"a":"$71.8$ g"}],"traps":["Coefficients are MOLE ratios, not gram ratios.","Put what you want on top of the mole ratio.","Don't stop at moles when the question asks for grams."],"alt":"Think of a recipe: 2 eggs for every 1 cup of flour. With 3 cups of flour you need 6 eggs; that is the mole ratio. But here the store sells everything by weight, so first convert grams to \"how many\" (moles), use the recipe ratio, then convert back to grams."},{"k":"limit","t":"Limiting reactant and percent yield","sh":"Limiting and excess reactants, percent yield","hook":"You can't play more holes than you have balls for. The reactant that runs out first limits how much product you can make.","big":"The limiting reactant is used up first and sets the theoretical yield. Percent yield compares what you actually collected with that maximum.","keys":[["Limiting reactant","\\text{the one that makes the least product}"],["Percent yield","\\f{\\text{actual}}{\\text{theoretical}}\\times100"],["Excess left","\\text{starting amount} - \\text{amount used}"]],"how":["Convert each reactant to moles.","Work out how much product each one could make (or divide each one's moles by its coefficient).","The smaller amount is the theoretical yield, and that reactant is limiting.","Percent yield = actual ÷ theoretical × 100."],"ex":[{"t":"Percent yield","q":"A reaction should produce $18.5$ g of product, but only $17.3$ g is collected. What is the percent yield?","s":[["\\f{17.3\\text{ g}}{18.5\\text{ g}}\\times100=93.5\\%",""]],"a":"$93.5$ %"},{"t":"Yield from a reaction","q":"In $\\ce{CH4 + 2O2 -> CO2 + 2H2O}$, $52.1$ g of $\\ce{CH4}$ reacts completely and $90.7$ g of $\\ce{CO2}$ is collected. What is the percent yield? (C = 12.01, H = 1.01, O = 16.00)","s":[["52.1\\div16.05\\times\\f{1\\text{ mol CO_2}}{1\\text{ mol CH_4}}\\times44.01=143\\text{ g}","Theoretical yield."],["\\f{90.7}{143}\\times100=63.5\\%","Percent yield."]],"a":"$63.5$ %"}],"traps":["Don't compare grams of reactants; compare moles adjusted by the coefficients.","The theoretical yield comes from the limiting reactant, not the one in excess.","Percent yield is actual ÷ theoretical, not the other way round."],"alt":"You head out with 14 clubs and 3 balls. The clubs aren't the problem: you will run out of balls first, so the balls are the limiting reactant. However the round goes, the number of balls decides how much golf you play; the extra clubs are in excess."},{"k":"pressure","t":"Pressure, temperature and kinetic theory","sh":"Pressure units, kelvin, gas particles","hook":"A golf ball flies farther on a hot day partly because warm air is thinner: its molecules move faster and spread out. Gases are all about particles in motion.","big":"Gas particles move fast and randomly. Pressure comes from their collisions with the walls, and temperature (in kelvin) measures their average kinetic energy.","keys":[["Pressure units","1\\text{ atm}=101.3\\text{ kPa}=760\\text{ mmHg}=14.7\\text{ psi}"],["Kelvin","K=°C+273"],["STP","0\\text{ °C (273 K) and 1 atm}"]],"how":["Convert pressures with 1 atm = 101.3 kPa = 760 mmHg = 14.7 psi.","Convert temperatures to kelvin by adding 273.","Kinetic-molecular theory: particles are tiny, far apart and always moving, with elastic collisions and no attractions.","Real gases behave most like ideal gases at high temperature and low pressure."],"ex":[{"t":"Pressure units","q":"Convert $176.6$ kPa to mmHg. (1 atm = 101.3 kPa = 760 mmHg = 14.7 psi)","s":[["176.6\\text{ kPa}\\times\\f{760\\text{ mmHg}}{101.3\\text{ kPa}}=1320\\text{ mmHg}",""]],"a":"$1320$ mmHg"},{"t":"Celsius and kelvin","q":"Convert $18$ °C to kelvin.","s":[["18+273=291\\text{ K}","Kelvin starts at absolute zero (−273 °C)."]],"a":"$291.1$ K"}],"traps":["Gas-law temperatures must be in kelvin.","Temperature measures the AVERAGE kinetic energy of the particles.","At the same temperature, lighter gases move faster."],"alt":"Picture a driving range inside a closed dome. The balls (gas particles) fly everywhere and bang into the walls: that is pressure. Turn up the heat and they fly faster, hitting the walls harder and more often. Absolute zero, 0 K, would be every ball lying still."},{"k":"gaslaw","t":"Boyle, Charles and the combined gas law","sh":"Boyle's, Charles's, Gay-Lussac's and combined","hook":"A golf ball squashes at impact and springs back. A gas's volume, pressure and temperature trade off in predictable ways.","big":"With the amount of gas fixed: pressure and volume are inversely related (Boyle), volume and kelvin temperature are directly related (Charles), and pressure and temperature are directly related (Gay-Lussac). The combined gas law handles all three.","keys":[["Boyle's law","P_1V_1=P_2V_2"],["Charles's law","\\f{V_1}{T_1}=\\f{V_2}{T_2}"],["Gay-Lussac's law","\\f{P_1}{T_1}=\\f{P_2}{T_2}"],["Combined","\\f{P_1V_1}{T_1}=\\f{P_2V_2}{T_2}"]],"how":["List what is given and what stays constant.","Convert every temperature to kelvin.","Choose the law, or use the combined law and cross out what is constant.","Solve, then check the direction makes sense (hotter gas at the same pressure should get bigger)."],"ex":[{"t":"Boyle's law","q":"A gas occupies $8.88$ L at $1.01$ atm. At constant temperature, what is its volume at $2.45$ atm?","s":[["V_2=\\f{P_1V_1}{P_2}=\\f{(1.01)(8.88)}{2.45}",""],["=3.66\\text{ L}","More pressure, smaller volume."]],"a":"$3.66$ L"},{"t":"Charles's law","q":"A balloon holds $9.43$ L of gas at $79$ °C. At constant pressure, what is its volume at $-34$ °C?","s":[["T_1=79+273=352\\text{ K},\\;T_2=-34+273=239\\text{ K}","Convert to kelvin."],["V_2=V_1\\f{T_2}{T_1}=9.43\\times\\f{239}{352}=6.40\\text{ L}",""]],"a":"$6.40$ L"}],"traps":["Using °C instead of K gives wrong, even negative, answers.","Boyle's law is inverse: double the pressure and the volume halves.","Charles's and Gay-Lussac's laws are direct: hotter means bigger or higher pressure."],"alt":"Squeeze a balloon (raise the pressure) and it shrinks: Boyle. Leave a balloon in a hot car and it swells: Charles. Leave a sealed can of tennis balls in the sun and the pressure inside climbs: Gay-Lussac. The combined law is all three at once. Just use kelvin, because 0 °C isn't zero energy."},{"k":"ideal","t":"The ideal gas law","sh":"PV = nRT, including molar mass","hook":"One formula, four dials. PV = nRT connects pressure, volume, moles and temperature for any gas.","big":"PV = nRT. With P in atm, V in liters, n in moles and T in kelvin, R = 0.0821 L·atm/(mol·K).","keys":[["Ideal gas law","PV=nRT"],["R","0.0821\\text{ L·atm/(mol·K)}"],["Molar mass","M=\\f{\\text{grams}}{n}"]],"how":["Convert to atm, liters, moles and kelvin.","Rearrange PV = nRT for the unknown.","Substitute and solve.","With grams, convert to moles first (n = grams ÷ molar mass), or find a molar mass from M = grams ÷ n."],"ex":[{"t":"PV = nRT","q":"A gas sample has $V=25.30$ L, $n=2.18$ mol, $T=92$ °C. What is its pressure? ($R=0.0821\\text{ L·atm/(mol·K)}$)","s":[["T=92+273=365\\text{ K}","Kelvin."],["P=\\f{(2.18)(0.0821)(365)}{25.30}=2.58\\text{ atm}",""]],"a":"$2.58$ atm"},{"t":"Ideal gas with grams","q":"What volume does $29.72$ g of $\\ce{Cl2}$ gas occupy at $1.02$ atm and $58$ °C? ($R=0.0821$ L·atm/(mol·K)) (Cl = 35.45)","s":[["\\f{29.72}{70.90}=0.419\\text{ mol}","Moles."],["V=\\f{(0.419)(0.0821)(331)}{1.02}=11.2\\text{ L}",""]],"a":"$11.2$ L"}],"traps":["Use kelvin, never °C.","Match R to the units: 0.0821 goes with atm and liters.","n is moles, not grams."],"alt":"Think of PV = nRT as a balanced scorecard: pressure × volume on one side must equal moles × R × temperature on the other. Change any one number and something else has to give. R is just the conversion number that makes the units line up."},{"k":"dalton","t":"Partial pressures and gas stoichiometry","sh":"Dalton's law and gas stoichiometry at STP","hook":"A foursome's team total is just the four scores added up. Gas mixtures work the same way: the partial pressures add up to the total.","big":"Each gas in a mixture contributes its own partial pressure, and they add up to the total (Dalton's law). At STP, one mole of any gas takes up 22.4 L.","keys":[["Dalton's law","P_{\\text{total}}=P_1+P_2+P_3"],["Mole fraction","P_A=X_A\\,P_{\\text{total}}"],["Over water","P_{\\text{gas}}=P_{\\text{total}}-P_{\\text{water}}"],["At STP","1\\text{ mol}=22.4\\text{ L}"]],"how":["Add the partial pressures for the total, or subtract to find a missing one.","For gas collected over water, subtract the water's vapor pressure.","Partial pressure = mole fraction × total pressure.","Gas stoichiometry at STP: grams → moles → mole ratio → moles × 22.4 L."],"ex":[{"t":"Dalton's law","q":"A container holds $\\ce{N2}$ at $288$ mmHg, $\\ce{H2}$ at $311$ mmHg, $\\ce{CO2}$ at $291$ mmHg. What is the total pressure?","s":[["288+311+291=890\\text{ mmHg}",""]],"a":"$890$ mmHg"},{"t":"Gas collected over water","q":"$\\ce{H2}$ gas is collected over water at $22$ °C. The total pressure is $744$ mmHg, and the vapor pressure of water at that temperature is $19.8$ mmHg. What is the pressure of the dry $\\ce{H2}$?","s":[["744-19.8=724.2\\text{ mmHg}","Remove the water vapor."]],"a":"$724.2$ mmHg"}],"traps":["Over water, SUBTRACT the vapor pressure; don't add it.","The mole fraction is moles of A ÷ TOTAL moles.","22.4 L per mole only holds at STP."],"alt":"Picture each gas as a golfer adding strokes to the team total. Nitrogen supplies most of air's pressure because most of the \"players\" are nitrogen. If water vapor sneaks into your collection tube, it adds strokes you didn't make: subtract it to get the dry gas's score."},{"k":"solub","t":"Solutions and solubility","sh":"Like dissolves like, saturation, solubility curves","hook":"Sports-drink powder disappears into water; sunscreen doesn't. Whether something dissolves comes down to \"like dissolves like\".","big":"A solution is a solute dissolved in a solvent. Polar and ionic substances dissolve in polar solvents like water; nonpolar substances dissolve in nonpolar ones. Solubility depends on temperature, and on pressure for gases.","keys":[["Like dissolves like","\\text{polar or ionic in water; nonpolar in nonpolar}"],["Saturation","\\text{unsaturated, saturated, supersaturated}"],["Gases","\\text{more soluble cold and under pressure}"]],"how":["Identify the solute (what is dissolved) and the solvent (what does the dissolving).","Compare polarity: like dissolves like.","Compare the amount dissolved with the solubility to judge saturation.","To find what crystallizes on cooling, subtract the two solubilities and scale for the mass of water."],"ex":[{"t":"Crystals from cooling","q":"The solubility of $\\ce{KNO3}$ is 64 g per 100 g of water at 40 °C and 32 g per 100 g at 20 °C. A saturated solution made with 200 g of water at 40 °C is cooled to 20 °C. What mass of $\\ce{KNO3}$ crystallizes?","s":[["","At 40 °C: 64 × 200/100 = 128 g dissolved."],["","At 20 °C only 64 g can stay dissolved."],["128-64=64\\text{ g}","That much crystallizes."]],"a":"$64$ g"},{"t":"Saturated or not","q":"At 40 °C, the solubility of $\\ce{NaCl}$ is 37 g per 100 g of water. A clear solution at 40 °C contains 51 g of $\\ce{NaCl}$ dissolved in 100 g of water, with no crystals. How would you describe it?","s":[["","Dissolved: 51 g; maximum: 37 g."],["","It holds more than the 37 g that should dissolve: an unstable solution that crystallizes if disturbed."]],"a":"Supersaturated","c":["Saturated","Supersaturated","Unsaturated"]}],"traps":["Stirring and crushing speed up dissolving but don't change how much can dissolve.","Gases are LESS soluble in warm water.","Solubility tables are per 100 g of water: scale for other amounts."],"alt":"Think of the solvent as a gallery of fans. Polar water molecules love talking to charged or polar visitors (salt, sugar), so those mix right in. Oil is the quiet visitor who won't join the conversation, so it stays apart. Saturated means the gallery is full: every extra fan gets turned away."},{"k":"molarity","t":"Molarity","sh":"Moles per liter of solution","hook":"A sports-drink label tells you how much electrolyte is in each bottle. Molarity tells you how many moles are in each liter.","big":"Molarity (M) = moles of solute ÷ liters of solution.","keys":[["Molarity","M=\\f{\\text{mol solute}}{\\text{L solution}}"],["Moles","n=M\\times V"],["Ion concentration","0.2\\text{ M }\\ce{CaCl2}\\text{ gives }0.4\\text{ M }\\ce{Cl^-}"]],"how":["Convert grams of solute to moles.","Convert mL to L (÷ 1000).","M = moles ÷ liters; rearrange to n = M × V or V = n ÷ M.","For one ion's concentration, multiply by how many of that ion are in each formula unit."],"ex":[{"t":"Molarity from grams","q":"$34.90$ g of $\\ce{CaCl2}$ is dissolved to make $300$ mL of solution. What is the molarity? (Ca = 40.08, Cl = 35.45)","s":[["\\f{34.90}{110.98}=0.314\\text{ mol}","Moles of solute."],["300\\text{ mL}=0.3\\text{ L}",""],["M=\\f{0.314}{0.3}=1.05\\text{ M}",""]],"a":"$1.05$ M"},{"t":"Grams for a solution","q":"What mass of $\\ce{MgSO4}$ is needed to make $500$ mL of a $0.82$ M solution? (Mg = 24.31, S = 32.06, O = 16.00)","s":[["0.82\\times0.5=0.410\\text{ mol}","Moles of solute."],["0.410\\times120.37=49.4\\text{ g}","Grams."]],"a":"$49.4$ g"}],"traps":["The volume must be in liters.","Moles, not grams, go on top.","Count the ions per formula: 0.2 M CaCl₂ is 0.4 M in Cl⁻."],"alt":"Molarity is like balls per bucket. A 2 M solution has 2 moles of solute in every liter, the way a large bucket always holds the same number of balls. Twice the volume holds twice the moles, but the concentration stays the same."},{"k":"dilute","t":"Dilution","sh":"M₁V₁ = M₂V₂","hook":"Mixing sports-drink powder into more water spreads the same powder through a bigger bottle. Diluting never changes the moles of solute.","big":"Adding water doesn't change the moles of solute, so M₁V₁ = M₂V₂.","keys":[["Dilution","M_1V_1=M_2V_2"],["Water to add","V_2-V_1"]],"how":["Label the concentrated solution 1 and the diluted solution 2.","Fill in the three known values.","Solve for the unknown, with both volumes in the same unit.","Water to add = final volume − starting volume."],"ex":[{"t":"Dilution","q":"To what final volume (in mL) must $31.9$ mL of $2.29$ M $\\ce{HCl}$ be diluted to make it $1.31$ M?","s":[["V_2=\\f{(2.29)(31.9)}{1.31}=55.8\\text{ mL}",""]],"a":"$55.8$ mL"},{"t":"How much water to add","q":"You have $28.1$ mL of $4.45$ M HCl. How much water must you ADD to make the solution $0.979$ M?","s":[["V_2=\\f{(4.45)(28.1)}{0.979}=128\\text{ mL}","Final volume."],["128-28.1=99.6\\text{ mL}","Water to add."]],"a":"$99.6$ mL"}],"traps":["The concentrated stock needs a SMALLER volume than the final solution.","Diluting always lowers the molarity.","V₂ is the total final volume, not the water added."],"alt":"Pour a bucket of 50 balls into a bigger bucket and you still have 50 balls (the same moles), just spread through more room (a lower concentration). M₁V₁ = M₂V₂ simply says \"balls before = balls after\"."},{"k":"collig","t":"Concentration units and colligative properties","sh":"Percent, molality, freezing and boiling points","hook":"Ground crews salt icy paths because salt makes ice melt below 0 °C. Dissolved particles change freezing and boiling points.","big":"Colligative properties depend on the number of dissolved particles, not on what they are. ΔT = i·K·m, where m is molality and i is the number of particles per formula unit.","keys":[["Percent by mass","\\f{\\text{mass solute}}{\\text{mass solution}}\\times100"],["Molality","m=\\f{\\text{mol solute}}{\\text{kg solvent}}"],["Temperature change","\\Delta T=i\\,K\\,m"],["For water","K_f=1.86,\\;K_b=0.512\\text{ °C/m}"]],"how":["Percent by mass: divide by the whole solution (solute + solvent).","Molality: moles of solute ÷ kilograms of solvent.","Find i: 1 for molecules like sugar, 2 for NaCl, 3 for CaCl₂.","ΔT = i K m. Subtract it from 0 °C for the freezing point; add it to 100 °C for the boiling point."],"ex":[{"t":"Percent by mass","q":"A solution is made by dissolving $8.19$ g of $\\ce{NaOH}$ in $55.9$ g of water. What is the percent by mass of the solute?","s":[["8.19+55.9=64.09\\text{ g}","Mass of solution."],["\\f{8.19}{64.09}\\times100=12.8\\%",""]],"a":"$12.8$ %"},{"t":"Molality","q":"$24.20$ g of $\\ce{C6H12O6}$ is dissolved in $500$ g of water. What is the molality? (C = 12.01, H = 1.01, O = 16.00)","s":[["\\f{24.20}{180.18}=0.134\\text{ mol}","Moles."],["m=\\f{0.134}{0.5}=0.269\\text{ m}",""]],"a":"$0.269$ m"}],"traps":["Molality uses kilograms of SOLVENT, not liters of solution.","Ionic solutes split apart: don't forget i.","Solutes LOWER freezing points and RAISE boiling points."],"alt":"Think of dissolved particles as people blocking the path. Water molecules trying to lock into ice keep bumping into them, so it has to get colder before ice can form. What matters is how many blockers there are, not who they are, and salt brings two per formula unit."},{"k":"acidbase","t":"Acids, bases and conjugate pairs","sh":"Definitions, conjugate pairs, strength","hook":"In an alternate-shot match, one player hits and hands off to the partner. In a Brønsted–Lowry reaction, an acid hands an H⁺ to a base.","big":"Arrhenius: acids make H⁺ in water, bases make OH⁻. Brønsted–Lowry: acids donate H⁺, bases accept it. Conjugate pairs differ by one H⁺. Strong acids and bases break apart completely in water.","keys":[["Brønsted–Lowry acid","\\text{donates H⁺}"],["Brønsted–Lowry base","\\text{accepts H⁺}"],["Conjugate pairs","\\ce{HCl}/\\ce{Cl^-},\\;\\ce{NH4^+}/\\ce{NH3}"],["Strong acids","\\text{HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄}"]],"how":["Find the H⁺ that moves: the giver is the acid; the receiver is the base.","Conjugate base = the acid minus one H⁺ (its charge drops by 1).","Conjugate acid = the base plus one H⁺ (its charge rises by 1).","Strong acids and bases ionize completely; all the others are weak."],"ex":[{"t":"Conjugate acids and bases","q":"What is the conjugate acid of $\\ce{HCO3^-}$?","s":[["","A conjugate acid is the base with ONE H⁺ added: one more H, and the charge rises by 1."],["","\\ce{HCO3^-} + H⁺ → \\ce{H2CO3}."]],"a":"$\\ce{H2CO3}$","c":["$\\ce{H2CO3}$","$\\ce{CO3^2-}$","$\\ce{H2CO3^-}$"]},{"t":"Brønsted–Lowry roles","q":"In $\\ce{CO3^2- + H2O -> HCO3^- + OH^-}$, which species is the Brønsted–Lowry base?","s":[["","\\ce{H2O} gives H⁺ to \\ce{CO3^2-}."],["","The base is \\ce{CO3^2-}."]],"a":"$\\ce{CO3^2-}$","c":["$\\ce{OH^-}$","$\\ce{H2O}$","$\\ce{CO3^2-}$","$\\ce{HCO3^-}$"]}],"traps":["A conjugate pair differs by exactly ONE H⁺.","Water can act as an acid or as a base: it is amphoteric.","Weak doesn't mean dilute; it means only partly ionized."],"alt":"Picture handing over the flag stick. The acid holds the H⁺ (the flag) and passes it to the base. After the hand-off, the base is holding it, so it has become the conjugate acid, and the old acid, now empty-handed, is the conjugate base, ready to take it back."},{"k":"ph","t":"pH and pOH","sh":"[H⁺], [OH⁻] and the log scale","hook":"Golf scores and pH both run backward: a lower pH means MORE acidic, the way a lower score means better golf.","big":"pH = −log[H⁺], pOH = −log[OH⁻], and pH + pOH = 14 at 25 °C. Below 7 is acidic, 7 is neutral, above 7 is basic. Each pH unit is a tenfold change.","keys":[["pH","\\text{pH}=-\\log[\\text{H}^+]"],["[H⁺] from pH","[\\text{H}^+]=10^{-\\text{pH}}"],["pH and pOH","\\text{pH}+\\text{pOH}=14"],["Strong bases","[\\text{OH}^-]=M\\times(\\text{OH}^-\\text{ per formula})"]],"how":["From [H⁺]: pH = −log[H⁺].","From pH: [H⁺] = 10 to the power −pH.","From [OH⁻]: find pOH = −log[OH⁻], then pH = 14 − pOH.","Strong acids give [H⁺] equal to their concentration; strong bases give [OH⁻] (twice it for Ca(OH)₂)."],"ex":[{"t":"pH from [H⁺]","q":"What is the pH of a solution with $[\\text{H}^+]=7.0\\times10^{-7}$ M?","s":[["\\text{pH}=-\\log(7.0\\times10^{-7})=6.15","Below 7: acidic."]],"a":"$6.155$"},{"t":"[H⁺] from pH","q":"A solution has a pH of $8.12$. What is $[\\text{H}^+]$?","s":[["[\\text{H}^+]=10^{-8.12}=7.6\\times10^{-9}\\text{ M}",""]],"a":"$7.6\\times10^{-9}$ M"}],"traps":["Use log base 10, not ln.","For a base, find pOH first, then subtract from 14.","pH 3 is ten times more acidic than pH 4."],"alt":"The pH scale is like a handicap for acidity: lower means stronger. Each step down by one is ten times more acidic, the way a few strokes of handicap mark a very different player. Pure water sits at 7: neutral, like scratch."},{"k":"titrate","t":"Neutralization and titration","sh":"Neutralization and the equivalence point","hook":"A match is all square when both sides have won the same number of holes. A titration is complete when the moles of H⁺ equal the moles of OH⁻.","big":"Acid + base → salt + water. At the equivalence point, moles of H⁺ from the acid equal moles of OH⁻ from the base: (H⁺ per acid) MₐVₐ = (OH⁻ per base) M_bV_b.","keys":[["Neutralization","\\ce{HCl + NaOH -> NaCl + H2O}"],["1 : 1 acids and bases","M_aV_a=M_bV_b"],["H₂SO₄ with NaOH","2M_aV_a=M_bV_b"]],"how":["Write the neutralization: H⁺ + OH⁻ → H₂O, and the leftover ions make the salt.","Count the H⁺ per acid formula and the OH⁻ per base formula.","Set moles of H⁺ equal to moles of OH⁻.","Solve for the unknown concentration or volume."],"ex":[{"t":"Titration","q":"$27.0$ mL of $\\ce{HCl}$ is neutralized by $39.8$ mL of $0.61$ M $\\ce{Ca(OH)2}$. What is the molarity of the $\\ce{HCl}$?","s":[["2(0.61)(39.8)=48.56\\text{ mmol OH⁻}","Moles of OH⁻ added (mL × M = mmol)."],["M_a=\\f{48.56}{27.0}=1.80\\text{ M}","Equal moles of H⁺."]],"a":"$1.80$ M"},{"t":"Products of neutralization","q":"What are the products of $\\ce{HCl + Ca(OH)2}$?","s":[["","H⁺ + OH⁻ → H₂O."],["","\\ce{Ca^2+} + \\ce{Cl^-} → \\ce{CaCl2}."]],"a":"$\\ce{CaCl2 + H2O}$","c":["$\\ce{CaCl + H2O}$","$\\ce{CaCl2 + H2}$","$\\ce{CaCl2 + H2O}$","$\\ce{H2O}$ only"]}],"traps":["H₂SO₄ gives 2 H⁺ and Ca(OH)₂ gives 2 OH⁻: include them.","The products are a salt and WATER, not hydrogen gas.","Volumes can stay in mL as long as both sides use mL."],"alt":"Think of the titration as squaring a match: every H⁺ the acid puts up must be matched by an OH⁻ from the base. When the match is all square (equal moles), the indicator changes color. A diprotic acid like H₂SO₄ wins two holes per shot, so it needs twice the base."},{"k":"heat","t":"Specific heat and calorimetry","sh":"q = mcΔT and calorimetry","hook":"A metal club head gets hot fast in the sun, but a water bottle stays cool much longer. Water has a huge specific heat.","big":"q = mcΔT: heat equals mass × specific heat × temperature change. In a calorimeter, the heat lost by the hot object equals the heat gained by the cold one.","keys":[["Heat","q=mc\\Delta T"],["Water","c=4.18\\text{ J/(g·°C)}"],["Calorimetry","q_{\\text{lost}}=q_{\\text{gained}}"]],"how":["Find ΔT = final − initial.","Multiply m × c × ΔT to get joules (÷ 1000 for kJ).","Rearrange to find c, m or ΔT; final temperature = start + ΔT.","Calorimetry: m_m c_m (T_m − T_f) = m_w c_w (T_f − T_w)."],"ex":[{"t":"q = mcΔT","q":"How much heat (in joules) is needed to raise the temperature of $127.1$ g of iron from $16$ °C to $64$ °C? ($c=0.449$ J/(g·°C))","s":[["q=(127.1)(0.449)(48)",""],["=2740\\text{ J}","= 2.74 kJ"]],"a":"$2740$ J"},{"t":"Solve for c, m or ΔT","q":"How many grams of copper absorb $542$ J when warmed by $23$ °C? ($c=0.385$ J/(g·°C))","s":[["m=\\f{542}{(0.385)(23)}=61.2\\text{ g}",""]],"a":"$61.2$ g"}],"traps":["Use the temperature CHANGE, not the final temperature.","Endothermic processes absorb heat (the surroundings feel cold); exothermic ones release it.","1 kJ = 1000 J."],"alt":"Specific heat is like a player's temperament. Water is the calm veteran: pour in a lot of energy and its temperature barely moves. Metals are hotheads: a little energy and their temperature jumps. In a calorimeter, the hot metal loses exactly as much energy as the water gains."},{"k":"enthalpy","t":"Enthalpy and phase changes","sh":"ΔH, heating curves, q = mΔH","hook":"On a heating curve, the flat stretches are like waiting on the tee: energy keeps going in, but the temperature doesn't move.","big":"ΔH is the heat of a reaction as written; a negative ΔH means heat is released. During a phase change the temperature stays constant: q = mΔH_fus for melting or mΔH_vap for boiling.","keys":[["Thermochemistry","\\Delta H\\text{ goes with the coefficients as written}"],["Phase change","q=m\\Delta H"],["Water","\\Delta H_{\\text{fus}}=334\\text{ J/g},\\;\\Delta H_{\\text{vap}}=2260\\text{ J/g}"]],"how":["Reaction heat: grams → moles, then × ΔH ÷ that substance's coefficient.","Melting or freezing: q = m × ΔH_fus. Boiling or condensing: q = m × ΔH_vap.","Sloped parts of a heating curve use q = mcΔT; flat parts use q = mΔH.","For a multi-step change, add the heat for each segment."],"ex":[{"t":"Thermochemical equations","q":"$\\ce{C3H8 + 5O2 -> 3CO2 + 4H2O}$, $\\Delta H=-2220$ kJ. How much heat is released when $52.18$ g of $\\ce{O2}$ reacts? (O = 16.00)","s":[["\\f{52.18}{32.00}=1.63\\text{ mol}","Moles."],["1.63\\times\\f{2220\\text{ kJ}}{5\\text{ mol}}=724\\text{ kJ}","Negative ΔH: heat is released."]],"a":"$724$ kJ"},{"t":"Ice to warm water","q":"How much heat (in joules) turns $30.8$ g of ice at $-9$ °C into liquid water at $28$ °C? ($c_{\\text{ice}}=2.09$, $c_{\\text{water}}=4.18$ J/(g·°C); $\\Delta H_{\\text{fus}}=334$ J/g)","s":[["q_1=(30.8)(2.09)(9)=579\\text{ J}","Ice warms to 0 °C."],["q_2=(30.8)(334)=10300\\text{ J}","Ice melts."],["q_3=(30.8)(4.18)(28)=3.60\\times10^{3}\\text{ J}","Water warms."],["q=14500\\text{ J}","Add them."]],"a":"$14500$ J"}],"traps":["ΔH matches the coefficients: −572 kJ is for 2 mol of H₂.","Melting uses ΔH_fus; boiling uses ΔH_vap.","Don't skip the melting step when warming ice into water."],"alt":"Picture a heating curve as a round with waits. On the sloped holes, the temperature climbs as you add heat. On the flat stretches you are waiting on the tee: energy still goes in, but it breaks the attractions between particles (melting or boiling) instead of raising the temperature."},{"k":"nuclear","t":"Nuclear chemistry","sh":"Decay, nuclear equations, half-life","hook":"If half your range balls vanished into the trees every week, after four weeks you would have one-sixteenth left. That is half-life.","big":"Unstable nuclei decay by giving off alpha particles (⁴₂He), beta particles (⁰₋₁e), positrons (⁰₊₁e) or gamma rays. Mass numbers and atomic numbers balance in nuclear equations. A half-life is the time for half a sample to decay.","keys":[["Alpha decay","\\text{A − 4, Z − 2}"],["Beta decay","\\text{A same, Z + 1}"],["Half-life","\\text{left}=\\text{start}\\times\\left(\\f{1}{2}\\right)^{n}"],["Penetration","\\text{alpha < beta < gamma}"]],"how":["Balance mass numbers (top) and atomic numbers (bottom) on both sides.","Use the new atomic number to name the new element.","Half-life: n = time ÷ half-life, and remaining = start ÷ 2ⁿ.","Fission splits heavy nuclei (nuclear power plants); fusion joins light nuclei (the Sun)."],"ex":[{"t":"Half-life","q":"A $120.0$ g sample of cobalt-60 decays to $15$ g. Its half-life is $5.27$ years. How much time has passed?","s":[["","120.0 → 60 → 30 → 15 g: 3 half-lives."],["3\\times5.27=15.81\\text{ years}",""]],"a":"$15.81$ years"},{"t":"Complete a nuclear equation","q":"Complete the nuclear equation: $\\ce{^{15}_{8}O -> ^{0}_{1}e + ?}$. Give the mass number, atomic number and symbol of the missing nucleus.","s":[["A=15-0=15","Mass numbers balance."],["Z=8-(1)=7","Atomic numbers balance."],["\\ce{^{15}_{7}N}","Element 7 is nitrogen."]],"a":"Mass number: 15 · Atomic number: 7 · Element symbol: \\ce{N}"}],"traps":["Half-lives halve repeatedly: after 3 half-lives, 1/8 is left, not 1/6.","Beta decay RAISES the atomic number by 1.","Gamma rays don't change the mass number or atomic number."],"alt":"Imagine a bucket of 80 balls where half go missing every week. After one week, 40; two weeks, 20; three, 10. You never reach zero in a straight line; you keep halving. Each nucleus decays at random, like any one ball, but the whole bucket follows the halving pattern."}],"qs":[{"id":"b001","s":"matter","d":1,"q":"Which can be separated by physical means, such as filtering or evaporating?","c":["A mixture","An element","A compound","Any pure substance"],"w":["An element is one kind of atom; it can't be broken down at all.","A compound can only be broken apart by a chemical change.","Pure substances can't be separated physically."],"h":"Mixtures keep their parts' identities.","x":[["","The parts of a mixture keep their own properties, so physical methods can separate them."]]},{"id":"b002","s":"matter","d":2,"q":"A student heats a white powder. It turns black and gives off a gas. What does this show?","c":["A chemical change: new substances formed","A physical change: the powder melted","A physical change: the powder dissolved","No change: the powder only got hot"],"w":["Melting doesn't change color to black or release a new gas.","Nothing was dissolved.","A color change and a new gas are evidence of new substances."],"h":"Look for evidence of new substances.","x":[["","A color change plus a gas being produced are signs of a chemical change."]]},{"id":"b003","s":"sigfig","d":1,"q":"Three measurements of a 5.00 g mass read 4.12 g, 4.11 g and 4.13 g. They are…","c":["Precise but not accurate","Accurate but not precise","Both accurate and precise","Neither accurate nor precise"],"w":["They are far from the true 5.00 g, so they aren't accurate.","They are close to the true value only if they average near 5.00 g; they don't.","They agree with each other but miss the true value."],"h":"Precision: close to each other. Accuracy: close to the true value.","x":[["","The readings agree closely (precise) but are all about 0.9 g off (not accurate)."]]},{"id":"b004","s":"sigfig","d":2,"q":"Why does 0.0050 have two significant figures?","c":["The leading zeros only place the decimal point; the trailing zero after the decimal is measured","All zeros are significant","Only nonzero digits are significant","Zeros after a decimal point never count"],"w":["Leading zeros never count.","The trailing zero after the decimal point does count.","Trailing zeros after a decimal point do count: they show precision."],"h":"Separate the leading zeros from the trailing zero.","x":[["","The \"5\" and the final \"0\" are significant; the zeros in front are placeholders."]]},{"id":"b005","s":"convert","d":1,"q":"Which is the largest length?","c":["1 km","1000 cm","1000 mm","100 m"],"w":["1000 cm is 10 m.","1000 mm is 1 m.","100 m is a tenth of a kilometer."],"h":"Convert each to meters.","x":[["","1 km = 1000 m, larger than 100 m, 10 m or 1 m."]]},{"id":"b006","s":"convert","d":2,"q":"Why can a conversion factor such as 1000 m / 1 km be multiplied without changing the length?","c":["It equals 1, because the top and bottom are the same length","It makes the number bigger","It only changes the significant figures","It changes kilometers into a different quantity"],"w":["It makes the NUMBER bigger, but the length is unchanged.","Exact conversion factors don't affect significant figures.","It changes only the unit, not the quantity being measured."],"h":"What is 1000 m divided by 1 km?","x":[["","1000 m and 1 km are the same distance, so their ratio is exactly 1."]]},{"id":"b007","s":"density","d":1,"q":"An object floats in water (density 1.00 g/mL). What do you know about its density?","c":["It is less than 1.00 g/mL","It is more than 1.00 g/mL","It is exactly 1.00 g/mL","Floating says nothing about density"],"w":["A denser object would sink.","Equal density would make it hover, neither rising nor sinking.","Floating or sinking is decided by density."],"h":"Compare the object with the liquid.","x":[["","Less dense objects float on denser liquids."]]},{"id":"b008","s":"density","d":2,"q":"A block of wood is cut in half. What happens to the density of each half?","c":["It stays the same","It is halved","It doubles","It depends on which way you cut it"],"w":["Both mass and volume are halved, so their ratio is unchanged.","Density doesn't depend on amount.","Density is an intensive property."],"h":"What happens to mass and volume?","x":[["","Mass and volume both halve, so D = m/V is unchanged: density is intensive."]]},{"id":"b009","s":"models","d":2,"q":"Why did Rutherford conclude that the nucleus is positive?","c":["Positive alpha particles were strongly repelled and bounced back","Electrons were attracted to the foil","Most alpha particles went straight through","The foil glowed when it was hit"],"w":["The experiment tracked alpha particles, not electrons.","That showed the atom is mostly empty space, not that the nucleus is positive.","The glow on the detector screen just recorded where the particles landed."],"h":"Like charges repel.","x":[["","Only a concentrated positive charge could repel positive alpha particles so strongly."]]},{"id":"b010","s":"models","d":1,"q":"What did J.J. Thomson's cathode-ray experiments show?","c":["Atoms contain small negative particles (electrons)","Atoms have a dense nucleus","Electrons orbit in fixed energy levels","Neutrons exist in the nucleus"],"w":["The nucleus came from Rutherford's gold-foil experiment.","Energy levels were Bohr's idea.","Neutrons were found by Chadwick in 1932."],"h":"Cathode rays bent toward a positive plate.","x":[["","Cathode rays were deflected by charged plates, showing negative particles inside atoms."]]},{"id":"b011","s":"isotope","d":1,"q":"Carbon-12 and carbon-14 have different numbers of…","c":["Neutrons","Protons","Electrons in the neutral atom","Valence electrons"],"w":["Same element, same protons (6).","Neutral isotopes have the same electrons.","Valence electrons are the same for isotopes of an element."],"h":"The number is the mass number.","x":[["","Both have 6 protons; carbon-14 has 8 neutrons and carbon-12 has 6."]]},{"id":"b012","s":"isotope","d":2,"q":"Which change turns a neutral atom into a different element?","c":["Adding a proton","Adding a neutron","Removing an electron","Adding an electron"],"w":["That makes an isotope of the same element.","That makes a positive ion of the same element.","That makes a negative ion of the same element."],"h":"What sets an element's identity?","x":[["","The number of protons (the atomic number) identifies the element."]]},{"id":"b013","s":"avgmass","d":1,"q":"Copper is 69% copper-63 and 31% copper-65. Its average atomic mass is closest to…","c":["63.5","64.0","65.0","63.0"],"w":["64.0 would mean equal amounts of each isotope.","That is the less common isotope.","Some copper-65 pulls the average above 63."],"h":"The average is pulled toward the more common isotope.","x":[["","0.69(63) + 0.31(65) ≈ 63.6, close to 63.5."]]},{"id":"b014","s":"avgmass","d":2,"q":"Why aren't the atomic masses on the periodic table whole numbers?","c":["They are weighted averages of the masses of an element's isotopes","Scientists measure them inaccurately","Electrons add fractional amounts of mass","Protons and neutrons have different charges"],"w":["They are measured very precisely.","Electrons barely affect the mass.","Charge doesn't set mass."],"h":"Think about isotopes.","x":[["","Each element is a mix of isotopes, so its average mass falls between whole numbers."]]},{"id":"b015","s":"light","d":1,"q":"Why does each element give a unique line spectrum?","c":["Its electrons can only jump between its own set of energy levels","Each element has a different color of nucleus","Its atoms vibrate at different speeds","Each element absorbs all colors equally"],"w":["A nucleus doesn't have a color.","Line spectra come from electron transitions, not vibration.","Then there would be no distinct lines."],"h":"Think about electrons falling between levels.","x":[["","Each element's energy levels are different, so the photons emitted (the lines) are different."]]},{"id":"b016","s":"light","d":2,"q":"When an electron falls from a higher to a lower energy level, the atom…","c":["Emits a photon of light","Absorbs a photon of light","Loses a proton","Becomes an ion"],"w":["Absorbing light moves an electron UP.","Electron transitions don't change the nucleus.","The electron stays in the atom."],"h":"Energy has to go somewhere.","x":[["","The energy difference is released as a photon."]]},{"id":"b017","s":"config","d":1,"q":"Hund's rule says that electrons in the same sublevel…","c":["Fill each orbital singly before pairing up","Always pair up first","Must have the same spin in one orbital","Fill the 4s sublevel last"],"w":["They spread out before pairing.","Two electrons in one orbital have opposite spins (Pauli).","4s fills before 3d."],"h":"Think of seats on a bus.","x":[["","Like passengers taking empty seats first, electrons occupy empty d Cu²⁺)","There are two chlorine atoms","Copper is a nonmetal","All compounds need Roman numerals"],"w":["The numeral shows the metal's charge, not the number of chlorines.","Copper is a metal.","Metals with one possible charge (Na, Ca) don't get one."],"h":"What is the numeral for?","x":[["","The Roman numeral tells which copper ion is present: here Cu²⁺."]]},{"id":"b032","s":"nameion","d":2,"q":"What is the name of NH₄NO₃?","c":["Ammonium nitrate","Nitrogen hydrogen nitrate","Ammonium nitride","Ammonia nitrate"],"w":["NH₄⁺ is the ammonium ion.","NO₃⁻ is nitrate; nitride is N³⁻.","Ammonia is NH₃; the ion is ammonium."],"h":"Both parts are polyatomic ions.","x":[["","NH₄⁺ is ammonium and NO₃⁻ is nitrate."]]},{"id":"b033","s":"namecov","d":1,"q":"Why do molecular compounds use prefixes like di- and tri-?","c":["Nonmetals can combine in several ratios, so the name must state the numbers","Molecular compounds contain ions","Prefixes show the charges","Prefixes show the state of matter"],"w":["Molecular compounds don't contain ions.","Molecules have no ion charges to show.","States are shown with (s), (l), (g), (aq)."],"h":"Think of CO and CO₂.","x":[["","CO and CO₂ are different compounds, so the name must say how many oxygens."]]},{"id":"b034","s":"namecov","d":2,"q":"Which is the correct name for H₂SO₄(aq)?","c":["Sulfuric acid","Hydrosulfuric acid","Sulfurous acid","Hydrogen sulfide"],"w":["Hydro- is only for acids without oxygen.","Sulfurous acid is H₂SO₃ (from sulfite).","Hydrogen sulfide is H₂S."],"h":"Sulfate becomes…?","x":[["","The anion is sulfate (-ate), so the acid is sulfuric (-ic)."]]},{"id":"b035","s":"balance","d":1,"q":"Why must chemical equations be balanced?","c":["Atoms are neither created nor destroyed in a reaction","Reactants and products must have the same number of molecules","Coefficients must all be equal","The masses of individual substances stay the same"],"w":["The number of molecules can change.","Coefficients are often different.","Individual substances change; only the total mass is conserved."],"h":"Law of conservation of mass.","x":[["","Every atom present at the start must still be there at the end."]]},{"id":"b036","s":"balance","d":2,"q":"A student balances H₂ + O₂ → H₂O by changing it to H₂ + O₂ → H₂O₂. What went wrong?","c":["They changed a subscript, which made a different substance","They used too many coefficients","Nothing: it is balanced","They should have changed O₂ to O"],"w":["They used no coefficients at all.","H₂O₂ is hydrogen peroxide, not water.","Oxygen gas is O₂; changing it changes the substance."],"h":"What do subscripts mean?","x":[["","Only coefficients may change; the correct balance is 2H₂ + O₂ → 2H₂O."]]},{"id":"b037","s":"rxtype","d":1,"q":"Which is evidence of a chemical reaction?","c":["Bubbles of gas form when two liquids mix","Ice melts on the counter","Sugar dissolves in water","A glass breaks"],"w":["Melting is a physical change.","Dissolving is a physical change.","Breaking is a physical change."],"h":"Look for a new substance.","x":[["","Unexpected gas formation is a sign that a new substance formed."]]},{"id":"b038","s":"rxtype","d":2,"q":"Will Cu react with ZnCl₂ solution? Zinc is more active than copper.","c":["No, copper can't replace the more active zinc","Yes, copper replaces zinc","Yes, they combine into one compound","Yes, but only if heated"],"w":["Only a more active metal can replace another.","Single replacement doesn't combine everything.","Heating doesn't change the activity order."],"h":"Activity series.","x":[["","A metal replaces only metals below it on the activity series; copper is below zinc."]]},{"id":"b039","s":"molar","d":1,"q":"Which contains more atoms: 1 mol of helium or 1 mol of neon?","c":["They contain the same number","Helium","Neon","It depends on the temperature"],"w":["One mole is always 6.02 × 10²³ particles.","One mole is always the same count.","The count doesn't depend on conditions."],"h":"A mole is a count.","x":[["","One mole of anything is 6.02 × 10²³ particles."]]},{"id":"b040","s":"molar","d":2,"q":"Which has the greater mass: 1 mol of CO₂ or 1 mol of H₂O?","c":["1 mol of CO₂ (44 g)","1 mol of H₂O (18 g)","They have the same mass","It can't be determined"],"w":["Water's molar mass is smaller.","Same count, different molar masses.","Their molar masses are known."],"h":"Compare molar masses.","x":[["","Same number of molecules, but each CO₂ is heavier."]]},{"id":"b041","s":"pcomp","d":1,"q":"Two samples of pure water, 10 g and 100 g, are analyzed. Their percent oxygen is…","c":["The same, 88.8%","Ten times bigger for the 100 g sample","Ten times smaller for the 100 g sample","Different, depending on where the water came from"],"w":["Percent composition doesn't depend on the amount.","Percent composition doesn't depend on the amount.","A pure compound has a fixed composition."],"h":"Law of definite proportions.","x":[["","A compound always has the same percent composition by mass."]]},{"id":"b042","s":"empir","d":1,"q":"Which pair has the same empirical formula?","c":["C₂H₂ and C₆H₆","CO and CO₂","H₂O and H₂O₂","CH₄ and C₂H₆"],"w":["CO is 1:1 and CO₂ is 1:2.","H₂O is 2:1 and H₂O₂ is 1:1.","CH₄ is 1:4 and C₂H₆ is 1:3."],"h":"Reduce each formula.","x":[["","Both reduce to CH."]]},{"id":"b043","s":"stoich","d":1,"q":"In 2H₂ + O₂ → 2H₂O, how many molecules of O₂ react with 10 molecules of H₂?","c":["5","10","20","2"],"w":["The ratio is 2 H₂ : 1 O₂.","That would need twice the H₂.","Use the ratio of coefficients, not the coefficient."],"h":"Use the coefficients.","x":[["","2 H₂ for every 1 O₂, so 10 H₂ need 5 O₂."]]},{"id":"b044","s":"stoich","d":2,"q":"Total mass before a reaction in a sealed container is 50.0 g. After the reaction it is…","c":["50.0 g","More than 50.0 g, if a gas forms","Less than 50.0 g, if a gas forms","It depends on the mole ratio"],"w":["Mass is conserved in a sealed container.","The gas is still inside the sealed container.","Mole ratios don't change total mass."], // Pause is stop-and-remember, because pause()/resume() are unreliable in iPad Safari.

function withCE(t, fn) {

const massTxt = e => UNSTABLE(e) && Number.isInteger(e.m) ? '(' + e.m + ')' : e.m.toFixed(2);
const PTPOS = (() => {   // grid row and column for every element; the f-block sits in two rows under the table
  const pos = {}, col = {6: 4, 7: 4};

    + '<div class="ptkey" style="grid-row:1 / span 3;grid-column:3 / span 10">' + Object.keys(CATNAME).map(c => '<span><i class="c-' + c + '"></i>' + CATNAME[c] + '</span>').join('') + '</div></div></div>';

const CONSTS = [['Avogadro\'s number', '6.02\\times10^{23}\\text{ particles/mol}'], ['Ideal gas constant', 'R=0.0821\\text{ L·atm/(mol·K)}'], ['Molar volume at STP', '22.4\\text{ L/mol}'], ['STP', '0\\text{ °C (273 K) and 1 atm}'],
