<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chemistry Prep · SC300A/B</title>
<meta name="theme-color" content="#0a6b73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chemistry">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a6b73'/%3E%3Cpath d='M26 12h12M28 12v16L16 48a3 3 0 0 0 2.6 4.5h26.8A3 3 0 0 0 48 48L36 28V12' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cpath d='M21 41h22l4 7.5a2 2 0 0 1-1.8 3H18.8a2 2 0 0 1-1.8-3z' fill='%23ffc94a'/%3E%3C/svg%3E">
<style>
/* VOICE everyday study tool for a sophomore: focused, encouraging, a little game-like
   IDEA a lab notebook: faint grid paper, teal lab-glass ink, the same scorecard as the Algebra apps (level, streak, medals)
   PICTURE the question card with textbook formulas and a calculator keypad beside it; a colour-coded periodic table one tap away
   COLOUR white paper with a faint grid, ink #15171c, teal #0a6b73, red pen #c9352a, green #0d7f52, gold #b8860b for rewards
   TYPE Iowan Old Style / Palatino headings, system sans UI, Times math (all on-device, works offline)
   LAYOUT six bottom tabs; one column up to 960px; keypad beside the question on wide iPads, under it in portrait */
:root{--bg:#fbfdfd;--paper:#fff;--ink:#15171c;--mute:#566270;--line:#dbe4e8;--grid:rgba(10,107,115,.06);--blue:#0a6b73;--blue2:#e0f2f3;--onblue:#fff;--red:#c9352a;--red2:#fff0ee;--green:#0d7f52;--green2:#e7f6ef;--amber:#9a5b00;--amber2:#fff5e2;--gold:#b8860b;--gold2:#fff7dc;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--math:"Times New Roman","STIX Two Text",Times,serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1517;--paper:#132024;--ink:#e7f0f1;--mute:#9db0b4;--line:#26393e;--grid:rgba(111,214,220,.05);--blue:#6fd6dc;--blue2:#133a40;--onblue:#04201f;--red:#ff8073;--red2:#3a1d1d;--green:#4fd6a0;--green2:#11302a;--amber:#ffc46b;--amber2:#33280f;--gold:#ffd166;--gold2:#3a2f10;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0c1517;--paper:#132024;--ink:#e7f0f1;--mute:#9db0b4;--line:#26393e;--grid:rgba(111,214,220,.05);--blue:#6fd6dc;--blue2:#133a40;--onblue:#04201f;--red:#ff8073;--red2:#3a1d1d;--green:#4fd6a0;--green2:#11302a;--amber:#ffc46b;--amber2:#33280f;--gold:#ffd166;--gold2:#3a2f10;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background-color:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
@supports (background:color-mix(in srgb,red 50%,blue)){.top{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}}
.topin{display:flex;align-items:center;gap:10px;min-height:54px}
.tt{flex:1;font-family:var(--serif);font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;align-items:center;gap:8px}
.back{border:0;background:none;color:var(--blue);font-weight:600;font-size:16px;min-height:44px;padding:0 6px 0 0;cursor:pointer;white-space:nowrap}
.chipst{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--mute);white-space:nowrap}
.chipst .ic{width:17px;height:17px}
.chipst.fl{color:var(--red)}.chipst.co{color:var(--gold)}.chipst.lv{color:var(--blue)}
main{padding:14px 0 calc(100px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tin{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));max-width:760px;margin:0 auto}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;color:var(--mute);font-size:12px;font-weight:600;cursor:pointer;position:relative}
.tab .ic{width:24px;height:24px;stroke-width:1.8}
.tab[aria-current=page]{color:var(--blue)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;min-height:48px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);text-decoration:none;text-align:center}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.btn.gold{background:var(--gold2);border-color:var(--gold);color:var(--ink)}
.btn.big{min-height:54px;padding:12px 22px;font-size:17px}
.btn.sm{min-height:44px;padding:6px 14px;font-size:15px}
.btn[disabled],.btn.off{opacity:.45;cursor:default}
.btn.on{border-color:var(--green);color:var(--green);background:var(--green2)}
.lnk{background:none;border:0;color:var(--blue);font-weight:600;padding:8px 4px;min-height:44px;cursor:pointer}
.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.h1{font-family:var(--serif);font-size:clamp(30px,4.6vw,44px);line-height:1.05;margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.h2{font-family:var(--serif);font-size:24px;line-height:1.15;font-weight:600;margin:26px 0 10px}
h3{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 8px}
.lede{font-size:18px;color:var(--mute);margin:4px 0 16px;max-width:64ch}
.meta{color:var(--mute);font-size:15px;margin:4px 0 0}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--mute);white-space:nowrap}
.bar{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.g>i{background:var(--green)}.bar.y>i{background:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
/* math */
.m{font-family:var(--math);font-size:1.16em;white-space:nowrap;line-height:1}
.m i{font-style:italic;padding-right:.02em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.18}
.fr>.nu{padding:0 .16em .06em;border-bottom:.065em solid currentColor}
.fr>.de{padding:.08em .16em 0}
.fr .fr{font-size:.92em}
.m sup{font-size:.68em;line-height:0;vertical-align:.62em;margin-left:.03em}
.m sub{font-size:.68em;line-height:0;vertical-align:-.28em}
.bin{margin:0 .2em}.rel{margin:0 .3em}
.s1{display:inline-block;width:.17em}.s2{display:inline-block;width:.3em}.s3{display:inline-block;width:1em}
.tx{font-style:normal}
.sqa{margin-left:.03em}
.lr{display:inline-flex;align-items:center;vertical-align:middle}
.lr>.dl{font-size:2em;line-height:1;font-weight:300;margin:0 .03em;transform:scaleY(1.1)}
.mb{overflow-x:auto;overflow-y:hidden;padding:6px 2px;-webkit-overflow-scrolling:touch}
.mb .m{font-size:1.3em;white-space:normal}
.nb{white-space:nowrap}
/* today */
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.badge-lv{width:74px;height:74px;border-radius:50%;background:var(--blue);color:var(--onblue);display:grid;place-items:center;font:700 30px var(--serif);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.lvl b{font-family:var(--serif);font-size:22px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px}
.quest{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .bar{flex:1;max-width:160px}
.quest.done span{color:var(--green);text-decoration:line-through}
.plan{display:grid;gap:12px}
.pcard{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--ink);min-height:76px}
.pcard .ic{width:30px;height:30px;color:var(--blue)}
.pcard b{display:block;font-family:var(--serif);font-size:19px}
.pcard span{color:var(--mute);font-size:15px}
.pcard>div{flex:1}
.pcard.hot{border-color:var(--blue);box-shadow:inset 4px 0 0 var(--blue)}
.pcard.red .ic{color:var(--red)}.pcard.gold .ic{color:var(--gold)}
.cal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:4px;max-width:300px}
.cal i{display:block;aspect-ratio:1;border-radius:4px;background:var(--line)}
.cal i.on{background:var(--green)}.cal i.fz{background:#7fb2ff}.cal i.rs{background:var(--amber2);outline:1px solid var(--amber)}.cal i.today{outline:2px solid var(--blue);outline-offset:1px}
/* skills */
.list{padding:4px 0}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 18px;min-height:62px;cursor:pointer;color:var(--ink)}
.row:last-child{border-bottom:0}
.row.static{cursor:default}
.rt{flex:1;display:flex;flex-direction:column}
.rt b{font-weight:600}
.rt>span{color:var(--mute);font-size:14px}
.rm{display:flex;align-items:center;gap:10px;width:min(38%,230px)}
.rm .bar{flex:1}
.row>.ic{width:18px;height:18px;color:var(--mute)}
.chp{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.chp.untouched{background:var(--line);color:var(--mute)}.chp.practicing{background:var(--blue2);color:var(--blue)}.chp.mastered{background:var(--green2);color:var(--green)}.chp.due{background:var(--amber2);color:var(--amber)}
.skc{display:flex;flex-direction:column;gap:8px}
.skc .row2{margin-top:auto}
/* lesson */
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:6px 0 12px}
.player{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:0 0 14px}
.player .lbl{flex:1;color:var(--mute);font-size:14px;min-width:120px}
.say{border-radius:10px;transition:background .2s}
.say.on{background:var(--amber2);box-shadow:0 0 0 6px var(--amber2)}
.hook{display:flex;gap:12px;background:var(--green2);border-radius:14px;padding:14px 16px;margin:0 0 16px}
.hook .ic{width:24px;height:24px;color:var(--green);margin-top:1px}
.hook p{margin:0}
.big{font-size:19px;margin:0 0 18px;max-width:64ch}
.keys{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 22px;align-items:center}
.kl{font-weight:600;color:var(--mute);font-size:15px}
.how{padding-left:1.4em;margin:0 0 6px;max-width:64ch}
.how li{margin:7px 0;padding-left:4px}
.traps{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
.traps li{position:relative;padding:10px 14px 10px 40px;background:var(--red2);border-radius:12px}
.traps li::before{content:"\2717";position:absolute;left:15px;top:10px;color:var(--red);font-weight:700}
.alt{background:var(--blue2);border-radius:14px;padding:14px 16px;margin:10px 0}
.ex .exh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.prob .m{font-size:1.42em}
.prob{font-size:18px}
.steps{display:grid;gap:10px;margin-top:8px}
.st{border-left:3px solid var(--blue);padding:4px 0 4px 14px}
.st .mb{padding:4px 2px}
.st .mb .m{font-size:1.24em}
.stx{margin:2px 0 0;color:var(--mute);font-size:16px}
.ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--blue2);overflow-x:auto}
.ans>b{margin-right:8px;color:var(--blue)}
.trap{display:flex;gap:8px;margin:8px 0 0;color:var(--red);font-size:16px}
.exbtn{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tag{display:inline-flex;align-items:center;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue2);border-radius:99px;padding:4px 10px;line-height:1.3}
.tag.tw{color:var(--amber);background:var(--amber2)}.tag.fresh{color:var(--green);background:var(--green2)}.tag.word{color:var(--gold);background:var(--gold2)}
/* questions */
.qwrap{display:grid;gap:14px}
@media (min-width:1000px){.qwrap.typ{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.qwrap.typ .kpcol{position:sticky;top:76px}}
.qprog{display:flex;align-items:center;gap:12px;margin:4px 0 12px;font-size:15px;color:var(--mute)}
.qprog .bar{flex:1}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.dots{display:inline-flex;gap:3px;margin-left:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}
.spk{margin-left:auto;border:0;background:none;color:var(--blue);min-width:44px;min-height:40px;cursor:pointer;display:grid;place-items:center}
.prompt{font-size:21px;line-height:1.6;margin:4px 0 14px;overflow-x:auto;overflow-y:hidden;padding:4px 0}
.prompt .m{font-size:1.2em}
.fld{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px;cursor:text;background:var(--paper)}
.fld.focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
.fld.ok{border-color:var(--green);background:var(--green2)}.fld.no{border-color:var(--red);background:var(--red2)}
.fld .fl{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;color:var(--mute)}
.fld .box{font:20px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:34px;padding:2px 0;word-break:break-all}
.fld .caret{display:inline-block;width:2px;height:1.1em;background:var(--blue);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
.fld:not(.focus) .caret{display:none}
@keyframes blink{50%{opacity:0}}
.fld .pv{min-height:30px;font-size:19px;color:var(--ink);overflow-x:auto}
.fld .pv:empty{display:none}
.quick{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:2px 12px;min-height:32px;font-size:13px;font-weight:700;cursor:pointer;color:var(--mute)}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--blue2);border-radius:16px;padding:10px}
.kp button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font:600 21px var(--math);cursor:pointer;color:var(--ink)}
.kp button.op{color:var(--blue)}
.kp button.fn{font:700 15px var(--sans)}
.kp button.ck{grid-column:span 4;background:var(--blue);color:var(--onblue);border-color:var(--blue);font:700 18px var(--sans)}
.kp button:active{transform:translateY(1px)}
.choices{display:grid;gap:10px}
.ch{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:62px;padding:10px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);cursor:pointer;font-size:19px;color:var(--ink)}
.ch .lt{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blue2);color:var(--blue);font-weight:700;font-size:15px;font-family:var(--sans)}
.ch .ct{flex:1;overflow-x:auto;overflow-y:hidden;padding:6px 0}
.ch.sel{border-color:var(--blue);background:var(--blue2)}
.ch.ok{border-color:var(--green);background:var(--green2)}.ch.ok .lt{background:var(--green);color:var(--paper)}
.ch.no{border-color:var(--red);background:var(--red2)}.ch.no .lt{background:var(--red);color:var(--paper)}
.ch.dim{opacity:.55}
.ch[disabled]{cursor:default}
.qtools{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.hints{display:grid;gap:8px;margin-top:12px}
.hint{background:var(--amber2);border-radius:12px;padding:10px 14px}
.hint b{color:var(--amber)}
.fb{border-radius:16px;padding:14px 18px;margin:0 0 14px;border:1.5px solid}
.fb.ok{background:var(--green2);border-color:var(--green)}
.fb.no{background:var(--red2);border-color:var(--red)}
.fbh{display:flex;align-items:center;gap:8px;font-size:19px;flex-wrap:wrap}
.fb.ok .fbh{color:var(--green)}.fb.no .fbh{color:var(--red)}
.fb p{margin:6px 0 0}
.xp{font:700 14px var(--sans);color:var(--gold);background:var(--gold2);border-radius:99px;padding:2px 10px;margin-left:auto}
.cat{font:700 12px var(--sans);border-radius:99px;padding:2px 9px;background:var(--paper);color:var(--mute);border:1px solid var(--line)}
.why{margin-top:14px}
.why summary{cursor:pointer;color:var(--blue);font-weight:600;min-height:44px;display:flex;align-items:center}
.why ul{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:10px}
.why li{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--red2)}
.mrun{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.mrun .pips{display:inline-flex;gap:6px}
.mrun .pips i{width:16px;height:16px;border-radius:50%;border:2px solid var(--green)}
.mrun .pips i.on{background:var(--green)}
.score .big-n{font-family:var(--serif);font-size:72px;line-height:1;font-weight:600}
.score .big-n span{font-size:.45em;color:var(--mute)}
.score>p{font-size:18px;margin:8px 0 12px}
details.rv{padding:0}
details.rv>summary{padding:14px 18px;cursor:pointer;list-style:none;font-size:18px;line-height:1.6;display:flex;gap:12px;align-items:flex-start}
.rvs{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin-top:4px;background:var(--line);color:var(--mute);font-weight:700}
.rv.ok .rvs{background:var(--green2);color:var(--green)}.rv.no .rvs{background:var(--red2);color:var(--red)}
.rvs .ic{width:16px;height:16px}
.rvq{flex:1;min-width:0;overflow-x:auto}
.rvn{display:block;font-size:13px;color:var(--mute);font-weight:600;line-height:1.5}
.rvc{flex:none;margin-top:6px;color:var(--mute);transition:transform .15s}
details.rv[open] .rvc{transform:rotate(90deg)}
details.rv>summary::-webkit-details-marker{display:none}
details.rv[open]>summary{border-bottom:1px solid var(--line)}
.rvb{padding:12px 18px 16px}
.yours{margin:0 0 8px;color:var(--red)}.yours.ok{color:var(--green)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--blue)}
.timer.low{color:var(--red)}
.hearts{display:inline-flex;gap:4px;color:var(--red)}
.hearts .ic{width:22px;height:22px;fill:var(--red)}
.hearts .ic.gone{fill:none;opacity:.4}
.tnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:0 0 14px}
.tnav .btn{flex:1;min-width:110px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.pal button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer}
.pal .ans{background:var(--blue2);border-color:var(--blue);color:var(--blue)}
.pal .flag{border-color:var(--amber);box-shadow:inset 0 -4px 0 var(--amber)}
.pal .cur{outline:3px solid var(--blue);outline-offset:1px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:16px;cursor:pointer;color:var(--ink);min-height:130px}
.tcard .ic{width:28px;height:28px;color:var(--blue)}
.tcard b{font-family:var(--serif);font-size:20px}
.tcard span{color:var(--mute);font-size:14.5px}
.tcard em{font-style:normal;font-weight:700;color:var(--blue);font-size:14px;margin-top:auto}
.tcard.lock{opacity:.6}
/* speed */
.sbar{display:flex;align-items:center;gap:12px;margin:4px 0 8px}
.tbar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.tbar>i{display:block;height:100%;width:100%;background:var(--blue);border-radius:99px}
.ghost{position:relative;height:8px;border-radius:99px;background:var(--line);margin:0 0 10px}
.ghost i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:99px;opacity:.6}
.ghost b{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:99px}
.ghost span{position:absolute;right:0;top:10px;font-size:12px;color:var(--mute)}
.combo{font-weight:800;color:var(--mute)}.combo.hot{color:var(--red)}
.choices.two{grid-template-columns:1fr 1fr}
.ch.ok{animation:pop .28s ease}
@keyframes pop{50%{transform:scale(1.025)}}
.medal{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font:800 12px var(--sans);color:#fff}
.medal.b{background:#b0703a}.medal.s{background:#8f9aa8}.medal.g{background:#d4a017}.medal.n{background:var(--line);color:var(--mute)}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.drill{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--ink);min-height:58px}
.drill[aria-pressed=true]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.drill div{flex:1}.drill small{display:block;color:var(--mute);font-size:13px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;border-right:1.5px solid var(--line);background:var(--paper);padding:8px 16px;min-height:44px;font-weight:600;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--blue2);color:var(--blue)}
.newbest{display:inline-block;margin-left:10px;font-size:14px;font-weight:700;color:var(--green);background:var(--green2);border-radius:99px;padding:3px 10px;vertical-align:middle;font-family:var(--sans)}
.miss{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.miss:last-child{border-bottom:0}
/* me */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mcell{border-radius:12px;padding:10px;border:1.5px solid var(--line);font-size:14px;font-weight:600;min-height:64px;text-align:left;cursor:pointer;background:var(--paper);color:var(--ink)}
.mcell.mastered{background:var(--green2);border-color:var(--green)}.mcell.practicing{border-color:var(--blue)}.mcell.due{background:var(--amber2);border-color:var(--amber)}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bd{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;opacity:.45}
.bd.got{opacity:1;border-color:var(--gold);background:var(--gold2)}
.bd .ic{color:var(--gold);width:22px;height:22px}
.tog{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer}
.tog input{width:24px;height:24px;accent-color:var(--blue)}
.f{display:grid;gap:6px;margin:0 0 12px;font-weight:600}
.f input,.f select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--paper);min-height:46px}
table.tb{width:100%;border-collapse:collapse;font-size:15px}
.tb th,.tb td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tb td.r,.tb th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.modal{position:fixed;inset:0;background:rgba(10,14,25,.5);display:grid;place-items:center;z-index:20;padding:20px}
.modal .card{max-width:460px;width:100%;margin:0}
.modal p{font-size:18px;margin:0 0 4px}
#toasts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:toastin .18s ease-out}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
.foot{color:var(--mute);font-size:14px;margin:22px 0 6px}
/* chemistry: formulas, configurations, nuclides */
.ce{font-style:normal;white-space:nowrap}
.ce sub{font-size:.72em;line-height:0;vertical-align:-.3em}
.ce sup,.cfg sup{font-size:.72em;line-height:0;vertical-align:.55em}
.nuc{display:inline-flex;align-items:center;vertical-align:middle}
.nz{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.64em;line-height:1.05;margin-right:.06em}
.nz sup,.nz sub{font-size:1em!important;vertical-align:baseline!important;line-height:1.05!important;margin:0!important}
.ar{margin:0 .35em}.op{margin:0 .25em}.ph{font-size:.8em}
.cfg{white-space:nowrap}
.keys .tx,.st .tx,.ans .tx{white-space:normal}
/* answer fields */
label.fld{display:block;cursor:text}
label.fld:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
.fld .fin{display:block;width:100%;border:0;background:transparent;font:20px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);padding:4px 0;min-height:36px;outline:none;border-radius:0}
.fld .fin::placeholder{color:var(--mute);font:15px var(--sans);opacity:.85}
.fld .u{font-size:.85em;color:var(--mute)}
.eqn{display:flex;flex-wrap:wrap;align-items:center;gap:10px 6px;font-size:22px;font-family:var(--math);padding:8px 0 2px}
.term{display:inline-flex;align-items:center;gap:5px}
.cbox{min-width:46px;height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font:700 20px ui-monospace,Menlo,monospace;color:var(--blue);cursor:pointer;padding:0 6px}
.cbox:empty::before{content:"1";color:var(--line)}
.cbox.focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
.eqop{color:var(--mute);margin:0 2px}
.fld.coef.ok .cbox{border-color:var(--green)}.fld.coef.no .cbox{border-color:var(--red)}
.kp button[disabled]{opacity:.32;cursor:default}
.kp sup{font-size:.6em;vertical-align:.7em;line-height:0}
.qbtns{margin-left:auto;display:inline-flex}
.qbtns .spk{margin-left:0}
/* units */
.kicker{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--blue);letter-spacing:.02em}
.uhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:12px 18px 6px;font-family:var(--serif);font-size:18px;border-bottom:1px solid var(--line)}
.uhead2{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:24px 0 10px}
.uhead2 h3{margin:0;flex:1;min-width:200px}
.uchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.uchip{min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer;color:var(--blue)}
.ulab{font-weight:700;color:var(--mute);font-size:14px;margin:16px 0 6px}
.skn{font-family:var(--serif);font-size:19px}
/* reference */
.reftabs{margin:0 0 14px;display:inline-flex;flex-wrap:nowrap;max-width:100%;overflow-x:auto}
.reftabs button{white-space:nowrap}
.reftabs .sm{display:none}
.ptwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 8px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(37px,1fr));grid-template-rows:repeat(7,auto) 10px repeat(2,auto);gap:3px;min-width:718px}
.el{border:1px solid rgba(0,0,0,.08);border-radius:6px;padding:3px 1px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:#15171c;min-height:50px;line-height:1.1;font-family:var(--sans);min-width:0;overflow:hidden}
.el .z{font-size:9.5px;align-self:flex-start;padding-left:3px}
.el b{font-size:15px}
.el .ms{font-size:8.5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.el.sel{outline:3px solid var(--ink);outline-offset:1px}
.c-alkali{background:#ffb8a8}.c-alkaline{background:#ffd8a0}.c-transition{background:#f5c8d8}.c-post{background:#cdd9e5}.c-metalloid{background:#d3ebbd}.c-nonmetal{background:#aee8d2}.c-halogen{background:#fff0a3}.c-noble{background:#c8bff2}.c-lanthanide{background:#f0d0ea}.c-actinide{background:#e8cdb4}
.ptkey{display:flex;flex-wrap:wrap;gap:4px 14px;align-content:center;font-size:12px;padding:4px 10px}
.ptkey span{display:inline-flex;align-items:center;gap:5px;color:var(--mute)}
.ptkey i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.elinfo{display:flex;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.elbig{width:92px;height:92px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#15171c;flex:none}
.elbig .z{font-size:13px}.elbig b{font-size:34px;line-height:1.1}.elbig .ms{font-size:12px}
.elinfo h3{margin:0}.elinfo p{margin:4px 0}
.cfgl{font-family:var(--math);font-size:18px}
.irow{display:flex;gap:14px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.irow:last-of-type{border-bottom:0}
.irow .if{min-width:100px;font-family:var(--math);font-size:19px}
.modal.refm{place-items:start center;overflow:auto}
.refm .card{max-width:1000px;max-height:calc(100vh - 40px);overflow:auto}
.eqs{margin-bottom:12px}
.exc{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.exc li{border:1.5px solid var(--line);border-radius:10px;padding:4px 12px;font-size:16px;background:var(--paper)}
@media (max-width:640px){.reftabs .lg{display:none}.reftabs .sm{display:inline}
.grid3{grid-template-columns:1fr 1fr}
.mgrid{grid-template-columns:1fr 1fr}
.keys{grid-template-columns:1fr}
.kl{margin-top:8px}
.prompt{font-size:19px}
.ch{font-size:18px;padding:8px 12px;gap:10px}
.rm{width:34%}
.row{padding:12px 14px}
.chipst span{display:none}
.tab{font-size:11px}
.lvl{gap:12px}.badge-lv{width:54px;height:54px;font-size:22px}.lvl b{font-size:19px}
}
@media (max-width:560px){.choices.two,.grid2{grid-template-columns:1fr}.lhead{flex-direction:column}.kp button{min-height:48px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

ic and -ous acids"},{"k":"balance","n":"Balancing equations","sh":"Coefficients and conservation of atoms"},{"k":"rxtype","n":"Reaction types","sh":"Five reaction types and predicting products"},{"k":"molar","n":"Molar mass and moles","sh":"Grams, moles and particles"},{"k":"pcomp","n":"Percent composition","sh":"Mass percents and hydrates"},{"k":"empir","n":"Empirical formulas","sh":"Simplest ratio and molecular formula"},{"k":"stoich","n":"Stoichiometry","sh":"Mole ratios and gram-to-gram problems"},{"k":"limit","n":"Limiting reactant and yield","sh":"Limiting and excess reactants, percent yield"},{"k":"pressure","n":"Pressure and kinetic theory","sh":"Pressure units, kelvin, gas particles"},{"k":"gaslaw","n":"Gas laws","sh":"Boyle's, Charles's, Gay-Lussac's and combined"},{"k":"ideal","n":"Ideal gas law","sh":"PV = nRT, including molar mass"},{"k":"dalton","n":"Partial pressures","sh":"Dalton's law and gas stoichiometry at STP"},{"k":"solub","n":"Solutions and solubility","sh":"Like dissolves like, saturation, solubility curves"},{"k":"molarity","n":"Molarity","sh":"Moles per liter of solution"},{"k":"dilute","n":"Dilution","sh":"M₁V₁ = M₂V₂"},{"k":"collig","n":"Colligative properties","sh":"Percent, molality, freezing and boiling points"},{"k":"acidbase","n":"Acids and bases","sh":"Definitions, conjugate pairs, strength"},{"k":"ph","n":"pH and pOH","sh":"[H⁺], [OH⁻] and the log scale"},{"k":"titrate","n":"Titration","sh":"Neutralization and the equivalence point"},{"k":"heat","n":"Specific heat","sh":"q = mcΔT and calorimetry"},{"k":"enthalpy","n":"Enthalpy and phase changes","sh":"ΔH, heating curves, q = mΔH"},{"k":"nuclear","n":"Nuclear chemistry","sh":"Decay, nuclear equations, half-life"}],"lessons":[{"k":"matter","t":"Classifying matter and changes","sh":"Elements, compounds, mixtures; physical vs chemical change","hook":"A golf ball is a mixture of materials (a rubber core, a plastic cover), but the water in your bottle is a pure compound. Chemists sort everything the same way: pure, or mixed?","big":"Matter is either a pure substance (an element or a compound, with a fixed composition) or a mixture (homogeneous or heterogeneous). Physical changes alter form; chemical changes make new substances.","keys":[["Element","\\text{one kind of atom: Cu, O₂, He}"],["Compound","\\text{elements bonded in a fixed ratio: H₂O, NaCl}"],["Homogeneous","\\text{uniform throughout: salt water, air, brass}"],["Heterogeneous","\\text{visibly uneven: granite, soup, trail mix}"]],"how":["Ask: is it one substance, or more than one?","One substance: one kind of atom means an element; a fixed formula means a compound.","A mixture: the same throughout is homogeneous; visibly different parts is heterogeneous.","For a change, ask whether a new substance forms. Gas, a color change, light, heat, a new smell or a new solid mean chemical."],"ex":[{"t":"Element, compound or mixture","q":"Classify baking soda, \\ce{NaHCO3}.","s":[["","It is a pure substance with a fixed composition."],["","So it is a compound."]],"a":"Compound","c":["Element","Compound","Heterogeneous mixture","Homogeneous mixture"]},{"t":"Physical or chemical property","q":"Which of these is a physical property?","s":[["","Electrical conductivity can be measured while the substance stays the same."],["","So it is a physical property."]],"a":"Electrical conductivity","c":["Rusts in moist air","Decomposes when heated","Electrical conductivity","Burns in oxygen"]}],"traps":["Salt water looks pure, but it is a homogeneous mixture: boil off the water and the salt is left behind.","Melting, boiling and dissolving are physical changes; the substance is still the same.","Properties you can see without changing the substance (density, boiling point, color) are physical. Flammability and reactivity are chemical."],"alt":"Think of your golf bag. Each club is its own pure thing, like an element or compound: a 7-iron is always a 7-iron. The bag full of clubs, balls and tees is a mixture: you can take it apart by hand, and every bag is packed differently. Cleaning your clubs is a physical change; rust on an old wedge is chemical, because iron oxide is a new substance."},{"k":"sigfig","t":"Significant figures and scientific notation","sh":"Counting, rounding, calculating, scientific notation","hook":"A rangefinder that reads 152.4 yards promises more precision than one that reads 150. Significant figures are how a number tells you how precisely it was measured.","big":"Significant figures are the digits you actually measured, plus one estimated digit. A calculated answer can't be more precise than its least precise measurement.","keys":[["Always count","\\text{nonzero digits, and zeros between them (1007 has 4)}"],["Never count","\\text{leading zeros (0.0045 has 2)}"],["Trailing zeros","\\text{count only with a decimal point: 25.00 has 4, 2500 has 2}"],["× and ÷","\\text{round to the fewest significant figures}"],["+ and −","\\text{round to the fewest decimal places}"]],"how":["To count, start at the first nonzero digit and count to the end. Drop trailing zeros only when there is no decimal point.","Multiplying or dividing: keep the fewest significant figures of the measurements.","Adding or subtracting: keep the fewest decimal places.","Scientific notation: put one nonzero digit before the decimal point, then × 10 to the number of places you moved it. Moving left gives a positive exponent."],"ex":[{"t":"Count significant figures","q":"How many significant figures are in $0.0560$?","s":[["","The leading zeros don't count. Zeros between nonzero digits count. The trailing zeros count, because there is a decimal point. "],["","That gives 3 significant figures."]],"a":"3"},{"t":"Round to significant figures","q":"Round $0.0029203$ to 4 significant figures.","s":[["","Start counting at the first nonzero digit and keep 4 digits."],["0.0029203\\to 0.002920","Round using the next digit."]],"a":"$0.002920$"}],"traps":["Leading zeros (0.00450) only hold the decimal point; they never count.","Don't use the decimal-place rule for multiplying, or the significant-figure rule for adding.","Round once, at the end. Rounding every step makes the answer drift."],"alt":"Picture yardages. A caddie who says \"about 150\" gives two significant figures; \"152.4 yards\" gives four. If you add a 152.4-yard carry to \"roughly 20\" yards of roll, the total is only as precise as the rough guess: the sloppiest number limits the answer. Leading zeros, as in 0.004, just say \"zero ones, zero tenths\". They hold the decimal point in place."},{"k":"convert","t":"Metric conversions and dimensional analysis","sh":"Metric prefixes and dimensional analysis","hook":"Courses list holes in yards, but launch monitors often report meters. Converting units is just multiplying by a fraction that equals 1.","big":"Multiply by conversion factors written so the unit you don't want cancels. Each factor equals one, so the amount stays the same; only the units change.","keys":[["Prefixes","\\text{k}=10^{3},\\;\\text{c}=10^{-2},\\;\\text{m}=10^{-3},\\;\\text{µ}=10^{-6},\\;\\text{n}=10^{-9}"],["A factor","\\f{1000\\text{ m}}{1\\text{ km}}=1"],["Squared, cubed","1\\text{ m}^2=10^4\\text{ cm}^2,\\;1\\text{ mL}=1\\text{ cm}^3"]],"how":["Write the starting amount with its unit.","Multiply by a factor with the unwanted unit on the bottom and the new unit on top.","Chain more factors if needed, until only the unit you want is left.","Multiply the tops, divide by the bottoms. Exact definitions (1 km = 1000 m) don't limit significant figures."],"ex":[{"t":"Metric prefixes","q":"Convert $54.15\\text{ L}$ to mL.","s":[["54.15\\text{ L}\\times\\f{1000\\text{ mL}}{1\\text{ L}}","Set up the factor so the old unit cancels."],["=54150\\text{ mL}",""]],"a":"$54150$ mL"},{"t":"Dimensional analysis chains","q":"How many seconds are in $3.2$ days?","s":[["3.2\\text{ d}\\times\\f{24\\text{ h}}{1\\text{ d}}\\times\\f{60\\text{ min}}{1\\text{ h}}\\times\\f{60\\text{ s}}{1\\text{ min}}","Each unit cancels the one before it."],["=280000\\text{ s}","Two significant figures, from the measurement."]],"a":"$280000$ s"}],"traps":["Going to a smaller unit makes the number bigger: 2.5 km is 2500 m.","For cm² or m³, square or cube the conversion factor too.","If the units don't cancel, flip the factor."],"alt":"Think of it as exchanging currency. You hand over yards and get meters at a fixed rate (1 yd = 0.9144 m). Write the rate as a fraction with yards on the bottom so they cancel out. If you need several exchanges (days to hours to minutes), keep trading until you hold the unit you want."},{"k":"density","t":"Density and percent error","sh":"D = m/V, water displacement, percent error","hook":"A golf ball and a ping-pong ball are about the same size, but the golf ball is far heavier. That is density: how much mass is packed into each bit of volume.","big":"Density = mass ÷ volume. It doesn't depend on the size of the sample, so it can identify a substance. Percent error measures how far a measurement is from the accepted value.","keys":[["Density","D=\\f{m}{V}"],["Displacement","V=V_{\\text{final}}-V_{\\text{initial}}"],["Percent error","\\f{|\\text{measured}-\\text{accepted}|}{\\text{accepted}}\\times100"]],"how":["Write D = m/V and fill in what you know.","Rearrange for the unknown: m = D × V, or V = m ÷ D.","For an odd-shaped solid, find its volume by water displacement: final reading minus starting reading.","Percent error: subtract, drop the sign, divide by the accepted value, multiply by 100."],"ex":[{"t":"Density from mass and volume","q":"A sample has a mass of $230.2$ g and a volume of $20.85$ mL. What is its density?","s":[["D=\\f{m}{V}=\\f{230.2\\text{ g}}{20.85\\text{ mL}}",""],["=11.04\\text{ g/mL}","4 significant figures, the fewer of the two measurements."]],"a":"$11.04$ g/mL"},{"t":"Solve for mass or volume","q":"The density of copper is $8.96$ g/cm³. What is the mass of a $32.1$ cm³ piece?","s":[["m=D\\times V=8.96\\times32.1",""],["=288\\text{ g}",""]],"a":"$288$ g"}],"traps":["Divide mass by volume, not volume by mass.","With displacement, the object's volume is the RISE in water level, not the final reading.","Percent error divides by the accepted value, not the measured one."],"alt":"Imagine two range buckets, both full. One holds golf balls, the other ping-pong balls. Same volume, very different mass, so the golf-ball bucket is denser. Density doesn't care about the size of the bucket: half a bucket of golf balls is exactly as dense as a full one."},{"k":"models","t":"Atomic models and subatomic particles","sh":"Dalton to quantum; protons, neutrons, electrons","hook":"Golf club design improved one test at a time, and so did our model of the atom: from solid balls to a nucleus wrapped in electron clouds.","big":"Each experiment changed the model: Dalton's solid atoms, Thomson's electrons, Rutherford's dense positive nucleus, Bohr's energy levels, and today's quantum orbitals. Protons and neutrons sit in the nucleus; electrons are outside it.","keys":[["Proton","+1,\\;1\\text{ amu, in the nucleus}"],["Neutron","0,\\;1\\text{ amu, in the nucleus}"],["Electron","-1,\\;\\approx0\\text{ amu, outside the nucleus}"]],"how":["Dalton: atoms are tiny and indivisible, and each element has its own kind.","Thomson (cathode rays): atoms contain negative electrons, the plum-pudding model.","Rutherford (gold foil): most alpha particles went straight through, but a few bounced back. So the atom is mostly empty space with a tiny, dense, positive nucleus.","Bohr: electrons in fixed energy levels. The quantum model: electrons in orbitals, regions of probability."],"ex":[{"t":"Who discovered what","q":"What did Erwin Schrödinger contribute to atomic theory?","s":[["","Erwin Schrödinger described electrons as probability clouds (orbitals) in the quantum model."]],"a":"Described electrons as probability clouds (orbitals) in the quantum model","c":["Proposed that matter is made of tiny, indivisible particles called atoms","Described electrons as probability clouds (orbitals) in the quantum model","Measured the charge of an electron with the oil-drop experiment","Said each element is made of its own kind of solid, indivisible atom"]},{"t":"Subatomic particles","q":"Two isotopes of the same element differ in their number of…","s":[["","Neutrons."]],"a":"Neutrons","c":["Charge","Protons","Neutrons","Electrons"]}],"traps":["Protons, not neutrons or electrons, decide which element it is.","Nearly all the mass is in the nucleus; electrons take up space, not mass.","The gold-foil experiment revealed the nucleus. Energy levels came later, from Bohr."],"alt":"Picture a golf course from a blimp. Almost everything is open fairway and rough, but the clubhouse in the middle holds nearly all the mass. That is Rutherford's atom: a tiny, heavy nucleus with electrons spread far around it. Most alpha particles sailed through the empty space like shots over open fairway; only the rare one hit the clubhouse and bounced back."},{"k":"isotope","t":"Isotopes, ions and counting particles","sh":"Counting protons, neutrons and electrons","hook":"Two golf balls can look identical but have different cores. Isotopes are atoms of the same element with different numbers of neutrons.","big":"Atomic number (Z) = protons. Mass number (A) = protons + neutrons. Charge = protons − electrons.","keys":[["Protons","Z"],["Neutrons","A-Z"],["Electrons","Z-\\text{charge}"],["Notation","\\ce{^{56}_{26}Fe^3+}"]],"how":["Protons = the atomic number: the bottom number, or from the periodic table.","Neutrons = mass number − atomic number.","Electrons = protons for a neutral atom. For an ion, subtract the charge: a 2+ ion has 2 fewer electrons, a 3− ion has 3 more.","Isotopes have the same protons but different neutrons, like carbon-12 and carbon-14."],"ex":[{"t":"Protons, neutrons, electrons","q":"How many protons, neutrons and electrons are in $\\ce{^{6}_{3}Li}$?","s":[["\\text{protons}=Z=3","The atomic number."],["\\text{neutrons}=6-3=3","Mass number minus atomic number."],["\\text{electrons}=3=3","A neutral atom has as many electrons as protons."]],"a":"Protons: 3 · Neutrons: 3 · Electrons: 3"},{"t":"Write the symbol from p, n, e","q":"A particle has 30 protons, 36 neutrons and 30 electrons. Give its element symbol, mass number and charge.","s":[["Z=30\\Rightarrow \\ce{Zn}","Zinc has atomic number 30."],["A=30+36=66","Mass number."],["\\text{charge}=30-30=0",""],["\\ce{^{66}_{30}Zn}",""]],"a":"Element symbol: \\ce{Zn} · Mass number: 66 · Charge (0 if neutral): 0"}],"traps":["The mass number counts protons AND neutrons: subtract the atomic number to get neutrons.","Positive ions have LOST electrons; negative ions have GAINED them.","Change protons and you change the element; change electrons and you make an ion; change neutrons and you make an isotope."],"alt":"Think of a team. The protons are the team name: change them and it is a different team (element). Neutrons are bench players: add one or two and it is the same team, just heavier (an isotope). Electrons are fans in the stands: gain or lose a few and the team picks up a charge (an ion), but it is still the same team."},{"k":"avgmass","t":"Average atomic mass","sh":"Weighted averages of isotopes","hook":"Your average score isn't the average of your best and worst rounds; it depends on how often you shoot each one. Average atomic mass works the same way.","big":"Average atomic mass is a weighted average of the isotopes' masses, weighted by how common each isotope is (its percent abundance).","keys":[["Weighted average","\\text{sum of (mass × fraction)}"],["Fraction","75.78\\%\\to0.7578"],["Reverse problem","m_1x+m_2(1-x)=\\text{average}"]],"how":["Change each percent abundance to a decimal.","Multiply each isotope's mass by its decimal abundance.","Add the products. The answer lands closest to the most common isotope.","To find an abundance, let x be one fraction and 1 − x the other, then solve."],"ex":[{"t":"Average atomic mass","q":"Chlorine has 2 natural isotopes: mass $34.969$ amu, abundance $75.78\\%$; mass $36.966$ amu, abundance $24.22\\%$. What is its average atomic mass?","s":[["34.969\\times0.7578+36.966\\times0.2422","Mass × fraction for each isotope."],["=26.5+8.953",""],["=35.45\\text{ amu}","The average sits closest to the most common isotope."]],"a":"$35.45$ amu"},{"t":"Find a percent abundance","q":"Silver has two isotopes, with masses $106.905$ amu and $108.905$ amu. Its average atomic mass is $107.87$ amu. What percent of silver atoms are the lighter isotope?","s":[["106.905x+108.905(1-x)=107.87","The weighted average."],["x=\\f{107.87-108.905}{106.905-108.905}=0.5175","Solve for x."],["51.7\\%","As a percent."]],"a":"$51.7$ %"}],"traps":["A plain average of the masses ignores how common each isotope is.","Multiply by decimals (0.7578), not percents (75.78).","Use the exact isotope masses given, not the rounded mass numbers."],"alt":"Say you shoot 72 most weekends (75% of rounds) and 80 on bad days (25%). Your average isn't 76; it is 0.75 × 72 + 0.25 × 80 = 74, pulled toward the score you shoot most. Chlorine is the same: mostly chlorine-35 with some chlorine-37, so its average, 35.45, sits close to 35."},{"k":"light","t":"Light and energy","sh":"c = λν, E = hν, the spectrum","hook":"On a launch monitor, more club speed means more energy into the ball. For light, higher frequency means more energy in each photon.","big":"Light travels at c = 3.00 × 10⁸ m/s. Wavelength and frequency are inversely related (c = λν), and a photon's energy rises with frequency (E = hν).","keys":[["Waves","c=\\lambda\\nu"],["Energy","E=h\\nu=\\f{hc}{\\lambda}"],["Constants","c=3.00\\times10^{8}\\text{ m/s},\\;h=6.626\\times10^{-34}\\text{ J·s}"],["Spectrum","\\text{radio → gamma: energy up, wavelength down}"]],"how":["Convert wavelength to meters (1 nm = 10⁻⁹ m).","Frequency: ν = c ÷ λ. Wavelength: λ = c ÷ ν.","Energy: E = hν, or E = hc ÷ λ in one step.","Comparing light: shorter wavelength means higher frequency and more energy (violet over red, X-rays over radio)."],"ex":[{"t":"Wavelength and frequency","q":"Visible light has a wavelength of $590$ nm. What is its frequency? ($c=3.00\\times10^{8}$ m/s)","s":[["\\lambda=590\\text{ nm}=5.90\\times10^{-7}\\text{ m}","1 nm = 10⁻⁹ m."],["\\nu=\\f{3.00\\times10^{8}}{5.90\\times10^{-7}}=5.08\\times10^{14}\\text{ Hz}","Hz means s⁻¹."]],"a":"$5.08\\times10^{14}$ Hz"},{"t":"Photon energy","q":"What is the energy of one photon of light with a wavelength of $463$ nm? ($h=6.626\\times10^{-34}$ J·s, $c=3.00\\times10^{8}$ m/s)","s":[["\\lambda=463\\times10^{-9}\\text{ m}",""],["\\nu=\\f{3.00\\times10^{8}}{4.63\\times10^{-7}}=6.48\\times10^{14}\\text{ Hz}",""],["E=(6.626\\times10^{-34})(6.48\\times10^{14})=4.29\\times10^{-19}\\text{ J}",""]],"a":"$4.29\\times10^{-19}$ J"}],"traps":["Convert nanometers to meters before using c = λν.","Wavelength and frequency are inversely related: double one and the other halves.","E = hν multiplies; don't divide by h."],"alt":"Picture waves on a pond. If the crests are close together (short wavelength), many pass you each second (high frequency), and each one hits harder (more energy). Long, lazy radio waves are gentle; short gamma waves pack a punch. When an electron drops a long way between energy levels, it releases a high-energy photon, like a long downhill putt picking up speed."},{"k":"config","t":"Electron configurations","sh":"Filling order, noble-gas cores, valence electrons","hook":"Players tee off in a set order, and electrons fill sublevels in a set order too: lowest energy first.","big":"Electrons fill sublevels in order of energy: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p. An s sublevel holds 2, p holds 6, d holds 10. Valence electrons are the outermost s and p electrons.","keys":[["Filling order","\\text{1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p}"],["Capacity","s=2,\\;p=6,\\;d=10,\\;f=14"],["Shorthand","\\cfg{[Ne] 3s2}\\text{ is magnesium}"],["Valence","\\text{groups 1–2: 1–2; groups 13–18: 3–8}"]],"how":["Count the electrons: the atomic number, adjusted for any ion charge.","Fill sublevels in order, writing the number of electrons as an exponent.","For shorthand, start with the previous noble gas in brackets.","Check that the exponents add up to the electron count."],"ex":[{"t":"Write a configuration","q":"Write the full electron configuration of beryllium (atomic number 4).","s":[["","Place 4 electrons, lowest energy first."],["\\cfg{1s2 2s2}","Check: the exponents add up to 4."]],"a":"\\cfg{1s2 2s2}"},{"t":"Noble-gas configurations","q":"Write the noble-gas (shorthand) configuration of zirconium.","s":[["","The previous noble gas is Kr (36 electrons)."],["\\cfg{[Kr] 5s2 4d2}","Add the remaining 4 electrons in filling order (4s before 3d, 5s before 4d)."]],"a":"\\cfg{[Kr] 5s2 4d2}"}],"traps":["4s fills before 3d, and after 4s comes 3d, not 4d.","For ions, remove electrons for a positive charge and add them for a negative one.","A p sublevel holds 6 electrons, not 8."],"alt":"Think of a parking garage. The ground level (1s) fills first with 2 cars, then the next levels in order. One upper level (4s) is easier to reach than a lower wing (3d), so it fills first: that is why 4s comes before 3d. Valence electrons are the cars on the top level, the ones that leave or arrive when atoms react."},{"k":"table","t":"The periodic table","sh":"Groups, periods, families, metals and nonmetals","hook":"Golf sorts clubs into woods, irons and wedges because each family behaves alike. The periodic table sorts elements into families the same way.","big":"Rows are periods (energy levels); columns are groups, families with similar properties. Metals are on the left, nonmetals on the right, and metalloids along the staircase line.","keys":[["Group 1","\\text{alkali metals: very reactive}"],["Group 2","\\text{alkaline earth metals}"],["Groups 3–12","\\text{transition metals}"],["Groups 17, 18","\\text{halogens; noble gases}"]],"how":["Find the period (row): it matches the outermost energy level.","Find the group (column 1–18): elements in a group share valence electrons and behave alike.","Left of the staircase: metals. Right of it: nonmetals. Along it: metalloids (B, Si, Ge, As, Sb, Te).","The table is ordered by atomic number (Moseley), not by atomic mass."],"ex":[{"t":"Period and group","q":"In which period and group is potassium (\\ce{K}, atomic number 19) on the periodic table?","s":[["","\\ce{K} sits in row 4, so period 4."],["","It is in column 1, so group 1."]],"a":"Period (row): 4 · Group (column, 1–18): 1"},{"t":"Element families","q":"Which family does argon (\\ce{Ar}) belong to?","s":[["","\\ce{Ar} is in group 18."],["","So it is a noble gas."]],"a":"Noble gas","c":["Transition metal","Alkali metal","Noble gas","Halogen"]}],"traps":["Periods are rows; groups are columns.","Hydrogen sits in group 1 but is a nonmetal.","Noble gases are unreactive because their outer energy level is full."],"alt":"Think of a golf bag sorted by club family. Every wedge has a short shaft and a lofted face; every alkali metal has one valence electron and reacts with water. Move down a column and you get bigger versions of the same family; move across a row and you change families."},{"k":"trends","t":"Periodic trends","sh":"Radius, ionization energy, electronegativity","hook":"A firmer grip pulls the club in tighter. A nucleus with more protons pulls its electrons in tighter, and that explains every periodic trend.","big":"Across a period, more protons pull the same energy level inward: atoms shrink, and ionization energy and electronegativity rise. Down a group, extra energy levels make atoms bigger and their outer electrons easier to remove.","keys":[["Atomic radius","\\text{bigger down a group and to the left}"],["Ionization energy","\\text{higher up a group and to the right}"],["Electronegativity","\\text{higher up and to the right; F is highest}"],["Ions","\\text{cations are smaller, anions larger, than their atoms}"]],"how":["Locate both elements: same period, or same group?","Same period: the one further right has more protons pulling inward, so it is smaller with higher ionization energy and electronegativity.","Same group: the one further down has more energy levels, so it is bigger with lower ionization energy and electronegativity.","For ions with the same number of electrons, more protons means a smaller ion."],"ex":[{"t":"Compare two elements","q":"Which has the higher first ionization energy: \\ce{Sb} or \\ce{N}?","s":[["","\\ce{N} is in period 2, group 15; \\ce{Sb} is in period 5, group 15."],["","Ionization energy rises across a period and up a group: electrons closer to a stronger nucleus are harder to remove."]],"a":"\\ce{N}","c":["\\ce{N}","\\ce{Sb}"]},{"t":"Rank across a period or down a group","q":"Which of these has the highest electronegativity: \\ce{O}, \\ce{S}, \\ce{Te}, \\ce{Se}?","s":[["","They are all in group 16."],["","Electronegativity rises across a period and up a group (fluorine is the highest). So \\ce{O}."]],"a":"\\ce{O}","c":["\\ce{Te}","\\ce{S}","\\ce{O}","\\ce{Se}"]}],"traps":["Across a period atoms get SMALLER, even though they gain electrons.","Metallic character runs opposite to ionization energy: it grows down and to the left.","A positive ion is smaller than its atom; a negative ion is larger."],"alt":"Imagine the nucleus as a player holding a rope with electrons on the end. Across a period the player gets stronger (more protons) and reels the electrons in: a smaller atom that is harder to steal from. Down a group, each new energy level is a longer rope: the electrons sit farther out and slip away more easily."},{"k":"ionic","t":"Ions and ionic formulas","sh":"Ion charges and criss-cross formulas","hook":"In a team match, the sides have to balance. In an ionic compound, the positive and negative charges have to balance to zero.","big":"Metals lose electrons to form positive ions; nonmetals gain electrons to form negative ions. An ionic formula combines ions so the total charge is zero, in the lowest whole-number ratio.","keys":[["Main-group charges","\\text{groups 1, 2, 13: +1, +2, +3; groups 15, 16, 17: −3, −2, −1}"],["Criss-cross","\\ce{Al^3+}\\text{ and }\\ce{O^2-}\\to\\ce{Al2O3}"],["Polyatomic ions","\\text{keep them whole; parentheses for more than one}"]],"how":["Write each ion with its charge.","Criss-cross the charge numbers into subscripts.","Reduce to the lowest whole-number ratio.","Put parentheses around a polyatomic ion when there is more than one of it, as in Ca₃(PO₄)₂."],"ex":[{"t":"Predict the ion charge","q":"What is the charge on the ion that magnesium (\\ce{Mg}) usually forms?","s":[["","\\ce{Mg} has 2 valence electrons."],["","Losing 2 is easiest, so the ion is \\ce{Mg^2+}."]],"a":"2+"},{"t":"Formulas with polyatomic ions","q":"Write the formula of the compound made of \\ce{NH4^+} and \\ce{SO3^2-} (sulfite).","s":[["\\ce{NH4^+}\\quad \\ce{SO3^2-}","Charges."],["","Criss-cross and reduce; use parentheses if there is more than one polyatomic ion."],["\\ce{(NH4)2SO3}",""]],"a":"\\ce{(NH4)2SO3}"}],"traps":["The charges must cancel: Mg²⁺ and Cl⁻ make MgCl₂, not MgCl.","Never change the subscripts inside a polyatomic ion.","Cl₂ is diatomic only as an element. In NaCl, each Cl⁻ counts once."],"alt":"Think of a team match where both sides must end level. Aluminum brings +3 per atom and oxygen brings −2. Two aluminums make +6 and three oxygens make −6: level, so Al₂O₃. The criss-cross trick just finds the smallest numbers that make the totals match."},{"k":"lewis","t":"Lewis structures","sh":"Valence electrons, bonds, lone pairs","hook":"Before a shot you check your yardage. Before drawing a molecule, you count its valence electrons.","big":"A Lewis structure shows valence electrons as bonds (shared pairs) and lone pairs, so each atom except hydrogen ends up with eight.","keys":[["Valence electrons","\\text{H 1, C 4, N 5, O 6, halogens 7}"],["Ions","\\text{add one per negative charge; remove one per positive}"],["Octet","\\text{8 around each atom (H: 2)}"]],"how":["Count the valence electrons of every atom, and adjust for an ion's charge.","Put the least electronegative atom in the center (never H) and connect the others with single bonds.","Fill the outer atoms' octets with lone pairs.","Put any leftover electrons on the central atom. If it still has fewer than eight, turn lone pairs into double or triple bonds."],"ex":[{"t":"Count valence electrons","q":"How many valence electrons go into the Lewis structure of $\\ce{CO3^2-}$?","s":[["1(4)+3(6)=22","Valence electrons of the atoms."],["22+2=24","Add electrons for the negative charge."]],"a":"24"},{"t":"Bonded atoms and lone pairs","q":"Draw the Lewis structure of $\\ce{BF3}$. How many atoms are bonded to the central \\ce{B} atom, and how many lone pairs are on \\ce{B}?","s":[["","\\ce{B} is bonded to 3 atoms."],["","\\ce{B} has no lone pairs: all its electrons are in bonds (boron is fine with six)."]],"a":"Atoms bonded to B: 3 · Lone pairs on B: 0"}],"traps":["Count every atom: CO₂ has 4 + 6 + 6 = 16 valence electrons, not 10.","Add electrons for a negative ion; subtract them for a positive one.","Count lone PAIRS, not single electrons."],"alt":"Think of the valence electrons as a budget of golf balls: you must use exactly that many. Each bond spends two balls shared by two players; each lone pair is two balls one player keeps. Everyone except hydrogen wants eight in their bag, so you trade lone pairs for double bonds until the budget balances."},{"k":"shape","t":"Shapes, bond type and polarity","sh":"VSEPR, bond angles, bond type, polar molecules","hook":"Players on a crowded tee box spread out to stay out of each other's way. Electron groups around an atom spread out the same way.","big":"Electron groups (bonds and lone pairs) repel and spread as far apart as possible (VSEPR). The electronegativity difference sets the bond type, and the shape decides whether polar bonds cancel.","keys":[["2, 3, 4 groups","\\text{linear, trigonal planar, tetrahedral}"],["With lone pairs","\\text{trigonal pyramidal (3 + 1), bent (2 + 1 or 2 + 2)}"],["Electronegativity gap","<0.4\\text{ nonpolar},\\;0.4\\text{–}1.7\\text{ polar},\\;>1.7\\text{ ionic}"],["Polar molecule","\\text{polar bonds and an unsymmetric shape}"]],"how":["Draw the Lewis structure and count electron groups on the central atom.","Name the shape from the bonded atoms only; lone pairs bend it.","For bond type, subtract the electronegativities.","For polarity: symmetric shapes with identical outer atoms cancel (nonpolar). Lone pairs or different outer atoms make it polar."],"ex":[{"t":"Molecular shape","q":"What is the molecular shape of $\\ce{NH3}$?","s":[["","4 electron groups spread out as tetrahedral."],["","With 1 lone pair, the atoms form a trigonal pyramidal shape."]],"a":"Trigonal pyramidal","c":["Tetrahedral","Trigonal pyramidal","Bent","Linear"]},{"t":"Bond angles","q":"What is the approximate bond angle in $\\ce{CO2}$ (linear)?","s":[["","\\ce{CO2} is linear."],["","Bond angle ≈ 180°."]],"a":"180°","c":["107°","104.5°","180°","120°"]}],"traps":["NH₃ has four electron groups arranged tetrahedrally, but its shape is trigonal pyramidal.","A molecule can have polar bonds and still be nonpolar (CO₂, CCl₄).","Lone pairs squeeze bond angles: 109.5°, then 107°, then 104.5°."],"alt":"Picture balloons tied together at the knots. Two point opposite ways (linear), three make a flat triangle, four make a tetrahedron. Now make one balloon invisible: that is a lone pair. It still takes up space, but you only see the other three, so the shape looks like a pyramid. Polarity is a tug-of-war: if equal pullers pull in symmetric directions, the rope doesn't move."},{"k":"imf","t":"Intermolecular forces","sh":"London, dipole–dipole, hydrogen bonding","hook":"Teammates can be strong on their own, but how well they stick together decides a scramble. Molecules feel forces between each other, not just the bonds inside them.","big":"Intermolecular forces hold molecules together: London dispersion forces (in every molecule, stronger for bigger ones), dipole–dipole forces (polar molecules) and hydrogen bonding (H on N, O or F, the strongest). Stronger forces mean higher boiling points.","keys":[["London dispersion","\\text{every molecule; stronger for bigger ones}"],["Dipole–dipole","\\text{polar molecules}"],["Hydrogen bonding","\\text{H bonded to N, O or F}"],["Boiling point","\\text{stronger forces → higher boiling point}"]],"how":["Decide whether the molecule is polar, from its shape.","Look for H bonded directly to N, O or F: that means hydrogen bonding.","Polar without that: dipole–dipole. Nonpolar: London dispersion only.","To compare boiling points: the stronger strongest force wins. If both have the same kind, the bigger molecule wins."],"ex":[{"t":"Strongest intermolecular force","q":"What is the strongest intermolecular force between molecules of $\\ce{CH2O}$?","s":[["","\\ce{CH2O} is polar, without H on N, O or F."],["","Strongest force: dipole–dipole forces."]],"a":"Dipole–dipole forces","c":["London dispersion forces","Dipole–dipole forces","Ionic bonding","Hydrogen bonding"]},{"t":"Higher boiling point","q":"Which has the higher boiling point: $\\ce{CH4}$ or $\\ce{CH3OH}$?","s":[["","\\ce{CH3OH} has hydrogen bonding, stronger than the london dispersion forces in \\ce{CH4}."],["","So \\ce{CH3OH} boils higher (65 °C vs -162 °C)."]],"a":"\\ce{CH3OH}","c":["\\ce{CH3OH}","\\ce{CH4}"]}],"traps":["Hydrogen bonding needs H on N, O or F. HCl doesn't have it.","Ionic and covalent bonds are inside compounds, not between molecules.","Bigger nonpolar molecules (I₂ versus F₂) have stronger London forces."],"alt":"Think of molecules as golfers leaving the 18th green. Nonpolar ones barely notice each other (weak London forces) and scatter fast: a low boiling point. Polar ones chat in pairs (dipole–dipole). Hydrogen-bonded ones, like water, link arms and don't want to leave, so it takes a lot of energy, 100 °C, to pull them apart into a gas."},{"k":"nameion","t":"Naming ionic compounds","sh":"Roman numerals and polyatomic ions","hook":"A scorecard lists every player by full name, not a nickname. Ionic compounds have official names too: cation first, then anion.","big":"Name the cation, then the anion. Single-atom anions end in -ide; polyatomic ions keep their own names; metals that can have more than one charge get a Roman numeral.","keys":[["Two elements","\\text{NaCl: sodium chloride}"],["Roman numeral","\\text{Fe₂O₃: iron(III) oxide}"],["Polyatomic","\\text{CaCO₃: calcium carbonate}"]],"how":["Name the cation: the metal's name (with a Roman numeral for Fe, Cu, Pb, Sn, Co), or ammonium.","Name the anion: the element's root + -ide, or the polyatomic ion's name.","For the Roman numeral, use the anions' total charge to work out the metal's charge.","From a name to a formula: write both ions, balance the charges, and add parentheses for more than one polyatomic ion."],"ex":[{"t":"Name an ionic compound","q":"Name the compound $\\ce{Ba(C2H3O2)2}$.","s":[["","Anion: \\ce{C2H3O2^-} = acetate."],["","Cation: \\ce{Ba^2+} = barium."],["","Barium acetate."]],"a":"barium acetate"},{"t":"Formula from an ionic name","q":"Write the formula for zinc fluoride.","s":[["\\ce{Zn^2+}\\quad \\ce{F^-}","Ions and charges."],["\\ce{ZnF2}","Criss-cross the charges, reduce, and add parentheses for more than one polyatomic ion."]],"a":"\\ce{ZnF2}"}],"traps":["The Roman numeral is the metal's charge, not its subscript: Fe₂O₃ is iron(III) oxide.","No prefixes (di-, tri-) in ionic names.","-ate and -ite ions differ by one oxygen: nitrate is NO₃⁻, nitrite is NO₂⁻."],"alt":"Treat the name like introducing a pairing: the positive player first, then the negative one. If the first player could carry more than one handicap (iron can be 2+ or 3+), you announce which in Roman numerals. A polyatomic ion is a team with a fixed name: sulfate is always SO₄²⁻, so you never rename it."},{"k":"namecov","t":"Naming molecular compounds and acids","sh":"Prefixes; -ic and -ous acids","hook":"Golf counts everything: a three-putt, a double bogey. Molecular names use counting prefixes too.","big":"Two nonmetals: use prefixes (mono, di, tri, tetra, penta, hexa…) for how many of each atom, and drop \"mono\" on the first element. Acids: binary acids are hydro-…-ic acid; -ate ions make -ic acids; -ite ions make -ous acids.","keys":[["Prefixes","\\text{mono 1, di 2, tri 3, tetra 4, penta 5, hexa 6, hepta 7, deca 10}"],["Example","\\text{N₂O₄: dinitrogen tetroxide}"],["Acids","\\text{HCl hydrochloric; HNO₃ nitric; HNO₂ nitrous}"]],"how":["Check: are both elements nonmetals? Then use prefixes.","First element: its name, with a prefix only if there is more than one atom.","Second element: prefix + root + -ide (monoxide, not monooxide).","Acids: no oxygen means hydro + root + -ic acid. An -ate ion gives an -ic acid; an -ite ion gives an -ous acid."],"ex":[{"t":"Name a molecular compound","q":"Name the compound $\\ce{CCl4}$.","s":[["","1 carbon atom → carbon (no mono)."],["","4 chlorine atoms → tetrachloride."],["","Carbon tetrachloride."]],"a":"carbon tetrachloride"},{"t":"Name an acid","q":"Name the acid $\\ce{H3PO4(aq)}$.","s":[["","The anion is phosphate."],["","\"-ate\" becomes \"-ic\": phosphoric acid."],["","Phosphoric acid."]],"a":"phosphoric acid"}],"traps":["Never reduce a molecular formula: N₂O₄ is not NO₂.","Hydro- is only for binary acids like HCl. H₂SO₄ is sulfuric acid, not hydrosulfuric.","Roman numerals are for ionic compounds, never molecular ones."],"alt":"Read the name like a scorecard: \"dinitrogen tetroxide\" says two nitrogens, four oxygens, N₂O₄. The prefixes are the stroke counts, so you never simplify them. For acids: \"-ate, I ate something icky\" (nitrate becomes nitric acid); \"-ite is delight-ous\" (nitrite becomes nitrous acid)."},{"k":"balance","t":"Balancing equations","sh":"Coefficients and conservation of atoms","hook":"A scorecard has to add up: the front nine plus the back nine equals the total. A chemical equation has to add up too: atoms in equal atoms out.","big":"Atoms are conserved, so every element must have the same count on both sides. Change only coefficients, never subscripts, and use the lowest whole numbers.","keys":[["Conservation","\\text{atoms in = atoms out}"],["Example","\\ce{2H2 + O2 -> 2H2O}"],["Order","\\text{complicated formulas first; lone elements and O last}"]],"how":["Count the atoms of each element on both sides.","Balance the element in the most complicated formula first. Leave lone elements (O₂, H₂, Fe) for last.","A polyatomic ion that appears unchanged on both sides can be balanced as one unit.","Recount everything, and divide by a common factor if every coefficient has one."],"ex":[{"t":"Balance a simple equation","q":"Balance the equation: $\\ce{SO2 + O2 -> SO3}$","s":[["","Change coefficients until every element matches."],["\\ce{2SO2 + O2 -> 2SO3}","Balanced, with the lowest whole numbers."]],"a":"\\ce{2SO2 + O2 -> 2SO3}"},{"t":"Balance an equation","q":"Balance the equation: $\\ce{NH3 + O2 -> NO + H2O}$","s":[["","Balance one element at a time, leaving lone elements and O for last."],["\\ce{4NH3 + 5O2 -> 4NO + 6H2O}","Balanced."],["","Check: N 4=4, H 12=12, O 10=10."]],"a":"\\ce{4NH3 + 5O2 -> 4NO + 6H2O}"}],"traps":["Never change a subscript: that changes the substance.","Balanced but not in lowest terms (4, 2, 4) still needs dividing.","Combustion: balance C, then H, then O."],"alt":"Balancing is like settling up after a round: the money everyone had at the start must equal what they have at the end. Coefficients are how many of each bet you place. You can place more bets, but you can't change what one bet is worth (the subscripts)."},{"k":"rxtype","t":"Reaction types and predicting products","sh":"Five reaction types and predicting products","hook":"Golf has match play, stroke play and scrambles, each with its own pattern. Reactions come in a few patterns too.","big":"Synthesis (A + B → AB), decomposition (AB → A + B), single replacement (A + BC → AC + B), double replacement (AB + CD → AD + CB) and combustion (fuel + O₂ → CO₂ + H₂O). Spot the pattern and you can predict the products.","keys":[["Synthesis","A+B\\to AB"],["Decomposition","AB\\to A+B"],["Single replacement","A+BC\\to AC+B"],["Double replacement","AB+CD\\to AD+CB"],["Combustion","\\text{fuel}+\\ce{O2}\\to\\ce{CO2}+\\ce{H2O}"]],"how":["Count the reactants and products, and notice which are elements and which are compounds.","Single replacement happens only if the free element is more active (activity series).","Double replacement: swap the partners, then fix each new formula's charges.","Combustion of a hydrocarbon always makes CO₂ and H₂O."],"ex":[{"t":"Classify a reaction","q":"What type of reaction is $\\ce{CaCO3 -> CaO + CO2}$?","s":[["","Here one compound breaks into two or more simpler substances (AB → A + B)."],["","So it is decomposition."]],"a":"Decomposition","c":["Synthesis","Decomposition","Single replacement","Combustion"]},{"t":"Predict the products","q":"Predict the products: $\\ce{Fe + CuSO4} \\to$ ?","s":[["","Products: \\ce{FeSO4 + Cu}."],["","Then balance the equation."]],"a":"$\\ce{FeSO4 + Cu}$","c":["$\\ce{Fe(SO4)2 + Cu}$","No reaction","$\\ce{FeSO4 + Cu}$","$\\ce{FeCu + SO4}$"]}],"traps":["In double replacement, cations pair with anions, never cation with cation.","A less active metal can't replace a more active one: no reaction.","Rebalance the charges in new compounds: Pb²⁺ with I⁻ makes PbI₂."],"alt":"Think of changing playing partners. Single replacement is one player stepping in to take another's place, and only a stronger player can. Double replacement is two pairs swapping partners. Synthesis is players forming a team; decomposition is the team splitting up. Combustion is the clubhouse fire pit: fuel plus oxygen gives CO₂ and water."},{"k":"molar","t":"Molar mass and mole conversions","sh":"Grams, moles and particles","hook":"A dozen balls is always 12 balls, whatever the brand. A mole is always 6.02 × 10²³ particles, whatever the substance.","big":"A mole is 6.02 × 10²³ particles. Molar mass (g/mol) is the mass of one mole: add up the atomic masses in the formula. It converts between grams and moles.","keys":[["Avogadro's number","1\\text{ mol}=6.02\\times10^{23}\\text{ particles}"],["Grams to moles","n=\\f{\\text{mass}}{\\text{molar mass}}"],["Molar mass","\\ce{H2O}:\\;2(1.01)+16.00=18.02\\text{ g/mol}"]],"how":["Molar mass: count each atom (a subscript after parentheses multiplies everything inside) and add the atomic masses.","Grams to moles: divide by the molar mass.","Moles to grams: multiply by the molar mass.","Moles to particles: multiply by 6.02 × 10²³. For atoms of one element, also multiply by its subscript."],"ex":[{"t":"Molar mass","q":"What is the molar mass of $\\ce{C2H5OH}$? (C = 12.01, H = 1.01, O = 16.00)","s":[["2(12.01)+6(1.01)+1(16.00)=46.08\\text{ g/mol}","Atoms × atomic mass, added up."]],"a":"$46.08$ g/mol"},{"t":"Moles and particles","q":"How many molecules (or formula units) are in $50.74$ g of $\\ce{K2Cr2O7}$? (Use $6.02\\times10^{23}$ per mole.) (K = 39.10, Cr = 52.00, O = 16.00)","s":[["50.74\\text{ g}\\div294.20=0.172\\text{ mol}","Grams to moles."],["0.172\\times6.02\\times10^{23}=1.04\\times10^{23}","Moles to particles."]],"a":"$1.04\\times10^{23}$"}],"traps":["A subscript after parentheses multiplies everything inside: Ca(NO₃)₂ has 2 N and 6 O.","Use atomic masses, not atomic numbers.","Moles to particles multiplies by Avogadro's number; particles to moles divides."],"alt":"A mole is a counting word, like a dozen. A dozen golf balls and a dozen bowling balls are the same count but very different weights. One mole of carbon weighs 12.01 g; one mole of gold weighs 196.97 g. Molar mass just answers: how much does a mole-sized bag of this stuff weigh?"},{"k":"pcomp","t":"Percent composition and hydrates","sh":"Mass percents and hydrates","hook":"Your stats might say 40% of your strokes are putts. Percent composition says what share of a compound's mass comes from each element.","big":"Percent by mass = (mass of the element in one mole ÷ molar mass) × 100. Hydrates hold water in a fixed ratio; heating drives it off.","keys":[["Percent by mass","\\f{(\\text{subscript})(\\text{atomic mass})}{\\text{molar mass}}\\times100"],["Hydrate","\\text{CuSO₄·5H₂O: 5 water per formula unit}"],["Finding x","x=\\f{\\text{mol water}}{\\text{mol salt}}"]],"how":["Find the molar mass of the compound.","Multiply the element's atomic mass by its subscript.","Divide by the molar mass and multiply by 100.","Hydrate formula: water lost and salt left, each converted to moles; x is the ratio."],"ex":[{"t":"Percent by mass","q":"What is the percent by mass of oxygen in $\\ce{Al2O3}$? (Al = 26.98, O = 16.00)","s":[["2(26.98)+3(16.00)=101.96\\text{ g/mol}","Molar mass."],["\\f{3(16.00)}{101.96}\\times100=47.1\\%",""]],"a":"$47.1$ %"},{"t":"Percent water in a hydrate","q":"What is the percent by mass of water in $\\ce{MgSO4·7H2O}$? (Mg = 24.31, S = 32.06, O = 16.00, H = 1.01)","s":[["1(24.31)+1(32.06)+11(16.00)+14(1.01)=246.51\\text{ g/mol}","Molar mass of the hydrate."],["\\f{7(18.02)}{246.51}\\times100=51.2\\%",""]],"a":"$51.2$ %"}],"traps":["Percent composition is by MASS, not by number of atoms.","Include the subscript: 2 × 1.01 for H₂.","To find x in a hydrate, compare moles, not grams."],"alt":"If a round of 80 included 32 putts, putts are 32 ÷ 80 = 40% of your strokes. Percent composition splits mass the same way: in water, oxygen supplies 16.00 of every 18.02 g, so water is 88.8% oxygen by mass even though only one of its three atoms is oxygen."},{"k":"empir","t":"Empirical and molecular formulas","sh":"Simplest ratio and molecular formula","hook":"A practice plan of 30 putts, 15 chips and 45 full swings has a simplest ratio of 2 : 1 : 3. An empirical formula is a compound's simplest atom ratio.","big":"The empirical formula is the simplest whole-number ratio of atoms. The molecular formula is a whole-number multiple of it: C₆H₁₂O₆ is 6 × CH₂O.","keys":[["Percent to grams","\\text{assume a 100 g sample}"],["Grams to ratio","\\text{÷ atomic mass, then ÷ the smallest}"],["Molecular formula","n=\\f{\\text{molar mass}}{\\text{empirical formula mass}}"]],"how":["Assume 100 g, so each percent becomes grams.","Divide each by its atomic mass to get moles.","Divide every mole value by the smallest one.","If you get x.5 or x.33, multiply everything by 2 or 3. For the molecular formula, multiply the subscripts by molar mass ÷ empirical mass."],"ex":[{"t":"Empirical formula from percents","q":"A compound is $81.7\\%$ carbon and $18.3\\%$ hydrogen by mass. What is its empirical formula? (C = 12.01, H = 1.01)","s":[["","In 100 g: 81.7 g C, 18.3 g H."],["\\f{81.7}{12.01}=6.803,\\;\\f{18.3}{1.01}=18.119","Moles of each."],["C:1.00,\\;H:2.66","Divide by the smallest."],["\\ce{C3H8}","Multiply to clear the fraction."]],"a":"\\ce{C3H8}"},{"t":"Molecular formula","q":"A compound has the empirical formula $\\ce{CH2}$ and a molar mass of $84.18$ g/mol. What is its molecular formula? (C = 12.01, H = 1.01)","s":[["1(12.01)+2(1.01)=14.03\\text{ g/mol}","Empirical formula mass."],["\\f{84.18}{14.03}=6","Multiplier."],["\\ce{C6H12}","Multiply every subscript by 6."]],"a":"\\ce{C6H12}"}],"traps":["Mass percents aren't mole ratios: divide by atomic masses first.","Don't round 1.5 to 2; multiply every ratio by 2 instead.","The empirical formula is the molecular formula only when the multiplier is 1."],"alt":"Think of the practice plan again: 30 putts, 15 chips and 45 full swings reduce to 2 : 1 : 3. That is the empirical formula. The actual session, the molecular formula, is that ratio times 15. Finding the multiplier is just \"total ÷ one set\"."},{"k":"stoich","t":"Stoichiometry","sh":"Mole ratios and gram-to-gram problems","hook":"A lesson plan might say \"two buckets of balls for every lesson\". A balanced equation says how many moles of each substance go together
