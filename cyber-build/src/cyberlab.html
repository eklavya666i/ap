<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP Cyber Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
VOICE: a calm security operations console. Exact, quiet, no drama.
IDEA: a SOC wall: one big readout (predicted AP score) beside a live board of the 24 topics.
PICTURE: the topic board, every cell coloured by mastery band, next to the score readout.
COLOUR and TYPE: steel panel, white consoles, black rail, alarm red accent; Inter Tight + Inter, mono only for logs.
LAYOUT: black top rail; home = readout + board; work views in one calm column up to 980px.
*/
:root{color-scheme:light dark;
--bg:light-dark(#d5dbe0,#16191c);--card:light-dark(#fff,#1f2428);--ink:light-dark(#0c0e10,#eef1f3);
--mut:light-dark(#4b555e,#9aa5ae);--line:light-dark(#b8c1c8,#30363c);--soft:light-dark(#eef1f3,#262b30);
--acc:#e8251a;--acci:light-dark(#b8160d,#ff6a5f);--ok:light-dark(#11733a,#5fd08f);--bad:light-dark(#c4180f,#ff7a70);
--b0:light-dark(#c9d0d6,#30363c);--b1:light-dark(#f4bcb6,#6e2620);--b2:light-dark(#f2d58a,#6b5314);--b3:light-dark(#9fc3df,#22506f);--b4:light-dark(#86cfa3,#1c6a3e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;font-weight:600;line-height:1.1;text-wrap:balance;margin:0 0 .5em}
h1{font-size:clamp(30px,4vw,44px)}h2{font-size:24px}h3{font-size:18px}
p{margin:0 0 .8em}a{color:var(--acci)}
.rail{position:sticky;top:0;z-index:20;background:#0c0e10;color:#fff;display:flex;align-items:center;gap:8px;padding:8px max(3vw,12px);flex-wrap:wrap}
.brand{font:700 18px "Inter Tight",sans-serif;display:flex;align-items:center;gap:10px;margin-right:12px;color:#fff;text-decoration:none}
.brand i{width:12px;height:12px;border-radius:2px;background:var(--acc);display:inline-block}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav a{color:#c9d0d6;text-decoration:none;padding:10px 12px;border-radius:6px;font-weight:500;font-size:15px;min-height:44px;display:flex;align-items:center}
.nav a.on{background:#262b30;color:#fff}.nav a:hover{color:#fff}
.rail.lock .nav,.rail.lock #askBtn{opacity:.35;pointer-events:none}
.pill{font-size:12px;color:#9aa5ae}
.wrap{max-width:1180px;margin:0 auto;padding:24px max(3vw,14px) 80px}
.col{max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.btn{min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{filter:brightness(.95)}
.btn.ghost{background:transparent}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.mut{color:var(--mut)}.small{font-size:14px}.tiny{font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:stretch}
.readout{display:flex;flex-direction:column;gap:12px}
.big{font:700 clamp(84px,12vw,140px)/.9 "Inter Tight",sans-serif;letter-spacing:-.02em}
.board .urow{display:grid;grid-template-columns:118px repeat(6,minmax(0,1fr));gap:6px;align-items:stretch;margin-bottom:6px}
.board .ul{font-size:13px;color:var(--mut);display:flex;align-items:center;line-height:1.2}
.cell{border:0;border-radius:6px;min-height:62px;padding:6px 8px;text-align:left;cursor:pointer;font:600 13px Inter,sans-serif;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between}
.cell span{font-weight:400;font-size:12px;opacity:.8}
.cell:hover{outline:2px solid var(--ink)}
.c0{background:var(--b0)}.c1{background:var(--b1)}.c2{background:var(--b2)}.c3{background:var(--b3)}.c4{background:var(--b4)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.acts li{margin:0 0 10px}.acts{padding-left:20px;margin:0}
.unit{margin-bottom:22px}.tlist{display:grid;gap:8px}
.tl{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;min-height:56px}
.tl:hover{border-color:var(--ink)}.tl b{font-family:"Inter Tight",Inter,sans-serif;min-width:34px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.hook{border-left:4px solid var(--acc);background:var(--soft);padding:16px 18px;border-radius:0 8px 8px 0;font-size:17px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.flip{min-height:96px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.flip b{display:block;font-family:"Inter Tight",Inter,sans-serif;font-size:16px}.flip.on{background:var(--soft)}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:600;color:var(--mut);font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.qhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#qtimer{font:600 18px "JetBrains Mono",monospace;padding:4px 10px;border-radius:6px;background:var(--card);border:1px solid var(--line)}
#qtimer.warn{color:#fff;background:var(--acc);border-color:var(--acc)}
.stem{font-size:18px;line-height:1.5;margin-bottom:16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;min-height:52px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:16px/1.45 Inter,sans-serif;cursor:pointer;width:100%}
.opt:hover{border-color:var(--ink)}.opt .k{font:600 14px "Inter Tight",Inter,sans-serif;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.opt.sel .k{background:var(--ink);color:var(--card)}
.opt.right{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--soft)}
.fb.ok b{color:var(--ok)}.fb.no b{color:var(--bad)}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots button{width:30px;height:30px;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;cursor:pointer;padding:0}
.dots .a{background:var(--ink);color:var(--card)}.dots .f{box-shadow:inset 0 -3px 0 var(--acc)}.dots .cur{outline:2px solid var(--acc)}
pre,.scroll{overflow-x:auto}
pre.code,.log{font:13.5px/1.55 "JetBrains Mono",monospace;background:#0c0e10;color:#dfe5ea;padding:14px;border-radius:8px;margin:0}
pre.txt{white-space:pre-wrap;font:15px/1.55 Inter,sans-serif;background:var(--soft);padding:14px;border-radius:8px;margin:0}
textarea,input,select{font:16px Inter,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
textarea{width:100%;min-height:96px;resize:vertical}
input.mono{font-family:"JetBrains Mono",monospace}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--card);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s}
.drawer{visibility:hidden;transition:transform .2s,visibility 0s .2s}.drawer.on{transform:none;visibility:visible;transition:transform .2s}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.modes{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.modes button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px Inter;cursor:pointer;min-height:34px}
.modes button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{padding:10px 12px;border-radius:10px;max-width:92%;font-size:15px;line-height:1.5}
.m.u{align-self:flex-end;background:var(--ink);color:var(--card)}.m.a{align-self:flex-start;background:var(--soft)}
.m code{font-family:"JetBrains Mono",monospace;font-size:13px}
.compose{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}.compose textarea{min-height:44px;height:44px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0c0e10;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.pk{display:inline-flex;gap:4px}.pk label{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:2px}
.pk input{width:22px;height:22px;min-height:0}
.ok{color:var(--ok)}.no{color:var(--bad)}
.stack td{vertical-align:middle}
@media(max-width:700px){.rail{padding:6px 12px}.nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto}.nav a{flex:none}.pill{display:none}#askBtn{margin-left:auto}}
@media(max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.board .urow{grid-template-columns:repeat(6,minmax(0,1fr))}.board .ul{grid-column:1/-1}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}.cell{min-height:52px}}
</style>
</head>
<body>
<header class="rail" id="rail">
  <a class="brand" href="#home"><i></i>AP Cyber Lab</a>
  <nav class="nav" id="nav">
    <a href="#home">Home</a><a href="#learn">Learn</a><a href="#labs">Labs</a><a href="#practice">Practice</a><a href="#tests">Tests</a><a href="#progress">Progress</a>
  </nav>
  <span class="pill" id="saveState">Loading…</span>
  <button class="btn pri sm" id="askBtn" type="button">Ask tutor</button>
</header>
<main class="wrap" id="view"><p class="mut">Loading the curriculum…</p></main>
<aside class="drawer" id="tutor" aria-label="AMA tutor">
  <div class="dh"><h3 style="margin:0">AMA tutor</h3><span class="sp"></span><button class="btn sm ghost" id="tClear" type="button">Clear</button><button class="btn sm" id="tClose" type="button">Close</button></div>
  <div class="modes" id="tModes"></div>
  <div class="msgs" id="tMsgs"></div>
  <form class="compose" id="tForm"><textarea id="tIn" placeholder="Ask anything about AP Cybersecurity…" rows="1"></textarea><button class="btn pri" type="submit">Send</button></form>
</aside>
<div class="toast" id="toast"></div>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const today=()=>new Date().toISOString().slice(0,10);
const DAY=864e5;
const SKN={'1':'Analyze Risk','2':'Mitigate Risk','3':'Detect Attacks'};
const UW={1:.09,2:.19,3:.23,4:.21,5:.27};
const BANDS=['Not started','Not yet','Developing','Proficient','Exam-ready'];
const LABFOR={'1.1':'phish','2.1':'risk','2.3':'floor','2.4':'badge','3.3':'zone','3.4':'acl','3.5':'siem','4.2':'hash','4.4':'auth','5.2':'chmod','5.3':'cipher','5.4':'cipher'};
let U=[],T={},ITEMS=[],FRQ=[],V={name:'home'},Q=null,F=null,timer=null;
let sampleFn=null,dbRef=null,saving=false,pending=false,saveT=null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- state ---------- */
const blank=()=>({v:1,created:Date.now(),topics:{},skills:{'1':{r:25,n:0,c:0},'2':{r:25,n:0,c:0},'3':{r:25,n:0,c:0}},sub:{},tk:{},lessons:{},labs:{},attempts:[],cards:{},custom:[],tests:[],gen:{},days:{}});
let S=blank();
function merge(o){const b=blank();for(const k in b)if(o&&o[k]!==undefined)b[k]=o[k];return b}
try{const l=localStorage.getItem('apcyber');if(l)S=merge(JSON.parse(l))}catch(e){}
function save(){if(!saveT)saveT=setTimeout(()=>{saveT=null;flush()},800)}
addEventListener('pagehide',()=>{try{localStorage.setItem('apcyber',JSON.stringify(S))}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT){clearTimeout(saveT);saveT=null;flush()}});
async function flush(){
  try{localStorage.setItem('apcyber',JSON.stringify(S))}catch(e){}
  if(!dbRef)return;
  if(saving){pending=true;return}
  saving=true;
  try{await dbRef.set({v:1,at:Date.now(),json:JSON.stringify(S)});$('#saveState').textContent='Saved to your account'}
  catch(e){$('#saveState').textContent='Save failed, kept on this device'}
  saving=false;if(pending){pending=false;flush()}
}
async function connect(){
  const C=window.claude;
  if(!C||!C.use){$('#saveState').textContent='Saved on this device';return}
  C.use('sample').then(s=>{sampleFn=s;renderTutor()}).catch(()=>{});
  C.use('downloads').then(d=>{dlFn=d;if(V.name==='progress')render()}).catch(()=>{});
  try{
    const [user,db]=await Promise.all([C.use('user'),C.use('db')]);
    const uid=user?await user.id():null;
    if(!db||!uid){$('#saveState').textContent='Saved on this device';return}
    dbRef=db.doc('data/users/'+uid+'/state');
    const snap=await Promise.race([dbRef.get(),new Promise((_,r)=>setTimeout(()=>r('t'),10000))]);
    if(snap.exists){const d=snap.data();if(d&&d.json){const r=merge(JSON.parse(d.json));if(r.attempts.length>=S.attempts.length)S=r}}
    $('#saveState').textContent='Saved to your account';render();
    if(!snap.exists)flush();
  }catch(e){$('#saveState').textContent='Saved on this device'}
}

/* ---------- mastery ---------- */
function elo(o,d,s,K){const D=25+20*d,E=1/(1+10**((D-o.r)/40));o.r=clamp(o.r+K*(s-E),0,100);o.n++;if(s>=1)o.c++;o.last=Date.now()}
function record(it,ok,ctx,K){
  const t=it.t,cat=String(it.skill||'1')[0];
  S.topics[t]=S.topics[t]||{r:25,n:0,c:0,last:0};
  elo(S.topics[t],it.d||2,ok?1:0,K);elo(S.skills[cat],it.d||2,ok?1:0,K*.6);
  const sk=it.skill||cat;S.sub[sk]=S.sub[sk]||{n:0,c:0};S.sub[sk].n++;if(ok)S.sub[sk].c++;
  S.tk[t]=S.tk[t]||{};S.tk[t][cat]=S.tk[t][cat]||{n:0,c:0};S.tk[t][cat].n++;if(ok)S.tk[t][cat].c++;
  S.attempts.push({i:it.id,t,ok:ok?1:0,ts:Date.now(),c:ctx});if(S.attempts.length>300)S.attempts=S.attempts.slice(-300);
  const d=today();S.days[d]=(S.days[d]||0)+1;save();
}
function eff(t){const o=S.topics[t];if(!o||!o.n)return 0;const days=(Date.now()-o.last)/DAY;return clamp(Math.round(o.r-(days>21?Math.floor((days-21)/7):0)),0,100)}
function band(t){const o=S.topics[t];if(!o||!o.n)return 0;const m=eff(t);return m<50?1:m<70?2:m<85?3:4}
function masteryPct(){let s=0;for(const u of U){const w=UW[u.unit]/u.topics.length;for(const t of u.topics)s+=w*eff(t.id)}return s}
function predict(){
  const mocks=S.tests.filter(x=>x.kind==='mock').slice(-2);const mp=masteryPct();
  let comp=mp,conf='low';
  if(mocks.length){const avg=mocks.reduce((a,x)=>a+x.pct,0)/mocks.length;comp=.6*avg+.4*mp;conf=mocks.length>1?'high':'medium'}
  const score=comp>=75?5:comp>=60?4:comp>=45?3:comp>=30?2:1;
  return {score,comp:Math.round(comp),conf,mocks:mocks.length,mp:Math.round(mp)};
}
function nextActions(){
  const out=[];const all=U.flatMap(u=>u.topics);
  const firstNew=all.find(t=>!S.lessons[t.id]);
  if(firstNew)out.push({txt:`Start lesson ${firstNew.id}: ${firstNew.title}`,go:()=>openTopic(firstNew.id)});
  const due=dueCards().length;if(due)out.push({txt:`Review ${due} flashcard${due>1?'s':''} due today`,go:()=>startCards()});
  const tried=all.filter(t=>S.topics[t.id]?.n).map(t=>({t,score:(100-eff(t.id))*UW[t.unit]*(1+(Date.now()-(S.topics[t.id].last||0))/DAY/14)})).sort((a,b)=>b.score-a.score);
  for(const x of tried.slice(0,3)){if(out.length>=3)break;const lab=LABFOR[x.t.id];
    out.push(lab&&!(S.labs[lab]>=100)?{txt:`Lab: ${LABS[lab].title} (${x.t.id} at ${eff(x.t.id)}%)`,go:()=>openLab(lab)}:{txt:`Drill ${x.t.id} ${x.t.title} (${eff(x.t.id)}%)`,go:()=>drill(x.t.id)})}
  if(out.length<3&&!S.tests.some(x=>x.kind==='diag'))out.push({txt:'Take the 30-question diagnostic',go:()=>startTest('diag')});
  if(out.length<3)out.push({txt:'Full mock exam: 60 MCQ + FRQ',go:()=>startTest('mock')});
  return out.slice(0,3);
}

/* ---------- flashcards ---------- */
const IV=[0,1,2,4,8,16,30];
function allCards(){const out=[];for(const u of U)for(const t of u.topics)if(S.lessons[t.id])for(const [a,b] of t.terms)out.push({k:t.id+'|'+a,f:a,b,t:t.id});S.custom.forEach((c,i)=>out.push({k:'c|'+i,f:c.f,b:c.b,t:c.t||''}));return out}
function dueCards(){const now=Date.now();return allCards().filter(c=>{const s=S.cards[c.k];return !s||s.due<=now}).slice(0,30)}

/* ---------- routing ---------- */
const TABS=['home','learn','labs','practice','tests','progress'];
function route(){const h=location.hash.slice(1);if(Q&&Q.lock&&!Q.done)return;V={name:TABS.includes(h)?h:'home'};render()}
window.addEventListener('hashchange',route);
document.querySelectorAll('#nav a,.brand').forEach(a=>a.addEventListener('click',()=>{if(location.hash===a.getAttribute('href'))setTimeout(route)}));
function go(v){V=v;render();window.scrollTo(0,0)}
function render(){
  if(!U.length)return;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+(TABS.includes(V.name)?V.name:V.tab||'')));
  $('#rail').classList.toggle('lock',!!(Q&&Q.lock&&!Q.done&&(V.name==='quiz'||V.name==='frq')));

function warmup(){const tried=U.flatMap(u=>u.topics).filter(t=>S.topics[t.id]?.n||S.lessons[t.id]);const pool=(tried.length?tried:U[0].topics).sort((a,b)=>eff(a.id)-eff(b.id)).slice(0,6).flatMap(t=>t.items);startQuiz({title:'Warm-up',items:pick(pool,5),mode:'practice',ctx:'warm',back:{name:'home'}})}

/* ---------- quiz runner ---------- */
function prep(it){return {...it,order:shuffle([0,1,2,3])}}
function startQuiz(o){

}
function tick(){if(!Q||Q.done){clearInterval(timer);return}const left=Math.max(0,Q.end-Date.now());const e=$('#qtimer');if(e){const m=Math.floor(left/6e4),s=Math.floor(left/1e3)%60;e.textContent=`${m}:${String(s).padStart(2,'0')}`;e.classList.toggle('warn',left<5*6e4)}if(left<=0){clearInterval(timer);submitQuiz(true)}}
function vQuiz(){
  const it=Q.items[Q.i],n=Q.items.length,a=Q.ans[Q.i],prac=Q.mode==='practice',locked=prac&&a!==null;
  const ci=it.order.indexOf(it.a);
  const opts=it.order.map((oi,k)=>{let c='';if(locked){if(k===ci)c='right';else if(k===a)c='wrong'}else if(a===k)c='sel';return `<button class="opt ${c}" ${locked?'disabled':''} ${H(()=>choose(k))}><span class="k">${'ABCD'[k]}</span><span>${esc(it.opts[oi])}</span></button>`}).join('');
  const fb=locked?`<div class="fb ${a===ci?'ok':'no'}"><b>${a===ci?'Correct.':'Not quite.'}</b> ${esc(it.why)}${a!==ci?` <span class="mut">Answer: ${'ABCD'[ci]}.</span>`:''}</div>`:'';
  const nav=prac?`<div class="row" style="margin-top:16px"><span class="mut small">${Q.ans.filter(x=>x!==null).length}/${n} answered</span><span class="sp"></span>${locked?`<button class="btn ghost" ${H(()=>openTutor(`I got this question ${a===ci?'right':'wrong'} and want to understand it better: "${it.stem}" The correct answer is "${it.opts[it.a]}". Explain why, and why the other options are wrong.`))}>Ask tutor why</button><button class="btn pri" ${H(()=>{if(Q.i<n-1){Q.i++;render()}else submitQuiz()})}>${Q.i<n-1?'Next':'Finish'}</button>`:''}</div>`
  :`<div class="row" style="margin-top:16px"><button class="btn" ${Q.i?'':'disabled'} ${H(()=>{Q.i--;render()})}>Prev</button><button class="btn ghost" ${H(()=>{Q.flag[Q.i]=!Q.flag[Q.i];render()})}>${Q.flag[Q.i]?'Unflag':'Flag'}</button><span class="sp"></span>${Q.i<n-1?`<button class="btn" ${H(()=>{Q.i++;render()})}>Next</button>`:''}<button class="btn pri" ${H(()=>{const left=Q.ans.filter(x=>x===null).length;if(left&&!Q.confirm){Q.confirm=1;toast(`${left} unanswered. Press Submit again to finish.`);return}submitQuiz()})}>Submit</button></div>
  <div class="dots" style="margin-top:14px">${Q.items.map((_,k)=>`<button class="${Q.ans[k]!==null?'a':''} ${Q.flag[k]?'f':''} ${k===Q.i?'cur':''}" ${H(()=>{Q.i=k;render()})} aria-label="Question ${k+1}">${k+1}</button>`).join('')}</div>`;
  return `<div class="col"><div class="qhead"><b style="font-family:'Inter Tight',sans-serif;font-size:20px">${esc(Q.title)}</b><span class="tag">Q ${Q.i+1} of ${n}</span>${Q.timeMin?'<span id="qtimer">--:--</span>':''}<span class="sp"></span><button class="btn sm ghost" ${H(quitQuiz)}>${Q.lock?'Abandon test':'Exit'}</button></div>
  <div class="card"><div class="row" style="margin-bottom:10px"><span class="tag">${it.t} · ${SKN[String(it.skill)[0]]} ${esc(it.skill)}</span><span class="tag">${'●'.repeat(it.d||2)}${'○'.repeat(3-(it.d||2))}</span>${it.ai?'<span class="tag">AI-written</span>':''}</div>
  <p class="stem">${esc(it.stem)}</p><div class="opts">${opts}</div>${fb}${nav}</div></div>`;
}
function choose(k){const it=Q.items[Q.i];if(Q.mode==='practice'){if(Q.ans[Q.i]!==null)return;Q.ans[Q.i]=k;record(it,k===it.order.indexOf(it.a),Q.ctx,10)}else{Q.ans[Q.i]=k;Q.confirm=0}render();if(Q.timeMin)tick()}
function quitQuiz(){if(Q.lock&&!Q.confirmQuit){Q.confirmQuit=1;toast('Press Abandon again to leave. Nothing will be scored.');return}clearInterval(timer);const b=Q.back;Q=null;go(b||{name:'home'})}
function submitQuiz(timeUp){
  clearInterval(timer);Q.done=true;
  let correct=0;const bySk={};
  Q.items.forEach((it,k)=>{const ok=Q.ans[k]===it.order.indexOf(it.a);if(ok)correct++;const c=String(it.skill)[0];bySk[c]=bySk[c]||{n:0,c:0};bySk[c].n++;if(ok)bySk[c].c++;if(Q.mode==='test')record(it,ok,Q.ctx,14)});
  const r={correct,n:Q.items.length,pct:Math.round(100*correct/Q.items.length),bySk,timeUp};
  Q.result=r;
  if(Q.kind){S.tests.push({kind:Q.kind,label:Q.title,ts:Date.now(),pct:r.pct,mcq:r.pct,n:r.n,correct});if(S.tests.length>60)S.tests=S.tests.slice(-60);save()}
  Q.extra=Q.onDone?Q.onDone(r):'';

  go({name:'result',tab:Q.back?.tab||Q.back?.name});
}
function vResult(){

  <div class="row" style="margin-top:16px"><button class="btn pri" ${H(()=>{const b=Q.back;Q=null;go(b||{name:'home'})})}>Done</button>${miss.length?`<button class="btn" ${H(()=>{const items=miss.map(x=>{const {order,...rest}=x.it;return rest});startQuiz({title:'Retry misses',items,mode:'practice',ctx:'retry',back:Q.back})})}>Retry misses</button>`:''}</div></div>`;

function byUnit(u){return ITEMS.filter(i=>i.unit===u)}
function startTest(kind,arg){
  let items,title=TESTS[kind],min;
  if(kind==='topic'){const t=T[arg];items=shuffle(t.items).concat(pick(byUnit(t.unit).filter(i=>i.t!==t.id),2));title=`Topic quiz ${t.id}`;min=15}
  else if(kind==='unit'){items=pick(byUnit(arg),25);title=`Unit ${arg} test`;min=35}

  else{const n={1:5,2:11,3:14,4:13,5:17};items=shuffle(U.flatMap(u=>pick(byUnit(u.unit),n[u.unit])));min=80}
  startQuiz({title,items:shuffle(items),mode:'test',timeMin:min,ctx:kind,kind,back:{name:'tests'},then:kind==='mock'?r=>{const f=FRQ[Math.floor(Math.random()*FRQ.length)];startFRQ(f.id,{mode:'mock',mcq:r})}:null});

  const cols=[[L,'Topic'],[L+40,'Title'],[L+300,'Mastery'],[L+360,'Analyze'],[L+420,'Mitigate'],[L+478,'Detect']];
  cols.forEach(([x,h])=>tx(h,x,8.5,true,[90,98,106]));y+=6;d.setDrawColor(184,193,200);d.line(L,y,R,y);y+=12;
  for(const t of all){nl(14);const m=S.topics[t.id]?.n?eff(t.id)+'%':'-';tx(t.id,L,9.5,true);tx(t.title.length>46?t.title.slice(0,44)+'...':t.title,L+40,9.5);tx(m,L+300,9.5,true);tx(cell(t.id,'1'),L+360,9.5);tx(cell(t.id,'2'),L+420,9.5);tx(cell(t.id,'3'),L+478,9.5);y+=14}
  y+=12;nl(40);tx('Recent tests',L,13,true);y+=16;
  const h=S.tests.slice().reverse().slice(0,10);if(!h.length){tx('No tests yet.',L,10,false,[90,98,106]);y+=14}
  h.forEach(x=>{nl(14);tx(new Date(x.ts).toISOString().slice(0,10),L,9.5);tx(x.label,L+80,9.5);tx(x.pct+'%'+(x.kind==='mock'&&x.frq!=null?`  (MCQ ${x.mcq}%, FRQ ${x.frq}%)`:''),L+330,9.5,true);y+=14});
  y+=12;nl(40);tx('Where misses cluster (last 60 misses)',L,13,true);y+=16;
  const mt={};S.attempts.filter(a=>!a.ok).slice(-60).forEach(a=>mt[a.t]=(mt[a.t]||0)+1);const ml=Object.entries(mt).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!ml.length){tx('No misses yet.',L,10,false,[90,98,106]);y+=14}ml.forEach(([t,n])=>{nl(14);tx(`${t}  ${T[t]?.title||'FRQ practice'}`,L,9.5);tx(`${n}`,L+330,9.5,true);y+=14});
  const pages=d.getNumberOfPages();for(let i=1;i<=pages;i++){d.setPage(i);d.setFontSize(8);d.setTextColor(120,128,136);d.text(`AP Cyber Lab | page ${i} of ${pages}`,L,770)}
  return d.output('blob');
}
async function pdfReport(e,el){if(!dlFn)return;el.disabled=true;el.textContent='Building…';
  try{const J=await loadJsPDF();const blob=buildPDF(J);await dlFn.save({filename:`ap-cyber-progress-${today()}.pdf`,data:blob});toast('Report saved')}
  catch(err){toast(err&&err.code==='declined'?'Download cancelled':err&&err.code==='rate_limited'?'A save prompt is already open':'Could not create the report')}
  el.disabled=false;el.textContent='Download PDF report'}

/* ---------- tutor ---------- */
const MODES={explain:'Explain',socratic:'Socratic',quiz:'Quiz me',grade:'Grade my answer',coach:'Exam coach'};
let TM='explain',MSG=[],TB=false;
function openTutor(q){if(Q&&Q.lock&&!Q.done)return;$('#tutor').classList.add('on');renderTutor();if(q){$('#tIn').value=q;$('#tIn').focus()}}
function closeTutor(){$('#tutor').classList.remove('on')}
$('#askBtn').onclick=()=>openTutor();$('#tClose').onclick=closeTutor;$('#tClear').onclick=()=>{MSG=[];renderTutor()};
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>')}
function renderTutor(){
  $('#tModes').innerHTML=Object.entries(MODES).map(([k,l])=>`<button type="button" class="${k===TM?'on':''}" data-m="${k}">${l}</button>`).join('');
  $('#tModes').querySelectorAll('button').forEach(b=>b.onclick=()=>{TM=b.dataset.m;renderTutor()});
  const intro=sampleFn?`<div class="m a">Ask me anything about the AP Cybersecurity course. I can see which screen and topic you're on, plus your recent misses.<br><br><b>Modes:</b> Explain · Socratic (I guide you with questions) · Quiz me · Grade my answer (paste an FRQ response) · Exam coach.</div>`:`<div class="m a">The tutor runs on Claude and works when this page is opened on claude.ai while you're signed in.</div>`;
  $('#tMsgs').innerHTML=intro+MSG.map((m,i)=>`<div class="m ${m.role==='user'?'u':'a'}">${md(m.content)}${m.role==='assistant'&&m.content&&!TB?`<div style="margin-top:6px"><button class="btn sm ghost" data-card="${i}" type="button">Save as flashcard</button></div>`:''}</div>`).join('');
  $('#tMsgs').querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const i=+b.dataset.card;const q=MSG[i-1]?.content||'Tutor note';S.custom.push({f:q.slice(0,140),b:MSG[i].content.slice(0,600),t:curTopic()||''});save();toast('Saved to flashcards')});
  const box=$('#tMsgs');box.scrollTop=box.scrollHeight;
}
function curTopic(){if(V.name==='topic')return V.id;if(V.name==='lab')return LABS[V.id].topics[0];if(V.name==='quiz'&&Q&&Q.items)return Q.items[Q.i]?.t;return null}
function tutorSystem(){
  const t=curTopic(),miss=S.attempts.filter(a=>!a.ok).slice(-5).map(a=>{const it=ITEMS.find(x=>x.id===a.i)||findGen(a.i);return it?`- [${it.t}] ${it.stem}`:''}).filter(Boolean).join('\n');
  const mast=U.flatMap(u=>u.topics).filter(x=>S.topics[x.id]?.n).map(x=>`${x.id}:${eff(x.id)}%`).join(', ')||'no practice yet';
  return `You are the AMA tutor inside "AP Cyber Lab", a study app for the College Board AP Cybersecurity course (first exam May 2027: 60 MCQ 70% + 1 Device Security Analysis FRQ 30%; skills Analyze Risk, Mitigate Risk, Detect Attacks).
Course topics: ${U.map(u=>`Unit ${u.unit} ${u.title}: `+u.topics.map(x=>x.id+' '+x.title).join('; ')).join(' | ')}.
Mode: ${MODES[TM]}. ${{explain:'Explain clearly at a high-school level, with one concrete example.',socratic:'Do not give the answer. Ask one guiding question at a time and build on the reply.',quiz:'Ask the learner one scenario-based AP-style multiple-choice question (A-D) at a time on the current or weakest topic; after they answer, say if it is right and why, then offer the next.',grade:'Score the pasted response against AP task verbs (Identify, Describe, Explain, Determine, Write). Say what earned credit, what evidence is missing, and give a point estimate. If no question was given, ask for it.',coach:'Give exam strategy: pacing (about 1.33 min per MCQ, 50 min for the FRQ), eliminating distractors, citing evidence from sources, reading firewall rule order and logs.'}[TM]}
Rules: keep answers under 180 words unless asked for more. Tag the relevant topic IDs like (→ 3.4). Stay inside AP Cybersecurity scope; say so briefly if a question is outside it. Defensive and conceptual only: explain how attacks work at a conceptual level and how to detect and mitigate them; refuse step-by-step instructions, exploit code, or commands for attacking real systems, and point to the app's sandbox labs instead. Never give a full FRQ answer before the learner has attempted it. Plain text with **bold** for key terms; no headings.
Learner context: screen=${V.name}${t?`, current topic=${t} ${T[t]?.title}`:''}; mastery: ${mast}.${miss?`\nRecent misses:\n${miss}`:''}`;
}
$('#tForm').onsubmit=async e=>{e.preventDefault();const v=$('#tIn').value.trim();if(!v||TB)return;if(!sampleFn){toast('Tutor available on claude.ai');return}
  MSG.push({role:'user',content:v});$('#tIn').value='';MSG.push({role:'assistant',content:'Thinking…'});TB=true;renderTutor();
  const conv=MSG.slice(0,-1).slice(-12).map((m,i)=>({role:m.role,content:m.content}));if(conv[0].role!=='user')conv.shift();
  conv[0]={role:'user',content:tutorSystem()+'\n\nLearner: '+conv[0].content};
  const last=MSG[MSG.length-1];
  try{const r=await sampleFn(conv,{cache:false,onText:({text})=>{last.content=text;const els=$('#tMsgs').querySelectorAll('.m.a');const el=els[els.length-1];if(el){el.innerHTML=md(text);$('#tMsgs').scrollTop=1e9}}});last.content=r.text||last.content}
  catch(err){last.content=err&&err.code==='rate_limited'?'Too many requests right now. Try again in a minute.':err&&err.code==='not_granted'?'The tutor needs permission to use Claude in this page.':'Sorry, something went wrong. Try again.'}
  TB=false;renderTutor();
};
$('#tIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#tForm').requestSubmit()}});

/* ---------- boot ---------- */
(async()=>{
  try{
    const us=await Promise.all([1,2,3,4,5].map(n=>fetch(`data/u${n}.json`).then(r=>r.json())));
    FRQ=await fetch('data/frq.json').then(r=>r.json());
    const xs=await Promise.all([1,2,3,4,5].map(n=>fetch(`data/x${n}.json`).then(r=>r.ok?r.json():{topics:{}}).catch(()=>({topics:{}}))));
    U=us.map((u,ui)=>({...u,topics:u.topics.map(t=>({...t,unit:u.unit,items:t.items.concat((xs[ui].topics||{})[t.id]||[]).filter(i=>i&&i.stem&&Array.isArray(i.opts)&&i.opts.length===4).map(i=>({...i,t:t.id,unit:u.unit}))}))}));
    for(const u of U)for(const t of u.topics){T[t.id]=t;ITEMS.push(...t.items)}
    route();renderTutor();connect();
  }catch(e){$('#view').innerHTML='<div class="card"><h2>Could not load the curriculum</h2><p class="mut">Reload the page to try again.</p></div>'}
})();
}
</script>
