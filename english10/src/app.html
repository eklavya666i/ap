<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English 10H</title>
<!--__HEAD__-->
<!--__FONTS__-->
<style>
/* English 10H. Look and plumbing (storage, backup, offline worker, safe updates, install note) come from Math 6 and SAT Daily. */
:root{color-scheme:light;--bg:#fbfaf7;--card:#fff;--ink:#17181c;--soft:#5d6068;--line:#e3e1db;--panel:#f2f1ec;--accent:#5b21b6;--accentbg:#efe9fb;--onaccent:#fff;--ok:#127a45;--okbg:#e8f5ee;--pen:#c8102e;--penbg:#fcebee;--warn:#b45309;--warnbg:#fdf3e6;--gold:#b7791f;--hl:#fff3b0}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111317;--card:#181b20;--ink:#ecebe6;--soft:#a6a9b0;--line:#2c3038;--panel:#1d2026;--accent:#b4a0ff;--accentbg:#241c3d;--onaccent:#140d2b;--ok:#4cc685;--okbg:#13261b;--pen:#ff6b6b;--penbg:#2b1518;--warn:#f59e0b;--warnbg:#2a2010;--gold:#e0b453;--hl:#4a4110}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
body.big{font-size:19px}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.band{background:var(--accent);color:var(--onaccent);padding:calc(12px + env(safe-area-inset-top)) max(4vw,16px,env(safe-area-inset-right)) 12px max(4vw,16px,env(safe-area-inset-left))}
.band .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap}
h1{font:800 clamp(28px,5vw,40px)/1 Archivo,system-ui,sans-serif;font-stretch:82%;letter-spacing:-.02em;margin:0}
h1 small{display:block;font:600 13px/1.3 Archivo,system-ui,sans-serif;letter-spacing:.02em;opacity:.9;margin-top:4px;font-stretch:100%}
.stats{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.stat b{font:800 24px/1 Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:600;opacity:.92}
.xpbar{width:120px;height:7px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:currentColor}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .in{max-width:1100px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px max(4vw,12px)}
nav a{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:44px;min-width:48px;padding:0 14px;border-radius:10px;color:var(--soft);font-weight:700;text-decoration:none}
nav a[aria-current=page]{background:var(--accentbg);color:var(--accent)}
nav a.gear{margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:18px max(4vw,16px,env(safe-area-inset-left)) 40px}
h2{font:800 26px/1.15 Archivo,system-ui,sans-serif;margin:4px 0 6px}
h3{font:800 20px/1.2 Archivo,system-ui,sans-serif;margin:4px 0 8px}
h4{margin:14px 0 6px;font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.lead{color:var(--soft);margin:0 0 16px;max-width:66ch}
.meta{font-size:14px;color:var(--soft);margin:6px 0 0}
.crumb{font-size:14px;margin:0 0 6px}.crumb a{text-decoration:none;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.card.hi{border:2px solid var(--accent)}
.card.note{background:var(--warnbg);border-color:transparent}
.card.okc{background:var(--okbg);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:11px;border:2px solid var(--accent);background:var(--accent);color:var(--onaccent);font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:0 14px;font-size:15px}
.btn.warn{border-color:var(--pen);background:transparent;color:var(--pen)}
.btn[disabled]{opacity:.45;cursor:default}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:var(--panel);color:var(--soft);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.tip{background:var(--warnbg);color:var(--warn)}.chip.fix{background:var(--penbg);color:var(--pen)}.chip.ac{background:var(--accentbg);color:var(--accent)}
.pill{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:10px;background:var(--accentbg);color:var(--accent)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line);padding:6px 0}
.list li:last-child{border-bottom:0}
.list a.go{flex:1;display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-height:44px}
.list .n{font-weight:800;font-variant-numeric:tabular-nums;color:var(--u,var(--accent));min-width:2.2em}
.list .t{flex:1}
.list .s{font-size:13px;color:var(--soft)}
.locked{opacity:.5}
[hidden]{display:none!important}
.list li.term{display:block}
.ltabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 14px}
.ltabs a{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;font-weight:700;color:var(--soft);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.ltabs a[aria-current=page]{color:var(--accent);border-bottom-color:var(--accent)}
.unit{border-top:6px solid var(--u)}
.prose{font:400 19px/1.6 "Source Serif 4",Georgia,serif;max-width:68ch}
body.big .prose{font-size:21px}
.prose p{margin:0 0 12px}
ul.tight{margin:6px 0 0;padding-left:1.3em}ul.tight li{margin:4px 0}
.quiet{color:var(--soft)}
.lensm{border-left:5px solid var(--l,var(--accent));background:var(--panel);border-radius:10px;padding:10px 14px;margin:10px 0}
.track{list-style:none;padding:0;margin:8px 0 0}.track li{display:flex;gap:10px;padding:4px 0}.track b{min-width:3.4em;color:var(--accent);font-variant-numeric:tabular-nums}
.spoiler{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--soft);font-style:italic}
details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}details summary::before{content:"▸";margin-right:8px;color:var(--accent)}details[open] summary::before{content:"▾"}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px;margin:10px 0}
label.f span.h{font-weight:500;color:var(--soft);font-size:13.5px}
select,input[type=text],input[type=date],input[type=password],input[type=search],input[type=number]{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;max-width:100%}
textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;background:var(--card);padding:10px 12px;font:400 18px/1.55 "Source Serif 4",Georgia,serif;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.draft{min-height:340px}
.wc{font-size:13px;color:var(--soft);text-align:right;margin-top:4px}
.tog{display:flex;gap:10px;align-items:center;min-height:44px}.tog input{width:22px;height:22px}
/* questions */
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stem{font:500 20px/1.5 "Source Serif 4",Georgia,serif;margin:10px 0}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);cursor:pointer;font:500 18px/1.4 "Source Serif 4",Georgia,serif}
.choice .key{font:800 14px Archivo,system-ui,sans-serif;color:var(--soft);min-width:1.4em}
.choice.sel{border-color:var(--accent);background:var(--accentbg)}
.choice.right{border-color:var(--ok);background:var(--okbg)}.choice.wrong{border-color:var(--pen);background:var(--penbg)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--ok);background:var(--okbg)}
.fb.bad{border-color:var(--pen);background:var(--penbg)}
.tesbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 10px;padding:8px 12px;border-radius:12px;background:var(--panel)}
.timer{font:800 22px Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums}.timer.low{color:var(--pen)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin:10px 0}
.sheet button{min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700;cursor:pointer}
.sheet button.ans{border-color:var(--accent);background:var(--accentbg)}.sheet button.cur{box-shadow:0 0 0 2px var(--accent)}
.big{font:800 26px Archivo,system-ui,sans-serif}
.rlist{list-style:none;padding:0;margin:10px 0}
.rlist li{border-bottom:1px solid var(--line);padding:6px 0}
.rlist summary{gap:10px}
.rlist .mark{font-weight:800;width:1.4em}.rlist .ok .mark{color:var(--ok)}.rlist .no .mark{color:var(--pen)}
.bars{display:grid;grid-template-columns:minmax(90px,auto) 1fr 48px;gap:8px 10px;align-items:center;font-size:14px;margin-top:8px}
.bar{display:block;height:10px;border-radius:5px;background:var(--panel);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;max-width:420px;margin-top:8px}
.heat a{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:6px;background:var(--panel);font-size:12px;font-weight:700;color:var(--soft);text-decoration:none}
.heat a.g{background:var(--ok);color:#fff}.heat a.m{background:#9fd8b6;color:#103b25}.heat a.w{background:#f59e0b;color:#3a2200}.heat a.r{background:var(--pen);color:#fff}
/* check */
.areas{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.marked{white-space:pre-wrap;font:400 18px/1.7 "Source Serif 4",Georgia,serif;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:60vh;overflow:auto}
mark{background:transparent;color:inherit;border-radius:3px;padding:0 1px}
mark.f{background:var(--penbg);box-shadow:inset 0 -2px 0 var(--pen)}
mark.t{background:var(--warnbg);box-shadow:inset 0 -2px 0 var(--warn)}
mark.on{background:var(--hl)}
.finding{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.finding:last-child{border-bottom:0}
.finding .sev{flex:0 0 auto;margin-top:2px}
.finding .h{display:block;font-size:14px;color:var(--soft)}
.goods li{color:var(--ok)}
.tcheck{list-style:none;padding:0;margin:8px 0 0}.tcheck li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.tcheck .y{color:var(--ok);font-weight:800}.tcheck .x{color:var(--pen);font-weight:800}
.tcheck .h{display:block;font-size:13.5px;color:var(--soft)}
.ann{border-left:6px solid var(--c,var(--accent))}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c,var(--accent));flex:0 0 auto}
span.check{display:inline-flex;align-items:center;justify-content:center;cursor:default}
.tbl td.score{white-space:nowrap;color:var(--accent);letter-spacing:1px}
.rub{width:100%;border-collapse:separate;border-spacing:6px;margin-top:6px}
.rub th{text-align:left;font-size:14px;vertical-align:top;padding:6px 4px;min-width:110px}
.rub td{vertical-align:top}
.rub button{width:100%;min-height:64px;text-align:left;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:13.5px;line-height:1.35;cursor:pointer}
.rub button b{display:block;font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.rub button.on{border-color:var(--accent);background:var(--accentbg)}
.rubwrap{overflow-x:auto}
@media (max-width:760px){.rub,.rub tbody,.rub tr,.rub th,.rub td{display:block}.rub td{margin:4px 0}.rub tr{margin-bottom:10px}}
.model{font:400 18px/1.6 "Source Serif 4",Georgia,serif;background:var(--panel);border-radius:12px;padding:12px 14px}
.frame{display:block;width:100%;text-align:left;font:500 17px/1.45 "Source Serif 4",Georgia,serif;padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;background:var(--bg);cursor:pointer;margin:6px 0}
.outline fieldset{border:1px solid var(--line);border-radius:12px;padding:6px 14px 10px;margin:0 0 12px}
.outline legend{font-weight:800;padding:0 6px}
.outline textarea{min-height:70px;font-size:17px}
.steps{list-style:none;padding:0;margin:8px 0 0}
.steps li{display:flex;gap:12px;align-items:center;min-height:52px;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .d{font-size:13px;color:var(--soft);min-width:6.5em}
.steps .t,.steps .rs{flex:1}
.steps .done .t{text-decoration:line-through;color:var(--soft)}
.steps .today{background:var(--accentbg);border-radius:8px}
.check{width:28px;height:28px;flex:0 0 auto;border-radius:8px;border:2px solid var(--accent);background:transparent;cursor:pointer;font-weight:800;color:var(--onaccent)}
.check.on{background:var(--accent)}
.flip{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.flip .front{font:800 30px/1.2 Archivo,system-ui,sans-serif}
.flip .back{font:400 19px/1.5 "Source Serif 4",Georgia,serif;max-width:56ch}
.qlog{border-left:4px solid var(--accent);padding:6px 12px;margin:8px 0;background:var(--panel);border-radius:0 10px 10px 0}
.qlog q{font:italic 400 18px/1.5 "Source Serif 4",Georgia,serif}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.tagb{min-height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:18px;background:var(--bg);cursor:pointer;font-size:14px;font-weight:700}
.tagb.on{border-color:var(--accent);background:var(--accentbg);color:var(--accent)}
.goals{list-style:none;padding:0;margin:8px 0 0}.goals li{display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:36px}
.goals li.done{color:var(--ok)}.gbar{width:90px;height:8px;border-radius:4px;background:var(--panel);overflow:hidden;flex:0 0 auto}.gbar i{display:block;height:100%;background:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(7,22px);grid-auto-flow:column;gap:4px;max-width:260px;margin-top:10px}
.cal i{border-radius:4px;background:var(--panel)}.cal i.on{background:var(--ok)}.cal i.fz{background:#7dd3fc}.cal i.today{outline:2px solid var(--accent)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{font-size:12.5px;padding:4px 10px;border-radius:12px;border:1px dashed var(--line);color:var(--soft)}
.bdg.got{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accentbg)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.inst{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--accentbg);border-radius:12px;padding:12px 16px;margin:0 0 14px}
.inst span{display:block;color:var(--soft);font-size:15px}
pre.email{white-space:pre-wrap;font:400 16px/1.5 "Source Serif 4",Georgia,serif;background:var(--panel);border-radius:12px;padding:12px 14px;margin:8px 0}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.xppop{position:fixed;right:max(24px,env(safe-area-inset-right));top:calc(78px + env(safe-area-inset-top));z-index:30;font:800 18px Archivo,system-ui,sans-serif;color:#fff;background:var(--gold);padding:4px 12px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.18);pointer-events:none;animation:pop 1.2s ease forwards}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{top:105vh;opacity:.4}}
footer{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px) 30px;color:var(--soft);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
