<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rational Prep Detailed</title>
<meta name="theme-color" content="#1f3fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alg 2 Detailed">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f3fbf'/%3E%3Crect x='14' y='29' width='36' height='6' rx='3' fill='white'/%3E%3Ccircle cx='32' cy='18' r='5' fill='white'/%3E%3Ccircle cx='32' cy='46' r='5' fill='%23ffc94a'/%3E%3C/svg%3E">
<style>
/* VOICE everyday study tool for a sophomore: focused, encouraging, a little game-like
   IDEA the same graph-paper notebook as the Algebra app, now with a scorecard: level, streak, medals
   PICTURE the question card with big textbook math and a calculator keypad under it
   COLOUR white paper with a faint grid, ink #15171c, deeper pen blue #1f3fbf, red pen #c9352a, green #0d7f52, gold #b8860b for rewards
   TYPE Iowan Old Style / Palatino headings, system sans UI, Times math (all on-device, works offline)
   LAYOUT six bottom tabs; one column up to 960px; keypad beside the question on wide iPads, under it in portrait */
:root{--bg:#fbfcff;--paper:#fff;--ink:#15171c;--mute:#596071;--line:#dde3ee;--grid:rgba(31,63,191,.055);--blue:#1f3fbf;--blue2:#edf1ff;--onblue:#fff;--red:#c9352a;--red2:#fff0ee;--green:#0d7f52;--green2:#e7f6ef;--amber:#9a5b00;--amber2:#fff5e2;--gold:#b8860b;--gold2:#fff7dc;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--math:"Times New Roman","STIX Two Text",Times,serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1220;--paper:#151c2c;--ink:#e9edf6;--mute:#9ea7bc;--line:#28324d;--grid:rgba(142,166,255,.05);--blue:#8ea6ff;--blue2:#1c2648;--onblue:#0b1020;--red:#ff8073;--red2:#3a1d1d;--green:#4fd6a0;--green2:#11302a;--amber:#ffc46b;--amber2:#33280f;--gold:#ffd166;--gold2:#3a2f10;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d1220;--paper:#151c2c;--ink:#e9edf6;--mute:#9ea7bc;--line:#28324d;--grid:rgba(142,166,255,.05);--blue:#8ea6ff;--blue2:#1c2648;--onblue:#0b1020;--red:#ff8073;--red2:#3a1d1d;--green:#4fd6a0;--green2:#11302a;--amber:#ffc46b;--amber2:#33280f;--gold:#ffd166;--gold2:#3a2f10;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background-color:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
@supports (background:color-mix(in srgb,red 50%,blue)){.top{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}}
.topin{display:flex;align-items:center;gap:10px;min-height:54px}
.tt{flex:1;font-family:var(--serif);font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;align-items:center;gap:8px}
.back{border:0;background:none;color:var(--blue);font-weight:600;font-size:16px;min-height:44px;padding:0 6px 0 0;cursor:pointer;white-space:nowrap}
.chipst{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--mute);white-space:nowrap}
.chipst .ic{width:17px;height:17px}
.chipst.fl{color:var(--red)}.chipst.co{color:var(--gold)}.chipst.lv{color:var(--blue)}
main{padding:14px 0 calc(100px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tin{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));max-width:760px;margin:0 auto}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;color:var(--mute);font-size:12px;font-weight:600;cursor:pointer;position:relative}
.tab .ic{width:24px;height:24px;stroke-width:1.8}
.tab[aria-current=page]{color:var(--blue)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;min-height:48px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);text-decoration:none;text-align:center}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.btn.gold{background:var(--gold2);border-color:var(--gold);color:var(--ink)}
.btn.big{min-height:54px;padding:12px 22px;font-size:17px}
.btn.sm{min-height:44px;padding:6px 14px;font-size:15px}
.btn[disabled],.btn.off{opacity:.45;cursor:default}
.btn.on{border-color:var(--green);color:var(--green);background:var(--green2)}
.lnk{background:none;border:0;color:var(--blue);font-weight:600;padding:8px 4px;min-height:44px;cursor:pointer}
.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.h1{font-family:var(--serif);font-size:clamp(30px,4.6vw,44px);line-height:1.05;margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.h2{font-family:var(--serif);font-size:24px;line-height:1.15;font-weight:600;margin:26px 0 10px}
h3{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 8px}
.lede{font-size:18px;color:var(--mute);margin:4px 0 16px;max-width:64ch}
.meta{color:var(--mute);font-size:15px;margin:4px 0 0}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--mute);white-space:nowrap}
.bar{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.g>i{background:var(--green)}.bar.y>i{background:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
/* math */
.m{font-family:var(--math);font-size:1.16em;white-space:nowrap;line-height:1}
.m i{font-style:italic;padding-right:.02em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.18}
.fr>.nu{padding:0 .16em .06em;border-bottom:.065em solid currentColor}
.fr>.de{padding:.08em .16em 0}
.fr .fr{font-size:.92em}
.m sup{font-size:.68em;line-height:0;vertical-align:.62em;margin-left:.03em}
.m sub{font-size:.68em;line-height:0;vertical-align:-.28em}
.bin{margin:0 .2em}.rel{margin:0 .3em}
.s1{display:inline-block;width:.17em}.s2{display:inline-block;width:.3em}.s3{display:inline-block;width:1em}
.tx{font-style:normal}
.sqa{margin-left:.03em}
.lr{display:inline-flex;align-items:center;vertical-align:middle}
.lr>.dl{font-size:2em;line-height:1;font-weight:300;margin:0 .03em;transform:scaleY(1.1)}
.mb{overflow-x:auto;overflow-y:hidden;padding:6px 2px;-webkit-overflow-scrolling:touch}
.mb .m{font-size:1.3em;white-space:normal}
.nb{white-space:nowrap}
/* today */
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.badge-lv{width:74px;height:74px;border-radius:50%;background:var(--blue);color:var(--onblue);display:grid;place-items:center;font:700 30px var(--serif);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.lvl b{font-family:var(--serif);font-size:22px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px}
.quest{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .bar{flex:1;max-width:160px}
.quest.done span{color:var(--green);text-decoration:line-through}
.plan{display:grid;gap:12px}
.pcard{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--ink);min-height:76px}
.pcard .ic{width:30px;height:30px;color:var(--blue)}
.pcard b{display:block;font-family:var(--serif);font-size:19px}
.pcard span{color:var(--mute);font-size:15px}
.pcard>div{flex:1}
.pcard.hot{border-color:var(--blue);box-shadow:inset 4px 0 0 var(--blue)}
.pcard.red .ic{color:var(--red)}.pcard.gold .ic{color:var(--gold)}
.cal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:4px;max-width:300px}
.cal i{display:block;aspect-ratio:1;border-radius:4px;background:var(--line)}
.cal i.on{background:var(--green)}.cal i.fz{background:#7fb2ff}.cal i.rs{background:var(--amber2);outline:1px solid var(--amber)}.cal i.today{outline:2px solid var(--blue);outline-offset:1px}
/* skills */
.list{padding:4px 0}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 18px;min-height:62px;cursor:pointer;color:var(--ink)}
.row:last-child{border-bottom:0}
.row.static{cursor:default}
.rt{flex:1;display:flex;flex-direction:column}
.rt b{font-weight:600}
.rt>span{color:var(--mute);font-size:14px}
.rm{display:flex;align-items:center;gap:10px;width:min(38%,230px)}
.rm .bar{flex:1}
.row>.ic{width:18px;height:18px;color:var(--mute)}
.chp{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.chp.untouched{background:var(--line);color:var(--mute)}.chp.practicing{background:var(--blue2);color:var(--blue)}.chp.mastered{background:var(--green2);color:var(--green)}.chp.due{background:var(--amber2);color:var(--amber)}
.skc{display:flex;flex-direction:column;gap:8px}
.skc .row2{margin-top:auto}
/* lesson */
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:6px 0 12px}
.player{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:0 0 14px}
.player .lbl{flex:1;color:var(--mute);font-size:14px;min-width:120px}
.say{border-radius:10px;transition:background .2s}
.say.on{background:var(--amber2);box-shadow:0 0 0 6px var(--amber2)}
.hook{display:flex;gap:12px;background:var(--green2);border-radius:14px;padding:14px 16px;margin:0 0 16px}
.hook .ic{width:24px;height:24px;color:var(--green);margin-top:1px}
.hook p{margin:0}
.big{font-size:19px;margin:0 0 18px;max-width:64ch}
.keys{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 22px;align-items:center}
.kl{font-weight:600;color:var(--mute);font-size:15px}
.how{padding-left:1.4em;margin:0 0 6px;max-width:64ch}
.how li{margin:7px 0;padding-left:4px}
.traps{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
.traps li{position:relative;padding:10px 14px 10px 40px;background:var(--red2);border-radius:12px}
.traps li::before{content:"\2717";position:absolute;left:15px;top:10px;color:var(--red);font-weight:700}
.alt{background:var(--blue2);border-radius:14px;padding:14px 16px;margin:10px 0}
.ex .exh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.prob .m{font-size:1.42em}
.prob{font-size:18px}
.steps{display:grid;gap:10px;margin-top:8px}
.st{border-left:3px solid var(--blue);padding:4px 0 4px 14px}
.st .mb{padding:4px 2px}
.st .mb .m{font-size:1.24em}
.stx{margin:2px 0 0;color:var(--mute);font-size:16px}
.ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--blue2);overflow-x:auto}
.ans>b{margin-right:8px;color:var(--blue)}
.trap{display:flex;gap:8px;margin:8px 0 0;color:var(--red);font-size:16px}
.exbtn{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tag{display:inline-flex;align-items:center;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue2);border-radius:99px;padding:4px 10px;line-height:1.3}
.tag.tw{color:var(--amber);background:var(--amber2)}.tag.fresh{color:var(--green);background:var(--green2)}.tag.word{color:var(--gold);background:var(--gold2)}
/* questions */
.qwrap{display:grid;gap:14px}
@media (min-width:1000px){.qwrap.typ{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.qwrap.typ .kpcol{position:sticky;top:76px}}
.qprog{display:flex;align-items:center;gap:12px;margin:4px 0 12px;font-size:15px;color:var(--mute)}
.qprog .bar{flex:1}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.dots{display:inline-flex;gap:3px;margin-left:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}
.spk{margin-left:auto;border:0;background:none;color:var(--blue);min-width:44px;min-height:40px;cursor:pointer;display:grid;place-items:center}
.prompt{font-size:21px;line-height:1.6;margin:4px 0 14px;overflow-x:auto;overflow-y:hidden;padding:4px 0}
.prompt .m{font-size:1.2em}
.fld{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px;cursor:text;background:var(--paper)}
.fld.focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
.fld.ok{border-color:var(--green);background:var(--green2)}.fld.no{border-color:var(--red);background:var(--red2)}
.fld .fl{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;color:var(--mute)}
.fld .box{font:20px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:34px;padding:2px 0;word-break:break-all}
.fld .caret{display:inline-block;width:2px;height:1.1em;background:var(--blue);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
.fld:not(.focus) .caret{display:none}
@keyframes blink{50%{opacity:0}}
.fld .pv{min-height:30px;font-size:19px;color:var(--ink);overflow-x:auto}
.fld .pv:empty::before{content:"Preview";color:var(--mute);font-size:14px}
.quick{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:2px 12px;min-height:32px;font-size:13px;font-weight:700;cursor:pointer;color:var(--mute)}
.kp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;background:var(--blue2);border-radius:16px;padding:10px}
.kp button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font:600 21px var(--math);cursor:pointer;color:var(--ink)}
.kp button.op{color:var(--blue)}
.kp button.fn{font:700 15px var(--sans)}
.kp button.ck{grid-column:span 5;background:var(--blue);color:var(--onblue);border-color:var(--blue);font:700 18px var(--sans)}
.kp button:active{transform:translateY(1px)}
.choices{display:grid;gap:10px}
.ch{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:62px;padding:10px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);cursor:pointer;font-size:19px;color:var(--ink)}
.ch .lt{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blue2);color:var(--blue);font-weight:700;font-size:15px;font-family:var(--sans)}
.ch .ct{flex:1;overflow-x:auto;overflow-y:hidden;padding:6px 0}
.ch.sel{border-color:var(--blue);background:var(--blue2)}
.ch.ok{border-color:var(--green);background:var(--green2)}.ch.ok .lt{background:var(--green);color:var(--paper)}
.ch.no{border-color:var(--red);background:var(--red2)}.ch.no .lt{background:var(--red);color:var(--paper)}
.ch.dim{opacity:.55}
.ch[disabled]{cursor:default}
.qtools{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.hints{display:grid;gap:8px;margin-top:12px}
.hint{background:var(--amber2);border-radius:12px;padding:10px 14px}
.hint b{color:var(--amber)}
.fb{border-radius:16px;padding:14px 18px;margin:0 0 14px;border:1.5px solid}
.fb.ok{background:var(--green2);border-color:var(--green)}
.fb.no{background:var(--red2);border-color:var(--red)}
.fbh{display:flex;align-items:center;gap:8px;font-size:19px;flex-wrap:wrap}
.fb.ok .fbh{color:var(--green)}.fb.no .fbh{color:var(--red)}
.fb p{margin:6px 0 0}
.xp{font:700 14px var(--sans);color:var(--gold);background:var(--gold2);border-radius:99px;padding:2px 10px;margin-left:auto}
.cat{font:700 12px var(--sans);border-radius:99px;padding:2px 9px;background:var(--paper);color:var(--mute);border:1px solid var(--line)}
.why{margin-top:14px}
.why summary{cursor:pointer;color:var(--blue);font-weight:600;min-height:44px;display:flex;align-items:center}
.why ul{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:10px}
.why li{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--red2)}
.mrun{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.mrun .pips{display:inline-flex;gap:6px}
.mrun .pips i{width:16px;height:16px;border-radius:50%;border:2px solid var(--green)}
.mrun .pips i.on{background:var(--green)}
.score .big-n{font-family:var(--serif);font-size:72px;line-height:1;font-weight:600}
.score .big-n span{font-size:.45em;color:var(--mute)}
.score>p{font-size:18px;margin:8px 0 12px}
details.rv{padding:0}
details.rv>summary{padding:14px 18px;cursor:pointer;list-style:none;font-size:18px;line-height:1.6;display:flex;gap:12px;align-items:flex-start}
.rvs{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin-top:4px;background:var(--line);color:var(--mute);font-weight:700}
.rv.ok .rvs{background:var(--green2);color:var(--green)}.rv.no .rvs{background:var(--red2);color:var(--red)}
.rvs .ic{width:16px;height:16px}
.rvq{flex:1;min-width:0;overflow-x:auto}
.rvn{display:block;font-size:13px;color:var(--mute);font-weight:600;line-height:1.5}
.rvc{flex:none;margin-top:6px;color:var(--mute);transition:transform .15s}
details.rv[open] .rvc{transform:rotate(90deg)}
details.rv>summary::-webkit-details-marker{display:none}
details.rv[open]>summary{border-bottom:1px solid var(--line)}
.rvb{padding:12px 18px 16px}
.yours{margin:0 0 8px;color:var(--red)}.yours.ok{color:var(--green)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--blue)}
.timer.low{color:var(--red)}
.hearts{display:inline-flex;gap:4px;color:var(--red)}
.hearts .ic{width:22px;height:22px;fill:var(--red)}
.hearts .ic.gone{fill:none;opacity:.4}
.tnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:0 0 14px}
.tnav .btn{flex:1;min-width:110px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.pal button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer}
.pal .ans{background:var(--blue2);border-color:var(--blue);color:var(--blue)}
.pal .flag{border-color:var(--amber);box-shadow:inset 0 -4px 0 var(--amber)}
.pal .cur{outline:3px solid var(--blue);outline-offset:1px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:16px;cursor:pointer;color:var(--ink);min-height:130px}
.tcard .ic{width:28px;height:28px;color:var(--blue)}
.tcard b{font-family:var(--serif);font-size:20px}
.tcard span{color:var(--mute);font-size:14.5px}
.tcard em{font-style:normal;font-weight:700;color:var(--blue);font-size:14px;margin-top:auto}
.tcard.lock{opacity:.6}
/* speed */
.sbar{display:flex;align-items:center;gap:12px;margin:4px 0 8px}
.tbar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.tbar>i{display:block;height:100%;width:100%;background:var(--blue);border-radius:99px}
.ghost{position:relative;height:8px;border-radius:99px;background:var(--line);margin:0 0 10px}
.ghost i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:99px;opacity:.6}
.ghost b{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:99px}
.ghost span{position:absolute;right:0;top:10px;font-size:12px;color:var(--mute)}
.combo{font-weight:800;color:var(--mute)}.combo.hot{color:var(--red)}
.choices.two{grid-template-columns:1fr 1fr}
.ch.ok{animation:pop .28s ease}
@keyframes pop{50%{transform:scale(1.025)}}
.medal{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font:800 12px var(--sans);color:#fff}
.medal.b{background:#b0703a}.medal.s{background:#8f9aa8}.medal.g{background:#d4a017}.medal.n{background:var(--line);color:var(--mute)}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.drill{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--ink);min-height:58px}
.drill[aria-pressed=true]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.drill div{flex:1}.drill small{display:block;color:var(--mute);font-size:13px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;border-right:1.5px solid var(--line);background:var(--paper);padding:8px 16px;min-height:44px;font-weight:600;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--blue2);color:var(--blue)}
.newbest{display:inline-block;margin-left:10px;font-size:14px;font-weight:700;color:var(--green);background:var(--green2);border-radius:99px;padding:3px 10px;vertical-align:middle;font-family:var(--sans)}
.miss{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.miss:last-child{border-bottom:0}
/* me */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mcell{border-radius:12px;padding:10px;border:1.5px solid var(--line);font-size:14px;font-weight:600;min-height:64px}
.mcell.mastered{background:var(--green2);border-color:var(--green)}.mcell.practicing{border-color:var(--blue)}.mcell.due{background:var(--amber2);border-color:var(--amber)}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bd{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;opacity:.45}
.bd.got{opacity:1;border-color:var(--gold);background:var(--gold2)}
.bd .ic{color:var(--gold);width:22px;height:22px}
.tog{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer}
.tog input{width:24px;height:24px;accent-color:var(--blue)}
.f{display:grid;gap:6px;margin:0 0 12px;font-weight:600}
.f input,.f select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--paper);min-height:46px}
table.tb{width:100%;border-collapse:collapse;font-size:15px}
.tb th,.tb td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tb td.r,.tb th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.modal{position:fixed;inset:0;background:rgba(10,14,25,.5);display:grid;place-items:center;z-index:20;padding:20px}
.modal .card{max-width:460px;width:100%;margin:0}
.modal p{font-size:18px;margin:0 0 4px}
#toasts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:toastin .18s ease-out}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
.foot{color:var(--mute);font-size:14px;margin:22px 0 6px}
@media (max-width:640px){
.grid3{grid-template-columns:1fr 1fr}
.mgrid{grid-template-columns:1fr 1fr}
.keys{grid-template-columns:1fr}
.kl{margin-top:8px}
.prompt{font-size:19px}
.ch{font-size:18px;padding:8px 12px;gap:10px}
.rm{width:34%}
.row{padding:12px 14px}
.chipst span{display:none}
.tab{font-size:11px}
.lvl{gap:12px}.badge-lv{width:54px;height:54px;font-size:22px}.lvl b{font-size:19px}
}
@media (max-width:560px){.choices.two,.grid2{grid-template-columns:1fr}.lhead{flex-direction:column}.kp button{min-height:48px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

,"unit":"h"},"traps":[{"n":3.67,"why":"Averaging times doesn't work.","id":"bank","cat":"procedure"},{"n":11.0,"why":"Times don't add.","id":"bank","cat":"procedure"},{"n":0.5,"why":"The rates add to exactly 1 job per hour.","id":"bank","cat":"procedure"}]}},{"s":"word","d":3,"q":"A plane flies 600 mi with the wind in the same time it flies 480 mi against it. The wind is 30 mph. Find the plane's speed in still air.","c":["$270$ mph","$240$ mph","$300$ mph","$540$ mph"],"w":["Check: $\\f{600}{270}\\ne\\f{480}{210}$.","Check: $\\f{600}{330}\\ne\\f{480}{270}$.","That mixes up the distances."],"h":"Equal times: $\\f{600}{p+30}=\\f{480}{p-30}$.","x":[["600(p-30)=480(p+30)",""],["600p-18000=480p+14400\\Rightarrow120p=32400",""],["p=270\\ \\text{mph}",""]],"tw":null,"id":"q131","ta":{"k":"n","ans":{"n":"270","tol":0.001,"unit":"mph"},"traps":[{"n":240.0,"why":"Check: $\\f{600}{270}\\ne\\f{480}{210}$.","id":"bank","cat":"procedure"},{"n":300.0,"why":"Check: $\\f{600}{330}\\ne\\f{480}{270}$.","id":"bank","cat":"procedure"},{"n":540.0,"why":"That mixes up the distances.","id":"bank","cat":"procedure"}]}}],"sheet":[{"n":1,"sk":"simp","dir":"Simplify the function completely. Then state its domain.","q":"$y=\\f{x^2-49}{x^2+14x+49}$","s":[["\\f{(x-7)(x+7)}{(x+7)^2}","Factor: difference of squares on top, perfect square on the bottom."],["(x+7)^2=0\\Rightarrow x=-7","Find the restriction from the ORIGINAL denominator first."],["\\f{x-7}{x+7}","Cancel one common factor $(x+7)$."]],"a":"$y=\\f{x-7}{x+7}$; domain: all real numbers except $x=-7$","trap":"Don't exclude $x=7$ — it only makes the numerator 0."},{"n":2,"sk":"simp","dir":"Simplify the function completely. Then state its domain.","q":"$y=\\f{4x^2-1}{6x^2-x-2}$","s":[["\\f{(2x-1)(2x+1)}{(3x-2)(2x+1)}","Top: difference of squares. Bottom: ac-method, $ac=-12\\to-4,\\ 3$."],["x\\ne\\f23,\\ \\ x\\ne-\\f12","Both bottom factors give restrictions."],["\\f{2x-1}{3x-2}","Cancel $(2x+1)$."]],"a":"$y=\\f{2x-1}{3x-2}$; domain: $x\\ne-\\f12,\\ \\f23$","trap":"$x=-\\f12$ stays excluded even though $(2x+1)$ canceled (it's a hole)."},{"n":3,"sk":"as","dir":"Simplify. Include any restrictions due to eliminated factors.","q":"$\\f{3w}{w^2-16}+\\f{2}{2w-8}$","s":[["\\f{3w}{(w-4)(w+4)}+\\f{2}{2(w-4)}","Factor both denominators. Restrictions: $w\\ne\\pm4$."],["\\f{2}{2(w-4)}=\\f{1}{w-4}","Reduce the second fraction."],["\\f{3w}{(w-4)(w+4)}+\\f{w+4}{(w-4)(w+4)}","Build up to the LCD $(w-4)(w+4)$."],["\\f{4w+4}{(w-4)(w+4)}=\\f{4(w+1)}{(w-4)(w+4)}","Combine; factor the numerator — nothing cancels."]],"a":"$\\f{4(w+1)}{w^2-16}$, $w\\ne\\pm4$","trap":"Build up the numerator too: $1\\cdot(w+4)$, not just the denominator."},{"n":4,"sk":"as","dir":"Simplify. Include any restrictions due to eliminated factors.","q":"$-\\f{2}{n+4}-\\f{n^2}{n^2-16}$","s":[["-\\f{2}{n+4}-\\f{n^2}{(n+4)(n-4)}","Factor. LCD $(n+4)(n-4)$; restrictions $n\\ne\\pm4$."],["\\f{-2(n-4)-n^2}{(n+4)(n-4)}","Build up the first fraction by $(n-4)$."],["\\f{-n^2-2n+8}{(n+4)(n-4)}","Distribute: $-2n+8-n^2$."],["\\f{-(n+4)(n-2)}{(n+4)(n-4)}","Factor out $-1$: $n^2+2n-8=(n+4)(n-2)$."],["-\\f{n-2}{n-4}","Cancel $(n+4)$ — but keep $n\\ne-4$."]],"a":"$-\\f{n-2}{n-4}$ $\\left(\\text{or }\\f{2-n}{n-4}\\right)$, $n\\ne\\pm4$","trap":"Factor the final numerator — that's where the cancel hides."},{"n":5,"sk":"md","dir":"Simplify. Include any restrictions due to eliminated factors.","q":"$\\f{9x^2+6x}{2x-1}\\div\\f{6x^2+x-2}{4x^2-4x+1}$","s":[["\\f{3x(3x+2)}{2x-1}\\div\\f{(3x+2)(2x-1)}{(2x-1)^2}","Factor everything."],["x\\ne\\f12,\\ \\ x\\ne-\\f23","Denominators give $\\f12$; the divisor's numerator gives $-\\f23$ (and $\\f12$)."],["\\f{3x(3x+2)}{2x-1}\\cdot\\f{(2x-1)^2}{(3x+2)(2x-1)}","Flip the divisor."],["3x","Everything else cancels."]],"a":"$3x$, $x\\ne-\\f23,\\ \\f12$","trap":"$x\\ne-\\f23$ comes from the divisor's numerator — easy to miss."},{"n":6,"sk":"cf","dir":"Simplify. Include any restrictions due to eliminated factors.","q":"$\\f{\\f12-\\f{x+5}{4}}{\\f{x^2}{2}-\\f52}$","s":[["\\f{4\\cdot\\f12-4\\cdot\\f{x+5}{4}}{4\\cdot\\f{x^2}{2}-4\\cdot\\f52}","Multiply top and bottom by the LCD, 4."],["\\f{2-(x+5)}{2x^2-10}=\\f{-x-3}{2x^2-10}","Keep $(x+5)$ in parentheses."],["-\\f{x+3}{2(x^2-5)}","Factor; nothing cancels."],["x^2-5\\ne0\\Rightarrow x\\ne\\pm\\sqrt5","Restriction from the big denominator."]],"a":"$-\\f{x+3}{2(x^2-5)}$, $x\\ne\\pm\\sqrt5$","trap":"$2-(x+5)=-x-3$, not $-x+7$."},{"n":7,"sk":"solve","dir":"Solve. Check for extraneous solutions.","q":"$x+\\f{2}{x-3}=\\f{x-1}{3-x}$","s":[["x\\ne3;\\ \\ \\f{x-1}{3-x}=-\\f{x-1}{x-3}","Restriction; rewrite the opposite denominator."],["x(x-3)+2=-(x-1)","Multiply EVERY term by $(x-3)$."],["x^2-3x+2=-x+1\\Rightarrow x^2-2x+1=0",""],["(x-1)^2=0\\Rightarrow x=1","$1\\ne3$ ✓. Check: $1+\\f{2}{-2}=0$ and $\\f{0}{2}=0$."]],"a":"$x=1$","trap":"Multiply the lone $x$ by $(x-3)$ too."},{"n":8,"sk":"solve","dir":"Solve. Check for extraneous solutions.","q":"$\\f{1}{x+5}+\\f{1}{x-5}=\\f{10}{x^2-25}$","s":[["x\\ne\\pm5","$x^2-25=(x+5)(x-5)$ is the LCD."],["(x-5)+(x+5)=10","Multiply every term by the LCD."],["2x=10\\Rightarrow x=5",""],["x=5\\ \\text{is excluded}","Extraneous."]],"a":"No solution","trap":"Writing $x=5$ is the trap — always check against the restrictions."},{"n":9,"sk":"solve","dir":"Solve. Check for extraneous solutions.","q":"$\\f{x+3}{x-5}+\\f{2x^2+6}{x^2-7x+10}=\\f{3x}{x-2}$","s":[["x^2-7x+10=(x-5)(x-2);\\ \\ x\\ne5,\\ 2","LCD: $(x-5)(x-2)$."],["(x+3)(x-2)+2x^2+6=3x(x-5)","Multiply every term by the LCD."],["x^2+x-6+2x^2+6=3x^2-15x",""],["3x^2+x=3x^2-15x\\Rightarrow16x=0\\Rightarrow x=0","$0$ isn't excluded. Check: $-\\f35+\\f{6}{10}=0=\\f{0}{-2}$ ✓"]],"a":"$x=0$","trap":"$x=0$ is a real answer — don't throw it out."},{"n":10,"sk":"sys","dir":"Solve the system of equations.","q":"$y=\\f{9}{x+3}$ and $y=\\f{x^2}{x+3}$","s":[["\\f{9}{x+3}=\\f{x^2}{x+3},\\ \\ x\\ne-3","Set the two expressions equal."],["x^2=9\\Rightarrow x=\\pm3",""],["x=-3\\ \\text{excluded}","Extraneous."],["x=3\\Rightarrow y=\\f{9}{6}=\\f32","Find $y$."]],"a":"$\\left(3,\\ \\f32\\right)$","trap":"Give the ordered pair, not just $x=3$."},{"n":11,"sk":"cf","dir":"Two resistors in parallel: $R=\\f{1}{\\f{1}{r_1}+\\f{1}{r_2}}$. Find $R$ when $r_1=n$ and $r_2=n+1$, then state the domain.","q":"$R=\\f{1}{\\f1n+\\f{1}{n+1}}$","s":[["\\f1n+\\f{1}{n+1}=\\f{(n+1)+n}{n(n+1)}=\\f{2n+1}{n(n+1)}","Combine the bottom."],["R=\\f{n(n+1)}{2n+1}=\\f{n^2+n}{2n+1}","1 divided by a fraction = its reciprocal."],["n\\ne0,\\ \\ n\\ne-1,\\ \\ n\\ne-\\f12","From $r_1$, $r_2$, and the big denominator. (Physically, $n>0$.)"]],"a":"$R=\\f{n(n+1)}{2n+1}$; domain: $n\\ne-1,\\ -\\f12,\\ 0$","trap":"$\\f{1}{\\f1a+\\f1b}\\ne a+b$."},{"n":12,"sk":"word","dir":"Barry is twice as fast as Carrie, who clears the streets in 5 fewer hours than Larry. Together: 1 hour. How long would Larry take alone?","q":"\\text{Larry}=L,\\ \\ \\text{Carrie}=L-5,\\ \\ \\text{Barry}=\\f{L-5}{2}","s":[["\\f1L+\\f{1}{L-5}+\\f{2}{L-5}=1","Barry is twice as fast, so his rate is double Carrie's. Rates add to 1 job per hour."],["\\f1L+\\f{3}{L-5}=1\\Rightarrow(L-5)+3L=L(L-5)","Multiply by $L(L-5)$."],["L^2-9L+5=0",""],["L=\\f{9\\pm\\sqrt{61}}{2}\\approx8.41\\ \\text{or}\\ 0.59","Quadratic formula."],["L\\approx8.41\\ \\text{h}","Reject 0.59: Carrie's time $L-5$ would be negative."]],"a":"Larry: $\\f{9+\\sqrt{61}}{2}\\approx8.41$ hours (about 8 h 24 min)","trap":"Twice as fast = half the time, double the rate."}],"lessons":[{"k":"fac","t":"Factoring toolkit","sh":"Used in every problem","hook":"Factoring is reading the lie before you pick a club. You can't cancel, find an LCD, or spot a restriction until everything is factored.","big":"Factor every numerator and denominator completely. Always pull out the GCF first, then look for a pattern.","keys":[["GCF first","9x^2+6x=3x(3x+2)"],["Difference of squares","a^2-b^2=(a-b)(a+b)"],["Perfect square","a^2\\pm2ab+b^2=(a\\pm b)^2"],["Trinomial","x^2+bx+c=(x+m)(x+n)\\ \\ \\text{where}\\ mn=c,\\ m+n=b"],["Cubes (SOAP)","a^3\\pm b^3=(a\\pm b)(a^2\\mp ab+b^2)"],["Opposites","b-a=-(a-b)"]],"how":["Pull out the GCF — the number AND the variable.","Count the terms: 2 → squares or cubes; 3 → trinomial or perfect square; 4 → grouping.","For $ax^2+bx+c$ with $a\\ne1$, use the ac-method: split $b$ using factors of $ac$.","Keep going until nothing factors further, then FOIL-check."],"ex":[{"t":"ac-method (used in Sheet #2 and #5)","q":"$6x^2-x-2$","s":[["6\\cdot(-2)=-12","Find two numbers: product $-12$, sum $-1$ → $-4$ and $3$."],["6x^2-4x+3x-2","Split the middle term."],["2x(3x-2)+1(3x-2)","Group in pairs and factor each."],["(3x-2)(2x+1)","Pull out the common binomial."]],"a":"$(3x-2)(2x+1)$"}],"traps":["Stopping early: $2(x^2-9)$ isn't done — it's $2(x-3)(x+3)$.","$x^2+4$ does not factor (it's a sum of squares).","$(x-7)^2\\ne x^2-49$ — a squared binomial has a middle term.","$x-3$ and $3-x$ are opposites: $\\f{3-x}{x-3}=-1$."],"alt":"Think of factoring as un-multiplying. Instead of hunting for a pattern, ask what two brackets would FOIL back to this. For $x^2-7x+10$, list the factor pairs of 10 (1 and 10, 2 and 5), then pick the pair that adds to $-7$ once you choose the signs: $-2$ and $-5$. Always multiply your answer back out. If you get the original, you're done."},{"k":"simp","t":"Simplify & domain","sh":"Lesson 4.3 · Sheet #1, #2","hook":"Out-of-bounds stakes go in before anyone tees off. Restrictions come from the ORIGINAL denominator — set them before you cancel.","big":"A rational expression is undefined wherever its denominator is 0. Simplify by canceling common factors; the restrictions stay even after a factor is gone.","keys":[["Canceled factor","\\text{hole (still excluded)}"],["Remaining factor","\\text{vertical asymptote (excluded)}"],["Opposites","\\f{a-b}{b-a}=-1"]],"how":["Factor the numerator and the denominator completely.","Set each denominator factor $\\ne0$. These are the restrictions.","Cancel common FACTORS — never terms.","Write the simplified form with every restriction."],"ex":[{"t":"Sheet #1","q":"$y=\\f{x^2-49}{x^2+14x+49}$","s":[["\\f{(x-7)(x+7)}{(x+7)^2}","Factor: difference of squares on top, perfect square on the bottom."],["(x+7)^2=0\\Rightarrow x=-7","Find the restriction from the ORIGINAL denominator first."],["\\f{x-7}{x+7}","Cancel one common factor $(x+7)$."]],"a":"$y=\\f{x-7}{x+7}$; domain: all real numbers except $x=-7$"},{"t":"Sheet #2","q":"$y=\\f{4x^2-1}{6x^2-x-2}$","s":[["\\f{(2x-1)(2x+1)}{(3x-2)(2x+1)}","Top: difference of squares. Bottom: ac-method, $ac=-12\\to-4,\\ 3$."],["x\\ne\\f23,\\ \\ x\\ne-\\f12","Both bottom factors give restrictions."],["\\f{2x-1}{3x-2}","Cancel $(2x+1)$."]],"a":"$y=\\f{2x-1}{3x-2}$; domain: $x\\ne-\\f12,\\ \\f23$"}],"traps":["Cancel factors, not terms: $\\f{x+6}{x+3}\\ne2$.","A zero numerator is fine — don't exclude $x=7$ in Sheet #1.","A canceled factor still counts: in Sheet #2, $x\\ne-\\f12$ stays.","Opposites cancel to $-1$: $\\f{4-x}{x-4}=-1$."],"alt":"Picture the denominator as a machine that breaks at certain x-values. Before you touch anything, write those values in a box: they're excluded. Simplifying is just like reducing $\\f68$ to $\\f34$: divide the top and bottom by the same factor. The excluded values stay in the box even when a factor disappears, because the original machine still breaks there."},{"k":"md","t":"Multiply & divide","sh":"Lesson 4.3 · Sheet #5","hook":"Dividing is reading the putt from the other side: flip the second fraction and it plays exactly like multiplication.","big":"Multiply: factor, cancel across, multiply what's left. Divide: flip the divisor, then multiply.","keys":[["Multiply","\\f ab\\cdot\\f cd=\\f{ac}{bd}"],["Divide","\\f ab\\div\\f cd=\\f ab\\cdot\\f dc"],["Restrictions","b,\\ c,\\ d\\ne0"]],"how":["Factor every numerator and denominator.","List restrictions: every denominator — and when dividing, the divisor's numerator too.","Division: keep the first fraction, change ÷ to ×, flip the second.","Cancel common factors (any top with any bottom).","Multiply what's left and restate the restrictions."],"ex":[{"t":"Sheet #5","q":"$\\f{9x^2+6x}{2x-1}\\div\\f{6x^2+x-2}{4x^2-4x+1}$","s":[["\\f{3x(3x+2)}{2x-1}\\div\\f{(3x+2)(2x-1)}{(2x-1)^2}","Factor everything."],["x\\ne\\f12,\\ \\ x\\ne-\\f23","Denominators give $\\f12$; the divisor's numerator gives $-\\f23$ (and $\\f12$)."],["\\f{3x(3x+2)}{2x-1}\\cdot\\f{(2x-1)^2}{(3x+2)(2x-1)}","Flip the divisor."],["3x","Everything else cancels."]],"a":"$3x$, $x\\ne-\\f23,\\ \\f12$"}],"traps":["Flip the SECOND fraction only.","When dividing, the divisor's numerator can't be 0 (Sheet #5: $x\\ne-\\f23$).","Don't multiply polynomials out before canceling — you'll lose the factors.","Watch for opposites like $(5-x)$ and $(x-5)$ → $-1$."],"alt":"Multiplying fractions makes one big fraction: everything on top over everything on the bottom. So factor everything first, then cross out any factor that appears on top and on the bottom, anywhere in the problem. For division, rewrite it as multiplying by the reciprocal first; then it's the same game. The divisor's top becomes a bottom, so it adds a restriction."},{"k":"as","t":"Add & subtract","sh":"Lesson 4.4 · Sheet #3, #4","hook":"You can't add yardages measured to different pins. Get a common denominator first — same pin, then add.","big":"Rewrite each fraction over the LCD, combine the numerators, then simplify.","keys":[["Same denominator","\\f ac+\\f bc=\\f{a+b}{c}"],["Different","\\f ab+\\f cd=\\f{ad+bc}{bd}"],["Opposite denominators","\\f{k}{4-x}=-\\f{k}{x-4}"]],"how":["Factor each denominator.","LCD = every factor that appears, at its highest power.","Build up each fraction: multiply top and bottom by its missing factors.","Combine numerators over the LCD. Put a subtracted numerator in parentheses.","Simplify: factor the numerator, cancel, state the restrictions."],"ex":[{"t":"Sheet #3","q":"$\\f{3w}{w^2-16}+\\f{2}{2w-8}$","s":[["\\f{3w}{(w-4)(w+4)}+\\f{2}{2(w-4)}","Factor both denominators. Restrictions: $w\\ne\\pm4$."],["\\f{2}{2(w-4)}=\\f{1}{w-4}","Reduce the second fraction."],["\\f{3w}{(w-4)(w+4)}+\\f{w+4}{(w-4)(w+4)}","Build up to the LCD $(w-4)(w+4)$."],["\\f{4w+4}{(w-4)(w+4)}=\\f{4(w+1)}{(w-4)(w+4)}","Combine; factor the numerator — nothing cancels."]],"a":"$\\f{4(w+1)}{w^2-16}$, $w\\ne\\pm4$"},{"t":"Sheet #4","q":"$-\\f{2}{n+4}-\\f{n^2}{n^2-16}$","s":[["-\\f{2}{n+4}-\\f{n^2}{(n+4)(n-4)}","Factor. LCD $(n+4)(n-4)$; restrictions $n\\ne\\pm4$."],["\\f{-2(n-4)-n^2}{(n+4)(n-4)}","Build up the first fraction by $(n-4)$."],["\\f{-n^2-2n+8}{(n+4)(n-4)}","Distribute: $-2n+8-n^2$."],["\\f{-(n+4)(n-2)}{(n+4)(n-4)}","Factor out $-1$: $n^2+2n-8=(n+4)(n-2)$."],["-\\f{n-2}{n-4}","Cancel $(n+4)$ — but keep $n\\ne-4$."]],"a":"$-\\f{n-2}{n-4}$ $\\left(\\text{or }\\f{2-n}{n-4}\\right)$, $n\\ne\\pm4$"}],"traps":["Never add denominators: $\\f ab+\\f cd\\ne\\f{a+c}{b+d}$.","Distribute the minus to every term: $-(x-1)=-x+1$.","Opposite denominators: $\\f{12}{4-x}=-\\f{12}{x-4}$.","Factor the final numerator — it often cancels (Sheet #4)."],"alt":"You can only add pieces of the same size, which means the same denominator. The LCD is the smallest size every denominator fits into: list each different factor once, at its biggest power. Each fraction gets multiplied by 1 in disguise, like $\\f{x+2}{x+2}$, to reach that size. Only then do you add the tops."},{"k":"cf","t":"Complex fractions","sh":"Lesson 4.4 · Sheet #6, #11","hook":"A two-tier green: play each tier separately, or clear both tiers in one stroke — multiply by the LCD.","big":"A complex fraction has fractions inside its numerator or denominator. Clear them by multiplying the top and bottom by the LCD of every small fraction.","keys":[["One-stroke method","\\f{\\f ab+\\f cd}{\\f ef}=\\f{adf+bcf}{bde}"],["Resistors","\\f{1}{\\f1a+\\f1b}=\\f{ab}{a+b}"]],"how":["Find the LCD of every small denominator.","Multiply EVERY term on the top and bottom by it.","Simplify the single fraction that's left (factor, cancel).","Restrictions: the small denominators, plus anything that makes the big denominator 0."],"ex":[{"t":"Sheet #6","q":"$\\f{\\f12-\\f{x+5}{4}}{\\f{x^2}{2}-\\f52}$","s":[["\\f{4\\cdot\\f12-4\\cdot\\f{x+5}{4}}{4\\cdot\\f{x^2}{2}-4\\cdot\\f52}","Multiply top and bottom by the LCD, 4."],["\\f{2-(x+5)}{2x^2-10}=\\f{-x-3}{2x^2-10}","Keep $(x+5)$ in parentheses."],["-\\f{x+3}{2(x^2-5)}","Factor; nothing cancels."],["x^2-5\\ne0\\Rightarrow x\\ne\\pm\\sqrt5","Restriction from the big denominator."]],"a":"$-\\f{x+3}{2(x^2-5)}$, $x\\ne\\pm\\sqrt5$"},{"t":"Sheet #11","q":"$R=\\f{1}{\\f1n+\\f{1}{n+1}}$","s":[["\\f1n+\\f{1}{n+1}=\\f{(n+1)+n}{n(n+1)}=\\f{2n+1}{n(n+1)}","Combine the bottom."],["R=\\f{n(n+1)}{2n+1}=\\f{n^2+n}{2n+1}","1 divided by a fraction = its reciprocal."],["n\\ne0,\\ \\ n\\ne-1,\\ \\ n\\ne-\\f12","From $r_1$, $r_2$, and the big denominator. (Physically, $n>0$.)"]],"a":"$R=\\f{n(n+1)}{2n+1}$; domain: $n\\ne-1,\\ -\\f12,\\ 0$"}],"traps":["Multiply every term, including whole numbers like 1.","Keep $-(x+5)$ in parentheses (Sheet #6).","Don't forget the big denominator's restriction: $x^2-5\\ne0$.","$\\f{1}{\\f1a+\\f1b}\\ne a+b$."],"alt":"A complex fraction is a division problem written vertically: the top divided by the bottom. One way is to simplify the top to a single fraction, simplify the bottom to a single fraction, then multiply the top by the flipped bottom. The faster way is to multiply every little fraction by the LCD of all of them, so they all clear in one step."},{"k":"solve","t":"Solving equations","sh":"Lesson 4.5 · Sheet #7, #8, #9","hook":"A provisional ball: you play it, but it only counts if it's in bounds. Every answer has to be checked against the restrictions.","big":"Multiply both sides by the LCD to clear the fractions, solve, then throw out any answer that makes an original denominator 0 (extraneous).","keys":[["Clear fractions","\\text{LCD}\\times\\text{every term}"],["Contradiction","1=0\\Rightarrow\\text{no solution}"],["Identity","0=0\\Rightarrow\\text{all allowed }x"]],"how":["Factor the denominators and list the restrictions.","Multiply EVERY term on both sides by the LCD.","Solve the resulting polynomial equation (linear or quadratic).","Reject any answer that's a restriction — it's extraneous.","If nothing survives, the answer is \"no solution.\""],"ex":[{"t":"Sheet #7","q":"$x+\\f{2}{x-3}=\\f{x-1}{3-x}$","s":[["x\\ne3;\\ \\ \\f{x-1}{3-x}=-\\f{x-1}{x-3}","Restriction; rewrite the opposite denominator."],["x(x-3)+2=-(x-1)","Multiply EVERY term by $(x-3)$."],["x^2-3x+2=-x+1\\Rightarrow x^2-2x+1=0",""],["(x-1)^2=0\\Rightarrow x=1","$1\\ne3$ ✓. Check: $1+\\f{2}{-2}=0$ and $\\f{0}{2}=0$."]],"a":"$x=1$"},{"t":"Sheet #8","q":"$\\f{1}{x+5}+\\f{1}{x-5}=\\f{10}{x^2-25}$","s":[["x\\ne\\pm5","$x^2-25=(x+5)(x-5)$ is the LCD."],["(x-5)+(x+5)=10","Multiply every term by the LCD."],["2x=10\\Rightarrow x=5",""],["x=5\\ \\text{is excluded}","Extraneous."]],"a":"No solution"},{"t":"Sheet #9","q":"$\\f{x+3}{x-5}+\\f{2x^2+6}{x^2-7x+10}=\\f{3x}{x-2}$","s":[["x^2-7x+10=(x-5)(x-2);\\ \\ x\\ne5,\\ 2","LCD: $(x-5)(x-2)$."],["(x+3)(x-2)+2x^2+6=3x(x-5)","Multiply every term by the LCD."],["x^2+x-6+2x^2+6=3x^2-15x",""],["3x^2+x=3x^2-15x\\Rightarrow16x=0\\Rightarrow x=0","$0$ isn't excluded. Check: $-\\f35+\\f{6}{10}=0=\\f{0}{-2}$ ✓"]],"a":"$x=0$"}],"traps":["Multiply every term — including lone terms like $x$ or $3$.","Rewrite opposites first: $\\f{x-1}{3-x}=-\\f{x-1}{x-3}$.","Always check: Sheet #8's only candidate is extraneous.","\"No solution\" is a real, full-credit answer."],"alt":"In an equation you're allowed to multiply both sides by the same thing, so multiply by the LCD and every fraction disappears. The catch: the LCD is zero for some x, and multiplying by zero can sneak in fake answers. That's why you check every answer against the excluded values you wrote at the start."},{"k":"sys","t":"Systems","sh":"Lesson 4.5 · Sheet #10","hook":"Two players' lines cross where both balls land o   if (miss.some(v => EX.inSet(v, Z('cz')))) return {ok: false, msg: `A canceled factor still counts: ${show(miss.filter(v => EX.inSet(v, Z('cz'))))} makes the original denominator 0.`, id: 'lost_restriction', cat: 'concept'};
  if (extra.some(v => EX.inSet(v, Z('nz')))) return {ok: false, msg: `${show(extra.filter(v => EX.inSet(v, Z('nz'))))} only makes the numerator 0 — that's allowed.`, id: 'numerator_zero', cat: 'concept'};
  if (EX.sameSet(V.map(v => -v), R)) return {ok: false, msg: 'Sign slip: $x+a=0$ means $x=-a$.', id: 'sign', cat: 'slip'};
  if (miss.length) return {ok: false, msg: `Missing ${show(miss)} — set every factor of every original denominator equal to 0.`, id: 'missing_value', cat: 'procedure'};
  return {ok: false, msg: `${show(extra)} doesn't make any denominator 0.`, id: 'extra_value', cat: 'procedure'};
}
function gradeSol(typed, it) {
  let V; try { V = EX.vals(typed); } catch (e) { return {ok: false, msg: 'Type the solutions with commas, like $1, 2$ — or tap No solution.', id: 'unreadable', cat: 'slip', bad: 1}; }
  if (V === null) return {ok: false, msg: 'Type a solution or tap No solution.', id: 'blank', cat: 'slip', bad: 1};
  const S = it.ans.v.map(EX.val), X = (it.ex || []).map(EX.val);
  if (EX.sameSet(V, S)) return {ok: true};
  if (V.some(v => EX.inSet(v, X))) return {ok: false, msg: `${V.filter(v => EX.inSet(v, X)).map(v => '$x=' + fmtV(v) + '$').join(', ')} makes an original denominator 0 — it's extraneous. Throw it out.`, id: 'kept_extraneous', cat: 'concept'};
  if (!V.length && S.length) return {ok: false, msg: 'There is a solution that checks — solve the cleared equation again.', id: 'threw_out_valid', cat: 'concept'};
  if (V.length && !S.length) return {ok: false, msg: "Plug it in: it doesn't make both sides equal. Check for extraneous answers.", id: 'no_check', cat: 'concept'};
  if (V.every(v => EX.inSet(v, S)) && V.length < EX.uniq(S).length) return {ok: false, msg: "You have one — there's another solution. Did you solve the whole quadratic?", id: 'missed_root', cat: 'procedure'};
  if (EX.sameSet(V.map(v => -v), S)) return {ok: false, msg: 'Sign slip: $(x-a)=0$ gives $x=a$.', id: 'sign', cat: 'slip'};
  for (const t of it.traps || []) if (t.v) { try { if (EX.sameSet(V, t.v.map(EX.val))) return {ok: false, msg: t.why, id: t.id || 'trap', cat: t.cat || 'procedure'}; } catch (e) {} }
  return {ok: false, msg: "That doesn't check. Plug your answer into the original equation.", id: 'not_equal', cat: 'procedure'};
}
function gradeVals(typed, it) {   // domain-only questions
  return gradeRestr(typed, Object.assign({}, it, {rz: it.ans.v}));
}
function gradePairs(typed, it) {
  let P; try { P = EX.pairs(typed); } catch (e) { return {ok: false, msg: 'Type points like $(3, 1.5)$, or tap No solution.', id: 'unreadable', cat: 'slip', bad: 1}; }
  if (P === null) return {ok: false, msg: 'Type the points or tap No solution.', id: 'blank', cat: 'slip', bad: 1};
  const S = it.ans.p.map(q => [EX.val(q[0]), EX.val(q[1])]);
  if (EX.samePairs(P, S)) return {ok: true};
  for (const t of it.traps || []) if (t.p) { try { if (EX.samePairs(P, t.p.map(q => [EX.val(q[0]), EX.val(q[1])]))) return {ok: false, msg: t.why, id: t.id || 'trap', cat: t.cat || 'procedure'}; } catch (e) {} }
  if (P.length && S.length && P.every(p => S.some(q => Math.abs(p[0] - q[0]) < 1e-6))) return {ok: false, msg: 'Right $x$-values — recheck each $y$ by plugging $x$ into an equation.', id: 'wrong_y', cat: 'procedure'};
  return {ok: false, msg: "Those points don't satisfy both equations. Set them equal and solve.", id: 'not_equal', cat: 'procedure'};
}
function gradeNum(typed, it) {
  let v; try { v = EX.val(typed); } catch (e) { return {ok: false, msg: 'Type a number (decimals are fine).', id: 'unreadable', cat: 'slip', bad: 1}; }
  const want = EX.val(it.ans.n), tol = it.ans.tol || 1e-6;

  for (const t of it.traps || []) if (t.n !== undefined && Math.abs(v - EX.val(String(t.n))) <= Math.max(tol, 1e-6)) return {ok: false, msg: t.why, id: t.id || 'trap', cat: t.cat || 'procedure'};

function fmtV(v) {   // a number as math markup: fractions with small denominators, square roots, decimals
  if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
  for (let d = 2; d <= 12; d++) { const n = v * d; if (Math.abs(n - Math.round(n)) < 1e-9) return (n < 0 ? '-' : '') + '\\f{' + Math.abs(Math.round(n)) + '}{' + d + '}'; }
  const s = v * v; if (Math.abs(s - Math.round(s)) < 1e-9) return (v < 0 ? '-' : '') + '\\sqrt{' + Math.round(s) + '}';
  return String(+v.toFixed(3));
}

// ---------- Fresh-number question templates. Each make(R) returns an item; numbers change with the seed.
// Item kinds: er = expression + excluded values, e = expression, f = factor, v = excluded values,
// s = solutions, p = points, n = number. Traps are named mistakes (they double as multiple-choice options).
function rng(seed) {
  let a = (seed >>> 0) || 1;
  const f = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const i = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
  return {f, i, nz: (lo, hi) => { let v = 0; while (!v) v = i(lo, hi); return v; }, pick: a => a[Math.floor(f() * a.length)]};
}
const gcdi = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lin = k => k === 0 ? 'x' : 'x' + (k < 0 ? '-' : '+') + Math.abs(k);
const bin = (a, b) => { const m = a === 1 ? 'x' : a === -1 ? '-x' : a === 0 ? '' : a + 'x'; if (!m) return String(b); return b === 0 ? m : m + (b < 0 ? '-' : '+') + Math.abs(b); };
const poly = (c2, c1, c0) => { let s = c2 === 1 ? 'x^2' : c2 === -1 ? '-x^2' : c2 + 'x^2'; if (c1) s += (c1 < 0 ? '-' : '+') + (Math.abs(c1) === 1 ? '' : Math.abs(c1)) + 'x'; if (c0) s += (c0 < 0 ? '-' : '+') + Math.abs(c0); return s; };
const fr = (p, q) => { if (q < 0) { p = -p; q = -q; } const g = gcdi(p, q) || 1; p /= g; q /= g; return q === 1 ? String(p) : p + '/' + q; };
const par = v => (v < 0 ? '(' + v + ')' : String(v));
const F = (a, b) => `\\f{${a}}{${b}}`;
const VT = s => fmtV(EX.val(String(s)));          // value -> math markup
const NE = vs => 'x\\ne ' + vs.map(String).sort((p, q) => EX.val(p) - EX.val(q)).map(VT).join(',\\ ');
const TPLS = [], TPL = {};
function tpl(o) { TPLS.push(o); TPL[o.id] = o; }

/* ============ Factoring ============ */
tpl({id: 'f-dsq', s: 'fac', d: 1, name: 'Difference of squares', make(R) {
  const a = R.i(2, 12), c = a * a, e = 'x^2-' + c, ans = `(x-${a})(x+${a})`;
  return {k: 'f', q: `Factor completely: ${ML(e)}`, ans: {e: ans}, chk: {e},
    traps: [{e: `(x-${a})^2`, why: `$(x-${a})^2=${TEXL(poly(1, -2 * a, c))}$ has a middle term.`, id: 'square_not_difference', cat: 'concept'},
      {e: `(x+${a})^2`, why: `$(x+${a})^2$ has a middle term too.`, id: 'square_not_difference', cat: 'concept'},
      {e: `(x-${c})(x+1)`, why: `That multiplies to $${TEXL(poly(1, 1 - c, -c))}$.`, id: 'wrong_pair', cat: 'procedure'}],
    h: ['Two perfect squares with a minus between them.', `It's $x^2-${a}^2$, so use $a^2-b^2=(a-b)(a+b)$.`],
    x: [[`x^2-${c}=x^2-${a}^2`, 'A difference of squares.'], [`(x-${a})(x+${a})`, '']]};
}});
tpl({id: 'f-tri', s: 'fac', d: 1, name: 'Trinomial', make(R) {
  let r, s; do { r = R.nz(-9, 9); s = R.nz(-9, 9); } while (r === s || r === -s);
  const e = poly(1, r + s, r * s), ans = `(${lin(r)})(${lin(s)})`;
  return {k: 'f', q: `Factor completely: ${ML(e)}`, ans: {e: ans}, chk: {e},
    traps: [{e: `(${lin(-r)})(${lin(-s)})`, why: `Signs flipped: that's $${TEXL(poly(1, -(r + s), r * s))}$.`, id: 'sign', cat: 'slip'},
      {e: `(${lin(r)})(${lin(-s)})`, why: `That's $${TEXL(poly(1, r - s, -r * s))}$ — check the product sign.`, id: 'wrong_pair', cat: 'procedure'},
      {e: `(${lin(-r)})(${lin(s)})`, why: `That's $${TEXL(poly(1, s - r, -r * s))}$.`, id: 'wrong_pair', cat: 'procedure'}],
    h: [`Find two numbers that multiply to $${r * s}$ and add to $${r + s}$.`, `They are $${r}$ and $${s}$.`],
    x: [[`${r}\\cdot ${par(s)}=${r * s},\\ \\ ${r}+${par(s)}=${r + s}`, 'Product and sum.'], [`(${lin(r)})(${lin(s)})`, '']]};

tpl({id: 'f-ac', s: 'fac', d: 2, name: 'ac-method', make(R) {
  let a, b, c, d; do { a = R.pick([2, 3, 5]); c = R.pick([2, 3]); b = R.nz(-5, 5); d = R.nz(-5, 5); } while (a === c || gcdi(a, b) !== 1 || gcdi(c, d) !== 1 || a * d + b * c === 0 || b === d);
  const A = a * c, B = a * d + b * c, C = b * d, e = poly(A, B, C), f1 = bin(a, b), f2 = bin(c, d);
  const g1 = a + 'x' + (a * d < 0 ? '' : '') , split = `${A}x^2${a * d < 0 ? '-' : '+'}${Math.abs(a * d)}x${b * c < 0 ? '-' : '+'}${Math.abs(b * c)}x${C < 0 ? '-' : '+'}${Math.abs(C)}`;
  return {k: 'f', q: `Factor completely: ${ML(e)}`, ans: {e: `(${f1})(${f2})`}, chk: {e},
    traps: [{e: `(${bin(a, -b)})(${bin(c, -d)})`, why: 'Signs flipped — FOIL it and the middle term comes out wrong.', id: 'sign', cat: 'slip'},
      {e: `(${bin(a, d)})(${bin(c, b)})`, why: `Constants swapped: that's $${TEXL(poly(A, a * b + c * d, C))}$.`, id: 'wrong_pair', cat: 'procedure'},
      {e: `(${bin(A, b)})(${bin(1, d)})`, why: 'The leading coefficient splits between both brackets — FOIL to check.', id: 'wrong_pair', cat: 'procedure'}],
    h: [`ac-method: $${A}\\cdot ${par(C)}=${A * C}$. Find two numbers with product $${A * C}$ and sum $${B}$.`, `They are $${a * d}$ and $${b * c}$. Split the middle term: $${split}$.`],
    x: [[split, `Split $${B}x$ using $${a * d}$ and $${b * c}$.`], [`${a}x(${f2})${b < 0 ? '-' : '+'}${Math.abs(b)}(${f2})`, 'Group in pairs.'], [`(${f1})(${f2})`, 'Pull out the common bracket. FOIL to check.']]};

tpl({id: 'f-gcf', s: 'fac', d: 2, name: 'GCF first', make(R) {

    h: ['Take out the GCF first, then look again.', `$${TEXL(e)}=${k}(x^2-${a * a})$ — and that bracket is a difference of squares.`],

/* ============ Simplify & domain ============ */
tpl({id: 's-sq', s: 'simp', d: 1, name: 'Squares over a perfect square', make(R) {
  const a = R.i(2, 12), e = `(x^2-${a * a})/(${poly(1, 2 * a, a * a)})`, ans = `(x-${a})/(x+${a})`;

      {e: `-${a * a}/(${2 * a}x+${a * a})`, v: [fr(-a, 2)], why: 'You canceled the $x^2$ terms. Only factors cancel, never terms.', id: 'canceled_terms', cat: 'concept'},
      {e: `(x+${a})/(x-${a})`, v: [`${a}`], why: `Upside down — one $(x+${a})$ stays in the denominator.`, id: 'upside_down', cat: 'procedure'}],

tpl({id: 's-com', s: 'simp', d: 1, name: 'Cancel a common binomial', make(R) {
  let a, b, c; do { a = R.nz(-9, 9); b = R.nz(-9, 9); c = R.nz(-9, 9); } while (a === b || b === c || a === c);
  const N = poly(1, a + b, a * b), D = poly(1, a + c, a * c), e = `(${N})/(${D})`, ans = `(${lin(b)})/(${lin(c)})`;
  const ct = a + c !== 0 ? [fr(-a * c, a + c)] : [];
  return {k: 'er', q: `Simplify and state the excluded values: ${ML(e)}`, ans: {e: ans}, rz: [`${-a}`, `${-c}`], cz: [`${-a}`], nz: [`${-b}`], chk: {e, dens: [D]},
    traps: [{e: ans, v: [`${-c}`], why: `$x=${-a}$ was canceled, but it still makes the original denominator 0.`, id: 'lost_restriction', cat: 'concept'},
      {e: `(${lin(a)})/(${lin(c)})`, why: `$(${lin(a)})$ is the shared factor — cancel it and keep $(${lin(b)})$.`, id: 'canceled_wrong', cat: 'procedure'},
      {e: `(${bin(a + b, a * b)})/(${bin(a + c, a * c)})`, v: ct, why: 'You canceled the $x^2$ terms. Only factors cancel.', id: 'canceled_terms', cat: 'concept'}],
    h: [`Factor the top and bottom. Look for the bracket they share.`, `Top: $(${lin(a)})(${lin(b)})$. Bottom: $(${lin(a)})(${lin(c)})$.`],
    x: [[F(`(${lin(a)})(${lin(b)})`, `(${lin(a)})(${lin(c)})`), 'Factor.'], [NE([`${-a}`, `${-c}`]), 'Every factor of the original denominator.'], [F(lin(b), lin(c)), `Cancel $(${lin(a)})$.`]]};
}});
tpl({id: 's-ac', s: 'simp', d: 2, name: 'ac-method (Sheet #2)', make(R) {
  let p, q, r, s; do { p = R.pick([2, 3]); q = R.i(1, 5); r = R.pick([1, 2, 3]); s = R.nz(-5, 5); } while (gcdi(p, q) !== 1 || gcdi(r, s) !== 1 || s * p === q * r || s * p === -q * r);
  const N = poly(p * p, 0, -q * q), D = poly(r * p, r * q - s * p, -s * q), e = `(${N})/(${D})`, ans = `(${bin(p, -q)})/(${bin(r, -s)})`;
  return {k: 'er', q: `Simplify and state the excluded values: ${ML(e)}`, ans: {e: ans}, rz: [fr(-q, p), fr(s, r)], cz: [fr(-q, p)], nz: [fr(q, p)], chk: {e, dens: [D]},
    traps: [{e: ans, v: [fr(s, r)], why: `The canceled factor $(${bin(p, q)})$ still makes the original denominator 0 at $x=${VT(fr(-q, p))}$.`, id: 'lost_restriction', cat: 'concept'},
      {e: `(${bin(p, q)})/(${bin(r, -s)})`, why: `$(${bin(p, q)})$ is the shared factor — cancel it, not $(${bin(p, -q)})$.`, id: 'canceled_wrong', cat: 'procedure'},
      {e: `(${bin(p, -q)})/(${bin(r, s)})`, v: [fr(-q, p), fr(-s, r)], why: 'Sign slip factoring the bottom — FOIL to check.', id: 'sign', cat: 'slip'}],
    h: ['Top: difference of squares. Bottom: ac-method.', `Bottom factors as $(${bin(r, -s)})(${bin(p, q)})$.`],
    x: [[F(`(${bin(p, -q)})(${bin(p, q)})`, `(${bin(r, -s)})(${bin(p, q)})`), 'Factor both.'], [NE([fr(-q, p), fr(s, r)]), 'Both bottom factors give restrictions.'], [F(bin(p, -q), bin(r, -s)), `Cancel $(${bin(p, q)})$.`]]};
}});
tpl({id: 's-opp', s: 'simp', d: 2, name: 'Opposite factors', make(R) {
  const a = R.i(2, 9), e = `(${a}-x)/(x^2-${a * a})`, ans = `-1/(x+${a})`;
  return {k: 'er', q: `Simplify and state the excluded values: ${ML(e)}`, ans: {e: ans}, rz: [`-${a}`, `${a}`], cz: [`${a}`], chk: {e, dens: [`x^2-${a * a}`]},

tpl({id: 's-dom', s: 'simp', d: 1, name: 'Domain', make(R) {

tpl({id: 'm-div', s: 'md', d: 2, name: 'Divide (Sheet #5)', make(R) {
  let k, a, b; do { k = R.i(2, 5); a = R.nz(-6, 6); b = R.nz(-6, 6); } while (a === b);
  const N1 = poly(k, k * a, 0), N2 = poly(1, a + b, a * b), D2 = poly(1, 2 * b, b * b), ans = `${k}x`;
  return {k: 'er', q: `Simplify and state the excluded values: $${F(N1, lin(b))}\\div${F(N2, D2)}$`, ans: {e: ans}, rz: [`${-a}`, `${-b}`], dz: [`${-a}`], nz: ['0'],
    chk: {e: `((${N1})/(${lin(b)}))/((${N2})/(${D2}))`, dens: [lin(b), D2, N2]},
    traps: [{e: ans, v: [`${-b}`], why: "Dividing: the divisor's numerator can't be 0 either.", id: 'divisor_numerator', cat: 'concept'},
      {e: `(${k}x(${lin(a)})^2)/((${lin(b)})^2)`, why: 'You multiplied without flipping the divisor.', id: 'no_flip', cat: 'concept'},
      {e: `1/(${k}x)`, why: 'You flipped the wrong fraction — flip the divisor (the second one).', id: 'wrong_flip', cat: 'concept'}],
    h: ['Factor everything, then keep–change–flip.', `$${TEXL(N1)}=${k}x(${lin(a)})$, $${TEXL(N2)}=(${lin(a)})(${lin(b)})$, $${TEXL(D2)}=(${lin(b)})^2$.`],
    x: [[`${F(`${k}x(${lin(a)})`, lin(b))}\\cdot${F(`(${lin(b)})^2`, `(${lin(a)})(${lin(b)})`)}`, 'Factor and flip the divisor.'], [NE([`${-a}`, `${-b}`]), "Denominators, plus the divisor's numerator."], [`${k}x`, 'Everything else cancels.']]};
}});
tpl({id: 'm-bin', s: 'md', d: 2, name: 'Divide by a binomial', make(R) {
  let a, b; do { a = R.i(2, 9); b = R.nz(-9, 9); } while (b === a || b === -a);
  const ans = `(x+${a})/(${lin(b)})`;
  return {k: 'er', q: `Simplify and state the excluded values: $${F(`x^2-${a * a}`, lin(b))}\\div(x-${a})$`, ans: {e: ans}, rz: [`${-b}`, `${a}`], dz: [`${a}`], nz: [`-${a}`],
    chk: {e: `((x^2-${a * a})/(${lin(b)}))/(x-${a})`, dens: [lin(b), `x-${a}`]},
    traps: [{e: ans, v: [`${-b}`], why: `Dividing by $(x-${a})$ means $x\\ne${a}$.`, id: 'divisor_numerator', cat: 'concept'},
      {e: `((x-${a})^2(x+${a}))/(${lin(b)})`, why: `You multiplied by $(x-${a})$ instead of dividing.`, id: 'no_flip', cat: 'concept'},
      {e: `(x-${a})/(${lin(b)})`, why: `$(x-${a})$ cancels; $(x+${a})$ stays.`, id: 'canceled_wrong', cat: 'procedure'}],
    h: [`Dividing by $(x-${a})$ means multiplying by $${F(1, `x-${a}`)}$.`, `$x^2-${a * a}=(x-${a})(x+${a})$.`],
    x: [[`${F(`(x-${a})(x+${a})`, lin(b))}\\cdot${F(1, `x-${a}`)}`, ''], [NE([`${-b}`, `${a}`]), ''], [F(`x+${a}`, lin(b)), '']]};
}});

/* ============ Add & subtract ============ */
tpl({id: 'a-add', s: 'as', d: 2, name: 'Unlike denominators', make(R) {
  let m, n, a, b; do { m = R.i(1, 6); n = R.i(1, 6); a = R.nz(-7, 7); b = R.nz(-7, 7); } while (m === n || a === b);
  const N1 = m + n, N0 = m * b + n * a, ans = `(${bin(N1, N0)})/((${lin(a)})(${lin(b)}))`;
  return {k: 'er', q: `Add and state the excluded values: $${F(m, lin(a))}+${F(n, lin(b))}$`, ans: {e: ans}, rz: [`${-a}`, `${-b}`], nz: [fr(-N0, N1)], chk: {e: `${m}/(${lin(a)})+${n}/(${lin(b)})`, dens: [lin(a), lin(b)]},
    traps: [{e: `${N1}/(${bin(2, a + b)})`, why: 'Never add denominators.', id: 'added_denominators', cat: 'concept'},
      {e: `${N1}/((${lin(a)})(${lin(b)}))`, why: 'The numerators have to be built up too.', id: 'not_built_up', cat: 'procedure'},
      {e: `(${bin(N1, m * a + n * b)})/((${lin(a)})(${lin(b)}))`, why: 'Each fraction gets multiplied by the OTHER factor.', id: 'built_wrong', cat: 'procedure'}],
    h: [`LCD: $(${lin(a)})(${lin(b)})$.`, `$${F(`${m}(${lin(b)})+${n}(${lin(a)})`, `(${lin(a)})(${lin(b)})`)}$`],
    x: [[F(`${m}(${lin(b)})+${n}(${lin(a)})`, `(${lin(a)})(${lin(b)})`), 'Build each fraction to the LCD.'], [F(bin(N1, N0), `(${lin(a)})(${lin(b)})`), 'Combine like terms.'], [NE([`${-a}`, `${-b}`]), '']]};
}});
tpl({id: 'a-sub', s: 'as', d: 2, name: 'Subtract: distribute the minus', make(R) {
  let m, n, a, b; do { m = R.i(1, 7); n = R.i(1, 7); a = R.nz(-7, 7); b = R.nz(-7, 7); } while (m === n || a === b);
  const N1 = m - n, N0 = m * b - n * a, ans = `(${bin(N1, N0)})/((${lin(a)})(${lin(b)}))`;
  return {k: 'er', q: `Subtract and state the excluded values: $${F(m, lin(a))}-${F(n, lin(b))}$`, ans: {e: ans}, rz: [`${-a}`, `${-b}`], nz: N1 ? [fr(-N0, N1)] : [], chk: {e: `${m}/(${lin(a)})-${n}/(${lin(b)})`, dens: [lin(a), lin(b)]},
    traps: [{e: `(${bin(N1, m * b + n * a)})/((${lin(a)})(${lin(b)}))`, why: `Distribute the minus to both terms: $-${n}(${lin(a)})=${TEXL(bin(-n, -n * a))}$.`, id: 'minus_not_distributed', cat: 'procedure'},
      {e: `(${bin(m + n, m * b + n * a)})/((${lin(a)})(${lin(b)}))`, why: "That's adding, not subtracting.", id: 'added', cat: 'slip'},
      {e: `${N1}/((${lin(a)})(${lin(b)}))`, why: 'The numerators have to be built up too.', id: 'not_built_up', cat: 'procedure'}],
    h: ['LCD first. Put the second numerator in brackets so the minus hits both terms.', `$${F(`${m}(${lin(b)})-${n}(${lin(a)})`, `(${lin(a)})(${lin(b)})`)}$`],
    x: [[F(`${m}(${lin(b)})-${n}(${lin(a)})`, `(${lin(a)})(${lin(b)})`), 'Build to the LCD.'], [F(bin(N1, N0), `(${lin(a)})(${lin(b)})`), 'Distribute, then combine.'], [NE([`${-a}`, `${-b}`]), '']]};
}});
tpl({id: 'a-s3', s: 'as', d: 2, name: 'Reduce first (Sheet #3)', make(R) {
  const a = R.i(2, 9), k = R.i(2, 5), c = R.i(2, 5), ans = `(${bin(k + 1, a)})/(x^2-${a * a})`;
  return {k: 'er', q: `Add and state the excluded values: $${F(k + 'x', `x^2-${a * a}`)}+${F(c, `${c}x-${c * a}`)}$`, ans: {e: ans}, rz: [`-${a}`, `${a}`], nz: [fr(-a, k + 1)], chk: {e: `${k}x/(x^2-${a * a})+${c}/(${c}x-${c * a})`, dens: [`x^2-${a * a}`, `${c}x-${c * a}`]},
    traps: [{e: `(${k}x+1)/(x^2-${a * a})`, why: `Build up the numerator too: $1\\cdot(x+${a})$.`, id: 'not_built_up', cat: 'procedure'},
      {e: ans, v: [`${a}`], why: `$x=-${a}$ also makes $x^2-${a * a}=0$.`, id: 'lost_restriction', cat: 'concept'},
      {e: `(${k}x+${c})/(${poly(1, c, -a * a - c * a)})`, why: 'Never add denominators.', id: 'added_denominators', cat: 'concept'}],
    h: [`Factor: $${c}x-${c * a}=${c}(x-${a})$, so $${F(c, `${c}x-${c * a}`)}=${F(1, `x-${a}`)}$.`, `LCD: $(x-${a})(x+${a})$. Build $${F(1, `x-${a}`)}$ up by $(x+${a})$.`],
    x: [[F(1, `x-${a}`), 'Reduce the second fraction first.'], [F(`${k}x+(x+${a})`, `(x-${a})(x+${a})`), 'Build to the LCD and add.'], [`${F(bin(k + 1, a), `x^2-${a * a}`)},\\ \\ x\\ne\\pm${a}`, '']]};
}});
tpl({id: 'a-s4', s: 'as', d: 3, name: 'Cancel at the end (Sheet #4)', make(R) {
  const k = R.i(1, 6), A = 2 * k, ans = `-(x-${k})/(x-${A})`;
  return {k: 'er', q: `Simplify and state the excluded values: $-${F(k, `x+${A}`)}-${F('x^2', `x^2-${A * A}`)}$`, ans: {e: ans}, rz: [`-${A}`, `${A}`], cz: [`-${A}`], nz: [`${k}`], chk: {e: `-${k}/(x+${A})-x^2/(x^2-${A * A})`, dens: [`x+${A}`, `x^2-${A * A}`]},
    traps: [{e: ans, v: [`${A}`], why: `$x=-${A}$ was canceled, but it still breaks the original denominators.`, id: 'lost_restriction', cat: 'concept'},
      {e: `(x-${k})/(x-${A})`, why: `You lost the leading negative: the numerator is $-(x+${A})(x-${k})$.`, id: 'sign', cat: 'slip'},
      {e: `(-${k}-x^2)/(x^2-${A * A})`, why: `Build up $-${F(k, `x+${A}`)}$ by $(x-${A})$ first.`, id: 'not_built_up', cat: 'procedure'}],
    h: [`LCD: $(x+${A})(x-${A})$. Factor the numerator at the end.`, `Numerator: $-${k}(x-${A})-x^2=-x^2-${k}x+${2 * k * k}$.`],
    x: [[F(`-${k}(x-${A})-x^2`, `(x+${A})(x-${A})`), 'Build to the LCD.'], [F(`-(x+${A})(x-${k})`, `(x+${A})(x-${A})`), 'Factor out −1, then factor.'], [`-${F(`x-${k}`, `x-${A}`)},\\ \\ x\\ne\\pm${A}`, `Cancel $(x+${A})$ — keep its restriction.`]]};
}});
tpl({id: 'a-opp', s: 'as', d: 1, name: 'Opposite denominators', make(R) {
  const p = R.i(2, 9), a = R.i(1, 9);
  return {k: 'er', q: `Simplify and state the excluded values: $${F(p + 'x', `x-${a}`)}+${F(p * a, `${a}-x`)}$`, ans: {e: `${p}`}, rz: [`${a}`], chk: {e: `${p}x/(x-${a})+${p * a}/(${a}-x)`, dens: [`x-${a}`, `${a}-x`]},
    traps: [{e: `(${p}x+${p * a})/(x-${a})`, why: `$${a}-x=-(x-${a})$, so the second fraction changes sign.`, id: 'opposites', cat: 'slip'},
      {e: `-${p}`, why: `Sign: $${p}x-${p * a}=${p}(x-${a})$, so the answer is positive.`, id: 'sign', cat: 'slip'},
      {e: `${p}`, v: [], why: `$x=${a}$ makes the original denominators 0.`, id: 'lost_restriction', cat: 'concept'}],
    h: [`Rewrite $${F(p * a, `${a}-x`)}$ as $-${F(p * a, `x-${a}`)}$.`, `Now it's $${F(`${p}x-${p * a}`, `x-${a}`)}$.`],
    x: [[`${F(p + 'x', `x-${a}`)}-${F(p * a, `x-${a}`)}`, 'Flip the opposite denominator.'], [F(`${p}(x-${a})`, `x-${a}`), 'Factor.'], [`${p},\\ \\ x\\ne${a}`, '']]};
}});

/* ============ Complex fractions ============ */
tpl({id: 'c-sq', s: 'cf', d: 2, name: 'Clear with x²', make(R) {
  const a = R.i(1, 9), e = `(1-${a * a}/x^2)/(1+${a}/x)`, ans = `(x-${a})/x`;
  return {k: 'er', q: `Simplify and state the excluded values: ${ML(e)}`, ans: {e: ans}, rz: ['0', `-${a}`], bz: [`-${a}`], nz: [`${a}`], chk: {e, dens: ['x^2', 'x', `1+${a}/x`]},
    traps: [{e: ans, v: ['0'], why: `$1+${F(a, 'x')}=0$ at $x=-${a}$ — that's the big denominator.`, id: 'big_denominator', cat: 'concept'},
      {e: `(x+${a})/x`, why: `$(x+${a})$ cancels; $(x-${a})$ stays.`, id: 'canceled_wrong', cat: 'procedure'},
      {e: `x-${a}`, why: 'The $x$ from the small fractions stays in the denominator.', id: 'lost_denominator', cat: 'procedure'}],
    h: ['Multiply the top and bottom by $x^2$ — the LCD of the small fractions.', `You get $${F(`x^2-${a * a}`, `x^2+${a}x`)}$. Factor both.`],
    x: [[F(`x^2-${a * a}`, `x^2+${a}x`), 'Multiply every term by $x^2$.'], [F(`(x-${a})(x+${a})`, `x(x+${a})`), 'Factor.'], [`${F(`x-${a}`, 'x')},\\ \\ x\\ne0,\\ -${a}`, '$x=0$ from inside; $x=-' + a + '$ makes the big denominator 0.']]};
}});
tpl({id: 'c-res', s: 'cf', d: 2, name: 'Parallel resistors', make(R) {
  let a, b; do { a = R.i(0, 5); b = R.i(0, 5); } while (a === b);
  const ans = `((${lin(a)})(${lin(b)}))/(${bin(2, a + b)})`, h3 = fr(-(a + b), 2);
  return {k: 'er', q: `Two resistors in parallel: $R=${F(1, `${F(1, 'r_1')}+${F(1, 'r_2')}`)}$ with $r_1=${TEXL(lin(a))}$ and $r_2=${TEXL(lin(b))}$. Simplify $R$ and state the excluded values.`, ans: {e: ans}, rz: [`${-a}`, `${-b}`, h3], bz: [h3], chk: {e: `1/(1/(${lin(a)})+1/(${lin(b)}))`, dens: [lin(a), lin(b), `1/(${lin(a)})+1/(${lin(b)})`]},
    traps: [{e: `(${bin(2, a + b)})/((${lin(a)})(${lin(b)}))`, why: "That's $\\f1R$ — flip it.", id: 'forgot_flip', cat: 'concept'},
      {e: bin(2, a + b), why: 'Adding resistances is the series rule, not parallel.', id: 'series_rule', cat: 'concept'},
      {e: ans, v: [h3], why: '$r_1$ and $r_2$ can\'t be 0 either.', id: 'lost_restriction', cat: 'concept'}],
    h: [`Multiply the top and bottom by $(${lin(a)})(${lin(b)})$.`, `The bottom becomes $(${lin(b)})+(${lin(a)})=${TEXL(bin(2, a + b))}$.`],
    x: [[F(`(${lin(a)})(${lin(b)})`, `(${lin(b)})+(${lin(a)})`), 'Clear the small fractions.'], [F(`(${lin(a)})(${lin(b)})`, bin(2, a + b)), ''], [NE([`${-a}`, `${-b}`, h3]), 'From $r_1$, $r_2$ and the big denominator.']]};
}});
tpl({id: 'c-s6', s: 'cf', d: 3, name: 'Fractions over fractions (Sheet #6)', make(R) {
  const q = R.i(1, 6), p = q + 2, ans = `-1/(2(x-${q}))`;
  return {k: 'er', q: `Simplify and state the excluded values: $${F(`${F(1, 2)}-${F(`x+${p}`, 4)}`, `${F('x^2', 2)}-${F(q * q, 2)}`)}$`, ans: {e: ans}, rz: [`-${q}`, `${q}`], cz: [`-${q}`], chk: {e: `(1/2-(x+${p})/4)/(x^2/2-${q * q}/2)`, dens: [`x^2/2-${q * q}/2`]},
    traps: [{e: ans, v: [`${q}`], why: `$x=-${q}$ also makes the big denominator zero.`, id: 'lost_restriction', cat: 'concept'},
      {e: `1/(2(x-${q}))`, why: `Sign: $2-(x+${p})=-x-${q}$.`, id: 'minus_not_distributed', cat: 'slip'},
      {e: `-2/(x-${q})`, why: `Multiplying by 4 everywhere gives $${F(`2-(x+${p})`, `2x^2-${2 * q * q}`)}$ — check the factor of 2.`, id: 'division', cat: 'procedure'}],
    h: ['Multiply the top and bottom by 4, the LCD of all the small denominators.', `Top: $2-(x+${p})=-(x+${q})$. Bottom: $2x^2-${2 * q * q}=2(x-${q})(x+${q})$.`],
    x: [[F(`2-(x+${p})`, `2x^2-${2 * q * q}`), 'Multiply every small fraction by 4.'], [F(`-(x+${q})`, `2(x-${q})(x+${q})`), 'Factor.'], [`-${F(1, `2(x-${q})`)},\\ \\ x\\ne\\pm${q}`, '']]};
}});

/* ============ Solving ============ */
tpl({id: 'e-s8', s: 'solve', d: 1, name: 'Check for extraneous (Sheet #8)', make(R) {
  const a = R.i(2, 9), ext = R.f() < 0.5; let m = 0; if (!ext) do { m = R.nz(-9, 9); } while (m === a || m === -a);
  const c = ext ? 2 * a : 2 * m;
  return {k: 's', q: `Solve: $${F(1, `x+${a}`)}+${F(1, `x-${a}`)}=${F(c, `x^2-${a * a}`)}$`, ans: {v: ext ? [] : [`${m}`]}, ex: ext ? [`${a}`] : [], chk: {lhs: `1/(x+${a})+1/(x-${a})`, rhs: `${c}/(x^2-${a * a})`, dens: [`x+${a}`, `x-${a}`, `x^2-${a * a}`]},
    traps: ext ? [{v: [`${a}`], why: `$x=${a}$ makes $x-${a}=0$ — extraneous.`, id: 'kept_extraneous', cat: 'concept'}, {v: [`-${a}`], why: 'Not a root — and excluded anyway.', id: 'wrong_root', cat: 'procedure'}, {v: [`${a}`, `-${a}`], why: 'Both are excluded values.', id: 'kept_extraneous', cat: 'concept'}]
      : [{v: [`${c}`], why: `$2x=${c}$ means $x=${m}$.`, id: 'arith', cat: 'slip'}, {v: [], why: `$x=${m}$ isn't excluded, so it stands.`, id: 'threw_out_valid', cat: 'concept'}, {v: [`${-m}`], why: 'Sign slip.', id: 'sign', cat: 'slip'}],
    h: [`Restrictions: $x\\ne\\pm${a}$. Multiply every term by $(x+${a})(x-${a})$.`, `You get $(x-${a})+(x+${a})=${c}$.`],
    x: [[`x\\ne\\pm${a}`, ''], [`2x=${c}\\Rightarrow x=${ext ? a : m}`, 'Clear the fractions.'], [ext ? `x=${a}\\ \\text{is excluded}` : `x=${m}`, ext ? 'Extraneous: no solution.' : 'Not excluded, so it checks.']]};
}});
tpl({id: 'e-prop', s: 'solve', d: 1, name: 'Proportion', make(R) {
  const a = R.i(1, 6), mm = R.i(1, 3), x0 = R.nz(-9, 9), b = a * (1 + mm), c = x0 * mm;
  return {k: 's', q: `Solve: $${F(a, 'x')}=${F(b, lin(c))}$`, ans: {v: [`${x0}`]}, chk: {lhs: `${a}/x`, rhs: `${b}/(${lin(c)})`, dens: ['x', lin(c)]},
    traps: [{v: [`${-x0}`], why: 'Sign slip — plug it in to check.', id: 'sign', cat: 'slip'}, {v: [`${x0 + c}`], why: "Doesn't check: plug it into both sides.", id: 'arith', cat: 'procedure'}, {v: [`${2 * x0 + c}`], why: `Distribute: $${a}(${TEXL(lin(c))})=${TEXL(bin(a, a * c))}$.`, id: 'distribute', cat: 'procedure'}],
    h: ['Cross-multiply.', `$${a}(${TEXL(lin(c))})=${b}x$.`],
    x: [[`${a}(${lin(c)})=${b}x`, 'Cross-multiply.'], [`${TEXL(bin(a, a * c))}=${b}x\\Rightarrow x=${x0}`, `Check: $x\\ne0,\\ ${-c}$.`]]};
}});
tpl({id: 'e-quad', s: 'solve', d: 2, name: 'Rational to quadratic', make(R) {
  let r1, r2; do { r1 = R.nz(-8, 8); r2 = R.nz(-8, 8); } while (r1 === r2 || r1 === -r2);
  const m = r1 + r2, k = -r1 * r2;
  return {k: 's', q: `Solve: $${F(k, 'x')}=${TEXL(lin(-m))}$`, ans: {v: [`${r1}`, `${r2}`]}, chk: {lhs: `${k}/x`, rhs: lin(-m), dens: ['x']},
    traps: [{v: [`${r1}`], why: "There's a second solution — only $x=0$ is excluded.", id: 'missed_root', cat: 'procedure'}, {v: [`${-r1}`, `${-r2}`], why: 'Sign slip in the factors.', id: 'sign', cat: 'slip'}, {v: [`${k}`], why: 'Multiply both sides by $x$ first.', id: 'not_cleared', cat: 'procedure'}],
    h: ['Multiply both sides by $x$, then set the quadratic equal to 0.', `$${TEXL(poly(1, -m, -k))}=0$`],
    x: [[`${k}=x(${lin(-m)})`, 'Multiply by $x$.'], [`${poly(1, -m, -k)}=0`, ''], [`(${lin(-r1)})(${lin(-r2)})=0\\Rightarrow x=${r1},\\ ${r2}`, 'Neither is 0, so both work.']]};
}});
tpl({id: 'e-s9', s: 'solve', d: 3, name: 'Three fractions (Sheet #9)', make(R) {
  let p, q, a, x0, ext; do { p = R.i(2, 6); q = R.i(2, 6); a = R.i(1, 4); ext = R.f() < 0.3; x0 = ext ? p : R.i(-5, 5); } while (p === q || (!ext && (x0 === p || x0 === q)));
  const D = a - q + 3 * p, c = a * q - x0 * D, top = c === 0 ? '2x^2' : `2x^2${c < 0 ? '-' : '+'}${Math.abs(c)}`, den = poly(1, -(p + q), p * q);
  const s1 = x0 === 0 ? 1 : -x0;
  return {k: 's', q: `Solve: $${F(lin(a), `x-${p}`)}+${F(top, den)}=${F('3x', `x-${q}`)}$`, ans: {v: ext ? [] : [`${x0}`]}, ex: ext ? [`${p}`] : [], chk: {lhs: `(${lin(a)})/(x-${p})+(${top})/(${den})`, rhs: `3x/(x-${q})`, dens: [`x-${p}`, den, `x-${q}`]},
    traps: ext ? [{v: [`${p}`], why: `$x=${p}$ makes $x-${p}=0$ — extraneous.`, id: 'kept_extraneous', cat: 'concept'}, {v: [`${-p}`], why: 'Not a root of the cleared equation.', id: 'wrong_root', cat: 'procedure'}, {v: [`${q}`], why: `$x=${q}$ is excluded too.`, id: 'kept_extraneous', cat: 'concept'}]
      : [{v: [`${s1}`], why: 'Sign slip — redo the last step.', id: 'sign', cat: 'slip'}, {v: [], why: 'It checks — plug it back in.', id: 'threw_out_valid', cat: 'concept'}, {v: [`${x0}`, `${p}`], why: `$x=${p}$ is excluded.`, id: 'kept_extraneous', cat: 'concept'}],
    h: [`$${TEXL(den)}=(x-${p})(x-${q})$ is the LCD. Restrictions: $x\\ne${p},\\ ${q}$.`, `Multiply every term: $(${lin(a)})(x-${q})+${TEXL(top)}=3x(x-${p})$.`],
    x: [[`(${lin(a)})(x-${q})+${top}=3x(x-${p})`, 'Multiply every term by the LCD.'], [`${D}x=${a * q - c}\\Rightarrow x=${x0}`, 'The $x^2$ terms cancel.'], [ext ? `x=${p}\\ \\text{is excluded}` : `x=${x0}`, ext ? 'Extraneous: no solution.' : 'Not excluded, so it checks.']]};
