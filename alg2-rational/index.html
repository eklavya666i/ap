function startTest(){let L=[];for(const k in MIX)L=L.concat(shuf(BYSK[k]).slice(0,MIX[k]));TS={list:L.map(q=>q.id),i:0,ans:{},flag:{},perm:{},start:Date.now(),dur:25*60*1000,done:false};vTest()}
function vTest(){
  curView='test';const S=TS,q=QID[S.list[S.i]];
  if(!S.perm[q.id])S.perm[q.id]=shuf([0,1,2,3]);
  const na=Object.keys(S.ans).length;
  top('Test sim','<span class="timer" id="tmr">'+fmtT(left())+'</span>');setTab('home');
  main.innerHTML='<div class="wrap"><div class="qprog"><span>Question '+(S.i+1)+' of '+S.list.length+'</span>'+bar(100*na/S.list.length)+'<span class="num">'+na+' answered</span></div>'
  +'<section class="card qcard">'+qCard(q,S.perm[q.id],{picked:S.ans[q.id],reveal:false})+'</section>'
  +'<div class="tnav"><button class="btn" data-a="tprev"'+(S.i?'':' disabled')+'>‹ Back</button><button class="btn'+(S.flag[q.id]?' flagged':'')+'" data-a="tflag">'+ic('flag2')+(S.flag[q.id]?'Flagged':'Flag')+'</button><button class="btn pri" data-a="tnext">'+(S.i+1<S.list.length?'Next ›':'Finish')+'</button></div>'
  +'<section class="card"><div class="pal">'+S.list.map((id,k)=>'<button data-a="tgo" data-i="'+k+'" class="'+(S.ans[id]!==undefined?'ans ':'')+(S.flag[id]?'flag ':'')+(k===S.i?'cur':'')+'" aria-label="Question '+(k+1)+'">'+(k+1)+'</button>').join('')+'</div><div class="cta"><button class="btn big" data-a="tsubmit">Submit test</button></div></section></div>';
  stopTick();tick=setInterval(()=>{const l=left(),el=document.getElementById('tmr');if(el){el.textContent=fmtT(l);el.classList.toggle('low',l<120)}if(l<=0){stopTick();finishTest()}},1000);
}
function askSubmit(){const un=TS.list.filter(id=>TS.ans[id]===undefined).length;if(un)confirmBox('Submit with '+un+' unanswered question'+(un>1?'s':'')+'?','Submit',finishTest);else confirmBox('Submit your test?','Submit',finishTest)}
function finishTest(){
  if(!TS||TS.done)return;stopTick();TS.done=true;
  const used=Math.min(TS.dur,Date.now()-TS.start)/1000;let s=0;
  TS.list.forEach(id=>{const a=TS.ans[id];if(a!==undefined){record(QID[id],a===0);if(a===0)s++}});
  ST.tests.push({s,n:TS.list.length,t:Math.round(used),d:Date.now()});ST.tests=ST.tests.slice(-20);save();
  TS.score=s;TS.used=used;vTestEnd();
}
function vTestEnd(){
  curView='';const S=TS;top('Test results');setTab('home');
  main.innerHTML='<div class="wrap"><section class="card score"><div class="big-n">'+S.score+'<span> / '+S.list.length+'</span></div><p>'+msg(S.score,S.list.length)+' Time used: '+fmtT(S.used)+'.</p><div class="list">'+byskill(S.list,S.ans)+'</div></section>'
  +'<h2 class="h2">Every question, worked out</h2>'+S.list.map(id=>reviewItem(QID[id],S.ans[id])).join('')
  +'<div class="cta"><button class="btn pri big" data-a="tstart">New test</button><button class="btn big" data-a="nav" data-to="practice">Practice</button></div></div>';
  window.scrollTo(0,0);
}

/* ---------- SPEED (generated questions) ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let v=0;while(!v)v=ri(a,b);return v};
const pk=a=>a[Math.floor(Math.random()*a.length)];
const lin=(v,k)=>k===0?v:v+(k<0?'-':'+')+Math.abs(k);
const tri=(r,s)=>{const b=r+s,c=r*s;let t='x^2';if(b)t+=(b<0?'-':'+')+(Math.abs(b)===1?'':Math.abs(b))+'x';if(c)t+=(c<0?'-':'+')+Math.abs(c);return t};
const fN=v=>Number.isInteger(v)?String(v):String(+v.toFixed(2));
const mk=(q,c,w,x)=>{const all=[c].concat(w);return new Set(all).size<4?null:{q,c:all,x}};
const G={
 fac:[
  ()=>{const a=ri(2,12);return mk('Factor: $x^2-'+a*a+'$','$(x-'+a+')(x+'+a+')$',['$(x-'+a+')^2$','$(x+'+a+')^2$','$(x-'+a*a+')(x+1)$'],'Difference of squares: $(x-'+a+')(x+'+a+')$.')},
  ()=>{let r,s;do{r=nz(-9,9);s=nz(-9,9)}while(r===s||r===-s);return mk('Factor: $'+tri(r,s)+'$','$('+lin('x',r)+')('+lin('x',s)+')$',['$('+lin('x',-r)+')('+lin('x',-s)+')$','$('+lin('x',r)+')('+lin('x',-s)+')$','$('+lin('x',-r)+')('+lin('x',s)+')$'],'Product '+r*s+', sum '+(r+s)+': use '+r+' and '+s+'.')},
  ()=>{const a=ri(2,6),b=ri(1,9);return mk('Factor: $'+a+'x^2+'+a*b+'x$','$'+a+'x(x+'+b+')$',['$'+a+'(x^2+'+b+'x)$','$x('+a+'x+'+a*b+')$','$'+a+'x(x+'+a*b+')$'],'GCF is $'+a+'x$ — take out the number and the variable.')}],
 simp:[
  ()=>{let a,b,k;do{a=nz(-9,9);b=nz(-9,9);k=nz(-9,9)}while(a===b||a===-b||-k===a||-k===b);const v=[a,b].sort((p,q)=>p-q);return mk('Excluded values of $\\f{'+lin('x',k)+'}{('+lin('x',-a)+')('+lin('x',-b)+')}$?','$x\\ne'+v[0]+','+v[1]+'$',['$x\\ne'+(-v[1])+','+(-v[0])+'$','$x\\ne'+[v[0],v[1],-k].sort((p,q)=>p-q).join(',')+'$','$x\\ne'+v[0]+'$ only'],'Set each denominator factor to 0. The numerator never restricts.')},
  ()=>{let r,s;do{r=nz(-9,9);s=nz(-9,9)}while(r===s||r===-s||r*s===s||r*s===r);return mk('Simplify: $\\f{'+tri(r,s)+'}{'+lin('x',r)+'}$','$'+lin('x',s)+'$',['$'+lin('x',r)+'$','$'+lin('x',-s)+'$','$'+lin('x',r*s)+'$'],'Factor: $('+lin('x',r)+')('+lin('x',s)+')$, then cancel $('+lin('x',r)+')$.')},
  ()=>{const a=ri(1,9),f=Math.random()<.5;return mk('Simplify: $\\f{'+(f?a+'-x}{x-'+a:'x-'+a+'}{'+a+'-x')+'}$','$-1$',['$1$','$0$','$x-'+a+'$'],'Opposites divide to $-1$ (with $x\\ne'+a+'$).')},
  ()=>{const a=ri(2,9);return mk('Simplify: $\\f{x^2-'+a*a+'}{x+'+a+'}$','$x-'+a+'$',['$x+'+a+'$','$\\f{1}{x-'+a+'}$','$x^2-'+a+'$'],'$x^2-'+a*a+'=(x-'+a+')(x+'+a+')$; cancel $(x+'+a+')$.')}],
 ops:[
  ()=>{const a=ri(2,9);return mk('LCD of $\\f{1}{x^2-'+a*a+'}$ and $\\f{1}{x+'+a+'}$?','$(x-'+a+')(x+'+a+')$',['$(x^2-'+a*a+')(x+'+a+')$','$x+'+a+'$','$(x+'+a+')^2$'],'$x^2-'+a*a+'$ already contains the factor $x+'+a+'$.')},
  ()=>{let a,b;do{a=ri(1,9);b=ri(1,9)}while(a*b===a+b);return mk('Simplify: $\\f{'+a+'}{x}+\\f{'+b+'}{x}$','$\\f{'+(a+b)+'}{x}$',['$\\f{'+(a+b)+'}{2x}$','$\\f{'+a*b+'}{x}$','$\\f{'+(a+b)+'}{x^2}$'],'Same denominator: add only the numerators.')},
  ()=>{let a,b,c;do{a=nz(-9,9);b=nz(-9,9);c=nz(-9,9)}while(a===b||b===c||a===c);const A=lin('x',a),B=lin('x',b),C=lin('x',c);return mk('Simplify: $\\f{'+A+'}{'+B+'}\\div\\f{'+C+'}{'+B+'}$','$\\f{'+A+'}{'+C+'}$',['$\\f{'+C+'}{'+A+'}$','$\\f{('+A+')('+C+')}{('+B+')^2}$','$1$'],'Flip the divisor: $\\f{'+A+'}{'+B+'}\\cdot\\f{'+B+'}{'+C+'}$.')},
  ()=>{let a,b,c;do{a=ri(2,9);c=ri(1,9);b=ri(1,9)}while(a===c);return mk('Simplify: $\\f{'+a+'}{x-'+b+'}+\\f{'+c+'}{'+b+'-x}$','$\\f{'+(a-c)+'}{x-'+b+'}$',['$\\f{'+(a+c)+'}{x-'+b+'}$','$\\f{'+(c-a)+'}{x-'+b+'}$','$\\f{'+(a-c)+'}{x+'+b+'}$'],'$\\f{'+c+'}{'+b+'-x}=-\\f{'+c+'}{x-'+b+'}$, so subtract.')},
  ()=>{let a,b;do{a=nz(-9,9);b=nz(-9,9)}while(a===b||a===-b);const A=lin('x',a),B=lin('x',b);return mk('Simplify: $\\f{'+A+'}{'+B+'}\\cdot\\f{'+B+'}{x}$','$\\f{'+A+'}{x}$',['$\\f{'+A+'}{'+B+'}$','$'+A+'$','$\\f{('+A+')('+B+')}{x}$'],'Cancel the common factor $('+B+')$.')}],
 solve:[
  ()=>{const a=ri(1,6),m=ri(1,3),x0=nz(-9,9),b=a*(1+m),c=x0*m;return mk('Solve: $\\f{'+a+'}{x}=\\f{'+b+'}{'+lin('x',c)+'}$','$x='+x0+'$',['$x='+(-x0)+'$','$x='+(x0+c)+'$','$x='+(2*x0+c)+'$'],'Cross-multiply: $'+a+'('+lin('x',c)+')='+b+'x$.')},
  ()=>{const a=ri(1,9);if(Math.random()<.5)return mk('Solve: $\\f{x}{x-'+a+'}=\\f{'+a+'}{x-'+a+'}$','No solution',['$x='+a+'$','$x=-'+a+'$','All real numbers'],'Clearing gives $x='+a+'$, but that makes the denominator 0: extraneous.');let b;do{b=ri(1,9)}while(b===a);return mk('Solve: $\\f{x}{x-'+a+'}=\\f{'+b+'}{x-'+a+'}$','$x='+b+'$',['$x='+a+'$','No solution','$x=-'+b+'$'],'Numerators equal: $x='+b+'$, and $'+b+'\\ne'+a+'$, so it checks.')},
  ()=>{const a=ri(2,9);return mk('Solve: $\\f{x^2}{x-'+a+'}=\\f{'+a*a+'}{x-'+a+'}$','$x=-'+a+'$',['$x=\\pm'+a+'$','$x='+a+'$','No solution'],'$x^2='+a*a+'$ gives $\\pm'+a+'$, but $x='+a+'$ is excluded.')}],
 work:[
  ()=>{const P=[[2,3],[3,6],[4,12],[6,12],[10,15],[12,24],[20,30],[5,20],[4,4],[6,6],[8,24],[9,18],[6,3],[12,4],[15,10],[3,3],[12,6],[2,6]];const pr=pk(P),p=pr[0],q=pr[1],T=p*q/(p+q),w=pk([['Ira','her coach'],['Pipe A','pipe B'],['One mower','another'],['Sam','Kim']]);return mk(w[0]+' takes '+p+' h alone; '+w[1]+' takes '+q+' h. How long together?',fN(T)+' h',[(p+q)+' h',fN((p+q)/2)+' h',p*q+' h'],'Add rates: $\\f1{'+p+'}+\\f1{'+q+'}=\\f{'+(p+q)+'}{'+p*q+'}$, so $T='+fN(T)+'$ h.')},
  ()=>{const P=[[2,1],[3,1],[6,2],[6,3],[12,4],[10,5],[8,2],[9,3]];const pr=pk(P),R=pr[0],r=pr[1];return mk('Parallel resistors: $\\f1R=\\f1{'+R+'}+\\f1{'+r+'}$. Find $R$.',fN(R*r/(R+r))+' Ω',[(R+r)+' Ω',fN((R+r)/2)+' Ω',fN((R+r)/(R*r))+' Ω'],'Add the reciprocals, then flip: $R='+fN(R*r/(R+r))+'$.')}]
};
const FOCUS=[['mix','Mixed'],['fac','Factoring'],['simp','Simplify'],['ops','Operations'],['solve','Solving'],['work','Work & rates']];
function genQ(f){const pool=f==='mix'?[].concat(...Object.values(G)):G[f];let g=null,t=0;while(!g&&t<80){g=pk(pool)();t++;if(g&&SS&&SS.recent.includes(g.q))g=null}g.perm=shuf([0,1,2,3]);return g}
const bestTxt=(m,f)=>{const b=ST.sp[m+':'+f];return b===undefined?'—':m==='sprint'?b+' correct':fmtT(b)};
function vSpeed(){
  top('Speed');setTab('speed');const f=ST.po.sf||'mix';
  main.innerHTML='<div class="wrap"><p class="lede">Fast recall on the moves every problem needs. Questions are generated fresh each round, so you never run out.</p><section class="card form"><div class="fl"><b>Focus</b><div class="chips">'+FOCUS.map(x=>'<button class="chip" data-a="sfocus" data-k="'+x[0]+'" aria-pressed="'+(x[0]===f)+'">'+x[1]+'</button>').join('')+'</div></div></section>'
  +'<div class="modes"><button class="mode" data-a="sstart" data-m="sprint">'+ic('bolt')+'<b>Sprint</b><span>90 seconds. Answer as many as you can.</span><em>Best: '+bestTxt('sprint',f)+'</em></button><button class="mode" data-a="sstart" data-m="trial">'+ic('clock')+'<b>Time trial</b><span>10 questions against the clock. Each miss adds 5 seconds.</span><em>Best: '+bestTxt('trial',f)+'</em></button></div></div>';
}
function startSpeed(m){const f=ST.po.sf||'mix';SS={mode:m,f,score:0,n:0,miss:[],start:Date.now(),end:Date.now()+90000,pen:0,recent:[],lock:false,done:false};SS.q=genQ(f);vSpeedQ()}
function spCard(){const g=SS.q;return '<div class="prompt">'+R(g.q)+'</div><div class="choices two">'+g.perm.map((ci,k)=>'<button class="ch" data-a="choose" data-ci="'+ci+'"><span class="lt">'+'ABCD'[k]+'</span><span class="ct">'+R(g.c[ci])+'</span></button>').join('')+'</div>'}
function vSpeedQ(){
  curView='speed';top(SS.mode==='sprint'?'Sprint':'Time trial','<span class="timer" id="stm"></span>');setTab('speed');
  main.innerHTML='<div class="wrap"><div class="sbar"><div class="tbar"><i id="tbi"></i></div><span class="num" id="sct"></span></div><section class="card qcard speedq" id="sq">'+spCard()+'</section><div class="cta"><button class="btn" data-a="sstop">Stop</button></div></div>';
  supd();stopTick();tick=setInterval(()=>{supd();if(SS&&SS.mode==='sprint'&&Date.now()>=SS.end&&!SS.lock)endSpeed()},100);
}
function supd(){
  const S=SS;if(!S)return;const bi=document.getElementById('tbi'),ct=document.getElementById('sct'),tm=document.getElementById('stm');
  if(S.mode==='sprint'){const l=Math.max(0,S.end-Date.now());if(bi)bi.style.width=(100*l/90000).toFixed(2)+'%';if(ct)ct.textContent=S.score+' correct';if(tm){tm.textContent=fmtT(Math.ceil(l/1000));tm.classList.toggle('low',l<15000)}}
  else{if(bi)bi.style.width=(100*S.n/10)+'%';if(ct)ct.textContent=Math.min(S.n+1,10)+' / 10';if(tm)tm.textContent=fmtT((Date.now()-S.start)/1000+S.pen)}
}
function spChoose(ci){
  const S=SS;if(!S||S.lock)return;S.lock=true;const ok=ci===0;S.n++;
  if(ok)S.score++;else{S.miss.push(S.q);S.pen+=5}
  S.recent.push(S.q.q);S.recent=S.recent.slice(-8);
  document.querySelectorAll('#sq .ch').forEach(b=>{const c=+b.dataset.ci;b.disabled=true;if(c===0)b.classList.add('ok');else if(c===ci)b.classList.add('no')});
  setTimeout(()=>{if(SS!==S||S.done)return;S.lock=false;if(S.mode==='trial'&&S.n>=10)return endSpeed();if(S.mode==='sprint'&&Date.now()>=S.end)return endSpeed();S.q=genQ(S.f);const sq=document.getElementById('sq');if(sq)sq.innerHTML=spCard();supd()},ok?300:950);
}
function endSpeed(){
  const S=SS;if(!S||S.done)return;S.done=true;stopTick();
  const key=S.mode+':'+S.f;let nb=false;
  if(S.mode==='sprint'){if(ST.sp[key]===undefined||S.score>ST.sp[key]){if(S.score>0){ST.sp[key]=S.score;nb=true}}}
  else{S.time=(Date.now()-S.start)/1000+S.pen;if(S.n>=10&&(ST.sp[key]===undefined||S.time<ST.sp[key])){ST.sp[key]=Math.round(S.time);nb=true}}
  save();curView='';top(S.mode==='sprint'?'Sprint results':'Time trial results');
  const acc=S.n?Math.round(100*S.score/S.n):0;
  main.innerHTML='<div class="wrap"><section class="card score"><div class="big-n">'+(S.mode==='sprint'?S.score+'<span> correct</span>':fmtT(S.time))+(nb?'<span class="newbest">New best</span>':'')+'</div><p>'+(S.mode==='sprint'?S.n+' answered · '+acc+'% accuracy':S.score+' / '+S.n+' correct · '+S.miss.length*5+' s penalty')+'</p></section>'
  +(S.miss.length?'<h2 class="h2">Misses</h2><section class="card">'+S.miss.map(g=>'<div class="miss"><div>'+R(g.q)+'</div><div><b>Answer:</b> '+R(g.c[0])+'</div><p class="stx">'+R(g.x)+'</p></div>').join('')+'</section>':'')
  +'<div class="cta"><button class="btn pri big" data-a="sstart" data-m="'+S.mode+'">Go again</button><button class="btn big" data-a="nav" data-to="speed">Change mode</button></div></div>';
  window.scrollTo(0,0);
}

  predo:()=>startPractice(shuf((PS.missIds||[]).map(id=>QID[id]))),
  choose:t=>{const ci=+t.dataset.ci;
    if(curView==='prac'&&PS){const q=QID[PS.list[PS.i]];if(PS.ans[q.id]!==undefined)return;PS.ans[q.id]=ci;if(ci===0)PS.right++;record(q,ci===0);vQ()}
    else if(curView==='test'&&TS&&!TS.done){TS.ans[TS.list[TS.i]]=ci;vTest()}
    else if(curView==='speed')spChoose(ci)},
  tstart:()=>{quietHash('test');startTest();window.scrollTo(0,0)},
  tresume:()=>vTest(),
  tprev:()=>{if(TS.i>0){TS.i--;vTest()}},
  tnext:()=>{if(TS.i+1<TS.list.length){TS.i++;vTest()}else askSubmit()},
  tgo:t=>{TS.i=+t.dataset.i;vTest()},
  tflag:()=>{const id=TS.list[TS.i];TS.flag[id]=!TS.flag[id];vTest()},
  tsubmit:()=>askSubmit(),
  sfocus:t=>{ST.po.sf=t.dataset.k;save();vSpeed()},
  sstart:t=>{quietHash('speed');startSpeed(t.dataset.m);window.scrollTo(0,0)},
  sstop:()=>{if(SS&&SS.n)endSpeed();else{SS=null;go('speed')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=ACT[t.dataset.a];if(f){e.preventDefault();f(t)}});
addEventListener('keydown',e=>{
  if(modal.innerHTML){if(e.key==='Escape')ACT.mcancel();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();let i='1234'.indexOf(k);if(i<0&&k.length===1)i='abcd'.indexOf(k);
  if(k.length===1&&i>=0){const b=main.querySelectorAll('.choices .ch')[i];if(b&&!b.disabled&&b.dataset.a==='choose'){e.preventDefault();b.click()}return}
  if(k==='enter'){const n=main.querySelector('[data-a=pnext]');if(n){e.preventDefault();n.click()}}
  if(curView==='test'){if(k==='arrowright')ACT.tnext();if(k==='arrowleft')ACT.tprev()}
});
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude/i.test(location.hostname)){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{SWOK=true;const o=document.getElementById('offl');if(o)o.textContent=offText()}).catch(()=>{})}}catch(e){}
route(true);
}
