<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math 6</title>
<!--__HEAD__-->
<!--__FONTS__-->
<style>
/* Math 6. Plumbing (storage, backup, offline worker, safe updates, install note) comes from SAT Daily. */
:root{color-scheme:light;--bg:#fbfaf7;--card:#fff;--ink:#17181c;--soft:#5d6068;--line:#e3e1db;--panel:#f2f1ec;--accent:#1d4ed8;--accentbg:#e8eefc;--onaccent:#fff;--ok:#127a45;--okbg:#e8f5ee;--pen:#c8102e;--penbg:#fcebee;--warn:#b45309;--warnbg:#fdf3e6;--gold:#b7791f}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111317;--card:#181b20;--ink:#ecebe6;--soft:#a6a9b0;--line:#2c3038;--panel:#1d2026;--accent:#7aa2ff;--accentbg:#1b2440;--onaccent:#0d1430;--ok:#4cc685;--okbg:#13261b;--pen:#ff6b6b;--penbg:#2b1518;--warn:#f59e0b;--warnbg:#2a2010;--gold:#e0b453}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.band{background:var(--accent);color:var(--onaccent);padding:calc(12px + env(safe-area-inset-top)) max(4vw,16px,env(safe-area-inset-right)) 12px max(4vw,16px,env(safe-area-inset-left))}
.band .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap}
h1{font:800 clamp(28px,5vw,40px)/1 Archivo,system-ui,sans-serif;font-stretch:82%;letter-spacing:-.02em;margin:0}
.stats{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.stat b{font:800 24px/1 Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:600;opacity:.92}
.xpbar{width:120px;height:7px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:currentColor}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .in{max-width:1100px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px max(4vw,12px)}
nav a{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:44px;min-width:48px;padding:0 14px;border-radius:10px;color:var(--soft);font-weight:700;text-decoration:none}
nav a[aria-current=page]{background:var(--accentbg);color:var(--accent)}
nav a.gear{margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:18px max(4vw,16px,env(safe-area-inset-left)) 40px}
h2{font:800 26px/1.15 Archivo,system-ui,sans-serif;margin:4px 0 6px}
h3{font:800 20px/1.2 Archivo,system-ui,sans-serif;margin:4px 0 8px}
h4{margin:12px 0 6px;font-size:15px;color:var(--soft)}
.lead{color:var(--soft);margin:0 0 16px;max-width:66ch}
.meta{font-size:14px;color:var(--soft);margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row.center{justify-content:center}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:11px;border:2px solid var(--accent);background:var(--accent);color:var(--onaccent);font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:0 14px;font-size:15px}
.btn.big{min-width:96px;min-height:64px;font-size:26px}
.btn[disabled],.btn.disabled{opacity:.45;cursor:default}
.ico{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:18px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:var(--panel);color:var(--soft);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip.p{background:var(--warnbg);color:var(--warn)}
.chip.m{background:var(--okbg);color:var(--ok)}
.chip .due{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pen)}
.pill{font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:10px;background:var(--accentbg);color:var(--accent)}
.pill.w{background:var(--warnbg);color:var(--warn)}
.dots{letter-spacing:2px;color:var(--soft);font-size:13px}
.plus{font-size:12px;font-weight:800;color:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 .12em;font-size:.92em}
.fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 .15em}
.fr span:last-child{padding:0 .15em}
/* journey map */
.region{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--u);border-radius:14px;padding:12px 16px;margin:0 0 14px}
.region.cur{box-shadow:0 0 0 2px var(--u)}
.rhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;text-decoration:none;color:inherit;min-height:44px}
.rhead .k{font-size:13px;font-weight:700;color:var(--u);text-transform:uppercase;letter-spacing:.04em}
.rhead b{font-size:19px}
.tro{font-size:18px}.tro.bronze{color:#a0522d}.tro.silver{color:#8a8f98}.tro.gold{color:var(--gold)}
.path{display:flex;flex-wrap:wrap;gap:8px 6px;margin-top:8px}
.stop{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:inherit;min-width:56px;min-height:64px}
.stop .ring{width:44px;height:44px;border-radius:50%;border:3px solid var(--u);display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--card)}
.stop .st{font-size:11px;color:var(--gold);letter-spacing:1px}
.stop.soon{opacity:.45}.stop.soon .st{color:var(--soft);letter-spacing:0}
.stop.boss .ring{border-style:dashed}.stop.boss.won .ring{background:var(--u);color:#fff}
.lessons{list-style:none;margin:0;padding:0}
.lessons li{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.lessons li:last-child{border-bottom:0}
.lessons .id{font-weight:800;font-variant-numeric:tabular-nums;color:var(--u,var(--accent));min-width:3.2em}
.lessons .t{flex:1}
.lessons .std{font-size:13px;color:var(--soft)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.ltabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 14px}
.ltabs a{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:44px;min-width:48px;padding:0 14px;font-weight:700;color:var(--soft);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.ltabs a[aria-current=page]{color:var(--accent);border-bottom-color:var(--accent)}
/* teach player */
.teach{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:900px) and (orientation:landscape){.teach{grid-template-columns:3fr 2fr}.tbar,.tdots,.teach>.meta{grid-column:1/-1}}
.tboard{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:240px;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.board-in{width:100%}.tboard .board-in{animation:fade .35s ease}   /* only the lesson board fades in; question boards stay still while you answer */
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tpart{display:flex;font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.tcap{font:500 20px/1.5 "Source Serif 4",Georgia,serif;margin-top:8px}
.tcap.off{display:none}
.twhy{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accentbg)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbar select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px}
.tdots{display:flex;flex-wrap:wrap;gap:6px}
.tdot{width:44px;height:44px;border:0;border-radius:10px;background:transparent;cursor:pointer;padding:0;position:relative}
.tdot::after{content:"";position:absolute;left:4px;right:4px;top:16px;height:12px;border-radius:6px;background:var(--line)}
.tdot.past::after{background:var(--accentbg)}.tdot.on::after{background:var(--accent)}
.done-card{border:2px solid var(--ok)}
.vfail{grid-column:1/-1;padding:12px 14px;border-radius:12px;border-left:5px solid var(--pen);background:var(--penbg)}
.tips{margin:8px 0 0;padding-left:1.3em}.tips li{margin:4px 0}
.premhelp{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accentbg)}.premhelp p{margin:6px 0}
.vnote{grid-column:1/-1;margin-top:0}
details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}details summary::before{content:"▸";margin-right:8px;color:var(--accent)}details[open] summary::before{content:"▾"}
/* board models */
.bw{text-align:center}.bw-big{font:700 clamp(24px,3.6vw,34px)/1.3 "Source Serif 4",Georgia,serif}.bw-small{color:var(--soft);margin-top:8px;font-size:18px}
.beq{font:600 clamp(20px,3vw,28px)/1.5 "Source Serif 4",Georgia,serif;text-align:center}
.beq-l{padding:2px 10px;border-radius:8px}.beq-l.hl{background:var(--accentbg);color:var(--accent)}.beq-l.strike{text-decoration:line-through;color:var(--pen)}
.brt{display:flex;flex-direction:column;align-items:center;overflow-x:auto}
.rt{border-collapse:collapse;font:600 20px/1.3 "Source Serif 4",Georgia,serif;margin:0 auto}
.rt th,.rt td{border:1.5px solid var(--line);padding:8px 14px;text-align:center;min-width:64px}
.rt th{font:700 15px Archivo,system-ui,sans-serif;color:var(--soft);text-align:left;background:var(--panel)}
.rt td.hl{background:var(--accentbg);color:var(--accent)}
.rt-ops{display:grid;width:100%;max-width:560px;font-size:14px;font-weight:700;color:var(--accent);text-align:center}
.bsvg{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
.bsvg .lbl{font:700 15px Archivo,system-ui,sans-serif;fill:var(--soft)}
.bsvg .axis{stroke:var(--ink);stroke-width:2}
.bsvg .tick{stroke:var(--ink);stroke-width:2}.bsvg .tick.on{stroke:var(--accent);stroke-width:3}
.bsvg .val{font:600 16px "Source Serif 4",Georgia,serif;fill:var(--ink)}.bsvg .val.on{fill:var(--accent);font-weight:800}
.bsvg .link{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4}
.bsvg .part{stroke:var(--card);stroke-width:2}.bsvg .p0{fill:#3b82f6}.bsvg .p1{fill:#f59e0b}.bsvg .p2{fill:#10b981}.bsvg .p3{fill:#a855f7}
.bsvg .pv{font:700 15px Archivo,system-ui,sans-serif;fill:#fff}
.bsvg .sq{fill:var(--card);stroke:var(--line);stroke-width:1}.bsvg .sq.on{fill:var(--accent)}
.bsvg .dot{fill:var(--accent)}
.grid100{max-width:300px}
.grid100.pick .sq{cursor:pointer}
/* questions */
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stem{font:500 20px/1.5 "Source Serif 4",Georgia,serif;margin:10px 0}
.qboard{margin:8px 0}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);cursor:pointer;font:500 18px/1.4 "Source Serif 4",Georgia,serif}
.choice .key{font:800 14px Archivo,system-ui,sans-serif;color:var(--soft);min-width:1.4em}
.choice.sel{border-color:var(--accent);background:var(--accentbg)}
.choice.right{border-color:var(--ok);background:var(--okbg)}.choice.wrong{border-color:var(--pen);background:var(--penbg)}.choice.missed{border-color:var(--ok);border-style:dashed}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ans{min-height:52px;width:12ch;max-width:100%;border:2px solid var(--line);border-radius:11px;background:var(--bg);padding:0 12px;font:600 22px "Source Serif 4",Georgia,serif;text-align:center}
.ans.focus,.ans:focus{border-color:var(--accent);outline:none}
.affix{font:700 22px "Source Serif 4",Georgia,serif}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(60px,76px));gap:8px;margin-top:12px;width:max-content;max-width:100%}
.kp-gap{min-height:52px}
.kp{min-height:52px;border:1.5px solid var(--line);border-radius:11px;background:var(--panel);font:700 22px Archivo,system-ui,sans-serif;cursor:pointer}
.kp:active{background:var(--accentbg)}
.tablewrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}.tablewrap .rt{margin:0}
@media (max-width:480px){.rt th,.rt td{padding:6px 8px;min-width:48px}.rt{font-size:18px}.qrt .ans{width:5.5ch}}
.qrt td.blank{padding:4px}.qrt .ans{width:7ch;min-height:44px;font-size:19px}
.qrt td.right .ans{border-color:var(--ok)}.qrt td.wrong .ans{border-color:var(--pen)}
.fix{display:block;font-size:14px;color:var(--ok);font-weight:700}
.count{font-weight:700}
.hint-sm{font-size:14px;color:var(--soft);margin:4px 0 8px}
.ordered,.pool{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chipbtn{min-height:48px;min-width:48px;padding:6px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);cursor:pointer;font:600 18px "Source Serif 4",Georgia,serif}
.chipbtn.on{border-color:var(--accent);background:var(--accentbg)}.chipbtn.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match>div{display:flex;flex-direction:column;gap:8px}
.yn{display:flex;flex-direction:column;gap:8px}
.ynrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border:1.5px solid var(--line);border-radius:11px;font:500 18px "Source Serif 4",Georgia,serif}
.ynrow.right{border-color:var(--ok)}.ynrow.wrong{border-color:var(--pen)}
.ynb{display:flex;gap:6px}.ynrow .why{flex-basis:100%;font:14px Archivo,system-ui,sans-serif;color:var(--soft)}
.steps{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.explain{width:100%;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);padding:10px;font:500 18px/1.5 "Source Serif 4",Georgia,serif}
.sample{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--ok);background:var(--okbg)}
.fb.bad{border-color:var(--pen);background:var(--penbg)}.fb.close{border-color:var(--warn);background:var(--warnbg)}
.okmsg{color:var(--ok)}.nomsg{color:var(--pen)}.closemsg{color:var(--warn)}
.fbmsg{margin:6px 0}
.sol{margin:8px 0;padding-left:1.4em}.sol li{margin:6px 0}.sol .s{display:block;font:600 18px "Source Serif 4",Georgia,serif}.sol .why{display:block;color:var(--soft);font-size:15px}
.hints{background:var(--card);border:1px dashed var(--accent);border-radius:12px;padding:6px 14px;margin:0 0 12px}
.pmeta{font-size:14px;color:var(--soft);margin:0 0 8px}
.scratch{margin-top:10px}.scratch canvas{width:100%;height:auto;aspect-ratio:1200/520;border:1px solid var(--line);border-radius:10px;touch-action:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
/* tests */
.tesbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 10px;padding:8px 12px;border-radius:12px;background:var(--panel)}
.timer{font:800 22px Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums}.timer.low{color:var(--pen)}
.hearts{color:var(--pen);font-size:22px;letter-spacing:2px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:10px 0}
.sheet .sq{min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700;cursor:pointer}
.sheet .sq.ans{border-color:var(--accent);background:var(--accentbg)}.sheet .sq.flag{border-color:var(--warn)}
.results .big{font:800 24px Archivo,system-ui,sans-serif}
.mislist{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--warnbg)}
.rlist{list-style:none;padding:0;margin:10px 0}
.rlist li{border-bottom:1px solid var(--line)}
.rlist summary{display:flex;gap:10px;align-items:center;min-height:48px;cursor:pointer}
.rlist .mark{font-weight:800;width:1.4em}.rlist li.ok .mark{color:var(--ok)}.rlist li.no .mark{color:var(--pen)}
.rlist .rq{flex:1;font-size:15px}
.pace{font-size:13px;color:var(--soft);white-space:nowrap}.pace.slow{color:var(--warn)}
.frame .fsteps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.frame .fsteps span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:10px;background:var(--panel);color:var(--soft)}
.frame .fsteps span.on{background:var(--accent);color:var(--onaccent)}.frame .fsteps span.past{background:var(--okbg);color:var(--ok)}
/* speed */
.spq{font:800 clamp(34px,7vw,56px)/1.2 "Source Serif 4",Georgia,serif;text-align:center;margin:18px 0}
.speed .numrow{justify-content:center}
.speed .keypad{margin-left:auto;margin-right:auto}
.spstats{display:flex;gap:16px;justify-content:center;margin-top:12px;font-weight:700}
.combo.hot{color:var(--warn)}
.ghost{position:relative;height:22px;border-radius:11px;background:var(--panel);overflow:hidden;margin:6px 0}
.ghost i{position:absolute;inset:0 auto 0 0;background:var(--line)}.ghost b{position:absolute;left:0;height:8px;top:7px;background:var(--accent);border-radius:4px}
.ghost span{position:relative;font-size:12px;padding-left:10px;line-height:22px;color:var(--soft)}
.drill.locked{opacity:.55}
/* today and progress */
.lvlrow{display:flex;gap:10px;align-items:baseline}
.bar{display:block;height:10px;border-radius:5px;background:var(--panel);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}
.quests{list-style:none;padding:0;margin:8px 0 0}.quests li{display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:36px}
.quests li.done{color:var(--ok)}.qbar{width:90px;height:8px;border-radius:4px;background:var(--panel);overflow:hidden;flex:0 0 auto}.qbar i{display:block;height:100%;background:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(7,22px);grid-auto-flow:column;gap:4px;max-width:260px;margin-top:10px}
.cal i{border-radius:4px;background:var(--panel)}.cal i.on{background:var(--ok)}.cal i.fz{background:#7dd3fc}.cal i.today{outline:2px solid var(--accent)}
.accrow{display:grid;grid-template-columns:64px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:10px}
.mc{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;color:var(--soft);border:2px solid var(--line)}
.mc.practicing{border-color:var(--u);color:var(--ink)}.mc.mastered{background:var(--u);border-color:var(--u);color:#fff}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{font-size:12.5px;padding:4px 10px;border-radius:12px;border:1px dashed var(--line);color:var(--soft)}
.bdg.got{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accentbg)}
.bdg.got.bronze{border-color:#a0522d}.bdg.got.silver{border-color:#8a8f98}.bdg.got.gold{border-color:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.heat{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;max-width:330px;margin-top:8px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--panel)}.heat i.auto{background:var(--ok)}.heat i.learn{background:#9fd8b6}.heat i.slow{background:#f59e0b}.heat i.miss{background:var(--pen)}
.hist{list-style:none;padding:0;margin:6px 0 0}.hist li{display:flex;gap:10px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.notes dl{margin:0}.notes dt{font-weight:800;margin-top:8px;display:flex;align-items:center;gap:8px}.notes dd{margin:2px 0 0}
.notes .ex{font:500 18px/1.5 "Source Serif 4",Georgia,serif;background:var(--panel);border-radius:10px;padding:8px 12px}
.toggles{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.tog{display:flex;gap:10px;align-items:center;min-height:44px}.tog input{width:22px;height:22px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px;margin:6px 0}
select,input[type=text],input[type=password]{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px}
.say{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:6px 14px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.say:last-child{border-bottom:0}.say .shown{font:600 20px/1.3 "Source Serif 4",Georgia,serif}.say .spoken{color:var(--soft);font-size:15px}.say.on{background:var(--accentbg);border-radius:8px}
.inst{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--accentbg);border-radius:12px;padding:12px 16px;margin:0 0 14px}
.inst span{display:block;color:var(--soft);font-size:15px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.xppop{position:fixed;right:max(24px,env(safe-area-inset-right));top:calc(78px + env(safe-area-inset-top));z-index:30;font:800 18px Archivo,system-ui,sans-serif;color:#fff;background:var(--gold);padding:4px 12px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.18);pointer-events:none;animation:pop 1.2s ease forwards}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{top:105vh;opacity:.4}}
footer{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px) 30px;color:var(--soft);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
