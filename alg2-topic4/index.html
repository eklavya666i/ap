<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Topic 4 Prep: Rational Functions</title>
<meta name="theme-color" content="#2448d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Topic 4 Prep">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232448d8'/%3E%3Crect x='14' y='29' width='36' height='6' rx='3' fill='white'/%3E%3Ccircle cx='32' cy='18' r='5' fill='white'/%3E%3Ccircle cx='32' cy='46' r='5' fill='white'/%3E%3C/svg%3E">
<style>
/* VOICE everyday study tool: calm, focused, a little playful
   IDEA a graph-paper math notebook marked up in teacher's red pen
   PICTURE the question card: big textbook math; home shows the title set as a fraction
   COLOUR white paper with a faint blue grid, ink #15171c, pen blue #2448d8, red pen #d33a2c, check green #0d8656
   TYPE Iowan Old Style / Palatino headings, system sans UI, Times math (all on-device, works offline)
   LAYOUT bottom tab bar; one column up to 940px; tiles 3 columns on iPad, 2 on phone */
:root{--bg:#fbfcff;--paper:#fff;--ink:#15171c;--mute:#5a6071;--line:#dfe4ee;--grid:rgba(36,72,216,.055);--blue:#2448d8;--blue2:#eef2ff;--onblue:#fff;--red:#c9352a;--red2:#fff0ee;--green:#0d7f52;--green2:#e7f6ef;--amber:#9a5b00;--amber2:#fff5e2;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--math:"Times New Roman","STIX Two Text",Times,serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1220;--paper:#151c2c;--ink:#e9edf6;--mute:#9ea7bc;--line:#28324d;--grid:rgba(142,166,255,.05);--blue:#8ea6ff;--blue2:#1c2648;--onblue:#0b1020;--red:#ff8073;--red2:#3a1d1d;--green:#4fd6a0;--green2:#11302a;--amber:#ffc46b;--amber2:#33280f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d1220;--paper:#151c2c;--ink:#e9edf6;--mute:#9ea7bc;--line:#28324d;--grid:rgba(142,166,255,.05);--blue:#8ea6ff;--blue2:#1c2648;--onblue:#0b1020;--red:#ff8073;--red2:#3a1d1d;--green:#4fd6a0;--green2:#11302a;--amber:#ffc46b;--amber2:#33280f;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background-color:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:940px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
@supports (background:color-mix(in srgb,red 50%,blue)){.top{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}}
.topin{display:flex;align-items:center;gap:10px;min-height:54px}
.tt{flex:1;font-family:var(--serif);font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;align-items:center;gap:8px}
.back{border:0;background:none;color:var(--blue);font-weight:600;font-size:16px;min-height:44px;padding:0 6px 0 0;cursor:pointer;white-space:nowrap}
main{padding:14px 0 calc(100px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tin{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:680px;margin:0 auto}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;color:var(--mute);font-size:12px;font-weight:600;cursor:pointer}
.tab .ic{width:24px;height:24px;stroke-width:1.8}
.tab[aria-current=page]{color:var(--blue)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;min-height:48px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.btn.big{min-height:54px;padding:12px 22px;font-size:17px}
.btn.sm{min-height:44px;padding:6px 14px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.gotit{border-color:var(--green);color:var(--green);background:var(--green2)}
.btn.flagged{border-color:var(--amber);color:var(--amber);background:var(--amber2)}
.lnk{background:none;border:0;color:var(--blue);font-weight:600;padding:8px 4px;min-height:44px;cursor:pointer}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.h1{font-family:var(--serif);font-size:clamp(30px,4.6vw,44px);line-height:1.05;margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.h2{font-family:var(--serif);font-size:24px;line-height:1.15;font-weight:600;margin:28px 0 10px}
h3{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 10px}
.lede{font-size:18px;color:var(--mute);margin:4px 0 16px;max-width:64ch}
.num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--mute);white-space:nowrap}
.bar{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.g>i{background:var(--green)}
/* math */
.m{font-family:var(--math);font-size:1.16em;white-space:nowrap;line-height:1}
.m i{font-style:italic;padding-right:.02em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.18}
.fr>.nu{padding:0 .16em .06em;border-bottom:.065em solid currentColor}
.fr>.de{padding:.08em .16em 0}
.fr .fr{font-size:.92em}
.m sup{font-size:.68em;line-height:0;vertical-align:.62em;margin-left:.03em}
.m sub{font-size:.68em;line-height:0;vertical-align:-.28em}
.bin{margin:0 .2em}.rel{margin:0 .3em}
.s1{display:inline-block;width:.17em}.s2{display:inline-block;width:.3em}.s3{display:inline-block;width:1em}
.tx{font-style:normal}
.sqa{margin-left:.03em}
.lr{display:inline-flex;align-items:center;vertical-align:middle}
.lr>.dl{font-size:2em;line-height:1;font-weight:300;margin:0 .03em;transform:scaleY(1.1)}
.mb{overflow-x:auto;overflow-y:hidden;padding:6px 2px;-webkit-overflow-scrolling:touch}
.mb .m{font-size:1.3em;white-space:normal}
.nb{white-space:nowrap}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:14px 0 22px}
.tfrac{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--serif);font-size:clamp(34px,8.5vw,66px);line-height:1.04;letter-spacing:-.015em;font-weight:600}
.tfrac .tn{padding:0 .16em .1em;border-bottom:.075em solid var(--blue)}
.tfrac .td{padding:.1em .16em 0}
.sub{color:var(--mute);margin:12px 0 18px}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ring{width:150px;height:150px}
.ring .rb{fill:none;stroke:var(--line);stroke-width:12}
.ring .rf{fill:none;stroke:var(--blue);stroke-width:12;stroke-linecap:round}
.ring .r1{font:700 30px var(--sans);fill:var(--ink);text-anchor:middle}
.ring .r2{font:600 13px var(--sans);fill:var(--mute);text-anchor:middle}
.rl{margin:0;font-size:14px;color:var(--mute);max-width:16em}
.rl b{color:var(--ink)}
.acts{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px;margin:0 0 6px}
.tile{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:16px;min-height:112px;display:flex;flex-direction:column;gap:4px;cursor:pointer;color:var(--ink)}
.tile .ic{width:28px;height:28px;color:var(--blue);margin-bottom:6px}
.tile b{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.15}
.tile span{color:var(--mute);font-size:14.5px;line-height:1.35}
.tile.pri{background:var(--blue);border-color:var(--blue);color:var(--onblue);grid-row:span 2}
.tile.pri .ic{margin-bottom:auto}
.tile.pri .ic,.tile.pri span{color:var(--onblue)}
.tile.pri b{font-size:30px}
.list{padding:4px 0}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 18px;min-height:62px;cursor:pointer;color:var(--ink)}
.row:last-child{border-bottom:0}
.row.static{cursor:default}
.rt{flex:1;display:flex;flex-direction:column}
.rt b{font-weight:600}
.rt>span{color:var(--mute);font-size:14px}
.rm{display:flex;align-items:center;gap:10px;width:min(40%,230px)}
.rm .bar{flex:1}
.row>.ic{width:18px;height:18px;color:var(--mute)}
.seen{font-size:12px;font-weight:700;color:var(--green);background:var(--green2);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.chk{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 26px}
.chk li{display:flex;gap:10px}
.chk .ic{color:var(--red);margin-top:3px}
.foot{color:var(--mute);font-size:14px;margin:22px 0 6px}
/* lesson */
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:6px 0 14px}
.meta{color:var(--mute);margin:6px 0 0}
.hook{display:flex;gap:12px;background:var(--green2);border-radius:14px;padding:14px 16px;margin:0 0 16px}
.hook .ic{width:24px;height:24px;color:var(--green);margin-top:1px}
.hook p{margin:0}
.big{font-size:19px;margin:0 0 18px;max-width:64ch}
.keys{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 22px;align-items:center}
.kl{font-weight:600;color:var(--mute);font-size:15px}
.how{padding-left:1.4em;margin:0 0 6px;max-width:64ch}
.how li{margin:7px 0;padding-left:4px}
.traps{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
.traps li{position:relative;padding:10px 14px 10px 40px;background:var(--red2);border-radius:12px}
.traps li::before{content:"\2717";position:absolute;left:15px;top:10px;color:var(--red);font-weight:700}
.ex .exh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.prob .m{font-size:1.42em}
.prob{font-size:18px}
.steps{display:grid;gap:10px;margin-top:8px}
.st{border-left:3px solid var(--blue);padding:4px 0 4px 14px}
.st .mb{padding:4px 2px}
.st .mb .m{font-size:1.24em}
.stx{margin:2px 0 0;color:var(--mute);font-size:16px}
.ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--blue2);overflow-x:auto}
.ans>b{margin-right:8px;color:var(--blue)}
.trap{display:flex;gap:8px;margin:8px 0 0;color:var(--red);font-size:16px}
.trap .ic{margin-top:3px}
.exbtn{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tag{display:inline-flex;align-items:center;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue2);border-radius:99px;padding:4px 10px;line-height:1.3}
.tag.tw{color:var(--amber);background:var(--amber2)}
/* practice */
.form{display:grid;gap:18px}
.fl{display:grid;gap:8px}
.fl>b{font-size:15px;color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 14px;min-height:44px;font-weight:600;font-size:15px;cursor:pointer}
.chip span{opacity:.65;font-weight:500;margin-left:3px}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;border-right:1.5px solid var(--line);background:var(--paper);padding:8px 16px;min-height:44px;font-weight:600;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--blue2);color:var(--blue)}
.go{display:flex;flex-wrap:wrap;gap:10px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qprog{display:flex;align-items:center;gap:12px;margin:4px 0 12px;font-size:15px;color:var(--mute)}
.qprog .bar{flex:1}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.dots{display:inline-flex;gap:3px;margin-left:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}
.prompt{font-size:21px;line-height:1.6;margin:4px 0 16px;overflow-x:auto;overflow-y:hidden;padding:4px 0}
.prompt .m{font-size:1.2em}
.choices{display:grid;gap:10px}
.ch{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:62px;padding:10px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);cursor:pointer;font-size:19px;color:var(--ink)}
.ch .lt{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blue2);color:var(--blue);font-weight:700;font-size:15px;font-family:var(--sans)}
.ch .ct{flex:1;overflow-x:auto;overflow-y:hidden;padding:6px 0}
.ch.sel{border-color:var(--blue);background:var(--blue2)}
.ch.ok{border-color:var(--green);background:var(--green2)}
.ch.ok .lt{background:var(--green);color:var(--paper)}
.ch.no{border-color:var(--red);background:var(--red2)}
.ch.no .lt{background:var(--red);color:var(--paper)}
.ch.dim{opacity:.55}
.ch[disabled]{cursor:default}
.qtools{display:flex;gap:10px;margin-top:12px}
.hint{background:var(--amber2);border-radius:12px;padding:10px 14px;margin-top:10px}
.fb{border-radius:16px;padding:14px 18px;margin:0 0 14px;border:1.5px solid}
.fb.ok{background:var(--green2);border-color:var(--green)}
.fb.no{background:var(--red2);border-color:var(--red)}
.fbh{display:flex;align-items:center;gap:8px;font-size:19px}
.fb.ok .fbh{color:var(--green)}
.fb.no .fbh{color:var(--red)}
.fb p{margin:6px 0 0}
.why{margin-top:14px}
.why summary{cursor:pointer;color:var(--blue);font-weight:600;min-height:44px;display:flex;align-items:center}
.why ul{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:10px}
.why li{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--red2)}
.why .wc{overflow-x:auto}
.score .big-n{font-family:var(--serif);font-size:72px;line-height:1;font-weight:600}
.score .big-n span{font-size:.45em;color:var(--mute)}
.score>p{font-size:18px;margin:8px 0 12px}
details.rv{padding:0}
details.rv>summary{padding:14px 18px;cursor:pointer;list-style:none;font-size:18px;line-height:1.6;overflow-x:auto}
details.rv>summary::-webkit-details-marker{display:none}
details.rv[open]>summary{border-bottom:1px solid var(--line)}
.rvb{padding:12px 18px 16px}
.yours{margin:0 0 8px;color:var(--red)}
.yours.ok{color:var(--green)}
/* test */
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--blue)}
.timer.low{color:var(--red)}
.tnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:0 0 14px}
.tnav .btn{flex:1;min-width:110px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.pal button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer}
.pal .ans{background:var(--blue2);border-color:var(--blue);color:var(--blue)}
.pal .flag{border-color:var(--amber);box-shadow:inset 0 -4px 0 var(--amber)}
.pal .cur{outline:3px solid var(--blue);outline-offset:1px}
.facts{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:10px}
.facts li{display:flex;gap:10px;align-items:center}
.facts .ic{color:var(--blue)}
/* speed */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px;cursor:pointer;color:var(--ink);min-height:150px}
.mode .ic{width:30px;height:30px;color:var(--blue);margin-bottom:6px}
.mode b{font-family:var(--serif);font-size:26px;font-weight:600}
.mode span{color:var(--mute)}
.mode em{font-style:normal;font-weight:700;color:var(--blue);margin-top:auto;padding-top:8px}
.sbar{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.tbar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.tbar>i{display:block;height:100%;width:100%;background:var(--blue);border-radius:99px}
.choices.two{grid-template-columns:1fr 1fr}
.speedq .prompt{min-height:64px}
.ch.ok{animation:pop .28s ease}
@keyframes pop{50%{transform:scale(1.025)}}
.newbest{display:inline-block;margin-left:10px;font-size:14px;font-weight:700;color:var(--green);background:var(--green2);border-radius:99px;padding:3px 10px;vertical-align:middle;font-family:var(--sans)}
.miss{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.miss:last-child{border-bottom:0}
.miss .stx{font-size:15px}
/* sheet */
.sh .pn{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--blue);line-height:1}
.sh .dir{color:var(--mute);flex:1}
.gotbar{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.gotbar .bar{flex:1}
.modal{position:fixed;inset:0;background:rgba(10,14,25,.5);display:grid;place-items:center;z-index:20;padding:20px}
.modal .card{max-width:440px;width:100%;margin:0}
.modal p{font-size:18px;margin:0 0 4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:15px;max-width:90vw}
@media (max-width:640px){
.acts{grid-template-columns:1fr 1fr}
.tile.pri{grid-row:auto;grid-column:1/-1;min-height:96px}
.tile.pri b{font-size:24px}
.chk{grid-template-columns:1fr}
.keys{grid-template-columns:1fr}
.kl{margin-top:8px}
.hero{grid-template-columns:1fr;gap:16px}
.ringbox{flex-direction:row;text-align:left;gap:14px}
.ring{width:92px;height:92px}
.hl .btn{width:100%}
.prompt{font-size:19px}
.ch{font-size:18px;padding:8px 12px;gap:10px}
.rm{width:34%}
.row{padding:12px 14px}
}
@media (max-width:560px){.choices.two,.modes{grid-template-columns:1fr}.lhead{flex-direction:column}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* graph */
.gph{display:block;width:100%;max-width:380px;margin:12px auto 6px}
.gph .gg{stroke:var(--line);stroke-width:.7}
.gph .ga{stroke:var(--mute);stroke-width:1.3}
.gph .gas{stroke:var(--red);stroke-width:1.5;stroke-dasharray:6 5}
.gph .gcv{fill:none;stroke:var(--blue);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.gph .gt{font:9.5px -apple-system,system-ui,sans-serif;fill:var(--mute);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}

{
const D={"skills":[{"k":"inv","n":"Inverse variation","sh":"Test review #3, #4"},{"k":"recip","n":"Reciprocal function & shifts","sh":"Test review #5, #8–10"},{"k":"feat","n":"Key features & graphs","sh":"Test review #1, #2, #5–7, #11, #12"},{"k":"fac","n":"Factoring toolkit","sh":"Every problem"},{"k":"simp","n":"Simplify & domain","sh":"4.3–4.5 #1, #2"},{"k":"md","n":"Multiply & divide","sh":"4.3–4.5 #5 · Test review #15, #16"},{"k":"as","n":"Add & subtract","sh":"4.3–4.5 #3, #4 · Test review #13, #14"},{"k":"cf","n":"Complex fractions","sh":"4.3–4.5 #6, #11"},{"k":"solve","n":"Solving equations","sh":"4.3–4.5 #7–9 · Test review #17–20"},{"k":"sys","n":"Systems","sh":"4.3–4.5 #10"},{"k":"word","n":"Word problems","sh":"4.3–4.5 #11, #12 · Test review #21, #22"}],"qs":[{"s":"fac","d":1,"q":"Factor completely: $x^2-49$","c":["$(x-7)(x+7)$","$(x-7)^2$","$(x+7)^2$","$(x-49)(x+1)$"],"w":["$(x-7)^2=x^2-14x+49$ — it has a middle term.","$(x+7)^2=x^2+14x+49$ — also has a middle term.","That multiplies to $x^2-48x-49$."],"h":"Difference of squares: $a^2-b^2=(a-b)(a+b)$.","x":[["x^2-49=x^2-7^2","Two perfect squares with a minus between them."],["(x-7)(x+7)","Use $a^2-b^2=(a-b)(a+b)$ with $a=x$, $b=7$."]],"tw":null,"id":"q001"},{"s":"fac","d":1,"q":"Factor completely: $x^2+14x+49$","c":["$(x+7)^2$","$(x-7)^2$","$(x+7)(x-7)$","$x(x+14)+49$"],"w":["That gives $-14x$ in the middle, not $+14x$.","That's $x^2-49$ — no middle term.","Not factored: it's still a sum."],"h":"Perfect square trinomial: $a^2+2ab+b^2=(a+b)^2$.","x":[["x^2+14x+49=x^2+2(7)(x)+7^2","First and last terms are squares; the middle is $2\\cdot7\\cdot x$."],["(x+7)^2",""]],"tw":null,"id":"q002"},{"s":"fac","d":2,"q":"Factor completely: $6x^2-x-2$","c":["$(3x-2)(2x+1)$","$(3x+2)(2x-1)$","$(6x+1)(x-2)$","$(6x-2)(x+1)$"],"w":["Signs swapped: this gives $+x$ in the middle.","This gives $-11x$ in the middle.","This gives $+4x$ in the middle (and $6x-2$ still has a GCF)."],"h":"ac-method: $a\\cdot c=-12$. Which two numbers multiply to $-12$ and add to $-1$?","x":[["6\\cdot(-2)=-12","Two numbers with product $-12$ and sum $-1$: $-4$ and $3$."],["6x^2-4x+3x-2","Split the middle term."],["2x(3x-2)+1(3x-2)","Group in pairs; factor each."],["(3x-2)(2x+1)","Pull out the common binomial. FOIL-check: $6x^2+3x-4x-2$ ✓"]],"tw":null,"id":"q003"},{"s":"fac","d":1,"q":"Factor completely: $4x^2-1$","c":["$(2x-1)(2x+1)$","$(2x-1)^2$","$(4x-1)(x+1)$","$4(x-1)(x+1)$"],"w":["$(2x-1)^2=4x^2-4x+1$.","That multiplies to $4x^2+3x-1$.","That multiplies to $4x^2-4$."],"h":"$4x^2=(2x)^2$ and $1=1^2$.","x":[["4x^2-1=(2x)^2-1^2","Difference of squares."],["(2x-1)(2x+1)",""]],"tw":null,"id":"q004"},{"s":"fac","d":2,"q":"Factor completely: $4x^2-4x+1$","c":["$(2x-1)^2$","$(2x+1)^2$","$(2x-1)(2x+1)$","$(4x-1)(x-1)$"],"w":["The middle term would be $+4x$.","That's $4x^2-1$.","That multiplies to $4x^2-5x+1$."],"h":"Is the middle term $2\\cdot(2x)\\cdot1$? Then it's a perfect square.","x":[["(2x)^2-2(2x)(1)+1^2","Perfect square pattern $a^2-2ab+b^2$."],["(2x-1)^2",""]],"tw":null,"id":"q005"},{"s":"fac","d":1,"q":"Factor completely: $9x^2+6x$","c":["$3x(3x+2)$","$3(3x^2+2x)$","$x(9x+6)$","$3x(3x+6)$"],"w":["Not complete: $3x^2+2x$ still has a common $x$.","Not complete: $9x+6$ still has a common 3.","$3x\\cdot6=18x$, not $6x$."],"h":"Take out the greatest common factor — number AND variable.","x":[["\\text{GCF}=3x","$\\gcd(9,6)=3$ and both terms contain $x$."],["3x(3x+2)","$9x^2\\div3x=3x$ and $6x\\div3x=2$."]],"tw":null,"id":"q006"},{"s":"fac","d":1,"q":"Factor completely: $x^2-7x+10$","c":["$(x-5)(x-2)$","$(x+5)(x+2)$","$(x-5)(x+2)$","$(x-10)(x+1)$"],"w":["That gives $+7x$ in the middle.","That multiplies to $x^2-3x-10$.","That multiplies to $x^2-9x-10$."],"h":"Two numbers that multiply to $+10$ and add to $-7$.","x":[["(-5)(-2)=10,\\ \\ (-5)+(-2)=-7",""],["(x-5)(x-2)","This is the denominator in Sheet #9."]],"tw":null,"id":"q007"},{"s":"fac","d":1,"q":"Factor both completely: $w^2-16$ and $2w-8$","c":["$(w-4)(w+4)$ and $2(w-4)$","$(w-4)^2$ and $2(w-4)$","$(w-8)(w+2)$ and $2(w-8)$","$(w-4)(w+4)$ and $2(w-8)$"],"w":["$(w-4)^2=w^2-8w+16$.","$(w-8)(w+2)=w^2-6w-16$, and $2(w-8)=2w-16$.","$2(w-8)=2w-16$, not $2w-8$."],"h":"A difference of squares, and a GCF.","x":[["w^2-16=(w-4)(w+4)",""],["2w-8=2(w-4)","The shared factor $(w-4)$ is the key to Sheet #3."]],"tw":null,"id":"q008"},{"s":"fac","d":1,"q":"Which expression is equal to $3-x$?","c":["$-(x-3)$","$x-3$","$-(x+3)$","$x+3$"],"w":["$x-3$ is the opposite of $3-x$.","$-(x+3)=-x-3$.","The sign on $x$ is wrong."],"h":"Factor out $-1$: $3-x=-1(\\ldots)$","x":[["3-x=-(x-3)","Pulling out $-1$ flips every sign inside."],["\\f{3-x}{x-3}=-1","This is why opposite binomials cancel to $-1$, not $1$."]],"tw":null,"id":"q009"},{"s":"fac","d":1,"q":"Factor completely: $x^2+4x-21$","c":["$(x+7)(x-3)$","$(x-7)(x+3)$","$(x+7)(x+3)$","$(x-7)(x-3)$"],"w":["That gives $-4x$ in the middle.","That gives $+21$ at the end.","That gives $-10x$ and $+21$."],"h":"Product $-21$, sum $+4$.","x":[["7\\cdot(-3)=-21,\\ \\ 7+(-3)=4",""],["(x+7)(x-3)",""]],"tw":null,"id":"q010"},{"s":"fac","d":2,"q":"Factor completely: $2x^2+7x+3$","c":["$(2x+1)(x+3)$","$(2x+3)(x+1)$","$(2x-1)(x-3)$","$2(x+1)(x+3)$"],"w":["That gives $5x$ in the middle.","That gives $-7x$ in the middle.","That multiplies to $2x^2+8x+6$."],"h":"$a\\cdot c=6$: two numbers with product 6 and sum 7.","x":[["2x^2+x+6x+3","Split $7x$ using $1$ and $6$."],["x(2x+1)+3(2x+1)",""],["(2x+1)(x+3)",""]],"tw":null,"id":"q011"},{"s":"fac","d":3,"q":"Factor completely: $x^3-8$","c":["$(x-2)(x^2+2x+4)$","$(x-2)^3$","$(x-2)(x^2-2x+4)$","$(x-2)(x^2+4)$"],"w":["$(x-2)^3=x^3-6x^2+12x-8$.","Wrong sign: the middle sign is opposite the binomial's (SOAP).","Missing the $2x$ term."],"h":"Difference of cubes: $a^3-b^3=(a-b)(a^2+ab+b^2)$.","x":[["x^3-8=x^3-2^3",""],["(x-2)(x^2+2x+4)","SOAP signs: Same, Opposite, Always Positive."]],"tw":null,"id":"q012"},{"s":"fac","d":3,"q":"Factor completely: $x^3+27$","c":["$(x+3)(x^2-3x+9)$","$(x+3)^3$","$(x+3)(x^2+3x+9)$","$(x-3)(x^2+3x+9)$"],"w":["$(x+3)^3$ has middle terms when expanded.","The middle sign must be opposite: $-3x$.","That's $x^3-27$."],"h":"Sum of cubes: $a^3+b^3=(a+b)(a^2-ab+b^2)$.","x":[["x^3+27=x^3+3^3",""],["(x+3)(x^2-3x+9)","SOAP: Same sign, Opposite sign, Always Positive."]],"tw":null,"id":"q013"},{"s":"fac","d":2,"q":"Factor completely: $2x^2-18$","c":["$2(x-3)(x+3)$","$2(x^2-9)$","$2(x-3)^2$","$(2x-3)(x+6)$"],"w":["Not complete: $x^2-9$ still factors.","$2(x-3)^2=2x^2-12x+18$.","That multiplies to $2x^2+9x-18$."],"h":"GCF first, then look again.","x":[["2(x^2-9)","Take out the GCF 2."],["2(x-3)(x+3)","Then factor the difference of squares."]],"tw":null,"id":"q014"},{"s":"fac","d":1,"q":"Factor completely: $3x^2-12x$","c":["$3x(x-4)$","$3(x^2-4x)$","$3x(x-12)$","$x(3x-4)$"],"w":["Not complete: still a common $x$.","$3x\\cdot12=36x$.","$x\\cdot4=4x$, not $12x$."],"h":"Take out $3x$.","x":[["3x(x-4)","$3x^2\\div3x=x$ and $12x\\div3x=4$."]],"tw":null,"id":"q015"},{"s":"fac","d":3,"q":"Factor completely by grouping: $x^3+2x^2-9x-18$","c":["$(x+2)(x-3)(x+3)$","$(x+2)(x^2-9)$","$(x-2)(x-3)(x+3)$","$(x+2)(x-3)^2$"],"w":["Not complete: $x^2-9$ factors.","Grouping gives $(x+2)$, not $(x-2)$.","$x^2-9=(x-3)(x+3)$, not $(x-3)^2$."],"h":"Group: $(x^3+2x^2)+(-9x-18)$.","x":[["x^2(x+2)-9(x+2)",""],["(x+2)(x^2-9)",""],["(x+2)(x-3)(x+3)","Keep going until nothing factors."]],"tw":null,"id":"q016"},{"s":"simp","d":1,"q":"Simplify and state the domain: $y=\\f{x^2-36}{x^2+12x+36}$","c":["$\\f{x-6}{x+6}$, $x\\ne-6$","$\\f{x-6}{x+6}$, $x\\ne-6,6$","$\\f{-36}{12x+36}$, $x\\ne-3$","$\\f{x+6}{x-6}$, $x\\ne6$"],"w":["$x=6$ only makes the numerator 0 — that's allowed ($y=0$).","You canceled the $x^2$ terms. Only factors cancel, never terms.","Upside down: one $(x+6)$ stays in the denominator."],"h":"Factor the top (difference of squares) and the bottom (perfect square).","x":[["\\f{(x-6)(x+6)}{(x+6)^2}","Factor completely."],["x+6\\ne0\\Rightarrow x\\ne-6","Restrictions come from the original denominator."],["\\f{x-6}{x+6}","Cancel one common factor $(x+6)$."]],"tw":1,"id":"q017"},{"s":"simp","d":2,"q":"Simplify and state the domain: $y=\\f{9x^2-1}{3x^2+5x-2}$","c":["$\\f{3x+1}{x+2}$, $x\\ne-2,\\f13$","$\\f{3x+1}{x+2}$, $x\\ne-2$","$\\f{3x-1}{x+2}$, $x\\ne-2,\\f13$","$\\f{3x+1}{x-2}$, $x\\ne2,\\f13$"],"w":["The canceled factor $3x-1$ still makes the original denominator 0 at $x=\\f13$.","You canceled the wrong factor — $(3x-1)$ is the shared one.","$3x^2+5x-2=(3x-1)(x+2)$, so the factor is $x+2$."],"h":"$9x^2-1$ is a difference of squares; the bottom is $(3x-1)(x+2)$.","x":[["\\f{(3x-1)(3x+1)}{(3x-1)(x+2)}","Factor completely."],["x\\ne\\f13,\\ \\ x\\ne-2","Both denominator factors give restrictions."],["\\f{3x+1}{x+2}","Cancel $(3x-1)$."]],"tw":2,"id":"q018"},{"s":"simp","d":1,"q":"Simplify and state the domain: $\\f{x^2-5x}{x^2-25}$","c":["$\\f{x}{x+5}$, $x\\ne-5,5$","$\\f{x}{x+5}$, $x\\ne-5$","$\\f{x}{x-5}$, $x\\ne-5,5$","$\\f{x}{5}$, $x\\ne-5,5$"],"w":["$x=5$ was canceled but still makes the original denominator 0.","The shared factor is $(x-5)$; $(x+5)$ stays on the bottom.","You canceled $x^2$ terms — only factors cancel."],"h":"Factor $x$ out of the top; the bottom is a difference of squares.","x":[["\\f{x(x-5)}{(x-5)(x+5)}",""],["x\\ne5,\\ \\ x\\ne-5",""],["\\f{x}{x+5}",""]],"tw":null,"id":"q019"},{"s":"simp","d":1,"q":"Simplify and state the domain: $\\f{2x+6}{x^2+5x+6}$","c":["$\\f{2}{x+2}$, $x\\ne-3,-2$","$\\f{2}{x+2}$, $x\\ne-2$","$\\f{2}{x+3}$, $x\\ne-3,-2$","$\\f{2}{x+5}$, $x\\ne-5$"],"w":["$x=-3$ was canceled but still breaks the original denominator.","The shared factor is $(x+3)$; $(x+2)$ remains.","You canceled terms (the 6's) — only factors cancel."],"h":"Top: GCF 2. Bottom: product 6, sum 5.","x":[["\\f{2(x+3)}{(x+2)(x+3)}",""],["x\\ne-2,\\ \\ x\\ne-3",""],["\\f{2}{x+2}",""]],"tw":null,"id":"q020"},{"s":"simp","d":2,"q":"Simplify and state the domain: $\\f{4-x}{x^2-16}$","c":["$-\\f{1}{x+4}$, $x\\ne-4,4$","$\\f{1}{x+4}$, $x\\ne-4,4$","$-\\f{1}{x+4}$, $x\\ne-4$","$-\\f{1}{x-4}$, $x\\ne-4,4$"],"w":["$4-x=-(x-4)$, so a $-1$ survives the cancel.","$x=4$ still makes the original denominator 0.","The canceled factor is $(x-4)$; $(x+4)$ stays."],"h":"Rewrite $4-x$ as $-(x-4)$.","x":[["\\f{-(x-4)}{(x-4)(x+4)}",""],["x\\ne\\pm4",""],["-\\f{1}{x+4}",""]],"tw":null,"id":"q021"},{"s":"simp","d":1,"q":"What is the domain of $f(x)=\\f{x+3}{x^2-9}$?","c":["$x\\ne-3,3$","$x\\ne3$","$x\\ne9$","All real numbers"],"w":["Simplifying first hides $x=-3$ — the domain comes from the original.","$x^2=9$ means $x=\\pm3$, not $9$.","The denominator is 0 at $x=\\pm3$."],"h":"Set the original denominator equal to 0.","x":[["x^2-9=0\\Rightarrow x=\\pm3",""],["x\\ne-3,\\ 3","$x=-3$ is a hole and $x=3$ is a vertical asymptote — both are excluded."]],"tw":null,"id":"q022"},{"s":"simp","d":2,"q":"The graph of $f(x)=\\f{x^2-x-6}{x-3}$ has a hole. Where is it?","c":["$(3,5)$","$(3,0)$","$(-2,0)$","No hole — $x=3$ is an asymptote"],"w":["The hole's $y$-value comes from the simplified form: $3+2=5$.","$(-2,0)$ is the $x$-intercept, not the hole.","$(x-3)$ cancels completely, so it's a removable hole."],"h":"Factor, cancel, then plug $x=3$ into what's left.","x":[["\\f{(x-3)(x+2)}{x-3}=x+2,\\ \\ x\\ne3",""],["y=3+2=5","Hole at $(3,5)$."]],"tw":null,"id":"q023"},{"s":"simp","d":1,"q":"Which values are excluded from the domain of $\\f{x}{x^2+4}$?","c":["None — all real numbers","$x\\ne-2,2$","$x\\ne0$","$x\\ne-4$"],"w":["$x^2+4$ is a sum of squares — it's never 0.","A zero numerator is fine.","$x^2+4=0$ has no real solution."],"h":"Can $x^2+4$ ever equal 0?","x":[["x^2+4\\ge4","The denominator is never 0."],["\\text{Domain: all real numbers}",""]],"tw":null,"id":"q024"},{"s":"simp","d":2,"q":"Simplify and state the domain: $\\f{3x^2-12}{x^2+x-6}$","c":["$\\f{3(x+2)}{x+3}$, $x\\ne-3,2$","$\\f{3(x+2)}{x+3}$, $x\\ne-3$","$\\f{x+2}{x+3}$, $x\\ne-3,2$","$\\f{3(x-2)}{x-3}$, $x\\ne-2,3$"],"w":["$x=2$ was canceled but still breaks the original denominator.","You dropped the GCF 3.","The bottom is $(x+3)(x-2)$, not $(x-3)(x+2)$."],"h":"GCF 3 first: $3(x^2-4)$.","x":[["\\f{3(x-2)(x+2)}{(x+3)(x-2)}",""],["x\\ne-3,\\ \\ x\\ne2",""],["\\f{3(x+2)}{x+3}",""]],"tw":null,"id":"q025"},{"s":"simp","d":3,"q":"Simplify and state the domain: $\\f{x^3-8}{x^2-4}$","c":["$\\f{x^2+2x+4}{x+2}$, $x\\ne-2,2$","$\\f{x^2+2x+4}{x+2}$, $x\\ne-2$","$\\f{x^2-2x+4}{x+2}$, $x\\ne-2,2$","$x-2$, $x\\ne-2,2$"],"w":["$x=2$ still breaks the original denominator.","Cube pattern: $a^3-b^3=(a-b)(a^2+ab+b^2)$ — the middle sign is $+$.","You can't cancel $x^3$ against $x^2$ — those are terms."],"h":"Difference of cubes on top, difference of squares on the bottom.","x":[["\\f{(x-2)(x^2+2x+4)}{(x-2)(x+2)}",""],["x\\ne\\pm2",""],["\\f{x^2+2x+4}{x+2}",""]],"tw":null,"id":"q026"},{"s":"simp","d":1,"q":"Simplify and state the domain: $\\f{x^2+2x-15}{x^2-9}$","c":["$\\f{x+5}{x+3}$, $x\\ne-3,3$","$\\f{x+5}{x+3}$, $x\\ne-3$","$\\f{x-5}{x-3}$, $x\\ne-3,3$","$\\f{2x-15}{-9}$, all real numbers"],"w":["$x=3$ was canceled but still breaks the original denominator.","The top factors as $(x+5)(x-3)$.","You canceled the $x^2$ terms — not allowed."],"h":"Top: product $-15$, sum $2$.","x":[["\\f{(x+5)(x-3)}{(x-3)(x+3)}",""],["x\\ne\\pm3",""],["\\f{x+5}{x+3}",""]],"tw":null,"id":"q027"},{"s":"simp","d":1,"q":"Simplify (no variable equals 0): $\\f{12x^3y}{8xy^4}$","c":["$\\f{3x^2}{2y^3}$","$\\f{3x^3}{2y^3}$","$\\f{3x^2}{2y^4}$","$\\f{4x^2}{y^3}$"],"w":["Subtract exponents: $x^3\\div x=x^2$.","Subtract exponents: $y^4\\div y=y^3$.","$12\\div8=\\f32$ — divide coefficients, don't subtract them."],"h":"Reduce $\\f{12}{8}$, then subtract exponents.","x":[["\\f{12}{8}=\\f32,\\ \\ \\f{x^3}{x}=x^2,\\ \\ \\f{y}{y^4}=\\f{1}{y^3}",""],["\\f{3x^2}{2y^3}",""]],"tw":null,"id":"q028"},{"s":"simp","d":1,"q":"Simplify and state the domain: $\\f{x-5}{5-x}$","c":["$-1$, $x\\ne5$","$1$, $x\\ne5$","$-1$, all real numbers","$0$, $x\\ne5$"],"w":["$x-5$ and $5-x$ are opposites, so they divide to $-1$.","$x=5$ makes the denominator 0 — it must be excluded.","Opposites divide to $-1$, not 0."],"h":"$5-x=-(x-5)$.","x":[["\\f{x-5}{-(x-5)}=-1",""],["x\\ne5",""]],"tw":null,"id":"q029"},{"s":"simp","d":1,"q":"What is the domain of $\\f{x+1}{x^2-x}$?","c":["$x\\ne0,1$","$x\\ne1$","$x\\ne-1,0,1$","$x\\ne0$"],"w":["Factor: $x^2-x=x(x-1)$ — both $0$ and $1$.","$x=-1$ only zeroes the numerator — that's allowed.","Missing $x=1$."],"h":"Factor the denominator.","x":[["x^2-x=x(x-1)=0\\Rightarrow x=0,\\ 1",""]],"tw":null,"id":"q030"},{"s":"simp","d":2,"q":"Simplify and state the domain: $\\f{x^2-4x+4}{x^2-4}$","c":["$\\f{x-2}{x+2}$, $x\\ne-2,2$","$\\f{x-2}{x+2}$, $x\\ne-2$","$\\f{x+2}{x-2}$, $x\\ne-2,2$","$x-1$, all real numbers"],"w":["$x=2$ still breaks the original denominator.","Upside down: one $(x-2)$ stays on top.","You canceled terms ($x^2$ and $4$) — not allowed."],"h":"The top is a perfect square.","x":[["\\f{(x-2)^2}{(x-2)(x+2)}",""],["x\\ne\\pm2",""],["\\f{x-2}{x+2}",""]],"tw":null,"id":"q031"},{"s":"simp","d":1,"q":"A student wrote $\\f{x+6}{x+3}=\\f63=2$. What went wrong?","c":["Canceled terms ($x$), not factors — it doesn't simplify","It should be $\\f63=3$","Nothing — just add $x\\ne-3$","Should divide by 3 to get $\\f{x+2}{x+1}$"],"w":["$6\\div3=2$ — the arithmetic isn't the problem.","It isn't correct: at $x=1$ it's $\\f74$, not 2.","3 isn't a factor of $x+6$ or $x+3$."],"h":"Test a value. Does $x=1$ give 2?","x":[["x=1:\\ \\ \\f{7}{4}\\ne2","Only common factors cancel. $x+6$ and $x+3$ share none, so it's already simplified (with $x\\ne-3$)."]],"tw":null,"id":"q032"},{"s":"simp","d":2,"q":"Simplify and state the domain: $\\f{2x^2-5x-3}{x^2-9}$","c":["$\\f{2x+1}{x+3}$, $x\\ne-3,3$","$\\f{2x+1}{x+3}$, $x\\ne-3$","$\\f{2x-1}{x+3}$, $x\\ne-3,3$","$\\f{2x+1}{x-3}$, $x\\ne-3,3$"],"w":["$x=3$ still breaks the original denominator.","$2x^2-5x-3=(2x+1)(x-3)$ — check the sign.","The shared factor is $(x-3)$; $(x+3)$ remains."],"h":"ac-method: $2\\cdot(-3)=-6$, so use $-6$ and $1$.","x":[["\\f{(2x+1)(x-3)}{(x-3)(x+3)}",""],["x\\ne\\pm3",""],["\\f{2x+1}{x+3}",""]],"tw":null,"id":"q033"},{"s":"simp","d":1,"q":"In Sheet #1, $y=\\f{x^2-49}{x^2+14x+49}$. Why is $x=7$ allowed but $x=-7$ excluded?","c":["$x=7$ makes only the numerator 0; $x=-7$ makes the denominator 0","$x=7$ cancels out, so it's allowed","Both should be excluded","The domain comes from the simplified form, which has no 7"],"w":["Nothing with $(x-7)$ cancels — and canceling never removes a restriction anyway.","A zero numerator just gives $y=0$, which is fine.","The domain comes from the original denominator."],"h":"Which part of a fraction can't be 0?","x":[["y(7)=\\f{0}{196}=0","Allowed: the output is just 0."],["y(-7)=\\f{0}{0}","Undefined: the denominator is 0."]],"tw":null,"id":"q034"},{"s":"md","d":1,"q":"Simplify and state restrictions: $\\f{x+3}{x-2}\\cdot\\f{x^2-4}{x^2+6x+9}$","c":["$\\f{x+2}{x+3}$, $x\\ne-3,2$","$\\f{x+2}{x+3}$, $x\\ne-3$","$\\f{x-2}{x+3}$, $x\\ne-3,2$","$\\f{1}{x+3}$, $x\\ne-3,2$"],"w":["$x=2$ makes an original denominator 0.","$x^2-4=(x-2)(x+2)$: the $(x-2)$ cancels and $(x+2)$ stays.","You canceled too much — $(x+2)$ survives."],"h":"Factor everything, then cancel across the multiplication.","x":[["\\f{x+3}{x-2}\\cdot\\f{(x-2)(x+2)}{(x+3)^2}",""],["x\\ne2,\\ \\ x\\ne-3",""],["\\f{x+2}{x+3}","Cancel $(x-2)$ and one $(x+3)$."]],"tw":null,"id":"q035"},{"s":"md","d":2,"q":"Simplify and state restrictions: $\\f{5x}{x+1}\\div\\f{10x^2}{x^2-1}$","c":["$\\f{x-1}{2x}$, $x\\ne-1,0,1$","$\\f{x-1}{2x}$, $x\\ne-1,1$","$\\f{2x}{x-1}$, $x\\ne-1,0,1$","$\\f{50x^3}{(x+1)^2(x-1)}$, $x\\ne-1,1$"],"w":["Dividing by $\\f{10x^2}{x^2-1}$ needs $10x^2\\ne0$, so $x\\ne0$ too.","You flipped the wrong fraction — flip the divisor (the second one).","You multiplied without flipping."],"h":"Keep–change–flip, then factor $x^2-1$.","x":[["\\f{5x}{x+1}\\cdot\\f{(x-1)(x+1)}{10x^2}","Flip the divisor."],["x\\ne\ $, $x\\ne-2,0$"],"w":["$x=-2$ makes the big denominator 0.","The $x$ from $\\f4x$ stays on the bottom.","$x=\\f{x^2}{x}$, so the top is $\\f{x^2-4}{x}$."],"h":"Write the top as one fraction: $\\f{x^2-4}{x}$.","x":[["\\f{x^2-4}{x}\\cdot\\f{1}{x+2}",""],["\\f{(x-2)(x+2)}{x(x+2)}=\\f{x-2}{x}",""]],"tw":null,"id":"q079"},{"s":"cf","d":2,"q":"A golf cart drives out at speed $a$ and back at speed $b$. Average speed $=\\f{2}{\\f1a+\\f1b}$. Simplify.","c":["$\\f{2ab}{a+b}$","$\\f{a+b}{2}$","$\\f{2}{a+b}$","$\\f{a+b}{2ab}$"],"w":["Average speed isn't the average of the speeds — time matters.","$\\f1a+\\f1b\\ne\\f{1}{a+b}$.","Upside down."],"h":"Multiply top and bottom by $ab$.","x":[["\\f{2ab}{b+a}",""]],"tw":null,"id":"q080"},{"s":"cf","d":3,"q":"Simplify: $\\f{\\f{1}{x+h}-\\f1x}{h}$","c":["$-\\f{1}{x(x+h)}$","$\\f{1}{x(x+h)}$","$-\\f{h}{x(x+h)}$","$0$"],"w":["$x-(x+h)=-h$ — it's negative.","You still need to divide by $h$.","$\\f{1}{x+h}\\ne\\f1x$."],"h":"Combine the top over $x(x+h)$, then divide by $h$.","x":[["\\f{x-(x+h)}{x(x+h)}=\\f{-h}{x(x+h)}",""],["\\f{-h}{x(x+h)}\\cdot\\f1h=-\\f{1}{x(x+h)}",""]],"tw":null,"id":"q081"},{"s":"cf","d":1,"q":"Simplify: $\\f{\\f12+\\f13}{\\f16}$","c":["$5$","$\\f{5}{36}$","$\\f{12}{5}$","$1$"],"w":["Dividing by $\\f16$ multiplies by 6.","$\\f12+\\f13=\\f56$, not $\\f25$ — so it's $\\f56\\cdot6$.","The top is $\\f56$, not $\\f16$."],"h":"Multiply top and bottom by 6.","x":[["\\f{3+2}{1}=5",""]],"tw":null,"id":"q082"},{"s":"cf","d":1,"q":"Three resistors of 2, 3, and 6 ohms in parallel: $R=\\f{1}{\\f12+\\f13+\\f16}$. Find $R$.","c":["$1$ ohm","$11$ ohms","$\\f{1}{11}$ ohm","$6$ ohms"],"w":["Adding resistances is the series rule.","Add the reciprocals: $\\f12+\\f13+\\f16=1$.","6 is the LCD, not the answer."],"h":"Add the reciprocals, then flip.","x":[["\\f12+\\f13+\\f16=\\f{3+2+1}{6}=1",""],["R=\\f11=1",""]],"tw":null,"id":"q083"},{"s":"solve","d":2,"q":"Solve: $x+\\f{3}{x-4}=\\f{x-1}{4-x}$","c":["$x=1$ or $x=2$","$x=1$ only","$x=1$ or $x=4$","No solution"],"w":["Treated $4-x$ like $x-4$. The sign matters: $\\f{x-1}{4-x}=-\\f{x-1}{x-4}$.","$x=4$ makes a denominator 0 — extraneous.","Both $x=1$ and $x=2$ check."],"h":"Rewrite $\\f{x-1}{4-x}=-\\f{x-1}{x-4}$, then multiply every term by $(x-4)$.","x":[["x\\ne4",""],["x(x-4)+3=-(x-1)","Multiply every term by $(x-4)$."],["x^2-4x+3=-x+1\\Rightarrow x^2-3x+2=0",""],["(x-1)(x-2)=0\\Rightarrow x=1,\\ 2","Neither is 4, so both work."]],"tw":7,"id":"q084"},{"s":"solve","d":1,"q":"Solve: $\\f{1}{x+3}+\\f{1}{x-3}=\\f{6}{x^2-9}$","c":["No solution","$x=3$","$x=-3$","$x=\\pm3$"],"w":["$x=3$ makes $x-3=0$ — it's extraneous.","$x=-3$ isn't a root (and it's excluded too).","Both are excluded values."],"h":"Multiply by $(x+3)(x-3)$, solve, then check the restrictions.","x":[["x\\ne\\pm3",""],["(x-3)+(x+3)=6\\Rightarrow2x=6\\Rightarrow x=3",""],["x=3\\ \\text{is excluded}\\Rightarrow\\text{no solution}",""]],"tw":8,"id":"q085"},{"s":"solve","d":3,"q":"Solve: $\\f{x+1}{x-3}+\\f{2x^2+10}{x^2-5x+6}=\\f{3x}{x-2}$","c":["$x=-1$","$x=1$","$x=-1$ or $x=3$","No solution"],"w":["Sign slip: $8x=-8$ gives $x=-1$.","$x=3$ is excluded (and isn't a root).","$x=-1$ checks."],"h":"$x^2-5x+6=(x-3)(x-2)$ is the LCD.","x":[["x\\ne3,\\ 2",""],["(x+1)(x-2)+2x^2+10=3x(x-3)",""],["x^2-x-2+2x^2+10=3x^2-9x",""],["3x^2-x+8=3x^2-9x\\Rightarrow8x=-8\\Rightarrow x=-1","Check: $0+1=1$ and $\\f{-3}{-3}=1$ ✓"]],"tw":9,"id":"q086"},{"s":"solve","d":1,"q":"Solve: $\\f{3}{x}=\\f{5}{x+4}$","c":["$x=6$","$x=-6$","$x=2$","No solution"],"w":["Sign slip: $12=2x$ gives $x=6$.","Distribute: $3(x+4)=3x+12$, not $3x+4$.","$x=6$ works."],"h":"Cross-multiply.","x":[["3(x+4)=5x\\Rightarrow3x+12=5x\\Rightarrow x=6","Check: $\\f36=\\f{5}{10}$ ✓"]],"tw":null,"id":"q087"},{"s":"solve","d":2,"q":"Solve: $\\f{x}{x-2}=\\f{2}{x-2}+3$","c":["No solution","$x=2$","$x=-4$","$x=5$"],"w":["$x=2$ makes the denominator 0 — extraneous.","Distribute: $3(x-2)=3x-6$.","You forgot to multiply the 3 by $(x-2)$."],"h":"Multiply EVERY term — including the 3 — by $(x-2)$.","x":[["x=2+3(x-2)\\Rightarrow x=3x-4\\Rightarrow x=2",""],["x=2\\ \\text{excluded}\\Rightarrow\\text{no solution}",""]],"tw":null,"id":"q088"},{"s":"solve","d":1,"q":"Solve: $\\f{2}{x}+\\f12=\\f{3}{x}$","c":["$x=2$","$x=-2$","$x=\\f12$","No solution"],"w":["Multiply by $2x$: $4+x=6$.","Upside down.","$x=2$ works."],"h":"LCD: $2x$.","x":[["4+x=6\\Rightarrow x=2","Check: $1+\\f12=\\f32$ ✓"]],"tw":null,"id":"q089"},{"s":"solve","d":2,"q":"Solve: $\\f{6}{x}=x-1$","c":["$x=3$ or $x=-2$","$x=3$ only","$x=-3$ or $x=2$","$x=6$"],"w":["$x=-2$ isn't excluded — only $x=0$ is.","Factor: $x^2-x-6=(x-3)(x+2)$.","Multiply both sides by $x$ first."],"h":"Multiply by $x$ to get a quadratic.","x":[["6=x^2-x\\Rightarrow x^2-x-6=0",""],["(x-3)(x+2)=0\\Rightarrow x=3,\\ -2","Both are allowed ($x\\ne0$)."]],"tw":null,"id":"q090"},{"s":"solve","d":2,"q":"Solve: $\\f{x}{x+1}+\\f1x=1$","c":["No solution","$x=0$","$x=-1$","All real numbers"],"w":["$x=0$ is excluded.","$x=-1$ is excluded.","Clearing gives $1=0$ — never true."],"h":"Multiply by $x(x+1)$.","x":[["x^2+(x+1)=x(x+1)",""],["x^2+x+1=x^2+x\\Rightarrow1=0","A contradiction: no solution."]],"tw":null,"id":"q091"},{"s":"solve","d":1,"q":"Solve: $\\f{x^2}{x-3}=\\f{9}{x-3}$","c":["$x=-3$","$x=\\pm3$","$x=3$","No solution"],"w":["$x=3$ is excluded — extraneous.","$x=3$ makes the denominator 0.","$x=-3$ checks: $\\f{9}{-6}=\\f{9}{-6}$."],"h":"Same denominators → numerators equal. Then check restrictions.","x":[["x^2=9\\Rightarrow x=\\pm3",""],["x\\ne3\\Rightarrow x=-3",""]],"tw":null,"id":"q092"},{"s":"solve","d":2,"q":"Solve: $\\f{1}{x-1}+\\f{2}{x+1}=\\f{4}{x^2-1}$","c":["$x=\\f53$","$x=1$","$x=\\f35$","No solution"],"w":["$x=1$ is excluded.","$3x=5$, so $x=\\f53$.","$x=\\f53$ checks."],"h":"LCD: $(x-1)(x+1)$.","x":[["(x+1)+2(x-1)=4",""],["3x-1=4\\Rightarrow x=\\f53","Not excluded ✓"]],"tw":null,"id":"q093"},{"s":"solve","d":2,"q":"Solve: $\\f{3}{x-2}-\\f{1}{x}=\\f{4}{x(x-2)}$","c":["$x=1$","$x=3$","$x=-1$","No solution"],"w":["Distribute the minus: $-(x-2)=-x+2$.","Sign slip: $2x+2=4$ gives $x=1$.","$x=1$ checks."],"h":"LCD: $x(x-2)$.","x":[["3x-(x-2)=4\\Rightarrow2x+2=4\\Rightarrow x=1","Check: $-3-1=-4$ and $\\f{4}{-1}=-4$ ✓"]],"tw":null,"id":"q094"},{"s":"solve","d":1,"q":"What is an extraneous solution?","c":["A solution of the cleared equation that makes an original denominator 0","Any negative solution","A solution that is a fraction","A solution that makes a numerator 0"],"w":["Negative solutions are fine if they check.","Fractions are fine if they check.","A zero numerator is allowed."],"h":"Think Sheet #8.","x":[["","Multiplying by the LCD can create solutions the original equation can't have. Any value that makes an original denominator 0 must be thrown out."]],"tw":null,"id":"q095"},{"s":"solve","d":1,"q":"Before solving $\\f{5}{x+2}+\\f{1}{x-6}=\\f{4}{x^2-4x-12}$, which values can never be solutions?","c":["$-2$ and $6$","$2$ and $-6$","$-5$ and $-1$","None"],"w":["Set each factor to 0: $x+2=0$ and $x-6=0$.","Those don't come from the denominators.","Denominators always restrict the solutions."],"h":"Restrictions come from the denominators.","x":[["x^2-4x-12=(x-6)(x+2)","Excluded: $x=-2$ and $x=6$."]],"tw":null,"id":"q096"},{"s":"solve","d":2,"q":"Solve: $\\f{x+5}{x^2-1}=\\f{2}{x-1}$","c":["$x=3$","$x=1$","$x=7$","$x=-3$"],"w":["$x=1$ is excluded.","Build up correctly: $2(x+1)$, not $2(x-1)$.","Sign slip: $x+5=2x+2$ gives $x=3$."],"h":"Multiply by $(x-1)(x+1)$.","x":[["x+5=2(x+1)\\Rightarrow x=3","Check: $\\f88=\\f22$ ✓"]],"tw":null,"id":"q097"},{"s":"solve","d":3,"q":"Solve: $\\f{x}{x+4}-\\f{4}{x-4}=\\f{x^2+16}{x^2-16}$","c":["No solution","$x=-4$","$x=4$","$x=0$"],"w":["$x=-4$ is excluded — extraneous.","Not a root, and excluded.","Plug it in: $1\\ne-1$."],"h":"LCD: $(x+4)(x-4)$.","x":[["x(x-4)-4(x+4)=x^2+16",""],["x^2-8x-16=x^2+16\\Rightarrow-8x=32\\Rightarrow x=-4",""],["x=-4\\ \\text{excluded}\\Rightarrow\\text{no solution}",""]],"tw":null,"id":"q098"},{"s":"solve","d":2,"q":"Solve: $\\f{x}{x-1}+\\f2x=\\f{1}{x(x-1)}$","c":["$x=-3$","$x=-3$ or $x=1$","$x=1$","$x=3$"],"w":["$x=1$ is excluded — extraneous.","$x=1$ makes $x-1=0$.","Factor: $(x+3)(x-1)=0$."],"h":"LCD: $x(x-1)$.","x":[["x^2+2(x-1)=1\\Rightarrow x^2+2x-3=0",""],["(x+3)(x-1)=0\\Rightarrow x=-3,\\ 1",""],["x\\ne1\\Rightarrow x=-3",""]],"tw":null,"id":"q099"},{"s":"solve","d":3,"q":"Solve: $\\f5x+\\f{3}{x+2}=2$","c":["$x=1\\pm\\sqrt{6}$","$x=-1\\pm\\sqrt{6}$","$x=1\\pm\\sqrt{5}$","No solution"],"w":["Sign: $x^2-2x-5=0$ gives $x=1\\pm\\sqrt6$.","$b^2-4ac=4+20=24$, and $\\sqrt{24}=2\\sqrt6$.","Both roots are allowed ($x\\ne0,-2$)."],"h":"Multiply by $x(x+2)$, then use the quadratic formula.","x":[["5(x+2)+3x=2x(x+2)",""],["8x+10=2x^2+4x\\Rightarrow x^2-2x-5=0",""],["x=\\f{2\\pm\\sqrt{24}}{2}=1\\pm\\sqrt6",""]],"tw":null,"id":"q100"},{"s":"solve","d":1,"q":"Solve: $\\f3x=\\f{x}{12}$","c":["$x=\\pm6$","$x=6$ only","$x=36$","$x=\\pm\\sqrt{15}$"],"w":["$x=-6$ works too: $\\f{3}{-6}=\\f{-6}{12}$.","$x^2=36$ means $x=\\pm6$.","Cross-multiply: $x^2=36$."],"h":"Cross-multiply.","x":[["x^2=36\\Rightarrow x=\\pm6","Only $x=0$ is excluded."]],"tw":null,"id":"q101"},{"s":"solve","d":1,"q":"A student solves $\\f{x}{x-5}=\\f{5}{x-5}$, gets $x=5$, and writes “$x=5$.” Is that right?","c":["No — $x=5$ is extraneous, so there's no solution","Yes, $x=5$","No — the answer is $x=-5$","No — every real number works"],"w":["$x=5$ makes the denominator 0.","$x=-5$ gives $\\f{-5}{-10}\\ne\\f{5}{-10}$.","Only $x=5$ satisfies $x=5$ — and it's excluded."],"h":"Check the answer against the restrictions.","x":[["x\\ne5","So the only candidate is thrown out: no solution."]],"tw":null,"id":"q102"},{"s":"solve","d":2,"q":"Solve: $\\f{x^2-4}{x-2}=x+2$","c":["All real numbers except $2$","All real numbers","$x=2$","No solution"],"w":["$x=2$ makes the left side undefined.","$x=2$ is the one value that fails.","It's true for every other $x$."],"h":"Simplify the left side. What do you notice?","x":[["\\f{(x-2)(x+2)}{x-2}=x+2,\\ \\ x\\ne2","An identity: true for every allowed $x$."]],"tw":null,"id":"q103"},{"s":"solve","d":2,"q":"Solve: $\\f{x-1}{x+2}=\\f{x+3}{x-4}$","c":["$x=-\\f15$","$x=\\f15$","$x=-5$","No solution"],"w":["Sign slip: $-10x=2$ gives $x=-\\f15$, not $+\\f15$.","Expansion slip: $x^2-5x+4=x^2+5x+6$ simplifies to $-10x=2$.","$x=-\\f15$ isn't excluded, and it checks."],"h":"Cross-multiply.","x":[["(x-1)(x-4)=(x+3)(x+2)",""],["x^2-5x+4=x^2+5x+6\\Rightarrow-10x=2\\Rightarrow x=-\\f15",""]],"tw":null,"id":"q104"},{"s":"solve","d":2,"q":"Solve: $1-\\f4x=-\\f{3}{x^2}$","c":["$x=1$ or $x=3$","$x=-1$ or $x=-3$","$x=3$ only","$x=1$ only"],"w":["Sign slip: $x^2-4x+3=(x-1)(x-3)$ has positive roots.","$x=1$ is allowed too — only $x=0$ is excluded.","$x=3$ is allowed too — only $x=0$ is excluded."],"h":"Multiply every term by $x^2$.","x":[["x^2-4x=-3\\Rightarrow x^2-4x+3=0",""],["(x-1)(x-3)=0\\Rightarrow x=1,\\ 3","Neither is 0 ✓"]],"tw":null,"id":"q105"},{"s":"sys","d":2,"q":"Solve the system: $y=\\f{16}{x+4}$ and $y=\\f{x^2}{x+4}$","c":["$(4,2)$","$(4,2)$ and $(-4,2)$","$(4,16)$","No solution"],"w":["$x=-4$ makes both denominators 0.","Plug back in: $y=\\f{16}{8}=2$.","$(4,2)$ works."],"h":"Set equal, solve, exclude, then find $y$.","x":[["\\f{16}{x+4}=\\f{x^2}{x+4},\\ \\ x\\ne-4",""],["x^2=16\\Rightarrow x=\\pm4",""],["x=4\\Rightarrow y=\\f{16}{8}=2","Solution: $(4,2)$."]],"tw":10,"id":"q106"},{"s":"sys","d":1,"q":"Solve the system: $y=\\f1x$ and $y=x$","c":["$(1,1)$ and $(-1,-1)$","$(1,1)$ only","$(1,-1)$ and $(-1,1)$","No solution"],"w":["$x=-1$ also works: $\\f{1}{-1}=-1$.","On $y=x$, the coordinates are equal.","$x^2=1$ has two solutions."],"h":"$\\f1x=x\\Rightarrow x^2=1$.","x":[["x^2=1\\Rightarrow x=\\pm1",""],["(1,1),\\ (-1,-1)",""]],"tw":null,"id":"q107"},{"s":"sys","d":2,"q":"Solve the system: $y=\\f6x$ and $y=x+1$","c":["$(2,3)$ and $(-3,-2)$","$(2,3)$ only","$(3,4)$ and $(-2,-1)$","$(-2,-3)$ and $(3,2)$"],"w":["$x=-3$ is allowed: $\\f{6}{-3}=-2$.","Factor: $x^2+x-6=(x+3)(x-2)$.","Find $y$ from $y=x+1$."],"h":"$6=x(x+1)$.","x":[["x^2+x-6=0\\Rightarrow(x+3)(x-2)=0",""],["x=2\\Rightarrow y=3;\\ \\ x=-3\\Rightarrow y=-2",""]],"tw":null,"id":"q108"},{"s":"sys","d":2,"q":"Solve the system: $y=\\f{2}{x-1}$ and $y=x$","c":["$(2,2)$ and $(-1,-1)$","$(2,2)$ only","$(-2,-2)$ and $(1,1)$","$(2,2)$ and $(-1,1)$"],"w":["$x=-1$ works: $\\f{2}{-2}=-1$.","Sign flip — and $x=1$ is excluded.","On $y=x$, $y$ equals $x$."],"h":"$2=x(x-1)$.","x":[["x^2-x-2=0\\Rightarrow(x-2)(x+1)=0",""],["(2,2),\\ (-1,-1)",""]],"tw":null,"id":"q109"},{"s":"sys","d":1,"q":"Solve the system: $y=\\f{x}{x-3}$ and $y=\\f{3}{x-3}$","c":["No solution","$(3,1)$","$(3,0)$","Infinitely many"],"w":["$x=3$ makes the denominators 0.","$x=3$ is excluded.","They'd only be equal at $x=3$."],"h":"Same denominators → set numerators equal.","x":[["x=3",""],["x\\ne3\\Rightarrow\\text{no solution}",""]],"tw":null,"id":"q110"},{"s":"sys","d":2,"q":"Solve the system: $y=\\f4x$ and $y=-x+5$","c":["$(1,4)$ and $(4,1)$","$(-1,-4)$ and $(-4,-1)$","$(1,4)$ only","$(4,1)$ only"],"w":["$x^2-5x+4=0$ has positive roots.","$x=4$ works too.","$x=1$ works too."],"h":"$4=x(-x+5)$.","x":[["x^2-5x+4=0\\Rightarrow x=1,\\ 4",""],["(1,4),\\ (4,1)",""]],"tw":null,"id":"q111"},{"s":"sys","d":1,"q":"Solve the system: $y=\\f{x+1}{x}$ and $y=2$","c":["$(1,2)$","$(2,1)$","$(-1,2)$","No solution"],"w":["Coordinates swapped: the order is $(x,y)$.","$x+1=2x$ gives $x=1$, not $-1$.","$x=1$ works: $\\f{2}{1}=2$."],"h":"$\\f{x+1}{x}=2$.","x":[["x+1=2x\\Rightarrow x=1",""],["(1,2)",""]],"tw":null,"id":"q112"},{"s":"sys","d":2,"q":"How many points do $y=\\f1x$ and $y=-x$ have in common?","c":["$0$","$1$","$2$","Infinitely many"],"w":["$\\f1x=-x\\Rightarrow x^2=-1$: no real $x$.","No real solutions at all.","Different curves — they never meet."],"h":"Set them equal.","x":[["\\f1x=-x\\Rightarrow x^2=-1","No real solution, so no intersection points."]],"tw":null,"id":"q113"},{"s":"sys","d":2,"q":"Solve the system: $y=\\f{12}{x+2}$ and $y=x+3$","c":["$(1,4)$ and $(-6,-3)$","$(1,4)$ only","$(6,9)$ and $(-1,2)$","$(-6,-3)$ only"],"w":["$x=-6$ is allowed: $\\f{12}{-4}=-3$.","Signs: $x^2+5x-6=(x+6)(x-1)$.","$x=1$ works too."],"h":"$12=(x+3)(x+2)$.","x":[["x^2+5x-6=0\\Rightarrow(x+6)(x-1)=0",""],["(1,4),\\ (-6,-3)",""]],"tw":null,"id":"q114"},{"s":"sys","d":3,"q":"Solve the system: $y=\\f{x^2-4}{x-2}$ and $y=4$","c":["No solution","$(2,4)$","$(-2,4)$","$(2,4)$ and $(-2,4)$"],"w":["$(2,4)$ is a hole — $x=2$ is excluded.","At $x=-2$, $y=0$, not 4.","Neither works."],"h":"Simplify first: $x+2$ with $x\\ne2$.","x":[["x+2=4\\Rightarrow x=2",""],["x\\ne2\\Rightarrow\\text{no solution}","The graph has a hole at $(2,4)$."]],"tw":null,"id":"q115"},{"s":"word","d":3,"q":"Ana mows the fairways twice as fast as Ben, who takes 4 fewer hours than Cal. Together they finish in 1 hour. How long would Cal take alone?","c":["$\\approx7.46$ hours","$\\approx0.54$ hours","$\\approx3.46$ hours","$6$ hours"],"w":["Reject this root — Ben's time, $C-4$, would be negative.","That's Ben's time, not Cal's.","Check: $\\f16+\\f12+1\\ne1$."],"h":"Cal $=C$, Ben $=C-4$, Ana $=\\f{C-4}{2}$. Add the rates.","x":[["\\f1C+\\f{1}{C-4}+\\f{2}{C-4}=1","Ana's rate is double Ben's."],["\\f1C+\\f{3}{C-4}=1\\Rightarrow(C-4)+3C=C(C-4)",""],["C^2-8C+4=0\\Rightarrow C=4\\pm2\\sqrt3",""],["C=4+2\\sqrt3\\approx7.46\\ \\text{h}","$4-2\\sqrt3\\approx0.54$ would make Ben's time negative."]],"tw":12,"id":"q116"},{"s":"word","d":1,"q":"Ira rakes a bunker in 6 minutes; her coach takes 12 minutes. How long working together?","c":["$4$ min","$9$ min","$18$ min","$3$ min"],"w":["Averaging the times doesn't work — rates add.","Times don't add; rates do.","That needs a combined rate of $\\f13$ per minute."],"h":"$\\f16+\\f1{12}=\\f1T$","x":[["\\f16+\\f1{12}=\\f{3}{12}=\\f14",""],["T=4\\ \\text{min}",""]],"tw":null,"id":"q117"},{"s":"word","d":1,"q":"Pipe A fills a tank in 3 h and pipe B in 6 h. How long with both?","c":["$2$ h","$4.5$ h","$9$ h","$1.5$ h"],"w":["Averaging times doesn't work.","Times don't add.","Check: $\\f13+\\f16=\\f12$, so $T=2$."],"h":"$\\f13+\\f16=\\f1T$","x":[["\\f13+\\f16=\\f12",""],["T=2\\ \\text{h}",""]],"tw":null,"id":"q118"},{"s":"word","d":2,"q":"A pipe fills a pool in 4 h; a drain empties it in 6 h. With both open, how long to fill?","c":["$12$ h","$2.4$ h","$2$ h","$10$ h"],"w":["The drain works against the pipe: subtract its rate.","Subtract the rates, then flip.","Times don't add."],"h":"$\\f14-\\f16=\\f1T$","x":[["\\f14-\\f16=\\f{3-2}{12}=\\f1{12}",""],["T=12\\ \\text{h}",""]],"tw":null,"id":"q119"},{"s":"word","d":2,"q":"Together two people paint a fence in 4 h. One alone takes 6 h. How long for the other alone?","c":["$12$ h","$2$ h","$10$ h","$5$ h"],"w":["Subtracting times doesn't work.","Times don't add.","Check: $\\f16+\\f15\\ne\\f14$."],"h":"$\\f16+\\f1t=\\f14$","x":[["\\f1t=\\f14-\\f16=\\f1{12}",""],["t=12\\ \\text{h}",""]],"tw":null,"id":"q120"},{"s":"word","d":2,"q":"Two groundskeepers finish together in 6 h. One works twice as fast as the other. How long for the slower one alone?","c":["$18$ h","$9$ h","$12$ h","$3$ h"],"w":["That's the faster one's time.","Check: $\\f1{12}+\\f16=\\f14\\ne\\f16$.","Twice as fast means half the time — this isn't either time."],"h":"Slower: $t$ hours; faster: $\\f t2$ hours. Rates: $\\f1t$ and $\\f2t$.","x":[["\\f1t+\\f2t=\\f16\\Rightarrow\\f3t=\\f16",""],["t=18\\ \\text{h}",""]],"tw":null,"id":"q121"},{"s":"word","d":3,"q":"A boat goes 12 mi upstream and 12 mi back in 5 h total. The current is 1 mph. What is the boat's speed in still water?","c":["$5$ mph","$4$ mph","$6$ mph","$-\\f15$ mph"],"w":["Check: $\\f{12}{3}+\\f{12}{5}\\ne5$.","Check: $\\f{12}{5}+\\f{12}{7}\\ne5$.","Speed can't be negative — reject this root."],"h":"time = distance ÷ rate: $\\f{12}{b-1}+\\f{12}{b+1}=5$.","x":[["12(b+1)+12(b-1)=5(b^2-1)",""],["5b^2-24b-5=0\\Rightarrow(5b+1)(b-5)=0",""],["b=5\\ \\text{mph}",""]],"tw":null,"id":"q122"},{"s":"word","d":2,"q":"Ira's cart goes 2 mi out at 8 mph and 2 mi back at 12 mph. What is the average speed for the round trip?","c":["$9.6$ mph","$10$ mph","$9$ mph","$4.8$ mph"],"w":["Average speed = total distance ÷ total time, not the average of speeds.","Total time is $\\f14+\\f16=\\f5{12}$ h.","The round trip is 4 mi, not 2."],"h":"Total distance ÷ total time.","x":[["t=\\f28+\\f2{12}=\\f5{12}\\ \\text{h}",""],["\\f{4}{\\f5{12}}=\\f{48}{5}=9.6\\ \\text{mph}",""]],"tw":null,"id":"q123"},{"s":"word","d":1,"q":"Two resistors, 6 Ω and 3 Ω, are in parallel. What is the total resistance?","c":["$2$ Ω","$9$ Ω","$4.5$ Ω","$\\f12$ Ω"],"w":["That's the series total.","Not an average.","That's $\\f1R$ — flip it."],"h":"$\\f1R=\\f16+\\f13$","x":[["\\f16+\\f13=\\f12",""],["R=2",""]],"tw":null,"id":"q124"},{"s":"word","d":2,"q":"Total parallel resistance is 4 Ω and one resistor is 12 Ω. What is the other?","c":["$6$ Ω","$8$ Ω","$3$ Ω","$16$ Ω"],"w":["You can't subtract resistances.","Check: $\\f1{12}+\\f13=\\f5{12}\\ne\\f14$.","That's series thinking."],"h":"$\\f14=\\f1{12}+\\f1r$","x":[["\\f1r=\\f14-\\f1{12}=\\f2{12}",""],["r=6",""]],"tw":null,"id":"q125"},{"s":"word","d":2,"q":"Resistors $r_1=n-1$ and $r_2=n+1$ are in parallel: $R=\\f{1}{\\f{1}{r_1}+\\f{1}{r_2}}$. Simplify and state the domain.","c":["$\\f{n^2-1}{2n}$, $n\\ne-1,0,1$","$\\f{2n}{n^2-1}$, $n\\ne-1,1$","$2n$, all real numbers","$\\f{n^2-1}{2n}$, $n\\ne0$"],"w":["That's $\\f1R$ — flip it.","Adding resistances is the series rule.","$n=\\pm1$ makes $r_1$ or $r_2$ zero — excluded too."],"h":"Multiply top and bottom by $(n-1)(n+1)$.","x":[["\\f{(n-1)(n+1)}{(n+1)+(n-1)}=\\f{n^2-1}{2n}",""],["n\\ne1,\\ -1,\\ 0",""]],"tw":11,"id":"q126"},{"s":"word","d":2,"q":"A number plus its reciprocal is $\\f{10}{3}$. Find the number.","c":["$3$ or $\\f13$","$3$ only","$\\f{10}{3}$","$-3$ or $-\\f13$"],"w":["$\\f13$ also works: $\\f13+3=\\f{10}3$.","$\\f{10}3+\\f3{10}\\ne\\f{10}3$.","Negative numbers give a negative sum."],"h":"$x+\\f1x=\\f{10}{3}$; multiply by $3x$.","x":[["3x^2+3=10x\\Rightarrow3x^2-10x+3=0",""],["(3x-1)(x-3)=0\\Rightarrow x=3,\\ \\f13",""]],"tw":null,"id":"q127"},{"s":"word","d":2,"q":"Ira has made 12 of 20 putts inside 6 feet. How many putts in a row must she make to reach 75%?","c":["$12$","$3$","$8$","$15$"],"w":["Each make also adds an attempt: $\\f{15}{23}\\approx65\\%$.","$\\f{20}{28}\\approx71\\%$.","That's 75% of 20, not the number of new makes."],"h":"$\\f{12+x}{20+x}=\\f34$","x":[["4(12+x)=3(20+x)",""],["48+4x=60+3x\\Rightarrow x=12","Check: $\\f{24}{32}=75\\%$ ✓"]],"tw":null,"id":"q128"},{"s":"word","d":2,"q":"A 10-liter mix is 20% acid. How many liters of pure acid must be added to make it 50% acid?","c":["$6$ L","$3$ L","$5$ L","$8$ L"],"w":["Adding acid also increases the total volume.","Check: $\\f{7}{15}\\ne50\\%$.","Check: $\\f{10}{18}\\ne50\\%$."],"h":"$\\f{2+x}{10+x}=\\f12$","x":[["2(2+x)=10+x",""],["4+2x=10+x\\Rightarrow x=6",""]],"tw":null,"id":"q129"},{"s":"word","d":1,"q":"Pat clears a green in 2 h, Sam in 3 h, and Kim in 6 h. How long all together?","c":["$1$ h","$\\approx3.67$ h","$11$ h","$\\f12$ h"],"w":["Averaging times doesn't work.","Times don't add.","The rates add to exactly 1 job per hour."],"h":"$\\f12+\\f13+\\f16=\\f1T$","x":[["\\f12+\\f13+\\f16=1",""],["T=1\\ \\text{h}",""]],"tw":null,"id":"q130"},{"s":"word","d":3,"q":"A plane flies 600 mi with the wind in the same time it flies 480 mi against it. The wind is 30 mph. Find the plane's speed in still air.","c":["$270$ mph","$240$ mph","$300$ mph","$540$ mph"],"w":["Check: $\\f{600}{270}\\ne\\f{480}{210}$.","Check: $\\f{600}{330}\\ne\\f{480}{270}$.","That mixes up the distances."],"h":"Equal times: $\\f{600}{p+30}=\\f{480}{p-30}$.","x":[["600(p-30)=480(p+30)",""],["600p-18000=480p+14400\\Rightarrow120p=32400",""],["p=270\\ \\text{mph}",""]],"tw":null,"id":"q131"},{"s":"feat","d":2,"q":"Which set of key features is correct for $y=\\f{4}{x+2}+1$?","c":["VA $x=-2$; HA $y=1$; range $y\\ne1$","VA $x=2$; HA $y=1$; range $y\\ne1$","VA $x=-2$; HA $y=4$; range $y\\ne4$","VA $x=-2$; HA $y=1$; range $y\\ne-2$"],"w":["$x+2=0$ gives $x=-2$, not $2$. The sign flips inside.","The 4 is the vertical stretch. The horizontal asymptote is the constant added on the outside, $y=1$.","$-2$ is the excluded $x$ (domain). The range excludes the horizontal asymptote, $y=1$."],"h":"In $y=\\f{a}{x-h}+k$ the asymptotes are $x=h$ and $y=k$.","x":[["x+2=0\\Rightarrow x=-2","The denominator is 0 here: vertical asymptote, and $x=-2$ is out of the domain."],["y=1","The $+1$ outside shifts the horizontal asymptote up to $y=1$, so the range is $y\\ne1$."]],"tw":"T1","id":"q132"},{"s":"feat","d":2,"q":"What are the intercepts of $y=\\f{4}{x+2}+1$?","c":["$(-6,0)$ and $(0,3)$","$(-2,0)$ and $(0,3)$","$(6,0)$ and $(0,3)$","$(-6,0)$ and $(0,2)$"],"w":["$x=-2$ is the vertical asymptote. The graph never touches it, so it can't be an intercept.","From $\\f{4}{x+2}=-1$ you get $x+2=-4$, so $x=-6$, not $6$.","$\\f{4}{0+2}=2$, but then add the $1$: the y-intercept is $(0,3)$."],"h":"x-intercept: set $y=0$. y-intercept: plug in $x=0$.","x":[["0=\\f{4}{x+2}+1\\Rightarrow\\f{4}{x+2}=-1","x-intercept: set $y=0$."],["4=-(x+2)\\Rightarrow x=-6",""],["y=\\f{4}{0+2}+1=3","y-intercept: plug in $x=0$."]],"tw":"T1","id":"q133"},{"s":"feat","d":2,"q":"What are the domain and range of $y=-\\f{3}{x-4}-1$?","c":["Domain $x\\ne4$; range $y\\ne-1$","Domain $x\\ne-4$; range $y\\ne-1$","Domain $x\\ne4$; range $y\\ne-3$","Domain $x\\ne-1$; range $y\\ne4$"],"w":["$x-4=0$ at $x=4$. The sign inside flips.","$-3$ is the stretch and reflection. The range skips the horizontal asymptote, $y=-1$.","Swapped: the $4$ goes with $x$ (domain), the $-1$ with $y$ (range)."],"h":"Domain skips the vertical asymptote $x=h$; range skips the horizontal asymptote $y=k$.","x":[["x-4\\ne0\\Rightarrow x\\ne4","Domain"],["y\\ne-1","Range: the graph approaches $y=-1$ but never reaches it."]],"tw":"T2","id":"q134"},{"s":"feat","d":2,"q":"What is the y-intercept of $y=-\\f{3}{x-4}-1$?","c":["$\\left(0,-\\f{1}{4}\\right)$","$\\left(0,-\\f{7}{4}\\right)$","$\\left(0,\\f{3}{4}\\right)$","$(1,0)$"],"w":["$-\\f{3}{0-4}=-\\f{3}{-4}=+\\f{3}{4}$. Two negatives make a positive.","That is only the fraction part. You still have to add the $-1$.","$(1,0)$ is the x-intercept. The y-intercept has $x=0$."],"h":"Plug in $x=0$ and watch the two negative signs.","x":[["y=-\\f{3}{0-4}-1",""],["=\\f{3}{4}-1=-\\f{1}{4}",""]],"tw":"T2","id":"q135"},{"s":"recip","d":2,"q":"Use long division to rewrite $y=\\f{-2x-2}{x+3}$ in the form $\\f{a}{x-h}+k$.","c":["$y=\\f{4}{x+3}-2$","$y=\\f{-4}{x+3}-2$","$y=\\f{4}{x+3}+2$","$y=\\f{-2}{x+3}-2$"],"w":["$-2x-2-(-2)(x+3)=-2x-2+2x+6=+4$. Subtracting a negative adds.","The quotient is $-2$ (from $\\f{-2x}{x}$), so $k=-2$.","The remainder is $4$, not $-2$: $-2x-2=-2(x+3)+4$."],"h":"Divide $-2x$ by $x$ to get the quotient $-2$, then find what's left over.","x":[["-2x-2=-2(x+3)+4","The quotient is $-2$; $-2(x+3)=-2x-6$, and $-2x-2-(-2x-6)=4$."],["y=\\f{-2(x+3)+4}{x+3}=\\f{4}{x+3}-2","Split the fraction."]],"tw":"T5","id":"q136"},{"s":"feat","d":2,"q":"For $y=\\f{4}{x+3}-2$, what happens as $x\\to\\infty$?","c":["$y\\to-2^{+}$ (from above)","$y\\to-2^{-}$ (from below)","$y\\to\\infty$","$y\\to0$"],"w":["For large $x$, $\\f{4}{x+3}$ is a small positive number, so $y$ is a little MORE than $-2$.","As $x$ grows, $\\f{4}{x+3}$ shrinks to 0. $y$ levels off at the asymptote.","The horizontal asymptote is $y=-2$, not $y=0$. The $-2$ shifts it down."],"h":"Plug in a big number like $x=997$: $\\f{4}{1000}-2=-1.996$.","x":[["x=997:\\ y=\\f{4}{1000}-2=-1.996","Slightly above $-2$."],["y\\to-2^{+}","The fraction stays positive and shrinks to 0."]],"tw":"T5","id":"q137"},{"s":"feat","d":2,"q":"For $f(x)=-\\f{3}{x}+2$, what happens as $x\\to-\\infty$?","c":["$f(x)\\to2^{+}$ (from above)","$f(x)\\to2^{-}$ (from below)","$f(x)\\to-\\infty$","$f(x)\\to-3$"],"w":["That is the right side ($x\\to\\infty$). For negative $x$, $-\\f{3}{x}$ is positive.","The function levels off at the horizontal asymptote $y=2$.","$-3$ is the stretch and reflection. The horizontal asymptote is $y=2$."],"h":"Try $x=-1000$: $-\\f{3}{-1000}=+0.003$.","x":[["x=-1000:\\ f=-\\f{3}{-1000}+2=2.003","A negative divided by a negative is positive."],["f(x)\\to2^{+}",""]],"tw":"T6","id":"q138"},{"s":"feat","d":2,"q":"Where is the hole in $g(x)=\\f{4x+8}{x^2-4}$?","c":["$(-2,-1)$","$(2,1)$","$(-2,0)$","No hole; VAs at $x=\\pm2$"],"w":["$x-2$ does not cancel, so $x=2$ is a vertical asymptote, not a hole.","The hole's $y$-value comes from the simplified function: $\\f{4}{-2-2}=-1$.","$4x+8=4(x+2)$ cancels with $(x+2)$ in the denominator. That makes a hole, not an asymptote."],"h":"Factor both parts. A factor that cancels is a hole.","x":[["\\f{4(x+2)}{(x+2)(x-2)}","Factor out 4 on top; difference of squares on the bottom."],["=\\f{4}{x-2},\\ x\\ne-2","$(x+2)$ cancels, so $x=-2$ is a hole."],["\\f{4}{-2-2}=-1\\Rightarrow(-2,-1)","Plug $-2$ into the simplified function."]],"tw":"T7","id":"q139"},{"s":"feat","d":2,"q":"What is the range of $g(x)=\\f{4x+8}{x^2-4}$?","c":["$y\\ne0$ and $y\\ne-1$","$y\\ne0$ only","$y\\ne-1$ only","$y\\ne2$ and $y\\ne-2$"],"w":["The hole at $(-2,-1)$ removes $y=-1$ from the range too.","$y=0$ is the horizontal asymptote: $\\f{4}{x-2}$ is never 0.","$\\pm2$ are excluded $x$-values (domain), not $y$-values."],"h":"The range skips the horizontal asymptote AND the $y$-value of any hole.","x":[["g(x)=\\f{4}{x-2},\\ \\text{hole }(-2,-1)",""],["\\f{4}{x-2}\\ne0\\Rightarrow y\\ne0","HA $y=0$ is never reached."],["y\\ne-1","The only $x$ that gives $-1$ is the hole at $x=-2$."]],"tw":"T7","id":"q140"},{"s":"recip","d":2,"q":"Problem #5 rewrites as $y=\\f{4}{x+3}-2$. Which transformations of $f(x)=\\f{1}{x}$ does it show?","c":["Vertical stretch by 4, left 3, down 2","Vertical stretch by 4, right 3, down 2","Vertical stretch by 4, left 3, up 2","Vertical shrink by $\\f{1}{4}$, left 3, down 2"],"w":["$x+3=x-(-3)$, so $h=-3$: that moves LEFT 3.","$k=-2$ moves the graph DOWN 2.","Multiplying by 4 makes the graph taller: a stretch, not a shrink."],"h":"Match to $y=\\f{a}{x-h}+k$.","x":[["a=4,\\ h=-3,\\ k=-2","$|a|>1$: stretch. $h=-3$: left. $k=-2$: down."]],"tw":"T8","id":"q141"},{"s":"recip","d":2,"q":"Write the reciprocal function translated up 5, right 6, reflected over the x-axis, with a vertical dilation of 2.","c":["$y=-\\f{2}{x-6}+5$","$y=-\\f{2}{x+6}+5$","$y=\\f{2}{x-6}+5$","$y=-\\f{1}{2(x-6)}+5$"],"w":["Right 6 is $x-6$. $x+6$ moves left.","Reflecting over the x-axis makes $a$ negative.","A dilation of 2 multiplies by 2. $\\f{1}{2(x-6)}$ shrinks by $\\f{1}{2}$ instead."],"h":"$a=-2$ (reflect and dilate), $h=6$, $k=5$.","x":[["y=\\f{a}{x-h}+k",""],["a=-2,\\ h=6,\\ k=5","Reflection makes $a$ negative."],["y=-\\f{2}{x-6}+5",""]],"tw":"T9","id":"q142"},{"s":"recip","d":2,"q":"Which equation matches the graph?","c":["$y=\\f{3}{x+1}+2$","$y=\\f{3}{x-1}+2$","$y=\\f{3}{x+2}+1$","$y=-\\f{3}{x+1}+2$"],"w":["The vertical asymptote is at $x=-1$, so the denominator is $x+1$.","Swapped: the asymptotes are $x=-1$ (so $x+1$) and $y=2$ (so $+2$).","Check $(0,5)$: $-\\f{3}{1}+2=-1$, not $5$. There is no reflection."],"h":"Read the dashed asymptotes for $h$ and $k$, then use a point to find $a$.","x":[["x=-1,\\ y=2\\Rightarrow y=\\f{a}{x+1}+2","Asymptotes from the dashed lines."],["(0,5):\\ 5=\\f{a}{1}+2\\Rightarrow a=3","Use a point on the curve."],["y=\\f{3}{x+1}+2",""]],"tw":"T10","g":{"a":3,"h":-1,"k":2,"o":[],"p":[[0,5],[-2,-1],[2,3]]},"id":"q143"},{"s":"feat","d":2,"q":"Which equation matches the graph? (The open circle is a hole.)","c":["$y=\\f{-3(x+1)}{(x-3)(x+1)}+3$","$y=\\f{-3}{x-3}+3$","$y=\\f{-3(x-1)}{(x-3)(x-1)}+3$","$y=\\f{3(x+1)}{(x-3)(x+1)}+3$"],"w":["Same curve, but it misses the hole. The open circle at $x=-1$ needs a factor $(x+1)$ on top and bottom.","That puts the hole at $x=1$. The open circle is at $x=-1$, so the factor is $x+1$.","Check $(4,0)$: $\\f{3}{1}+3=6$, not $0$. The branches need $a=-3$."],"h":"The asymptotes give $\\f{a}{x-3}+3$. The open circle at $x=-1$ means a cancelling factor $(x+1)$.","x":[["x=3,\\ y=3\\Rightarrow y=\\f{a}{x-3}+3","Asymptotes."],["(4,0):\\ 0=a+3\\Rightarrow a=-3","Use the point on the curve."],["\\text{hole at }x=-1\\Rightarrow\\times\\f{x+1}{x+1}","A hole comes from a factor that cancels."],["y=\\f{-3(x+1)}{(x-3)(x+1)}+3",""]],"tw":"T11","g":{"a":-3,"h":3,"k":3,"o":[-1],"p":[[4,0],[2,6],[0,4]]},"id":"q144"},{"s":"feat","d":2,"q":"Which equation matches the graph? (The open circle is a hole.)","c":["$y=\\f{3(x+3)}{(x-3)(x+3)}$","$y=\\f{3}{x-3}$","$y=\\f{3(x-3)}{(x-3)(x+3)}$","$y=\\f{-3(x+3)}{(x-3)(x+3)}$"],"w":["Right curve, but no hole. The open circle at $x=-3$ needs $(x+3)$ to cancel.","That simplifies to $\\f{3}{x+3}$, which has its asymptote at $x=-3$, not $x=3$.","Check $(4,3)$: $-\\f{3}{1}=-3$. There is no reflection."],"h":"VA $x=3$, HA $y=0$, hole at $x=-3$.","x":[["y=\\f{a}{x-3}","Asymptotes $x=3$ and $y=0$."],["(4,3)\\Rightarrow a=3",""],["y=\\f{3(x+3)}{(x-3)(x+3)}","Multiply top and bottom by $(x+3)$ to make the hole."]],"tw":"T12","g":{"a":3,"h":3,"k":0,"o":[-3],"p":[[4,3],[6,1],[0,-1],[2,-3]]},"id":"q145"},{"s":"as","d":2,"q":"Simplify: $\\f{x+7}{x^2-x-6}+\\f{2}{x^2-6x+9}$","c":["$\\f{x^2+6x-17}{(x+2)(x-3)^2}$","$\\f{x^2+6x-25}{(x+2)(x-3)^2}$","$\\f{x+9}{(x+2)(x-3)^2}$","$\\f{x^2+4x-21}{(x+2)(x-3)^2}$"],"w":["$2(x+2)=2x+4$, so the constant is $-21+4=-17$.","Each numerator must be multiplied by its missing factor. $(x+7)$ needs $(x-3)$, and $2$ needs $(x+2)$.","That forgot to add the second fraction's $2(x+2)$."],"h":"$x^2-x-6=(x-3)(x+2)$ and $x^2-6x+9=(x-3)^2$. The LCD is $(x+2)(x-3)^2$.","x":[["\\f{x+7}{(x-3)(x+2)}+\\f{2}{(x-3)^2}","Factor."],["\\f{(x+7)(x-3)+2(x+2)}{(x+2)(x-3)^2}","LCD $(x+2)(x-3)^2$."],["\\f{x^2+4x-21+2x+4}{(x+2)(x-3)^2}",""],["\\f{x^2+6x-17}{(x+2)(x-3)^2}","Doesn't factor, so you're done."]],"tw":"T13","id":"q146"},{"s":"as","d":2,"q":"Simplify: $\\f{8}{x^2+3x-10}-\\f{3}{x^2+8x+15}$","c":["$\\f{5(x+6)}{(x+5)(x-2)(x+3)}$","$\\f{5(x+2)}{(x+5)(x-2)(x+3)}$","$\\f{11x+18}{(x+5)(x-2)(x+3)}$","$\\f{5}{(x+5)(x-2)(x+3)}$"],"w":["$-3(x-2)=-3x+6$, not $-6$. Distribute the minus sign to both terms.","That added $3(x-2)$ instead of subtracting it.","You can't subtract the numerators until both fractions are over the LCD."],"h":"$x^2+3x-10=(x+5)(x-2)$ and $x^2+8x+15=(x+5)(x+3)$.","x":[["\\f{8(x+3)-3(x-2)}{(x+5)(x-2)(x+3)}","LCD $(x+5)(x-2)(x+3)$."],["\\f{8x+24-3x+6}{(x+5)(x-2)(x+3)}","The minus sign hits both terms."],["\\f{5x+30}{\\cdots}=\\f{5(x+6)}{(x+5)(x-2)(x+3)}",""]],"tw":"T14","id":"q147"},{"s":"md","d":2,"q":"Simplify: $\\f{x^2-x-20}{x^2-5x-14}\\cdot\\f{x^2+5x+6}{x^2-2x-15}$","c":["$\\f{x+4}{x-7}$","$\\f{x-4}{x+7}$","$\\f{x+4}{x+7}$","$\\f{(x+4)(x+2)}{(x-7)(x+3)}$"],"w":["Factor carefully: $x^2-x-20=(x-5)(x+4)$ and $x^2-5x-14=(x-7)(x+2)$.","$x^2-5x-14=(x-7)(x+2)$. Product $-14$, sum $-5$.","$(x+2)$ and $(x+3)$ also cancel."],"h":"Factor all four, then cancel across the whole product.","x":[["\\f{(x-5)(x+4)}{(x-7)(x+2)}\\cdot\\f{(x+3)(x+2)}{(x-5)(x+3)}","Factor everything."],["\\f{x+4}{x-7}","Cancel $(x-5)$, $(x+2)$, $(x+3)$."]],"tw":"T15","id":"q148"},{"s":"md","d":2,"q":"In #15, $\\f{x^2-x-20}{x^2-5x-14}\\cdot\\f{x^2+5x+6}{x^2-2x-15}=\\f{x+4}{x-7}$. Which values of $x$ must be excluded?","c":["$x\\ne7,-2,5,-3$","$x\\ne7$ only","$x\\ne7,-2$","$x\\ne7,-2,5,-3,-4$"],"w":["Cancelled factors still restrict $x$: $-2$, $5$ and $-3$ made the original undefined.","The second denominator $(x-5)(x+3)$ adds $5$ and $-3$.","$x=-4$ only makes a numerator 0. That's allowed."],"h":"Every zero of every ORIGINAL denominator is excluded.","x":[["(x-7)(x+2)=0\\Rightarrow x=7,-2","First denominator."],["(x-5)(x+3)=0\\Rightarrow x=5,-3","Second denominator."]],"tw":"T15","id":"q149"},{"s":"md","d":2,"q":"Simplify: $\\f{2x-10}{x^2-3x-10}\\div\\f{4x-20}{x^2+3x+2}$","c":["$\\f{x+1}{2(x-5)}$","$\\f{8(x-5)}{(x+2)^2(x+1)}$","$\\f{x+1}{2}$","$\\f{2(x-5)}{x+1}$"],"w":["That multiplied without flipping the second fraction.","$\\f{2(x-5)}{(x-5)(x+2)}\\cdot\\f{(x+2)(x+1)}{4(x-5)}$ still has $(x-5)$ in the denominator.","Flipped the wrong way. Flip the divisor only."],"h":"Keep, change, flip, then factor and cancel.","x":[["\\f{2(x-5)}{(x-5)(x+2)}\\cdot\\f{(x+2)(x+1)}{4(x-5)}","Flip the divisor and factor."],["\\f{2(x+1)}{4(x-5)}=\\f{x+1}{2(x-5)}","Cancel $(x-5)$, $(x+2)$, and $\f{2}{4}$."]],"tw":"T16","id":"q150"},{"s":"md","d":2,"q":"For #16, $\\f{2x-10}{x^2-3x-10}\\div\\f{4x-20}{x^2+3x+2}$, which values are excluded?","c":["$x\\ne5,-2,-1$","$x\\ne5,-2$","$x\\ne-2,-1$","$x\\ne5$ only"],"w":["When dividing, the divisor can't be 0 either. Its denominator $x^2+3x+2=(x+2)(x+1)$ adds $-1$.","$x=5$ makes $x^2-3x-10$ equal 0 and the divisor equal 0, so it is excluded too.","$x=-2$ zeroes the first denominator, and $-1$ zeroes the divisor's denominator."],"h":"Check the first denominator, the divisor's denominator, and the divisor's numerator.","x":[["x^2-3x-10=(x-5)(x+2)\\Rightarrow5,-2",""],["x^2+3x+2=(x+2)(x+1)\\Rightarrow-2,-1",""],["4x-20=0\\Rightarrow5","You can't divide by 0."]],"tw":"T16","id":"q151"},{"s":"solve","d":2,"q":"Solve: $\\f{1}{x^2+2x}+\\f{x-1}{x}=1$","c":["$x=-1$","$x=1$","$x=-1$ or $x=-2$","No solution"],"w":["Clearing gives $1+x^2+x-2=x^2+2x$, so $x-1=2x$ and $x=-1$. Sign error.","$x=-2$ makes $x^2+2x=0$. It was never a solution.","$x=-1$ checks: $\\f{1}{-1}+\\f{-2}{-1}=-1+2=1$."],"h":"LCD is $x(x+2)$. Multiply EVERY term, including the 1.","x":[["x(x+2)\\cdot\\left[\\f{1}{x(x+2)}+\\f{x-1}{x}\\right]=x(x+2)\\cdot1","Multiply every term by the LCD."],["1+(x-1)(x+2)=x^2+2x",""],["1+x^2+x-2=x^2+2x",""],["x-1=2x\\Rightarrow x=-1","Not 0 or $-2$, so it checks."]],"tw":"T17","id":"q152"},{"s":"solve","d":2,"q":"Solve: $\\f{x-3}{x+5}=\\f{x}{x+2}$","c":["$x=-1$","$x=1$","$x=-\\f{3}{2}$","No solution"],"w":["$-6=6x$ gives $x=-1$, not $1$.","Cross-multiplying gives $(x-3)(x+2)=x(x+5)$. Expand both sides fully.","$x=-1$ doesn't make either denominator 0, so it's valid."],"h":"Cross-multiply, expand, and the $x^2$ terms cancel.","x":[["(x-3)(x+2)=x(x+5)","Cross-multiply."],["x^2-x-6=x^2+5x",""],["-6=6x\\Rightarrow x=-1",""]],"tw":"T18","id":"q153"},{"s":"solve","d":2,"q":"Solve: $\\f{-10}{25-r^2}+\\f{1}{5+r}=\\f{r-4}{5-r}$","c":["$r=3$","$r=3$ or $r=-5$","$r=-5$","No solution"],"w":["$r=-5$ makes $5+r=0$. It is extraneous.","$r=-5$ is extraneous, but $r=3$ works: both sides equal $-\\f{1}{2}$.","$r=3$ checks out, so there IS a solution."],"h":"$25-r^2=(5+r)(5-r)$. That is the LCD.","x":[["-10+(5-r)=(r-4)(5+r)","Multiply by $(5+r)(5-r)$."],["-r-5=r^2+r-20",""],["0=r^2+2r-15=(r+5)(r-3)",""],["r=3\\ \\ (r=-5\\text{ extraneous})","$r=-5$ zeroes a denominator."]],"tw":"T19","id":"q154"},{"s":"solve","d":2,"q":"Solve: $\\f{4x-16}{x^2-2x-8}=\\f{4}{x+4}$","c":["No solution","$x=4$","$x=-2$","$x=-4$"],"w":["$x=4$ makes $x^2-2x-8=0$. It's excluded.","$x=-2$ also zeroes $x^2-2x-8=(x-4)(x+2)$.","$x=-4$ zeroes the right side's denominator."],"h":"Factor: $\\f{4(x-4)}{(x-4)(x+2)}=\\f{4}{x+2}$. Can $\\f{4}{x+2}=\\f{4}{x+4}$?","x":[["4(x-4)(x+4)=4(x-4)(x+2)","Cross-multiply after factoring."],["x+4=x+2\\Rightarrow4=2","Divide by $4(x-4)$ (allowed, since $x\\ne4$). False."],["\\text{no solution}",""]],"tw":"T20","id":"q155"},{"s":"word","d":2,"q":"An airplane flies 2238.6 miles each way. Its speed without wind is 560 mph. Going against the wind takes 12 minutes longer than going with it. What is the wind speed?","c":["$14$ mph","$28$ mph","$140$ mph","$7$ mph"],"w":["Check: $\\f{2238.6}{532}-\\f{2238.6}{588}\\approx0.4$ h $=24$ min, not 12.","12 minutes is $0.2$ h, not $12$ h. Convert to hours first.","Check: $\\f{2238.6}{553}-\\f{2238.6}{567}\\approx0.1$ h $=6$ min."],"h":"Time $=\\f{d}{r}$. Against minus with $=\\f{12}{60}=0.2$ h.","x":[["\\f{2238.6}{560-w}-\\f{2238.6}{560+w}=0.2","12 min $=0.2$ h."],["2238.6(2w)=0.2(560^2-w^2)","Multiply by $(560-w)(560+w)$."],["0.2w^2+4477.2w-62720=0",""],["w^2+22386w-313600=0","Divide by 0.2."],["(w-14)(w+22400)=0\\Rightarrow w=14","Speed is positive."]],"tw":"T21","id":"q156"},{"s":"word","d":2,"q":"Luke and Nora can peel 20 carrots in 6 minutes together. Luke alone peels 5 carrots in 2 minutes. How many minutes would Nora take to peel 10 carrots alone?","c":["12 min","4 min","6 min","$7\\f{1}{2}$ min"],"w":["Subtracting times doesn't work. Subtract RATES: $\\f{20}{6}-\\f{5}{2}=\\f{5}{6}$ carrot/min.","That's how long they take together for 20. Nora alone is slower.","Nora's rate is $\\f{5}{6}$ carrot per minute, so 10 carrots takes $10\\div\\f{5}{6}=12$ min."],"h":"Rates add: Luke $+$ Nora $=$ together.","x":[["\\f{5}{2}+\\f{10}{t}=\\f{20}{6}","Rates in carrots per minute."],["\\f{10}{t}=\\f{20}{6}-\\f{15}{6}=\\f{5}{6}",""],["5t=60\\Rightarrow t=12",""]],"tw":"T22","id":"q157"},{"s":"inv","d":2,"q":"A table shows $x=-3,-1,\\f{1}{2},\\f{2}{3}$ with $y=4,12,-24,-18$. Which equation models this inverse variation?","c":["$y=-\\f{12}{x}$","$y=\\f{12}{x}$","$y=-4x$","$y=-\\f{4}{3}x$"],"w":["$(-3)(4)=-12$. Keep the negative sign.","That's direct variation. Check: $x=-1$ gives $4$, but the table says $12$.","$\\f{y}{x}$ is the constant for DIRECT variation. Inverse uses $k=xy$."],"h":"For inverse variation, $xy$ is the same for every pair.","x":[["k=xy=(-3)(4)=-12",""],["(-1)(12)=\\left(\\f{1}{2}\\right)(-24)=\\left(\\f{2}{3}\\right)(-18)=-12","Every pair gives the same product."],["y=-\\f{12}{x}",""]],"tw":"T3","id":"q158"},{"s":"inv","d":2,"q":"Three students can wash a car in 16 minutes. The time varies inversely with the number of students. How long will two students take?","c":["24 minutes","$10\\f{2}{3}$ minutes","8 minutes","32 minutes"],"w":["That's direct variation. Fewer students should take LONGER, not shorter.","Dividing 16 by 2 ignores the original 3 students.","Doubling 16 isn't the rule. With $k=48$, $t=\\f{48}{2}=24$."],"h":"Find $k=tn$ first.","x":[["t=\\f{k}{n}",""],["16=\\f{k}{3}\\Rightarrow k=48",""],["t=\\f{48}{2}=24",""]],"tw":"T4","id":"q159"},{"s":"inv","d":2,"q":"$y$ varies inversely with $x$, and $y=6$ when $x=4$. Find $y$ when $x=-8$.","c":["$y=-3$","$y=3$","$y=-12$","$y=-\\f{1}{3}$"],"w":["$k=24$ is positive, but $x=-8$ is negative, so $y$ is negative.","That used direct variation, $y=\\f{3}{2}x$.","That is $\\f{x}{k}$, flipped. Use $y=\\f{k}{x}$."],"h":"$k=xy=24$.","x":[["k=(4)(6)=24",""],["y=\\f{24}{-8}=-3",""]],"tw":null,"id":"q160"},{"s":"inv","d":2,"q":"Which equation is an inverse variation?","c":["$xy=-7$","$y=\\f{x}{7}$","$y=\\f{7}{x}+1$","$y=\\f{7}{x+1}$"],"w":["That's direct variation: $y=\\f{1}{7}x$.","The $+1$ shift means $xy$ is not constant.","Horizontal shift. $x\\cdot y$ is not constant: $(1)(3.5)\\ne(6)(1)$."],"h":"Inverse variation means $xy=k$ exactly.","x":[["xy=-7\\Rightarrow y=\\f{-7}{x}","This is $y=\f{k}{x}$ with $k=-7$."]],"tw":null,"id":"q161"},{"s":"inv","d":2,"q":"Six pumps drain a pool in 10 hours. Time varies inversely with the number of pumps. How many pumps are needed to drain it in 4 hours?","c":["15 pumps","2.4 pumps","24 pumps","12 pumps"],"w":["That's direct variation. Less time needs MORE pumps.","$6\\cdot4=24$ multiplies the wrong pair. $k=6\\cdot10=60$.","Check: $12\\cdot4=48\\ne60$."],"h":"$k=$ pumps $\\times$ hours.","x":[["k=6\\cdot10=60",""],["n=\\f{60}{4}=15",""]],"tw":null,"id":"q162"},{"s":"recip","d":2,"q":"Which equation matches the graph?","c":["$y=-\\f{2}{x-2}-1$","$y=\\f{2}{x-2}-1$","$y=-\\f{2}{x+2}-1$","$y=-\\f{2}{x-2}+1$"],"w":["Check $(3,-3)$: $\\f{2}{1}-1=1$. The graph is reflected, so $a<0$.","The vertical asymptote is $x=2$, so the denominator is $x-2$.","The horizontal asymptote is $y=-1$."],"h":"Asymptotes first, then a point for $a$.","x":[["x=2,\\ y=-1\\Rightarrow y=\\f{a}{x-2}-1",""],["(3,-3):\\ -3=a-1\\Rightarrow a=-2",""],["y=-\\f{2}{x-2}-1",""]],"tw":null,"g":{"a":-2,"h":2,"k":-1,"o":[],"p":[[0,0],[3,-3],[4,-2],[1,1]]},"id":"q163"},{"s":"recip","d":2,"q":"Which
