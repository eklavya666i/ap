 equation matches the graph?","c":["$y=\\f{2}{x+3}+1$","$y=\\f{1}{x+3}+1$","$y=\\f{2}{x-3}+1$","$y=\\f{2}{x+3}-1$"],"w":["Check $(-2,3)$: $\\f{1}{1}+1=2$, not 3. You need $a=2$.","The vertical asymptote is $x=-3$, so the denominator is $x+3$.","The horizontal asymptote is $y=1$."],"h":"Use the point $(-2,3)$ to find $a$.","x":[["y=\\f{a}{x+3}+1",""],["(-2,3):\\ 3=\\f{a}{1}+1\\Rightarrow a=2",""],["y=\\f{2}{x+3}+1",""]],"tw":null,"g":{"a":2,"h":-3,"k":1,"o":[],"p":[[-2,3],[-1,2],[-4,-1],[-5,0]]},"id":"q164"},{"s":"recip","d":2,"q":"What are the asymptotes of $y=-\\f{5}{x-4}+7$?","c":["VA $x=4$; HA $y=7$","VA $x=-4$; HA $y=7$","VA $x=4$; HA $y=-5$","VA $x=7$; HA $y=4$"],"w":["$x-4=0$ at $x=4$.","$-5$ is the stretch and reflection, not a shift.","Swapped. $h$ is inside with $x$, $k$ is outside."],"h":"$y=\\f{a}{x-h}+k$ has asymptotes $x=h$, $y=k$.","x":[["h=4,\\ k=7",""]],"tw":null,"id":"q165"},{"s":"recip","d":2,"q":"Which function has domain $x\\ne5$ and range $y\\ne-3$?","c":["$y=\\f{2}{x-5}-3$","$y=\\f{2}{x+5}-3$","$y=\\f{2}{x-3}+5$","$y=\\f{-3}{x-5}$"],"w":["$x+5=0$ at $x=-5$.","Swapped: this has domain $x\\ne3$ and range $y\\ne5$.","With no constant added, the horizontal asymptote is $y=0$."],"h":"Domain skips $h$, range skips $k$.","x":[["h=5,\\ k=-3\\Rightarrow y=\\f{a}{x-5}-3",""]],"tw":null,"id":"q166"},{"s":"feat","d":2,"q":"Find the vertical asymptote and hole of $y=\\f{x-5}{x^2-3x-10}$.","c":["VA $x=-2$; hole $\\left(5,\\f{1}{7}\\right)$","VAs $x=5$ and $x=-2$","VA $x=-2$; hole $(5,0)$","VA $x=5$; hole $\\left(-2,-\\f{1}{7}\\right)$"],"w":["$(x-5)$ cancels, so $x=5$ is a hole.","The hole's $y$ comes from the simplified function: $\\f{1}{5+2}=\\f{1}{7}$.","Backwards: the factor that cancels is $(x-5)$."],"h":"$x^2-3x-10=(x-5)(x+2)$.","x":[["\\f{x-5}{(x-5)(x+2)}=\\f{1}{x+2}","Cancel $(x-5)$."],["\\text{VA }x=-2",""],["\\f{1}{5+2}=\\f{1}{7}\\Rightarrow\\left(5,\\f{1}{7}\\right)",""]],"tw":null,"id":"q167"},{"s":"feat","d":2,"q":"What is the horizontal asymptote of $y=\\f{6x^2-1}{2x^2+5x}$?","c":["$y=3$","$y=0$","No horizontal asymptote","$y=\\f{1}{3}$"],"w":["$y=0$ is for when the bottom degree is bigger.","Equal degrees DO have a horizontal asymptote.","Flipped: top coefficient over bottom, $\\f{6}{2}$."],"h":"Same degree: divide the leading coefficients.","x":[["y=\\f{6}{2}=3","Both are degree 2."]],"tw":null,"id":"q168"},{"s":"feat","d":2,"q":"What is the horizontal asymptote of $y=\\f{4x}{x^2+1}$?","c":["$y=0$","$y=4$","No horizontal asymptote","$y=\\f{1}{4}$"],"w":["The leading-coefficient ratio only applies when the degrees are equal.","\"No HA\" is when the TOP degree is bigger.","Bottom degree is bigger, so $y=0$."],"h":"Compare degrees: 1 on top, 2 on the bottom.","x":[["1<2\\Rightarrow y=0","Bottom wins, so it goes to 0."]],"tw":null,"id":"q169"},{"s":"feat","d":2,"q":"What are the x-intercepts of $y=\\f{x^2-9}{x^2+x-6}$?","c":["$(3,0)$ only","$(3,0)$ and $(-3,0)$","$(2,0)$","$(-3,0)$ only"],"w":["$x=-3$ zeroes the denominator too. It's a hole, not an intercept.","$x=2$ is the vertical asymptote.","$x=-3$ is the hole. $x=3$ is the real intercept."],"h":"Factor and cancel first. Intercepts come from the simplified numerator.","x":[["\\f{(x-3)(x+3)}{(x+3)(x-2)}=\\f{x-3}{x-2}","Hole at $x=-3$."],["x-3=0\\Rightarrow(3,0)",""]],"tw":null,"id":"q170"},{"s":"feat","d":2,"q":"What is the domain of $f(x)=\\f{x+1}{x^2-16}$?","c":["All reals except $x=4$ and $x=-4$","All reals except $x=16$","All reals except $x=-1$","All reals except $x=4$"],"w":["Solve $x^2-16=0$: $x=\\pm4$.","The numerator never restricts the domain.","$x^2=16$ has two roots."],"h":"Set the denominator equal to 0.","x":[["x^2-16=0\\Rightarrow x=\\pm4",""]],"tw":null,"id":"q171"},{"s":"as","d":2,"q":"Simplify: $\\f{3}{x^2-4}+\\f{1}{x+2}$","c":["$\\f{x+1}{(x-2)(x+2)}$","$\\f{4}{x^2+x-2}$","$\\f{x+5}{(x-2)(x+2)}$","$\\f{1}{x-2}$"],"w":["You can't add denominators.","$1$ gets multiplied by $(x-2)$, so it's $3+x-2$.","$x+1$ doesn't cancel with anything."],"h":"The LCD is $(x-2)(x+2)$.","x":[["\\f{3+1(x-2)}{(x-2)(x+2)}",""],["\\f{x+1}{(x-2)(x+2)}",""]],"tw":null,"id":"q172"},{"s":"as","d":2,"q":"Simplify: $\\f{x}{x-3}-\\f{2}{x+1}$","c":["$\\f{x^2-x+6}{(x-3)(x+1)}$","$\\f{x^2-x-6}{(x-3)(x+1)}$","$\\f{x-2}{(x-3)(x+1)}$","$\\f{x^2+3x-6}{(x-3)(x+1)}$"],"w":["$-2(x-3)=-2x+6$. The minus sign flips the $-3$ to $+6$.","Each numerator must be multiplied by its missing factor first.","$x(x+1)=x^2+x$, and $-2(x-3)=-2x+6$."],"h":"LCD $(x-3)(x+1)$. Put the second numerator in parentheses.","x":[["\\f{x(x+1)-2(x-3)}{(x-3)(x+1)}",""],["\\f{x^2+x-2x+6}{(x-3)(x+1)}",""],["\\f{x^2-x+6}{(x-3)(x+1)}",""]],"tw":null,"id":"q173"},{"s":"as","d":2,"q":"Simplify: $\\f{5}{x-4}+\\f{3}{4-x}$","c":["$\\f{2}{x-4}$","$\\f{8}{x-4}$","$\\f{8}{(x-4)(4-x)}$","$\\f{2}{4-x}$"],"w":["$\\f{3}{4-x}=-\\f{3}{x-4}$, so you subtract.","$4-x$ is the opposite of $x-4$, not a new factor.","Sign: $5-3=2$ over $x-4$."],"h":"Rewrite $4-x$ as $-(x-4)$.","x":[["\\f{5}{x-4}-\\f{3}{x-4}",""],["\\f{2}{x-4}",""]],"tw":null,"id":"q174"},{"s":"md","d":2,"q":"Simplify: $\\f{x^2-9}{x^2+5x+6}\\cdot\\f{x+2}{x-3}$","c":["$1$, with $x\\ne-3,-2,3$","$1$, with $x\\ne3$ only","$\\f{x-3}{x+2}$","$0$"],"w":["Every original denominator restricts $x$: $-3$, $-2$ and $3$.","$(x-3)$ and $(x+2)$ both cancel.","Cancelling leaves 1, not 0."],"h":"Factor: $(x-3)(x+3)$ and $(x+2)(x+3)$.","x":[["\\f{(x-3)(x+3)}{(x+2)(x+3)}\\cdot\\f{x+2}{x-3}",""],["=1","Everything cancels."]],"tw":null,"id":"q175"},{"s":"md","d":2,"q":"Simplify: $\\f{3x-12}{x^2+x}\\div\\f{x-4}{x+1}$","c":["$\\f{3}{x}$","$\\f{3(x-4)^2}{x(x+1)^2}$","$3x$","$\\f{3}{x+1}$"],"w":["That multiplied without flipping.","$x^2+x=x(x+1)$ puts $x$ in the denominator.","$(x+1)$ cancels."],"h":"Flip the divisor, then factor.","x":[["\\f{3(x-4)}{x(x+1)}\\cdot\\f{x+1}{x-4}",""],["\\f{3}{x}",""]],"tw":null,"id":"q176"},{"s":"solve","d":2,"q":"Solve: $\\f{x}{x-2}=\\f{2}{x-2}+3$","c":["No solution","$x=2$","$x=-2$","$x=1$"],"w":["$x=2$ makes $x-2=0$. It's extraneous.","Check: $\\f{-2}{-4}\\ne\\f{2}{-4}+3$.","Check: $\\f{1}{-1}=-1$, but $\\f{2}{-1}+3=1$."],"h":"Multiply every term by $x-2$.","x":[["x=2+3(x-2)",""],["x=3x-4\\Rightarrow x=2",""],["x=2\\text{ is extraneous}",""]],"tw":null,"id":"q177"},{"s":"solve","d":2,"q":"Solve: $\\f{3}{x}+\\f{1}{2}=\\f{5}{x}$","c":["$x=4$","$x=\\f{1}{4}$","$x=-4$","$x=2$"],"w":["From $6+x=10$, $x=4$ directly. Nothing gets flipped.","Subtract 6 from both sides of $6+x=10$: $x=+4$.","Check: $\\f{3}{2}+\\f{1}{2}=2$, but $\\f{5}{2}=2.5$."],"h":"LCD $2x$.","x":[["6+x=10","Multiply by $2x$."],["x=4",""]],"tw":null,"id":"q178"},{"s":"solve","d":2,"q":"Solve: $\\f{x+1}{x-3}=\\f{4}{x-3}+\\f{x}{2}$","c":["$x=2$","$x=2$ or $x=3$","$x=3$","No solution"],"w":["$x=3$ makes $x-3=0$, so it's extraneous. Only $x=2$ survives.","$x=3$ is the extraneous root. It makes the denominators 0.","$x=2$ works: $\\f{3}{-1}=-3$ and $\\f{4}{-1}+\\f{2}{2}=-3$."],"h":"LCD $2(x-3)$.","x":[["2(x+1)=8+x(x-3)",""],["x^2-5x+6=0",""],["(x-2)(x-3)=0",""],["x=2","$x=3$ is extraneous."]],"tw":null,"id":"q179"},{"s":"word","d":2,"q":"A boat goes 24 miles downstream and back. Its speed in still water is 10 mph, and the round trip takes 5 hours. How fast is the current?","c":["2 mph","4 mph","4.8 mph","$-2$ mph or $2$ mph"],"w":["$c^2=4$ means $c=2$. 4 is $c^2$, not $c$.","$24\\div5=4.8$ is not the current. Set up time $=\\f{d}{r}$ for each leg.","$c=-2$ solves the equation, but a speed can't be negative."],"h":"Down: $10+c$. Up: $10-c$.","x":[["\\f{24}{10+c}+\\f{24}{10-c}=5",""],["480=5(100-c^2)",""],["c^2=4\\Rightarrow c=2",""]],"tw":null,"id":"q180"},{"s":"word","d":2,"q":"Pipe A fills a tank in 6 h. With pipe B also open, it fills in 4 h. How long would pipe B take alone?","c":["12 h","2 h","10 h","5 h"],"w":["You can't subtract times. Subtract rates.","Adding times doesn't work.","Averaging times doesn't work."],"h":"$\\f{1}{6}+\\f{1}{b}=\\f{1}{4}$.","x":[["\\f{1}{b}=\\f{1}{4}-\\f{1}{6}=\\f{1}{12}",""],["b=12",""]],"tw":null,"id":"q181"},{"s":"inv","d":3,"q":"$y$ varies inversely with $x$. If $x$ increases by 50%, what happens to $y$?","c":["$y$ decreases by about 33.3%","$y$ decreases by 50%","$y$ decreases by about 66.7%","$y$ increases by 50%"],"w":["Inverse variation doesn't move by the same percent. $y$ becomes $\\f{1}{1.5}=\\f{2}{3}$ of what it was.","$y$ becomes $\\f{2}{3}$ of its value, so it DROPS by $\\f{1}{3}$, not $\\f{2}{3}$.","That's direct variation. In inverse variation, $y$ goes down when $x$ goes up."],"h":"Replace $x$ with $1.5x$ in $y=\\f{k}{x}$.","x":[["y_{new}=\\f{k}{1.5x}=\\f{2}{3}\\cdot\\f{k}{x}",""],["1-\\f{2}{3}=\\f{1}{3}\\approx33.3\\%","The drop is one third."]],"tw":null,"id":"q182"},{"s":"inv","d":3,"q":"$z$ varies directly with $x$ and inversely with $y$. $z=12$ when $x=8$ and $y=2$. Find $z$ when $x=6$ and $y=9$.","c":["$z=2$","$z=40.5$","$z=72$","$z=4.5$"],"w":["That is joint variation, $z=kxy$. Here $y$ is in the denominator.","That swapped the roles: $z=\\f{ky}{x}$.","$k=3$ is right, but then $x$ and $y$ went in the wrong places: $\\f{3\\cdot6}{9}=2$."],"h":"Model: $z=\\f{kx}{y}$.","x":[["z=\\f{kx}{y}",""],["12=\\f{8k}{2}\\Rightarrow k=3",""],["z=\\f{3\\cdot6}{9}=2",""]],"tw":null,"id":"q183"},{"s":"inv","d":3,"q":"At constant temperature, the pressure of a gas varies inversely with its volume. A gas at 3 atm fills 12 L. It is squeezed to 4.5 L. What is the new pressure?","c":["8 atm","1.125 atm","18 atm","10.5 atm"],"w":["That's direct variation. Squeezing the gas RAISES the pressure.","$k=PV=36$, and $\\f{36}{4.5}=8$, not $\\f{12\\cdot4.5}{3}$.","Variation multiplies; it doesn't add the change in volume."],"h":"$k=PV$.","x":[["k=3\\cdot12=36",""],["P=\\f{36}{4.5}=8",""]],"tw":null,"id":"q184"},{"s":"inv","d":3,"q":"Which point could NOT be on the same inverse variation as $(-4,9)$?","c":["$(6,6)$","$(-12,3)$","$\\left(\\f{3}{2},-24\\right)$","$(12,-3)$"],"w":["$(-12)(3)=-36=k$, so it fits.","$\\f{3}{2}\\cdot(-24)=-36$, so it fits.","$12\\cdot(-3)=-36$, so it fits."],"h":"$k=(-4)(9)=-36$. Check each product.","x":[["k=xy=-36",""],["6\\cdot6=36\\ne-36","The sign is wrong, so $(6,6)$ can't be on it."]],"tw":null,"id":"q185"},{"s":"recip","d":3,"q":"$g(x)=\\f{1}{2x-8}+3$. Which describes the transformations of $\\f{1}{x}$?","c":["Vertical shrink by $\\f{1}{2}$, right 4, up 3","Vertical shrink by $\\f{1}{2}$, right 8, up 3","Vertical stretch by 2, right 4, up 3","Vertical shrink by $\\f{1}{2}$, left 4, up 3"],"w":["Factor first: $2x-8=2(x-4)$, so the shift is 4, not 8.","$\\f{1}{2(x-4)}=\\f{\\f{1}{2}}{x-4}$ multiplies by $\\f{1}{2}$.","$x-4$ moves RIGHT."],"h":"Factor the 2 out of $2x-8$.","x":[["\\f{1}{2x-8}=\\f{1}{2(x-4)}=\\f{\\f{1}{2}}{x-4}",""],["a=\\f{1}{2},\\ h=4,\\ k=3",""]],"tw":null,"id":"q186"},{"s":"recip","d":3,"q":"Write $y=\\f{3x-5}{x-2}$ in the form $\\f{a}{x-h}+k$.","c":["$y=\\f{1}{x-2}+3$","$y=\\f{-5}{x-2}+3$","$y=\\f{1}{x-2}-3$","$y=\\f{-11}{x-2}+3$"],"w":["$3(x-2)=3x-6$, so the remainder is $-5-(-6)=1$.","The quotient is $+3$.","That subtracted $3(x+2)$. Use the same $x-2$."],"h":"$3x-5=3(x-2)+?$","x":[["3x-5=3(x-2)+1",""],["y=\\f{1}{x-2}+3",""]],"tw":null,"id":"q187"},{"s":"recip","d":3,"q":"Which equation matches the graph?","c":["$y=-\\f{3}{x+2}-1$","$y=-\\f{1}{x+2}-1$","$y=\\f{3}{x+2}-1$","$y=-\\f{3}{x-2}-1$"],"w":["Check $(-1,-4)$: $-1-1=-2$, not $-4$. You need $a=-3$.","Check $(-1,-4)$: $3-1=2$. The graph is reflected.","The vertical asymptote is $x=-2$."],"h":"Asymptotes, then plug in $(-1,-4)$.","x":[["y=\\f{a}{x+2}-1",""],["-4=\\f{a}{1}-1\\Rightarrow a=-3",""]],"tw":null,"g":{"a":-3,"h":-2,"k":-1,"o":[],"p":[[-1,-4],[-3,2],[1,-2],[-5,0]]},"id":"q188"},{"s":"recip","d":3,"q":"A reciprocal function has asymptotes $x=-3$ and $y=2$ and passes through $(-1,-2)$. Find its equation.","c":["$y=-\\f{8}{x+3}+2$","$y=-\\f{4}{x+3}+2$","$y=-\\f{8}{x-3}+2$","$y=-\\f{8}{x+3}-2$"],"w":["$\\f{a}{2}=-4$ means $a=-8$. Multiply by 2.","$x=-3$ means $x+3$.","The horizontal asymptote $y=2$ means $+2$."],"h":"Plug the point into $y=\\f{a}{x+3}+2$.","x":[["-2=\\f{a}{-1+3}+2",""],["\\f{a}{2}=-4\\Rightarrow a=-8",""]],"tw":null,"id":"q189"},{"s":"recip","d":3,"q":"$f(x)=\\f{1}{x}$ is reflected over the $y$-axis, then shifted right 2 and up 1. Which is the result?","c":["$y=\\f{1}{2-x}+1$","$y=\\f{1}{-x-2}+1$","$y=\\f{1}{x-2}+1$","$y=\\f{1}{2-x}-1$"],"w":["Shifting right replaces $x$ with $x-2$: $-(x-2)=2-x$.","That lost the reflection.","Up 1 is $+1$."],"h":"Reflect: $\\f{1}{-x}$. Then replace $x$ with $x-2$.","x":[["\\f{1}{-x}","Reflect over the y-axis."],["\\f{1}{-(x-2)}=\\f{1}{2-x}","Right 2."],["y=\\f{1}{2-x}+1","Up 1."]],"tw":null,"id":"q190"},{"s":"recip","d":3,"q":"Which statement about $y=\\f{6}{x+1}-4$ is true?","c":["As $x\\to-1^{+}$, $y\\to\\infty$","As $x\\to-1^{+}$, $y\\to-\\infty$","As $x\\to\\infty$, $y\\to-4^{-}$","The graph crosses $y=-4$"],"w":["Just right of $-1$, $x+1$ is a tiny positive number, so $\\f{6}{x+1}$ is huge and positive.","For big $x$, $\\f{6}{x+1}>0$, so $y$ stays ABOVE $-4$.","$\\f{6}{x+1}$ is never 0, so $y$ never equals $-4$."],"h":"Try $x=-0.99$.","x":[["x=-0.99:\\ \\f{6}{0.01}-4=596","Huge and positive."]],"tw":null,"id":"q191"},{"s":"feat","d":3,"q":"Which feature list is correct for $f(x)=\\f{2x^2-8}{x^2+x-6}$?","c":["Hole $\\left(2,\\f{8}{5}\\right)$; VA $x=-3$; HA $y=2$","VAs $x=2$ and $x=-3$; HA $y=2$","Hole $\\left(2,\\f{8}{5}\\right)$; VA $x=-3$; HA $y=0$","Hole $(-2,0)$; VA $x=3$; HA $y=2$"],"w":["$(x-2)$ is on top AND bottom, so it cancels. That makes a hole at $x=2$, not an asymptote.","Both are degree 2, so the HA is the ratio of leading coefficients: $\\f{2}{1}=2$.","Sign errors. $x^2+x-6=(x+3)(x-2)$, and the cancelled factor is $(x-2)$."],"h":"Factor: $2x^2-8=2(x-2)(x+2)$ and $x^2+x-6=(x+3)(x-2)$.","x":[["\\f{2(x-2)(x+2)}{(x+3)(x-2)}=\\f{2(x+2)}{x+3}",""],["\\f{2(4)}{5}=\\f{8}{5}","Hole $y$."],["\\text{VA }x=-3,\\ \\text{HA }y=2",""]],"tw":null,"id":"q192"},{"s":"feat","d":3,"q":"What is the range of $y=\\f{x^2+x-2}{x^2-1}$?","c":["$y\\ne1$ and $y\\ne\\f{3}{2}$","$y\\ne1$ only","$y\\ne1$ and $y\\ne-1$","All real numbers"],"w":["The hole at $x=1$ also removes its $y$-value, $\\f{3}{2}$.","$x=-1$ is excluded from the DOMAIN. The range question is about $y$.","$y=1$ is never reached (the HA), and the hole removes $y=\\f{3}{2}$."],"h":"Factor and cancel, then rewrite as $1+\\f{1}{x+1}$.","x":[["\\f{(x+2)(x-1)}{(x-1)(x+1)}=\\f{x+2}{x+1}",""],["=1+\\f{1}{x+1}\\Rightarrow y\\ne1",""],["\\f{1+2}{1+1}=\\f{3}{2}\\Rightarrow y\\ne\\f{3}{2}","Hole."]],"tw":null,"id":"q193"},{"s":"feat","d":3,"q":"Which function has a hole at $x=4$ and a vertical asymptote at $x=-1$?","c":["$y=\\f{x-4}{x^2-3x-4}$","$y=\\f{x+4}{x^2-3x-4}$","$y=\\f{x-4}{x^2+3x-4}$","$y=\\f{x+1}{x^2-3x-4}$"],"w":["$x+4$ is not a factor of $(x-4)(x+1)$, so nothing cancels. That gives two VAs, $x=4$ and $x=-1$, and no hole.","$x^2+3x-4=(x+4)(x-1)$. Nothing cancels, and the VAs are $x=-4$ and $x=1$.","Backwards: $(x+1)$ cancels, so the hole is at $x=-1$ and the VA is at $x=4$."],"h":"Factor $x^2-3x-4$. The factor that cancels makes the hole; the one left over makes the VA.","x":[["x^2-3x-4=(x-4)(x+1)",""],["\\f{x-4}{(x-4)(x+1)}=\\f{1}{x+1}","$(x-4)$ cancels: hole at $x=4$. $(x+1)$ stays: VA at $x=-1$."]],"tw":null,"id":"q194"},{"s":"feat","d":3,"q":"Does $y=\\f{x+2}{x^2-1}$ ever cross its horizontal asymptote?","c":["Yes, at $(-2,0)$","No. A graph never crosses a horizontal asymptote","Yes, at $(2,0)$","No. Its HA is $y=1$"],"w":["Horizontal asymptotes only describe the far left and far right ends. In the middle the graph can cross them, and this one does at its x-intercept.","The numerator is 0 at $x+2=0$, so $x=-2$, not $2$.","Degree 1 on top, degree 2 on the bottom, so the HA is $y=0$, not $y=1$."],"h":"Find the HA first. Then ask: is there any $x$ where $y$ equals that value?","x":[["\\text{HA }y=0","Bottom degree is bigger."],["y=0\\Rightarrow x+2=0\\Rightarrow x=-2","$x=-2$ is in the domain."],["(-2,0)","The graph crosses its own horizontal asymptote here."]],"tw":null,"id":"q195"},{"s":"feat","d":3,"q":"For $y=\\f{x+3}{x-2}$, what happens as $x\\to2^{-}$?","c":["$y\\to-\\infty$","$y\\to\\infty$","$y\\to1$","$y\\to-\\f{3}{2}$"],"w":["Just LEFT of 2, $x-2$ is a tiny negative number, and $x+3\\approx5$ is positive. Positive over tiny negative goes to $-\\infty$.","$y=1$ is the horizontal asymptote. That describes $x\\to\\pm\\infty$, not $x$ near 2.","$-\\f{3}{2}$ is the y-intercept, $f(0)$. It says nothing about $x$ near 2."],"h":"Plug in a number just below 2, like $x=1.99$.","x":[["x=1.99:\\ y=\\f{4.99}{-0.01}=-499","Numerator about 5, denominator a tiny negative."],["y\\to-\\infty",""]],"tw":null,"id":"q196"},{"s":"feat","d":3,"q":"Which function has VA $x=3$, HA $y=2$, and x-intercept $(-1,0)$?","c":["$y=\\f{2x+2}{x-3}$","$y=\\f{x+1}{x-3}$","$y=\\f{2x-2}{x-3}$","$y=\\f{2x+2}{x+3}$"],"w":["Leading coefficients $\\f{1}{1}$ give HA $y=1$, not $y=2$.","$2x-2=0$ at $x=1$, so the x-intercept is $(1,0)$, not $(-1,0)$.","$x+3=0$ at $x=-3$. The VA must be $x=3$, so the bottom is $x-3$."],"h":"Build it in pieces: the VA sets the bottom, the x-intercept sets the top factor, and the HA sets the leading coefficient.","x":[["\\text{VA }x=3\\Rightarrow\\text{bottom }x-3",""],["\\text{x-int }(-1,0)\\Rightarrow\\text{top factor }x+1",""],["\\text{HA }y=2\\Rightarrow\\f{2}{1}","Put a 2 in front of the top."],["y=\\f{2(x+1)}{x-3}=\\f{2x+2}{x-3}",""]],"tw":null,"id":"q197"},{"s":"feat","d":3,"q":"Which equation matches the graph? (The open circle is a hole.)","c":["$y=\\f{(x-1)(x-3)}{(x+1)(x-3)}$","$y=\\f{x-1}{x+1}$","$y=\\f{(x+1)(x-3)}{(x-1)(x-3)}$","$y=\\f{(x-1)(x+3)}{(x+1)(x+3)}$"],"w":["Right curve, but it has no hole. The open circle at $x=3$ needs a factor $(x-3)$ on top and bottom.","Flipped: that has its VA at $x=1$ and its x-intercept at $(-1,0)$.","That puts the hole at $x=-3$. The open circle is at $x=3$."],"h":"Read it off the picture: VA $x=-1$, HA $y=1$, x-intercept $(1,0)$, hole at $x=3$.","x":[["\\text{x-int }(1,0),\\ \\text{VA }x=-1\\Rightarrow\\f{x-1}{x+1}","HA $\\f{1}{1}=1$ matches."],["\\text{check }(0,-1):\\ \\f{-1}{1}=-1",""],["\\times\\f{x-3}{x-3}","The open circle at $x=3$ is a cancelled factor."]],"tw":null,"g":{"a":-2,"h":-1,"k":1,"o":[3],"p":[[1,0],[0,-1],[-3,2],[-2,3]]},"id":"q198"},{"s":"feat","d":3,"q":"Which is true about $h(x)=\\f{x^2-4x}{x^2-16}$?","c":["Hole at $\\left(4,\\f{1}{2}\\right)$, and the graph passes through the origin","Hole at $\\left(4,\\f{1}{2}\\right)$, and there is no x-intercept","VAs at $x=4$ and $x=-4$","Hole at $\\left(-4,\\f{1}{2}\\right)$"],"w":["The factor $x$ survives on top, so $h(0)=0$. The graph goes through $(0,0)$, which is an x-intercept.","$(x-4)$ cancels, so $x=4$ is a hole. Only $x=-4$ is a VA.","The factor that cancels is $(x-4)$, so the hole is at $x=4$. $x=-4$ is the VA."],"h":"Factor: $\\f{x(x-4)}{(x-4)(x+4)}$.","x":[["\\f{x(x-4)}{(x-4)(x+4)}=\\f{x}{x+4}","Hole at $x=4$; VA $x=-4$."],["\\f{4}{4+4}=\\f{1}{2}","Hole $\\left(4,\\f{1}{2}\\right)$."],["h(0)=\\f{0}{4}=0","It passes through the origin."]],"tw":null,"id":"q199"},{"s":"feat","d":3,"q":"For which value of $k$ does $y=\\f{x-k}{x^2-5x+6}$ have exactly one vertical asymptote?","c":["$k=3$","$k=-3$","$k=6$","$k=5$"],"w":["$x+3$ doesn't match $(x-2)$ or $(x-3)$, so nothing cancels: two VAs.","6 is the constant term of the denominator, not a root. Nothing cancels: two VAs.","5 is the middle coefficient, not a root. Nothing cancels: two VAs."],"h":"Factor the denominator. To lose one VA, the top must cancel one factor.","x":[["x^2-5x+6=(x-2)(x-3)","Two possible VAs."],["k=3:\\ \\f{x-3}{(x-2)(x-3)}=\\f{1}{x-2}","Hole at $x=3$, one VA at $x=2$."],["k=2\\text{ would also work}","But it isn't one of the choices."]],"tw":null,"id":"q200"},{"s":"feat","d":3,"q":"What is the range of $y=\\f{3x-1}{x+2}$?","c":["All reals except $y=3$","All reals except $y=-2$","All reals except $y=-\\f{1}{2}$","All reals except $y=\\f{1}{3}$"],"w":["$x\\ne-2$ is the DOMAIN restriction. The range is about $y$.","$-\\f{1}{2}$ is the y-intercept, $f(0)$. The graph does reach it.","$\\f{1}{3}$ is where the x-intercept is. It's an $x$-value, not a missing $y$."],"h":"Divide to get the form $\\f{a}{x-h}+k$. The range skips $k$.","x":[["3x-1=3(x+2)-7",""],["y=3-\\f{7}{x+2}",""],["\\f{7}{x+2}\\ne0\\Rightarrow y\\ne3","Same as the HA from the degree rule: $\\f{3}{1}$."]],"tw":null,"id":"q201"},{"s":"simp","d":3,"q":"Simplify $\\f{x^3-27}{x^2-9}$ and state the restrictions.","c":["$\\f{x^2+3x+9}{x+3}$; $x\\ne\\pm3$","$\\f{x^2+3x+9}{x+3}$; $x\\ne-3$ only","$\\f{x^2-3x+9}{x+3}$; $x\\ne\\pm3$","$x-3$; $x\\ne-3$"],"w":["$x=3$ made the ORIGINAL denominator 0, so it stays excluded even after $(x-3)$ cancels.","Difference of cubes: $a^3-b^3=(a-b)(a^2+ab+b^2)$. The middle sign is $+$, so it's $x^2+3x+9$.","$x^3-27$ is not $(x-3)^2(x+3)$. Use the cubes pattern."],"h":"SOAP: $x^3-27=(x-3)(x^2+3x+9)$.","x":[["\\f{(x-3)(x^2+3x+9)}{(x-3)(x+3)}","Difference of cubes on top, squares on the bottom."],["x\\ne3,\\ x\\ne-3","Restrictions from the original denominator."],["\\f{x^2+3x+9}{x+3}","Cancel $(x-3)$."]],"tw":null,"id":"q202"},{"s":"simp","d":3,"q":"Simplify: $\\f{12-3x}{x^2-8x+16}$","c":["$-\\f{3}{x-4}$","$\\f{3}{x-4}$","$-\\f{3}{x+4}$","$-3$"],"w":["$12-3x=-3(x-4)$. Factoring out $-3$ keeps the negative.","$x^2-8x+16=(x-4)^2$, not $(x-4)(x+4)$.","The bottom is $(x-4)^2$: two factors. Only one cancels."],"h":"Factor $-3$ out of the top so it matches $(x-4)$.","x":[["\\f{-3(x-4)}{(x-4)^2}","Perfect square on the bottom."],["-\\f{3}{x-4},\\ x\\ne4","Cancel one $(x-4)$."]],"tw":null,"id":"q203"},{"s":"simp","d":3,"q":"Simplify: $\\f{2x^2-7x+3}{6x^2-x-1}$","c":["$\\f{x-3}{3x+1}$","$\\f{x+3}{3x-1}$","$\\f{x-3}{3x-1}$","$\\f{2x-1}{3x+1}$"],"w":["Sign errors. $2x^2-7x+3=(2x-1)(x-3)$ and $6x^2-x-1=(3x+1)(2x-1)$.","$6x^2-x-1=(3x+1)(2x-1)$. Check: $3x\\cdot(-1)+1\\cdot2x=-x$.","$(2x-1)$ is the factor that cancels, so it can't be left on top."],"h":"ac-method on both: $ac=6$ on top, $ac=-6$ on the bottom.","x":[["2x^2-7x+3=(2x-1)(x-3)","$-6$ and $-1$: product 6, sum $-7$."],["6x^2-x-1=(3x+1)(2x-1)","$-3$ and $2$: product $-6$, sum $-1$."],["\\f{x-3}{3x+1},\\ x\\ne\\f{1}{2},-\\f{1}{3}","Cancel $(2x-1)$."]],"tw":null,"id":"q204"},{"s":"md","d":3,"q":"Simplify: $\\f{x^3-8}{x^2-4}\\div\\f{x^2+2x+4}{x+2}$","c":["$1$, with $x\\ne\\pm2$","$\\f{(x^2+2x+4)^2}{(x+2)^2}$","$x-2$","$\\f{1}{x+2}$"],"w":["That multiplied without flipping the divisor.","$(x-2)$ is on the top AND the bottom, so it cancels too.","After flipping, $(x+2)$ moves to the top and cancels."],"h":"$x^3-8=(x-2)(x^2+2x+4)$.","x":[["\\f{(x-2)(x^2+2x+4)}{(x-2)(x+2)}\\cdot\\f{x+2}{x^2+2x+4}","Factor, then flip the divisor."],["=1","Everything cancels."],["x\\ne\\pm2","$x^2+2x+4$ is never 0, so only $\\pm2$."]],"tw":null,"id":"q205"},{"s":"md","d":3,"q":"Simplify: $\\f{2x^2+5x-3}{x^2-9}\\cdot\\f{x-3}{4x^2-1}$","c":["$\\f{1}{2x+1}$","$\\f{1}{2x-1}$","$2x+1$","$\\f{x-3}{2x+1}$"],"w":["$(2x-1)$ cancels. The factor left over is $(2x+1)$.","Upside down: the leftover factor is in the denominator.","$(x-3)$ appears on top and bottom, so it cancels."],"h":"$2x^2+5x-3=(2x-1)(x+3)$ and $4x^2-1=(2x-1)(2x+1)$.","x":[["\\f{(2x-1)(x+3)}{(x-3)(x+3)}\\cdot\\f{x-3}{(2x-1)(2x+1)}",""],["\\f{1}{2x+1}","Cancel $(2x-1)$, $(x+3)$, $(x-3)$."]],"tw":null,"id":"q206"},{"s":"md","d":3,"q":"Which values must be excluded for $\\f{x+1}{x-5}\\div\\f{x+4}{x-2}$?","c":["$x\\ne5,2,-4$","$x\\ne5,2$","$x\\ne5,-4$","$x\\ne5,2,-1,-4$"],"w":["Dividing by $\\f{x+4}{x-2}$ means it can't be 0, so $x\\ne-4$ too.","$x=2$ makes the divisor's denominator 0.","$x=-1$ only makes the FIRST numerator 0. That's allowed."],"h":"Three checks: both denominators, plus the divisor's numerator.","x":[["x-5\\ne0,\\ x-2\\ne0","Denominators."],["x+4\\ne0","After flipping, $x+4$ is in the denominator."],["x\\ne5,2,-4",""]],"tw":null,"id":"q207"},{"s":"md","d":3,"q":"Simplify: $\\f{x^2-x-12}{x^2-16}\\cdot\\f{x^2+4x}{x^2+6x+9}$","c":["$\\f{x}{x+3}$","$\\f{1}{x+3}$","$\\f{x+3}{x}$","$\\f{x}{x-3}$"],"w":["The factor $x$ from $x^2+4x=x(x+4)$ has nothing to cancel with.","Upside down.","$x^2+6x+9=(x+3)^2$, so it's $x+3$, not $x-3$."],"h":"Four factorings, then cancel.","x":[["\\f{(x-4)(x+3)}{(x-4)(x+4)}\\cdot\\f{x(x+4)}{(x+3)^2}",""],["\\f{x}{x+3}","Cancel $(x-4)$, $(x+4)$, one $(x+3)$."]],"tw":null,"id":"q208"},{"s":"md","d":3,"q":"Simplify: $\\f{6x^2}{x^2-1}\\div\\f{3x}{x+1}\\cdot\\f{x-1}{2}$","c":["$x$, with $x\\ne0,\\pm1$","$x$, with no restrictions","$\\f{1}{x}$, with $x\\ne0,\\pm1$","$x^2$, with $x\\ne0,\\pm1$"],"w":["$x=\\pm1$ and $x=0$ all made the original expression undefined. They stay excluded.","Only flip the divisor $\\f{3x}{x+1}$, not the whole thing.","$\\f{6x^2}{6x}=x$, not $x^2$."],"h":"Left to right: flip only the divisor.","x":[["\\f{6x^2}{(x-1)(x+1)}\\cdot\\f{x+1}{3x}\\cdot\\f{x-1}{2}",""],["\\f{6x^2}{6x}=x",""],["x\\ne\\pm1,\\ x\\ne0","The divisor $3x$ can't be 0."]],"tw":null,"id":"q209"},{"s":"as","d":3,"q":"Simplify: $\\f{x+1}{x^2-x-6}-\\f{x-2}{x^2-9}$","c":["$\\f{4x+7}{(x-3)(x+2)(x+3)}$","$\\f{4x-1}{(x-3)(x+2)(x+3)}$","$\\f{2x^2+4x-1}{(x-3)(x+2)(x+3)}$","$\\f{3}{(x-3)(x+2)(x+3)}$"],"w":["$-(x-2)(x+2)=-(x^2-4)=-x^2+4$. The constant is $3+4=7$, not $3-4$.","That added the second numerator. The minus sign applies to all of $(x-2)(x+2)$.","$(x+1)-(x-2)=3$ subtracts the numerators before giving each its missing factor."],"h":"LCD $(x-3)(x+2)(x+3)$.","x":[["\\f{(x+1)(x+3)-(x-2)(x+2)}{(x-3)(x+2)(x+3)}",""],["x^2+4x+3-(x^2-4)",""],["\\f{4x+7}{(x-3)(x+2)(x+3)}",""]],"tw":null,"id":"q210"},{"s":"as","d":3,"q":"Simplify: $\\f{2x}{x^2-1}+\\f{1}{1-x}$","c":["$\\f{1}{x+1}$","$\\f{3x+1}{(x-1)(x+1)}$","$\\f{1}{x-1}$","$\\f{2x+1}{x^2-1}$"],"w":["$\\f{1}{1-x}=-\\f{1}{x-1}$. Adding it as $+\\f{1}{x-1}$ gives $2x+(x+1)=3x+1$. The sign must flip.","Watch which factor cancels: the numerator $x-1$ cancels with $(x-1)$, leaving $x+1$ on the bottom.","You can't add numerators until the denominators match. $1-x$ is not $x^2-1$."],"h":"Rewrite $\\f{1}{1-x}$ as $-\\f{1}{x-1}$.","x":[["\\f{1}{1-x}=-\\f{1}{x-1}","Opposites: pull out a $-1$."],["\\f{2x}{(x-1)(x+1)}-\\f{x+1}{(x-1)(x+1)}","LCD $(x-1)(x+1)$."],["\\f{2x-x-1}{(x-1)(x+1)}=\\f{x-1}{(x-1)(x+1)}",""],["\\f{1}{x+1},\\ x\\ne\\pm1","Cancel $(x-1)$."]],"tw":null,"id":"q211"},{"s":"as","d":3,"q":"Simplify: $\\f{3}{x}-\\f{2}{x+2}+\\f{6}{x^2+2x}$","c":["$\\f{x+12}{x(x+2)}$","$\\f{x+6}{x(x+2)}$","$\\f{5x+12}{x(x+2)}$","$\\f{7}{x(x+2)}$"],"w":["$3(x+2)-2x=x+6$ is only two of the three fractions. Add the $6$: $x+12$.","$-\\f{2}{x+2}$ becomes $-2x$ over the LCD, not $+2x$.","$3-2+6=7$ just adds the numerators. Each needs its missing factor first."],"h":"$x^2+2x=x(x+2)$ is the LCD.","x":[["x^2+2x=x(x+2)","This is the LCD."],["\\f{3(x+2)}{x(x+2)}-\\f{2x}{x(x+2)}+\\f{6}{x(x+2)}","Give each fraction its missing factor."],["\\f{3x+6-2x+6}{x(x+2)}",""],["\\f{x+12}{x(x+2)}","Doesn't cancel."]],"tw":null,"id":"q212"},{"s":"as","d":3,"q":"Simplify: $\\f{x}{x+3}-\\f{x+21}{x^2-9}$","c":["$\\f{x-7}{x-3}$","$\\f{x-7}{x+3}$","$\\f{x^2-4x+21}{(x-3)(x+3)}$","$\\f{x+7}{x-3}$"],"w":["After factoring, $(x+3)$ cancels, which leaves $(x-3)$ on the bottom, not $(x+3)$.","$-(x+21)=-x-21$. Distribute the minus to the 21 too.","$x^2-4x-21=(x-7)(x+3)$, not $(x+7)(x-3)$: product $-21$, sum $-4$."],"h":"After combining, factor the top. Something cancels.","x":[["\\f{x(x-3)-(x+21)}{(x-3)(x+3)}","LCD $(x-3)(x+3)$."],["\\f{x^2-3x-x-21}{(x-3)(x+3)}=\\f{x^2-4x-21}{(x-3)(x+3)}",""],["\\f{(x-7)(x+3)}{(x-3)(x+3)}","Always try to factor the final numerator."],["\\f{x-7}{x-3},\\ x\\ne\\pm3",""]],"tw":null,"id":"q213"},{"s":"as","d":3,"q":"Simplify: $\\f{1}{x-2}+\\f{1}{x+2}-\\f{4}{x^2-4}$","c":["$\\f{2}{x+2}$","$\\f{2}{x-2}$","$\\f{2x}{x^2-4}$","$-\\f{2}{x+2}$"],"w":["$2x-4=2(x-2)$. It's $(x-2)$ that cancels, leaving $x+2$ on the bottom.","$(x+2)+(x-2)=2x$, but you still have to subtract the 4: $2x-4$.","$(x+2)+(x-2)-4=2x-4=+2(x-2)$, so the answer is positive."],"h":"LCD $(x-2)(x+2)$.","x":[["\\f{(x+2)+(x-2)-4}{(x-2)(x+2)}","LCD $(x-2)(x+2)=x^2-4$."],["\\f{2x-4}{(x-2)(x+2)}=\\f{2(x-2)}{(x-2)(x+2)}",""],["\\f{2}{x+2},\\ x\\ne\\pm2",""]],"tw":null,"id":"q214"},{"s":"cf","d":3,"q":"Simplify: $\\f{\\f{1}{x}-\\f{1}{3}}{x-3}$","c":["$-\\f{1}{3x}$","$\\f{1}{3x}$","$-3x$","$\\f{3-x}{3x}$"],"w":["$3-x=-(x-3)$, so dividing by $x-3$ leaves $-1$. Don't drop the minus.","Upside down: the $3x$ belongs in the denominator.","That only simplified the top. You still have to divide by $x-3$."],"h":"Combine the top: $\\f{3-x}{3x}$.","x":[["\\f{1}{x}-\\f{1}{3}=\\f{3-x}{3x}","Combine the top over $3x$."],["\\f{3-x}{3x}\\div(x-3)=\\f{3-x}{3x(x-3)}",""],["\\f{-(x-3)}{3x(x-3)}=-\\f{1}{3x}","$3-x=-(x-3)$."]],"tw":null,"id":"q215"},{"s":"cf","d":3,"q":"Simplify: $\\f{\\f{4}{x^2-4}}{\\f{2}{x+2}+\\f{1}{x-2}}$","c":["$\\f{4}{3x-2}$","$\\f{4}{3x+2}$","$\\f{3x-2}{4}$","$\\f{4}{3}$"],"w":["$2(x-2)+(x+2)=2x-4+x+2=3x-2$, not $3x+2$.","Upside down: the 4 is from the top fraction.","The bottom is $\\f{3x-2}{x^2-4}$, so the $x$ doesn't disappear."],"h":"Combine the bottom over $x^2-4$.","x":[["\\f{2(x-2)+(x+2)}{(x+2)(x-2)}=\\f{3x-2}{x^2-4}","Combine the bottom."],["\\f{4}{x^2-4}\\cdot\\f{x^2-4}{3x-2}","Dividing is multiplying by the flip."],["\\f{4}{3x-2}",""]],"tw":null,"id":"q216"},{"s":"cf","d":3,"q":"Simplify: $\\f{x-\\f{4}{x}}{1+\\f{2}{x}}$","c":["$x-2$","$x+2$","$\\f{x-2}{x}$","$x-4$"],"w":["$x^2-4=(x-2)(x+2)$. $(x+2)$ cancels with the bottom, so $x-2$ remains.","Multiplying top and bottom by $x$ clears every small fraction, so no $x$ is left in a denominator.","$x\\cdot x=x^2$, not $x$. The top becomes $x^2-4$."],"h":"Multiply top and bottom by $x$.","x":[["\\f{x\\cdot x-\\f{4}{x}\\cdot x}{1\\cdot x+\\f{2}{x}\\cdot x}=\\f{x^2-4}{x+2}","Multiply top and bottom by $x$."],["\\f{(x-2)(x+2)}{x+2}=x-2","With $x\\ne0,-2$."]],"tw":null,"id":"q217"},{"s":"solve","d":3,"q":"Solve: $\\f{2}{x+1}+\\f{5}{x^2-1}=\\f{1}{x-1}$","c":["$x=-2$","$x=2$","$x=-3$","No solution"],"w":["Check $x=2$: $\\f{2}{3}+\\f{5}{3}=\\f{7}{3}$, but $\\f{1}{1}=1$. Sign error when solving.","$2(x-1)=2x-2$. Distributing to only $x$ gives $2x+4=x+1$.","$x=-2$ checks: $-2+\\f{5}{3}=-\\f{1}{3}$ on both sides."],"h":"LCD $(x-1)(x+1)$.","x":[["2(x-1)+5=1(x+1)","Multiply every term by $(x-1)(x+1)$."],["2x+3=x+1",""],["x=-2","Not $\\pm1$, so it's valid."],["\\text{check: }\\f{2}{-1}+\\f{5}{3}=-\\f{1}{3}=\\f{1}{-3}",""]],"tw":null,"id":"q218"},{"s":"solve","d":3,"q":"Solve: $\\f{x}{x-4}-\\f{4}{x+4}=\\f{32}{x^2-16}$","c":["No solution","$x=\\pm4$","$x=4$","$x=-4$"],"w":["Both $4$ and $-4$ make $x^2-16=0$. Neither can be a solution.","$x=4$ makes $x-4=0$. It's extraneous.","$x=-4$ makes $x+4=0$. It's extraneous."],"h":"LCD $x^2-16$.","x":[["x(x+4)-4(x-4)=32","Multiply by $(x-4)(x+4)$."],["x^2+4x-4x+16=32",""],["x^2=16\\Rightarrow x=\\pm4",""],["\\text{both excluded}\\Rightarrow\\text{no solution}",""]],"tw":null,"id":"q219"},{"s":"solve","d":3,"q":"Solve: $\\f{6}{x}-\\f{x}{x+2}=1$","c":["$x=1\\pm\\sqrt{7}$","$x=-1\\pm\\sqrt{7}$","$x=1\\pm\\sqrt{5}$","$x=3$ or $x=-2$"],"w":["Sign error in the quadratic formula: $x=\\f{2\\pm\\sqrt{28}}{2}=1\\pm\\sqrt{7}$.","$b^2-4ac=4+24=28$, so $\\sqrt{28}=2\\sqrt{7}$, not $\\sqrt{20}$.","$x^2-2x-6$ doesn't factor. $3$ and $-2$ multiply to $-6$ but add to $1$, not $-2$."],"h":"LCD $x(x+2)$.","x":[["6(x+2)-x\\cdot x=x(x+2)","Multiply every term by $x(x+2)$."],["6x+12-x^2=x^2+2x",""],["0=2x^2-4x-12",""],["x^2-2x-6=0","Divide by 2."],["x=\\f{2\\pm\\sqrt{4+24}}{2}=\\f{2\\pm2\\sqrt{7}}{2}",""],["x=1\\pm\\sqrt{7}","Neither is 0 or $-2$."]],"tw":null,"id":"q220"},{"s":"solve","d":3,"q":"Solve: $\\f{x}{x-1}-\\f{1}{x}=\\f{1}{x^2-x}$","c":["No solution","$x=0$ or $x=1$","$x=1$","$x=0$"],"w":["Both make a denominator 0: $x=0$ zeroes $\\f{1}{x}$, and $x=1$ zeroes $x-1$.","$x=1$ makes $x-1=0$. It's extraneous.","$x=0$ makes $\\f{1}{x}$ undefined."],"h":"LCD $x(x-1)$.","x":[["x\\cdot x-(x-1)=1","Multiply by $x(x-1)$."],["x^2-x+1=1\\Rightarrow x^2-x=0",""],["x(x-1)=0\\Rightarrow x=0,1",""],["\\text{both excluded}\\Rightarrow\\text{no solution}",""]],"tw":null,"id":"q221"},{"s":"solve","d":3,"q":"Solve: $\\f{3}{x-2}+\\f{x}{2-x}=4$","c":["$x=\\f{11}{5}$","$x=\\f{11}{3}$","$x=\\f{5}{11}$","No solution"],"w":["$\\f{x}{2-x}=-\\f{x}{x-2}$. Adding it as $+\\f{x}{x-2}$ gives $3+x=4x-8$, so $x=\\f{11}{3}$.","$5x=11$ means $x=\\f{11}{5}$. Upside down.","$x=\\f{11}{5}$ isn't 2, so it's valid. Check: $\\f{3-2.2}{0.2}=4$."],"h":"$\\f{x}{2-x}=-\\f{x}{x-2}$.","x":[["\\f{3}{x-2}-\\f{x}{x-2}=4","Rewrite $2-x=-(x-2)$."],["3-x=4(x-2)",""],["3-x=4x-8\\Rightarrow11=5x",""],["x=\\f{11}{5}",""]],"tw":null,"id":"q222"},{"s":"solve","d":3,"q":"Solve: $\\f{1}{x}+\\f{1}{x+3}=\\f{1}{2}$","c":["$x=3$ or $x=-2$","$x=3$ only","$x=-3$ or $x=2$","No solution"],"w":["$x=-2$ is fine: only $0$ and $-3$ are excluded. Check: $-\\f{1}{2}+1=\\f{1}{2}$.","$x^2-x-6=(x-3)(x+2)$, so the roots are $3$ and $-2$.","Both roots check, so there are two solutions."],"h":"LCD $2x(x+3)$.","x":[["2(x+3)+2x=x(x+3)","Multiply by $2x(x+3)$."],["4x+6=x^2+3x",""],["x^2-x-6=0\\Rightarrow(x-3)(x+2)=0",""],["x=3\\text{ or }x=-2","Neither is 0 or $-3$."]],"tw":null,"id":"q223"},{"s":"solve","d":3,"q":"Solve: $\\f{2x}{x+3}-\\f{x}{x-3}=\\f{36}{x^2-9}$","c":["$x=12$","$x=12$ or $x=-3$","$x=-12$ or $x=3$","$x=-3$"],"w":["$x=-3$ makes $x+3=0$. It's extraneous.","$x^2-9x-36=(x-12)(x+3)$, so the roots are $12$ and $-3$.","$-3$ is extraneous, and $12$ is a real solution."],"h":"LCD $(x+3)(x-3)$.","x":[["2x(x-3)-x(x+3)=36","Multiply by $(x+3)(x-3)$."],["2x^2-6x-x^2-3x=36",""],["x^2-9x-36=0",""],["(x-12)(x+3)=0",""],["x=12","$x=-3$ is extraneous."]],"tw":null,"id":"q224"},{"s":"solve","d":3,"q":"Solve: $\\f{x-1}{4}=\\f{3}{x+3}$","c":["$x=3$ or $x=-5$","$x=3$ only","$x=-3$ or $x=5$","$x=\\pm\\sqrt{15}$"],"w":["$x=-5$ works too: $\\f{-6}{4}=-\\f{3}{2}$ and $\\f{3}{-2}=-\\f{3}{2}$.","$x^2+2x-15=(x+5)(x-3)$, so the roots are $3$ and $-5$.","$(x-1)(x+3)=x^2+2x-3$. Dropping the $2x$ gives $x^2=15$."],"h":"Cross-multiply.","x":[["(x-1)(x+3)=12","Cross-multiply."],["x^2+2x-3=12\\Rightarrow x^2+2x-15=0",""],["(x+5)(x-3)=0",""],["x=3\\text{ or }x=-5","Neither is $-3$."]],"tw":null,"id":"q225"},{"s":"solve","d":3,"q":"Solve: $\\f{x}{x-5}+\\f{3}{x+5}=\\f{10x}{x^2-25}$","c":["$x=-3$","$x=5$ or $x=-3$","$x=5$","$x=3$ or $x=-5$"],"w":["$x=5$ makes $x-5=0$. It's extraneous.","$x=5$ is extraneous, so it can't be the only solution.","$x^2-2x-15=(x-5)(x+3)$, so the roots are $5$ and $-3$."],"h":"LCD $(x-5)(x+5)$.","x":[["x(x+5)+3(x-5)=10x","Multiply by $(x-5)(x+5)$."],["x^2+8x-15=10x",""],["x^2-2x-15=0\\Rightarrow(x-5)(x+3)=0",""],["x=-3","$x=5$ is extraneous."]],"tw":null,"id":"q226"},{"s":"word","d":3,"q":"Pipe A fills a pool in 8 h. Drain B empties it in 12 h. Both are open on an empty pool. How long to fill it?","c":["24 h","4.8 h","4 h","20 h"],"w":["$\\f{1}{8}+\\f{1}{12}$ treats the drain as a second filler. The drain's rate is subtracted.","$12-8=4$ subtracts times. Only rates can be combined.","Check: in 20 h the pipe adds $\\f{20}{8}=2.5$ pools and the drain removes $\\f{20}{12}\\approx1.67$, net $0.83$."],"h":"$\\f{1}{8}-\\f{1}{12}$.","x":[["\\f{1}{8}-\\f{1}{12}","Fill rate minus drain rate."],["\\f{3}{24}-\\f{2}{24}=\\f{1}{24}","Pool per hour."],["T=24\\text{ h}",""]],"tw":null,"id":"q227"},{"s":"word","d":3,"q":"Luke paints a fence 3 hours faster than Nora. Together they take 2 hours. How long does Luke take alone?","c":["3 h","6 h","3 h or $-2$ h","1 h"],"w":["$L=3$ is Luke. Nora takes $L+3=6$ h.","$L=-2$ is a root of the quadratic, but a time can't be negative.","Check $L=1$: $1+\\f{1}{4}\\ne\\f{1}{2}$."],"h":"$\\f{1}{L}+\\f{1}{L+3}=\\f{1}{2}$.","x":[["\\f{1}{L}+\\f{1}{L+3}=\\f{1}{2}","Nora takes $L+3$ hours."],["2(L+3)+2L=L(L+3)","Multiply by $2L(L+3)$."],["L^2-L-6=0\\Rightarrow(L-3)(L+2)=0",""],["L=3\\text{ h}","Reject $-2$."]],"tw":null,"id":"q228"},{"s":"word","d":3,"q":"You drive 60 miles to a course at 40 mph and back at 60 mph. What is your average speed for the round trip?","c":["48 mph","50 mph","45 mph","52 mph"],"w":["$\\f{40+60}{2}=50$ ignores that you spend longer at 40 mph.","Total time is $1.5+1=2.5$ h, and $\\f{120}{2.5}=48$.","52 mph would make the trip take $\\f{120}{52}\\approx2.3$ h, but it really takes $1.5+1=2.5$ h."],"h":"Total distance over total time.","x":[["\\f{60}{40}=1.5\\text{ h},\\ \\f{60}{60}=1\\text{ h}",""],["\\f{120}{2.5}=48\\text{ mph}","Total distance over total time."]],"tw":null,"id":"q229"},{"s":"word","d":3,"q":"A plane flies 1200 miles with the wind and 1200 miles back. Its still-air speed is 500 mph; the round trip takes 5 hours. Find the wind speed.","c":["100 mph","50 mph","240 mph","$\\pm100$ mph"],"w":["Check: $\\f{1200}{550}+\\f{1200}{450}\\approx4.85$ h, not 5.","$\\f{1200}{5}=240$ uses the total time for one leg.","$w^2=10000$ has two roots, but a speed is positive."],"h":"$\\f{1200}{500+w}+\\f{1200}{500-w}=5$.","x":[["\\f{1200}{500+w}+\\f{1200}{500-w}=5",""],["1200(500-w)+1200(500+w)=5(250000-w^2)",""],["1200000=1250000-5w^2",""],["w^2=10000\\Rightarrow w=100",""]],"tw":null,"id":"q230"},{"s":"word","d":3,"q":"Ira scrubs her clubs in 30 min, her coach in 20 min, a teammate in 60 min. How long working together?","c":["10 min","$36\\f{2}{3}$ min","110 min","6 min"],"w":["Averaging the three times gives $36\\f{2}{3}$. Working together is faster than any one person.","Adding times gives 110 min. Rates add; times don't.","$2+3+1=6$ is the numerator of the sum of rates over 60, so the time is $\\f{60}{6}=10$, not 6."],"h":"Add the three rates.","x":[["\\f{1}{30}+\\f{1}{20}+\\f{1}{60}=\\f{1}{10}",""],["10\\text{ min}",""]],"tw":null,"id":"q231"}],"sheet":[{"n":"t1","lab":1,"set":"t4","sk":"feat","dir":"Identify the key features.","q":"$y=\\f{4}{x+2}+1$","s":[["x+2\\ne0\\Rightarrow x\\ne-2","Domain; also the vertical asymptote."],["y\\ne1","Range; the $+1$ is the horizontal asymptote."],["0=\\f{4}{x+2}+1\\Rightarrow x+2=-4\\Rightarrow x=-6","x-intercept."],["y=\\f{4}{2}+1=3","y-intercept."]],"a":"Domain $x\\ne-2$; range $y\\ne1$; VA $x=-2$, HA $y=1$; x-int $(-6,0)$; y-int $(0,3)$","trap":"The 4 is a stretch, not an asymptote."},{"n":"t2","lab":2,"set":"t4","sk":"feat","dir":"Identify the key features.","q":"$y=-\\f{3}{x-4}-1$","s":[["x\\ne4,\\ \\ y\\ne-1","Domain and range from the asymptotes."],["0=-\\f{3}{x-4}-1\\Rightarrow x-4=-3\\Rightarrow x=1","x-intercept."],["y=-\\f{3}{-4}-1=\\f{3}{4}-1=-\\f{1}{4}","y-intercept. Two negatives make a positive."]],"a":"Domain $x\\ne4$; range $y\\ne-1$; VA $x=4$, HA $y=-1$; x-int $(1,0)$; y-int $\\left(0,-\\f{1}{4}\\right)$","trap":"$-\\f{3}{-4}=+\\f{3}{4}$."},{"n":"t3","lab":3,"set":"t4","sk":"inv","dir":"Write an equation for the inverse variation in the table.","q":"$x=-3,-1,\\f{1}{2},\\f{2}{3}$; $y=4,12,-24,-18$","s":[["y=\\f{k}{x}\\Rightarrow4=\\f{k}{-3}","Use any pair."],["k=-12","Check: every $xy=-12$."]],"a":"$y=-\\f{12}{x}$","trap":"$k=xy$, not $\\f{y}{x}$."},{"n":"t4","lab":4,"set":"t4","sk":"inv","dir":"Three students wash a car in 16 min. Time varies inversely with students. How long for two?","q":"t=\\f{k}{n}","s":[["16=\\f{k}{3}\\Rightarrow k=48",""],["t=\\f{48}{2}=24",""]],"a":"24 minutes","trap":"Fewer students must take MORE time."},{"n":"t5","lab":5,"set":"t4","sk":"recip","dir":"Identify the key features and sketch. Use long division.","q":"$y=\\f{-2x-2}{x+3}$","s":[["-2x-2=-2(x+3)+4","Quotient $-2$, remainder $4$."],["y=\\f{4}{x+3}-2",""],["x\\ne-3,\\ \\ y\\ne-2","Domain, range, VA $x=-3$, HA $y=-2$."],["x\\to\\infty:\\ y\\to-2^{+};\\ \\ x\\to-\\infty:\\ y\\to-2^{-}","End behavior: $\\f{4}{x+3}$ is positive on the right, negative on the left."]],"a":"$y=\\f{4}{x+3}-2$; domain $x\\ne-3$; range $y\\ne-2$; VA $x=-3$; HA $y=-2$","trap":"Subtracting $-2(x+3)$ ADDS 6: the remainder is $+4$."},{"n":"t6","lab":6,"set":"t4","sk":"feat","dir":"Identify the key features and sketch.","q":"$f(x)=-\\f{3}{x}+2$","s":[["x\\ne0,\\ \\ f(x)\\ne2","VA $x=0$, HA $y=2$."],["x\\to\\infty:\\ f\\to2^{-};\\ \\ x\\to-\\infty:\\ f\\to2^{+}","$-\\f{3}{x}$ is negative for $x>0$, positive for $x<0$."],["0=-\\f{3}{x}+2\\Rightarrow x=\\f{3}{2}","x-intercept, a handy point for the sketch."]],"a":"Domain $x\\ne0$; range $f(x)\\ne2$; VA $x=0$; HA $y=2$","trap":"The reflection flips which side approaches from above."},{"n":"t7","lab":7,"set":"t4","sk":"feat","dir":"Identify the key features, including holes.","q":"$g(x)=\\f{4x+8}{x^2-4}$","s":[["\\f{4(x+2)}{(x+2)(x-2)}=\\f{4}{x-2},\\ x\\ne-2","Factor and cancel."],["x\\ne\\pm2","Domain from the original."],["\\f{4}{-4}=-1\\Rightarrow\\text{hole }(-2,-1)",""],["\\text{VA }x=2,\\ \\text{HA }y=0",""],["g(x)\\ne0,-1","Range: HA and the hole."]],"a":"Domain $x\\ne\\pm2$; range $y\\ne0,-1$; VA $x=2$; HA $y=0$; hole $(-2,-1)$","trap":"The hole removes $y=-1$ from the range."},{"n":"t8","lab":8,"set":"t4","sk":"recip","dir":"Describe the transformations of #5 from $f(x)=\\f{1}{x}$.","q":"$y=\\f{4}{x+3}-2$","s":[["a=4,\\ h=-3,\\ k=-2",""]],"a":"Vertical stretch by 4, left 3, down 2","trap":"$x+3$ means LEFT."},{"n":"t9","lab":9,"set":"t4","sk":"recip","dir":"Write a reciprocal function translated up 5, right 6, reflected over the x-axis, vertical dilation 2.","q":"y=\\f{a}{x-h}+k","s":[["a=-2,\\ h=6,\\ k=5","Reflection makes $a$ negative."]],"a":"$y=-\\f{2}{x-6}+5$","trap":"Right 6 is $x-6$."},{"n":"t10","lab":10,"set":"t4","sk":"recip","dir":"Write the equation of the graph.","q":"Graph 10","s":[["x=-1,\\ y=2\\Rightarrow y=\\f{a}{x+1}+2","Read the asymptotes."],["(0,5):\\ 5=a+2\\Rightarrow a=3",""]],"a":"$y=\\f{3}{x+1}+2$","trap":"Read $h$ from the vertical asymptote: $x=-1$ means $x+1$.","g":{"a":3,"h":-1,"k":2,"o":[],"p":[[0,5],[-2,-1],[2,3]]}},{"n":"t11","lab":11,"set":"t4","sk":"feat","dir":"Write the equation of the graph.","q":"Graph 11","s":[["x=3,\\ y=3\\Rightarrow\\f{a}{x-3}+3",""],["(4,0):\\ 0=a+3\\Rightarrow a=-3",""],["\\text{hole at }x=-1\\Rightarrow\\f{x+1}{x+1}",""]],"a":"$y=\\f{-3(x+1)}{(x-3)(x+1)}+3$","trap":"The open circle needs its own cancelling factor.","g":{"a":-3,"h":3,"k":3,"o":[-1],"p":[[4,0],[2,6],[0,4]]}},{"n":"t12","lab":12,"set":"t4","sk":"feat","dir":"Write the equation of the graph.","q":"Graph 12","s":[["x=3,\\ y=0\\Rightarrow\\f{a}{x-3}",""],["(4,3)\\Rightarrow a=3",""],["\\text{hole at }x=-3\\Rightarrow\\f{x+3}{x+3}",""]],"a":"$y=\\f{3(x+3)}{(x-3)(x+3)}$","trap":"HA $y=0$: nothing added outside.","g":{"a":3,"h":3,"k":0,"o":[-3],"p":[[4,3],[6,1],[0,-1],[2,-3]]}},{"n":"t13","lab":13,"set":"t4","sk":"as","dir":"Simplify. Write the result in factored form and state restrictions.","q":"$\\f{x+7}{x^2-x-6}+\\f{2}{x^2-6x+9}$","s":[["\\f{(x+7)(x-3)+2(x+2)}{(x+2)(x-3)^2}","LCD $(x+2)(x-3)^2$."],["\\f{x^2+4x-21+2x+4}{(x+2)(x-3)^2}",""]],"a":"$\\f{x^2+6x-17}{(x+2)(x-3)^2}$; $x\\ne-2,3$","trap":"The LCD needs $(x-3)$ TWICE."},{"n":"t14","lab":14,"set":"t4","sk":"as","dir":"Simplify. Write the result in factored form.","q":"$\\f{8}{x^2+3x-10}-\\f{3}{x^2+8x+15}$","s":[["\\f{8(x+3)-3(x-2)}{(x+5)(x-2)(x+3)}",""],["\\f{8x+24-3x+6}{\\cdots}=\\f{5x+30}{\\cdots}",""]],"a":"$\\f{5(x+6)}{(x+5)(x-2)(x+3)}$; $x\\ne-5,2,-3$","trap":"$-3(x-2)=-3x+6$."},{"n":"t15","lab":15,"set":"t4","sk":"md","dir":"Simplify and state restrictions.","q":"$\\f{x^2-x-20}{x^2-5x-14}\\cdot\\f{x^2+5x+6}{x^2-2x-15}$","s":[["\\f{(x-5)(x+4)}{(x-7)(x+2)}\\cdot\\f{(x+3)(x+2)}{(x-5)(x+3)}",""],["\\f{x+4}{x-7}",""]],"a":"$\\f{x+4}{x-7}$; $x\\ne7,-2,5,-3$","trap":"Cancelled factors still count as restrictions."},{"n":"t16","lab":16,"set":"t4","sk":"md","dir":"Simplify and state restrictions.","q":"$\\f{2x-10}{x^2-3x-10}\\div\\f{4x-20}{x^2+3x+2}$","s":[["\\f{2(x-5)}{(x-5)(x+2)}\\cdot\\f{(x+2)(x+1)}{4(x-5)}","Flip the divisor."],["\\f{x+1}{2(x-5)}",""]],"a":"$\\f{x+1}{2(x-5)}$; $x\\ne5,-2,-1$","trap":"Dividing adds restrictions from the divisor."},{"n":"t17","lab":17,"set":"t4","sk":"solve","dir":"Solve. Check for extraneous solutions.","q":"$\\f{1}{x^2+2x}+\\f{x-1}{x}=1$","s":[["1+(x-1)(x+2)=x(x+2)","Multiply by $x(x+2)$."],["x^2+x-1=x^2+2x\\Rightarrow x=-1",""]],"a":"$x=-1$","trap":"Multiply the 1 by the LCD too."},{"n":"t18","lab":18,"set":"t4","sk":"solve","dir":"Solve.","q":"$\\f{x-3}{x+5}=\\f{x}{x+2}$","s":[["(x-3)(x+2)=x(x+5)",""],["-6=6x\\Rightarrow x=-1",""]],"a":"$x=-1$","trap":"The $x^2$ terms cancel; that's fine."},{"n":"t19","lab":19,"set":"t4","sk":"solve","dir":"Solve.","q":"$\\f{-10}{25-r^2}+\\f{1}{5+r}=\\f{r-4}{5-r}$","s":[["-10+(5-r)=(r-4)(5+r)",""],["r^2+2r-15=0\\Rightarrow(r+5)(r-3)=0",""]],"a":"$r=3$ ($r=-5$ is extraneous)","trap":"$r=-5$ zeroes $5+r$."},{"n":"t20","lab":20,"set":"t4","sk":"solve","dir":"Solve.","q":"$\\f{4x-16}{x^2-2x-8}=\\f{4}{x+4}$","s":[["4(x-4)(x+4)=4(x-4)(x+2)",""],["x+4=x+2\\Rightarrow4=2","False."]],"a":"No solution","trap":"$x=4$ is excluded, so it can't rescue it."},{"n":"t21","lab":21,"set":"t4","sk":"word","dir":"Wind speed problem (calculator allowed).","q":"\\f{2238.6}{560-w}-\\f{2238.6}{560+w}=0.2","s":[["0.2w^2+4477.2w-62720=0",""],["w^2+22386w-313600=0",""],["(w-14)(w+22400)=0",""]],"a":"14 mph","trap":"12 minutes is 0.2 hours."},{"n":"t22","lab":22,"set":"t4","sk":"word","dir":"Luke and Nora peel carrots. How long for Nora to peel 10 alone?","q":"\\f{5}{2}+\\f{10}{t}=\\f{20}{6}","s":[["\\f{10}{t}=\\f{5}{6}",""],["t=12",""]],"a":"12 minutes","trap":"Rates add; times don't."},{"n":1,"sk":"simp","dir":"Simplify the function completely. Then state its domain.","q":"$y=\\f{x^2-49}{x^2+14x+49}$","s":[["\\f{(x-7)(x+7)}{(x+7)^2}","Factor: difference of squares on top, perfect square on the bottom."],["(x+7)^2=0\\Rightarrow x=-7","Find the restriction from the ORIGINAL denominator first."],["\\f{x-7}{x+7}","Cancel one common factor $(x+7)$."]],"a":"$y=\\f{x-7}{x+7}$; domain: all real numbers except $x=-7$","trap":"Don't exclude $x=7$ — it only makes the numerator 0.","set":"r45","lab":1},{"n":2,"sk":"simp","dir":"Simplify the function completely. Then state its domain.","q":"$y=\\f{4x^2-1}{6x^2-x-2}$","s":[["\\f{(2x-1)(2x+1)}{(3x-2)(2x+1)}","Top: difference of squares. Bottom: ac-method, $ac=-12\\to-4,\\ 3$."],["x\\ne\\f23,\\ \\ x\\ne-\\f12","Both bottom factors give restrictions."],["\\f{2x-1}{3x-2}","Cancel $(2x+1)$."]],"a":"$y=\\f{2x-1}{3x-2}$; domain: $x\\ne-\\f12,\\ \\f23$","trap":"$x=-\\f12$ stays excluded even though $(2x+1)$ canceled (it's a hole).","set":"r45","lab":2},{"n":3,"sk":"as","dir":"Simplify. Include any restrictions due to eliminated factors.","q":"$\\f{3w}{w^2-16}+\\f{2}{2w-8}$","s":[["\\f{3w}{(w-4)(w+4)}+\\f{2}{2(w-4)}","Factor both denominators. Restrictions: $w\\ne\\pm4$."],["\\f{2}{2(w-4)}=\\f{1}{w-4}","Reduce the second fraction."],["\\f{3w}{(w-4)(w+4)}+\\f{w+4}{(w-4)(w+4)}","Build up to the LCD $(w-4)(w+4)$."],["\\f{4w+4}{(w-4)(w+4)}=\\f{4(w+1)}{(w-4)(w+4)}","Combine; factor the numerator — nothing cancels."]],"a":"$\\f{4(w+1)}{w^2-16}$, $w\\ne\\pm4$","trap":"Build up the numerator too: $1\\cdot(w+4)$, not just the denominator.","set":"r45","lab":3},{"n":4,"sk":"as","dir":"Simplify. Include any restrictions due to eliminated factors.","q":"$-\\f{2}{n+4}-\\f{n^2}{n^2-16}$","s":[["-\\f{2}{n+4}-\\f{n^2}{(n+4)(n-4)}","Factor. LCD $(n+4)(n-4)$; restrictions $n\\ne\\pm4$."],["\\f{-2(n-4)-n^2}{(n+4)(n-4)}","Build up the first fraction by $(n-4)$."],["\\f{-n^2-2n+8}{(n+4)(n-4)}","Distribute: $-2n+8-n^2$."],["\\f{-(n+4)(n-2)}{(n+4)(n-4)}","Factor out $-1$: $n^2+2n-8=(n+4)(n-2)$."],["-\\f{n-2}{n-4}","Cancel $(n+4)$ — but keep $n\\ne-4$."]],"a":"$-\\f{n-2}{n-4}$ $\\left(\\text{or }\\f{2-n}{n-4}\\right)$, $n\\ne\\pm4$","trap":"Factor the final numerator — that's where the cancel hides.","set":"r45","lab":4},{"n":5,"sk":"md","dir":"Simplify. Include any restrictions due to eliminated factors.","q":"$\\f{9x^2+6x}{2x-1}\\div\\f{6x^2+x-2}{4x^2-4x+1}$","s":[["\\f{3x(3x+2)}{2x-1}\\div\\f{(3x+2)(2x-1)}{(2x-1)^2}","Factor everything."],["x\\ne\\f12,\\ \\ x\\ne-\\f23","Denominators give $\\f12$; the divisor's numerator gives $-\\f23$ (and $\\f12$)."],["\\f{3x(3x+2)}{2x-1}\\cdot\\f{(2x-1)^2}{(3x+2)(2x-1)}","Flip the divisor."],["3x","Everything else cancels."]],"a":"$3x$, $x\\ne-\\f23,\\ \\f12$","trap":"$x\\ne-\\f23$ comes from the divisor's numerator — easy to miss.","set":"r45","lab":5},{"n":6,"sk":"cf","dir":"Simplify. Include any restrictions due to eliminated factors.","q":"$\\f{\\f12-\\f{x+5}{4}}{\\f{x^2}{2}-\\f52}$","s":[["\\f{4\\cdot\\f12-4\\cdot\\f{x+5}{4}}{4\\cdot\\f{x^2}{2}-4\\cdot\\f52}","Multiply top and bottom by the LCD, 4."],["\\f{2-(x+5)}{2x^2-10}=\\f{-x-3}{2x^2-10}","Keep $(x+5)$ in parentheses."],["-\\f{x+3}{2(x^2-5)}","Factor; nothing cancels."],["x^2-5\\ne0\\Rightarrow x\\ne\\pm\\sqrt5","Restriction from the big denominator."]],"a":"$-\\f{x+3}{2(x^2-5)}$, $x\\ne\\pm\\sqrt5$","trap":"$2-(x+5)=-x-3$, not $-x+7$.","set":"r45","lab":6},{"n":7,"sk":"solve","dir":"Solve. Check for extraneous solutions.","q":"$x+\\f{2}{x-3}=\\f{x-1}{3-x}$","s":[["x\\ne3;\\ \\ \\f{x-1}{3-x}=-\\f{x-1}{x-3}","Restriction; rewrite the opposite denominator."],["x(x-3)+2=-(x-1)","Multiply EVERY term by $(x-3)$."],["x^2-3x+2=-x+1\\Rightarrow x^2-2x+1=0",""],["(x-1)^2=0\\Rightarrow x=1","$1\\ne3$ ✓. Check: $1+\\f{2}{-2}=0$ and $\\f{0}{2}=0$."]],"a":"$x=1$","trap":"Multiply the lone $x$ by $(x-3)$ too.","set":"r45","lab":7},{"n":8,"sk":"solve","dir":"Solve. Check for extraneous solutions.","q":"$\\f{1}{x+5}+\\f{1}{x-5}=\\f{10}{x^2-25}$","s":[["x\\ne\\pm5","$x^2-25=(x+5)(x-5)$ is the LCD."],["(x-5)+(x+5)=10","Multiply every term by the LCD."],["2x=10\\Rightarrow x=5",""],["x=5\\ \\text{is excluded}","Extraneous."]],"a":"No solution","trap":"Writing $x=5$ is the trap — always check against the restrictions.","set":"r45","lab":8},{"n":9,"sk":"solve","dir":"Solve. Check for extraneous solutions.","q":"$\\f{x+3}{x-5}+\\f{2x^2+6}{x^2-7x+10}=\\f{3x}{x-2}$","s":[["x^2-7x+10=(x-5)(x-2);\\ \\ x\\ne5,\\ 2","LCD: $(x-5)(x-2)$."],["(x+3)(x-2)+2x^2+6=3x(x-5)","Multiply every term by the LCD."],["x^2+x-6+2x^2+6=3x^2-15x",""],["3x^2+x=3x^2-15x\\Rightarrow16x=0\\Rightarrow x=0","$0$ isn't excluded. Check: $-\\f35+\\f{6}{10}=0=\\f{0}{-2}$ ✓"]],"a":"$x=0$","trap":"$x=0$ is a real answer — don't throw it out.","set":"r45","lab":9},{"n":10,"sk":"sys","dir":"Solve the system of equations.","q":"$y=\\f{9}{x+3}$ and $y=\\f{x^2}{x+3}$","s":[["\\f{9}{x+3}=\\f{x^2}{x+3},\\ \\ x\\ne-3","Set the two expressions equal."],["x^2=9\\Rightarrow x=\\pm3",""],["x=-3\\ \\text{excluded}","Extraneous."],["x=3\\Rightarrow y=\\f{9}{6}=\\f32","Find $y$."]],"a":"$\\left(3,\\ \\f32\\right)$","trap":"Give the ordered pair, not just $x=3$.","set":"r45","lab":10},{"n":11,"sk":"cf","dir":"Two resistors in parallel: $R=\\f{1}{\\f{1}{r_1}+\\f{1}{r_2}}$. Find $R$ when $r_1=n$ and $r_2=n+1$, then state the domain.","q":"$R=\\f{1}{\\f1n+\\f{1}{n+1}}$","s":[["\\f1n+\\f{1}{n+1}=\\f{(n+1)+n}{n(n+1)}=\\f{2n+1}{n(n+1)}","Combine the bottom."],["R=\\f{n(n+1)}{2n+1}=\\f{n^2+n}{2n+1}","1 divided by a fraction = its reciprocal."],["n\\ne0,\\ \\ n\\ne-1,\\ \\ n\\ne-\\f12","From $r_1$, $r_2$, and the big denominator. (Physically, $n>0$.)"]],"a":"$R=\\f{n(n+1)}{2n+1}$; domain: $n\\ne-1,\\ -\\f12,\\ 0$","trap":"$\\f{1}{\\f1a+\\f1b}\\ne a+b$.","set":"r45","lab":11},{"n":12,"sk":"word","dir":"Barry is twice as fast as Carrie, who clears the streets in 5 fewer hours than Larry. Together: 1 hour. How long would Larry take alone?","q":"\\text{Larry}=L,\\ \\ \\text{Carrie}=L-5,\\ \\ \\text{Barry}=\\f{L-5}{2}","s":[["\\f1L+\\f{1}{L-5}+\\f{2}{L-5}=1","Barry is twice as fast, so his rate is double Carrie's. Rates add to 1 job per hour."],["\\f1L+\\f{3}{L-5}=1\\Rightarrow(L-5)+3L=L(L-5)","Multiply by $L(L-5)$."],["L^2-9L+5=0",""],["L=\\f{9\\pm\\sqrt{61}}{2}\\approx8.41\\ \\text{or}\\ 0.59","Quadratic formula."],["L\\approx8.41\\ \\text{h}","Reject 0.59: Carrie's time $L-5$ would be negative."]],"a":"Larry: $\\f{9+\\sqrt{61}}{2}\\approx8.41$ hours (about 8 h 24 min)","trap":"Twice as fast = half the time, double the rate.","set":"r45","lab":12}],"lessons":[{"k":"inv","t":"Inverse variation","sh":"Test review #3, #4","hook":"Two players sharing one range bucket: the more of you there are, the fewer balls each gets. One goes up, the other goes down, and the product stays the same. That's $xy=k$.","big":"In an inverse variation $y=\\f{k}{x}$, the product $xy$ is the same number $k$ for every pair. Double one quantity and the other halves.","keys":[["Model","y=\\f{k}{x}\\ \\ (k\\ne0)"],["Find k","k=xy"],["Test a table","x_1y_1=x_2y_2=x_3y_3"],["Compare: direct","y=kx,\\ \\ k=\\f{y}{x}"],["Combined","z=\\f{kx}{y}"]],"how":["Write the model with the problem's letters, like $t=\\f{k}{n}$.","Plug in the known pair to find $k=xy$.","Rewrite the model using your $k$.","Plug in the new value. Sanity check: if one quantity went up, the other must go down."],"ex":[{"t":"Table (Test review #3)","q":"$x=-3,-1,\\f{1}{2},\\f{2}{3}$; $y=4,12,-24,-18$","s":[["k=xy=(-3)(4)=-12","Multiply one pair."],["(-1)(12)=\\f{1}{2}(-24)=\\f{2}{3}(-18)=-12","Every pair gives the same product."],["y=-\\f{12}{x}",""]],"a":"$y=-\\f{12}{x}$"},{"t":"Word problem (Test review #4)","q":"3 students wash a car in 16 min. How long for 2 students?","s":[["t=\\f{k}{n}","Time varies inversely with students."],["16=\\f{k}{3}\\Rightarrow k=48",""],["t=\\f{48}{2}=24","Fewer students, more time. Makes sense."]],"a":"24 minutes"}],"traps":["$k=\\f{y}{x}$ is DIRECT variation. Inverse uses $k=xy$.","Keep the sign of $k$: $(-3)(4)=-12$.","If more workers seems to take more time, you used the wrong model.","$y=\\f{k}{x}+1$ is not an inverse variation; $xy$ isn't constant."]},{"k":"recip","t":"Reciprocal function & shifts","sh":"Test review #5, #8–10","hook":"Moving $\\f{1}{x}$ is like re-aiming at a new pin: the shape of the shot stays the same, only where it's centered changes. The asymptotes are your new crosshairs.","big":"$y=\\f{a}{x-h}+k$ is $\\f{1}{x}$ stretched by $|a|$, flipped if $a<0$, moved right $h$ and up $k$. Its asymptotes are $x=h$ and $y=k$.","keys":[["Parent","f(x)=\\f{1}{x}:\\ \\ x=0,\\ y=0"],["Transformed","y=\\f{a}{x-h}+k"],["Asymptotes","x=h,\\ \\ y=k"],["Domain, range","x\\ne h,\\ \\ y\\ne k"],["Inside sign flips","x+3=x-(-3)\\Rightarrow h=-3"],["Divide first","\\f{-2x-2}{x+3}=\\f{4}{x+3}-2"]],"how":["Read $h$ from the denominator ($x+3$ means LEFT 3) and $k$ from the number added outside.","$|a|>1$ is a vertical stretch, $0<|a|<1$ a shrink, and $a<0$ reflects over the x-axis.","If it's one fraction like $\\f{-2x-2}{x+3}$, divide first to get $\\f{a}{x-h}+k$.","From a graph: read the asymptotes for $h$ and $k$, then plug in one point to find $a$."],"ex":[{"t":"Long division (Test review #5)","q":"$y=\\f{-2x-2}{x+3}$","s":[["\\f{-2x}{x}=-2","The quotient is $k$."],["-2(x+3)=-2x-6",""],["(-2x-2)-(-2x-6)=4","The remainder is $a$."],["y=\\f{4}{x+3}-2","Stretch 4, left 3, down 2."]],"a":"$y=\\f{4}{x+3}-2$"},{"t":"From a graph (Test review #10)","q":"Asymptotes $x=-1$ and $y=2$; the curve passes through $(0,5)$.","s":[["y=\\f{a}{x+1}+2","Asymptotes give $h=-1$, $k=2$."],["5=\\f{a}{0+1}+2","Plug in the point."],["a=3",""]],"a":"$y=\\f{3}{x+1}+2$"}],"traps":["$x+3$ in the denominator means LEFT 3, not right.","$a$ is a stretch, not an asymptote.","A vertical dilation of 2 multiplies by 2. Don't write $\\f{1}{2}$.","Factor a coefficient out first: $\\f{1}{2x-8}=\\f{\\f{1}{2}}{x-4}$, so right 4, not 8."]},{"k":"feat","t":"Key features & graphs","sh":"Test review #1, #2, #5–7, #11, #12","hook":"Reading a rational function is like reading a green. Holes are pitch marks: one tiny spot to repair. Asymptotes are the slopes the ball never gets past.","big":"Factor the top and bottom. A factor that cancels makes a HOLE. A factor left on the bottom makes a VERTICAL ASYMPTOTE. Compare degrees for the HORIZONTAL ASYMPTOTE.","keys":[["Domain","\\text{skip every zero of the ORIGINAL denominator}"],["Hole","\\text{cancelled }(x-c)\\Rightarrow(c,\\ \\text{simplified }f(c))"],["Vertical asymptote","\\text{zero left on the bottom after cancelling}"],["HA, bottom bigger","y=0"],["HA, same degree","y=\\f{\\text{lead top}}{\\text{lead bottom}}"],["HA, top bigger","\\text{none}"],["Intercepts","x\\text{: top}=0\\text{ (not a hole)};\\ \\ y\\text{: plug in }0"]],"how":["Factor the numerator and denominator completely.","Domain: exclude every zero of the ORIGINAL denominator.","Cancel. Each cancelled factor is a hole. Get its $y$ by plugging into the SIMPLIFIED function.","Zeros left in the denominator are vertical asymptotes.","Horizontal asymptote from the degree rule. Range skips it, and skips each hole's $y$ too.","End behavior: plug in a big $x$ to see whether $y$ approaches the HA from above ($^{+}$) or below ($^{-}$)."],"ex":[{"t":"Everything at once (Test review #7)","q":"$g(x)=\\f{4x+8}{x^2-4}$","s":[["\\f{4(x+2)}{(x+2)(x-2)}","Factor."],["x\\ne\\pm2","Domain from the original denominator."],["=\\f{4}{x-2}\\Rightarrow\\text{hole at }x=-2","$(x+2)$ cancelled."],["\\f{4}{-2-2}=-1\\Rightarrow(-2,-1)","Hole's $y$."],["\\text{VA }x=2,\\ \\ \\text{HA }y=0","Bottom degree is bigger."],["\\text{range }y\\ne0,\\ y\\ne-1","HA and the hole's $y$."]],"a":"Domain $x\\ne\\pm2$; range $y\\ne0,-1$; VA $x=2$; HA $y=0$; hole $(-2,-1)$"},{"t":"Hole + asymptotes","q":"$f(x)=\\f{2x^2-8}{x^2+x-6}$","s":[["\\f{2(x-2)(x+2)}{(x+3)(x-2)}","Factor."],["=\\f{2(x+2)}{x+3}","Cancel $(x-2)$: hole at $x=2$."],["\\f{2(4)}{5}=\\f{8}{5}","Hole $\\left(2,\\f{8}{5}\\right)$."],["\\text{VA }x=-3,\\ \\ \\text{HA }y=\\f{2}{1}=2","Same degree."]],"a":"Hole $\\left(2,\\f{8}{5}\\right)$; VA $x=-3$; HA $y=2$"}],"traps":["A cancelled factor is a hole, not an asymptote.","The hole's $y$ comes from the simplified function. It's almost never 0.","Range: the hole's $y$-value is missing too (#7: $y\\ne0,-1$).","Graphs CAN cross a horizontal asymptote, but never a vertical one."]},{"k":"fac","t":"Factoring toolkit","sh":"Used in every problem","hook":"Factoring is reading the lie before you pick a club. You can't cancel, find an LCD, or spot a restriction until everything is factored.","big":"Factor every numerator and denominator completely. Always pull out the GCF first, then look for a pattern.","keys":[["GCF first","9x^2+6x=3x(3x+2)"],["Difference of squares","a^2-b^2=(a-b)(a+b)"],["Perfect square","a^2\\pm2ab+b^2=(a\\pm b)^2"],["Trinomial","x^2+bx+c=(x+m)(x+n)\\ \\ \\text{where}\\ mn=c,\\ m+n=b"],["Cubes (SOAP)","a^3\\pm b^3=(a\\pm b)(a^2\\mp ab+b^2)"],["Opposites","b-a=-(a-b)"]],"how":["Pull out the GCF — the number AND the variable.","Count the terms: 2 → squares or cubes; 3 → trinomial or perfect square; 4 → grouping.","For $ax^2+bx+c$ with $a\\ne1$, use the ac-method: split $b$ using factors of $ac$.","Keep going until nothing factors further, then FOIL-check."],"ex":[{"t":"ac-method (used in Sheet #2 and #5)","q":"$6x^2-x-2$","s":[["6\\cdot(-2)=-12","Find two numbers: product $-12$, sum $-1$ → $-4$ and $3$."],["6x^2-4x+3x-2","Split the middle term."],["2x(3x-2)+1(3x-2)","Group in pairs and factor each."],["(3x-2)(2x+1)","Pull out the common binomial."]],"a":"$(3x-2)(2x+1)$"}],"traps":["Stopping early: $2(x^2-9)$ isn't done — it's $2(x-3)(x+3)$.","$x^2+4$ does not factor (it's a sum of squares).","$(x-7)^2\\ne x^2-49$ — a squared binomial has a middle term.","$x-3$ and $3-x$ are opposites: $\\f{3-x}{x-3}=-1$."]},{"k":"simp","t":"Simplify & domain","sh":"Lesson 4.3 · Sheet #1, #2","hook":"Out-of-bounds stakes go in before anyone tees off. Restrictions come from the ORIGINAL denominator — set them before you cancel.","big":"A rational expression is undefined wherever its denominator is 0. Simplify by canceling common factors; the restrictions stay even after a factor is gone.","keys":[["Canceled factor","\\text{hole (still excluded)}"],["Remaining factor","\\text{vertical asymptote (excluded)}"],["Opposites","\\f{a-b}{b-a}=-1"]],"how":["Factor the numerator and the denominator completely.","Set each denominator factor $\\ne0$. These are the restrictions.","Cancel common FACTORS — never terms.","Write the simplified form with every restriction."],"ex":[{"t":"Sheet #1","q":"$y=\\f{x^2-49}{x^2+14x+49}$","s":[["\\f{(x-7)(x+7)}{(x+7)^2}","Factor: difference of squares on top, perfect square on the bottom."],["(x+7)^2=0\\Rightarrow x=-7","Find the restriction from the ORIGINAL denominator first."],["\\f{x-7}{x+7}","Cancel one common factor $(x+7)$."]],"a":"$y=\\f{x-7}{x+7}$; domain: all real numbers except $x=-7$"},{"t":"Sheet #2","q":"$y=\\f{4x^2-1}{6x^2-x-2}$","s":[["\\f{(2x-1)(2x+1)}{(3x-2)(2x+1)}","Top: difference of squares. Bottom: ac-method, $ac=-12\\to-4,\\ 3$."],["x\\ne\\f23,\\ \\ x\\ne-\\f12","Both bottom factors give restrictions."],["\\f{2x-1}{3x-2}","Cancel $(2x+1)$."]],"a":"$y=\\f{2x-1}{3x-2}$; domain: $x\\ne-\\f12,\\ \\f23$"}],"traps":["Cancel factors, not terms: $\\f{x+6}{x+3}\\ne2$.","A zero numerator is fine — don't exclude $x=7$ in Sheet #1.","A canceled factor still counts: in Sheet #2, $x\\ne-\\f12$ stays.","Opposites cancel to $-1$: $\\f{4-x}{x-4}=-1$."]},{"k":"md","t":"Multiply & divide","sh":"Lesson 4.3 · Sheet #5","hook":"Dividing is reading the putt from the other side: flip the second fraction and it plays exactly like multiplication.","big":"Multiply: factor, cancel across, multiply what's left. Divide: flip the divisor, then multiply.","keys":[["Multiply","\\f ab\\cdot\\f cd=\\f{ac}{bd}"],["Divide","\\f ab\\div\\f cd=\\f ab\\cdot\\f dc"],["Restrictions","b,\\ c,\\ d\\ne0"]],"how":["Factor every numerator and denominator.","List restrictions: every denominator — and when dividing, the divisor's numerator too.","Division: keep the first fraction, change ÷ to ×, flip the second.","Cancel common factors (any top with any bottom).","Multiply what's left and restate the restrictions."],"ex":[{"t":"Sheet #5","q":"$\\f{9x^2+6x}{2x-1}\\div\\f{6x^2+x-2}{4x^2-4x+1}$","s":[["\\f{3x(3x+2)}{2x-1}\\div\\f{(3x+2)(2x-1)}{(2x-1)^2}","Factor everything."],["x\\ne\\f12,\\ \\ x\\ne-\\f23","Denominators give $\\f12$; the divisor's numerator gives $-\\f23$ (and $\\f12$)."],["\\f{3x(3x+2)}{2x-1}\\cdot\\f{(2x-1)^2}{(3x+2)(2x-1)}","Flip the divisor."],["3x","Everything else cancels."]],"a":"$3x$, $x\\ne-\\f23,\\ \\f12$"}],"traps":["Flip the SECOND fraction only.","When dividing, the divisor's numerator can't be 0 (Sheet #5: $x\\ne-\\f23$).","Don't multiply polynomials out before canceling — you'll lose the factors.","Watch for opposites like $(5-x)$ and $(x-5)$ → $-1$."]},{"k":"as","t":"Add & subtract","sh":"Lesson 4.4 · Sheet #3, #4","hook":"You can't add yardages measured to different pins. Get a common denominator first — same pin, then add.","big":"Rewrite each fraction over the LCD, combine the numerators, then simplify.","keys":[["Same denominator","\\f ac+\\f bc=\\f{a+b}{c}"],["Different","\\f ab+\\f cd=\\f{ad+bc}{bd}"],["Opposite denominators","\\f{k}{4-x}=-\\f{k}{x-4}"]],"how":["Factor each denominator.","LCD = every factor that appears, at its highest power.","Build up each fraction: multiply top and bottom by its missing factors.","Combine numerators over the LCD. Put a subtracted numerator in parentheses.","Simplify: factor the numerator, cancel, state the restrictions."],"ex":[{"t":"Sheet #3","q":"$\\f{3w}{w^2-16}+\\f{2}{2w-8}$","s":[["\\f{3w}{(w-4)(w+4)}+\\f{2}{2(w-4)}","Factor both denominators. Restrictions: $w\\ne\\pm4$."],["\\f{2}{2(w-4)}=\\f{1}{w-4}","Reduce the second fraction."],["\\f{3w}{(w-4)(w+4)}+\\f{w+4}{(w-4)(w+4)}","Build up to the LCD $(w-4)(w+4)$."],["\\f{4w+4}{(w-4)(w+4)}=\\f{4(w+1)}{(w-4)(w+4)}","Combine; factor the numerator — nothing cancels."]],"a":"$\\f{4(w+1)}{w^2-16}$, $w\\ne\\pm4$"},{"t":"Sheet #4","q":"$-\\f{2}{n+4}-\\f{n^2}{n^2-16}$","s":[["-\\f{2}{n+4}-\\f{n^2}{(n+4)(n-4)}","Factor. LCD $(n+4)(n-4)$; restrictions $n\\ne\\pm4$."],["\\f{-2(n-4)-n^2}{(n+4)(n-4)}","Build up the first fraction by $(n-4)$."],["\\f{-n^2-2n+8}{(n+4)(n-4)}","Distribute: $-2n+8-n^2$."],["\\f{-(n+4)(n-2)}{(n+4)(n-4)}","Factor out $-1$: $n^2+2n-8=(n+4)(n-2)$."],["-\\f{n-2}{n-4}","Cancel $(n+4)$ — but keep $n\\ne-4$."]],"a":"$-\\f{n-2}{n-4}$ $\\left(\\text{or }\\f{2-n}{n-4}\\right)$, $n\\ne\\pm4$"}],"traps":["Never add denominators: $\\f ab+\\f cd\\ne\\f{a+c}{b+d}$.","Distribute the minus to every term: $-(x-1)=-x+1$.","Opposite denominators: $\\f{12}{4-x}=-\\f{12}{x-4}$.","Factor the final numerator — it often cancels (Sheet #4)."]},{"k":"cf","t":"Complex fractions","sh":"Lesson 4.4 · Sheet #6, #11","hook":"A two-tier green: play each tier separately, or clear both tiers in one stroke — multiply by the LCD.","big":"A complex fraction has fractions inside its numerator or denominator. Clear them by multiplying the top and bottom by the LCD of every small fraction.","keys":[["One-stroke method","\\f{\\f ab+\\f cd}{\\f ef}=\\f{adf+bcf}{bde}"],["Resistors","\\f{1}{\\f1a+\\f1b}=\\f{ab}{a+b}"]],"how":["Find the LCD of every small denominator.","Multiply EVERY term on the top and bottom by it.","Simplify the single fraction that's left (factor, cancel).","Restrictions: the small denominators, plus anything that makes the big denominator 0."],"ex":[{"t":"Sheet #6","q":"$\\f{\\f12-\\f{x+5}{4}}{\\f{x^2}{2}-\\f52}$","s":[["\\f{4\\cdot\\f12-4\\cdot\\f{x+5}{4}}{4\\cdot\\f{x^2}{2}-4\\cdot\\f52}","Multiply top and bottom by the LCD, 4."],["\\f{2-(x+5)}{2x^2-10}=\\f{-x-3}{2x^2-10}","Keep $(x+5)$ in parentheses."],["-\\f{x+3}{2(x^2-5)}","Factor; nothing cancels."],["x^2-5\\ne0\\Rightarrow x\\ne\\pm\\sqrt5","Restriction from the big denominator."]],"a":"$-\\f{x+3}{2(x^2-5)}$, $x\\ne\\pm\\sqrt5$"},{"t":"Sheet #11","q":"$R=\\f{1}{\\f1n+\\f{1}{n+1}}$","s":[["\\f1n+\\f{1}{n+1}=\\f{(n+1)+n}{n(n+1)}=\\f{2n+1}{n(n+1)}","Combine the bottom."],["R=\\f{n(n+1)}{2n+1}=\\f{n^2+n}{2n+1}","1 divided by a fraction = its reciprocal."],["n\\ne0,\\ \\ n\\ne-1,\\ \\ n\\ne-\\f12","From $r_1$, $r_2$, and the big denominator. (Physically, $n>0$.)"]],"a":"$R=\\f{n(n+1)}{2n+1}$; domain: $n\\ne-1,\\ -\\f12,\\ 0$"}],"traps":["Multiply every term, including whole numbers like 1.","Keep $-(x+5)$ in parentheses (Sheet #6).","Don't forget the big denominator's restriction: $x^2-5\\ne0$.","$\\f{1}{\\f1a+\\f1b}\\ne a+b$."]},{"k":"solve","t":"Solving equations","sh":"Lesson 4.5 · Sheet #7, #8, #9","hook":"A provisional ball: you play it, but it only counts if it's in bounds. Every answer has to be checked against the restrictions.","big":"Multiply both sides by the LCD to clear the fractions, solve, then throw out any answer that makes an original denominator 0 (extraneous).","keys":[["Clear fractions","\\text{LCD}\\times\\text{every term}"],["Contradiction","1=0\\Rightarrow\\text{no solution}"],["Identity","0=0\\Rightarrow\\text{all allowed }x"]],"how":["Factor the denominators and list the restrictions.","Multiply EVERY term on both sides by the LCD.","Solve the resulting polynomial equation (linear or quadratic).","Reject any answer that's a restriction — it's extraneous.","If nothing survives, the answer is \"no solution.\""],"ex":[{"t":"Sheet #7","q":"$x+\\f{2}{x-3}=\\f{x-1}{3-x}$","s":[["x\\ne3;\\ \\ \\f{x-1}{3-x}=-\\f{x-1}{x-3}","Restriction; rewrite the opposite denominator."],["x(x-3)+2=-(x-1)","Multiply EVERY term by $(x-3)$."],["x^2-3x+2=-x+1\\Rightarrow x^2-2x+1=0",""],["(x-1)^2=0\\Rightarrow x=1","$1\\ne3$ ✓. Check: $1+\\f{2}{-2}=0$ and $\\f{0}{2}=0$."]],"a":"$x=1$"},{"t":"Sheet #8","q":"$\\f{1}{x+5}+\\f{1}{x-5}=\\f{10}{x^2-25}$","s":[["x\\ne\\pm5","$x^2-25=(x+5)(x-5)$ is the LCD."],["(x-5)+(x+5)=10","Multiply every term by the LCD."],["2x=10\\Rightarrow x=5",""],["x=5\\ \\text{is excluded}","Extraneous."]],"a":"No solution"},{"t":"Sheet #9","q":"$\\f{x+3}{x-5}+\\f{2x^2+6}{x^2-7x+10}=\\f{3x}{x-2}$","s":[["x^2-7x+10=(x-5)(x-2);\\ \\ x\\ne5,\\ 2","LCD: $(x-5)(x-2)$."],["(x+3)(x-2)+2x^2+6=3x(x-5)","Multiply every term by the LCD."],["x^2+x-6+2x^2+6=3x^2-15x",""],["3x^2+x=3x^2-15x\\Rightarrow16x=0\\Rightarrow x=0","$0$ isn't excluded. Check: $-\\f35+\\f{6}{10}=0=\\f{0}{-2}$ ✓"]],"a":"$x=0$"}],"traps":["Multiply every term — including lone terms like $x$ or $3$.","Rewrite opposites first: $\\f{x-1}{3-x}=-\\f{x-1}{x-3}$.","Always check: Sheet #8's only candidate is extraneous.","\"No solution\" is a real, full-credit answer."]},{"k":"sys","t":"Systems","sh":"Lesson 4.5 · Sheet #10","hook":"Two players' lines cross where both balls land on the same spot. Set the two expressions equal.","big":"Set the two expressions for $y$ equal, solve for $x$, throw out restrictions, then find $y$.","keys":[["Equal denominators","\\f{A}{D}=\\f{B}{D}\\Rightarrow A=B,\\ D\\ne0"]],"how":["Set the right-hand sides equal.","Clear the fractions and solve for $x$.","Exclude any $x$ that makes a denominator 0.","Substitute each surviving $x$ to find $y$.","Answer with ordered pairs."],"ex":[{"t":"Sheet #10","q":"$y=\\f{9}{x+3}$ and $y=\\f{x^2}{x+3}$","s":[["\\f{9}{x+3}=\\f{x^2}{x+3},\\ \\ x\\ne-3","Set the two expressions equal."],["x^2=9\\Rightarrow x=\\pm3",""],["x=-3\\ \\text{excluded}","Extraneous."],["x=3\\Rightarrow y=\\f{9}{6}=\\f32","Find $y$."]],"a":"$\\left(3,\\ \\f32\\right)$"}],"traps":["Don't stop at $x$ — give $(x,y)$.","$x=-3$ in Sheet #10 is excluded, so there's no point there.","Equal denominators → set numerators equal, but keep the restriction.","A hole is not an intersection point."]},{"k":"word","t":"Word problems","sh":"Lesson 4.5 · Sheet #11, #12","hook":"Team scramble: everyone's work adds up. Rates add — times don't.","big":"Rate = 1 job ÷ time, and rates add. The same shape gives parallel resistors.","keys":[["Work","\\f{1}{t_1}+\\f{1}{t_2}+\\cdots=\\f{1}{T}"],["Parallel resistors","\\f1R=\\f{1}{r_1}+\\f{1}{r_2}"],["Distance–rate–time","t=\\f{d}{r}"],["Twice as fast","\\text{half the time, double the rate}"]],"how":["Let the unknown be the time you're asked about.","Write everyone else's time in terms of it.","Rate = 1 ÷ time. Add the rates and set equal to 1 ÷ (time together).","Clear the fractions and solve — often a quadratic.","Reject answers that make any time 0 or negative, and answer the question asked."],"ex":[{"t":"Sheet #12","q":"\\text{Larry}=L,\\ \\ \\text{Carrie}=L-5,\\ \\ \\text{Barry}=\\f{L-5}{2}","s":[["\\f1L+\\f{1}{L-5}+\\f{2}{L-5}=1","Barry is twice as fast, so his rate is double Carrie's. Rates add to 1 job per hour."],["\\f1L+\\f{3}{L-5}=1\\Rightarrow(L-5)+3L=L(L-5)","Multiply by $L(L-5)$."],["L^2-9L+5=0",""],["L=\\f{9\\pm\\sqrt{61}}{2}\\approx8.41\\ \\text{or}\\ 0.59","Quadratic formula."],["L\\approx8.41\\ \\text{h}","Reject 0.59: Carrie's time $L-5$ would be negative."]],"a":"Larry: $\\f{9+\\sqrt{61}}{2}\\approx8.41$ hours (about 8 h 24 min)"}],"traps":["\"Twice as fast\" = half the time = double the rate.","Add rates, not times.","Reject roots that make anyone's time negative.","Answer for the right person (Larry, not Carrie)."]}],"checklist":["Factor everything first.","Restrictions come from the ORIGINAL denominators — plus the divisor's numerator when dividing.","Cancel factors, never terms.","Opposites cancel to $-1$: $\\f{a-b}{b-a}=-1$.","Subtracting? Put the second numerator in parentheses.","Solving? Multiply EVERY term by the LCD.","Check each answer against the restrictions — \"no solution\" is allowed.","Work problems: rates add, times don't.","Holes come from factors that cancel; vertical asymptotes from what's left on the bottom.","Inverse variation: $k=xy$, not $\\f{y}{x}$."]};

/* ---------- math renderer: \f{a}{b}, ^, _, \ne, \pm, \sqrt, \text, \left( \right) ---------- */
const SYMS={ne:'≠',pm:'±',mp:'∓',cdot:'·',div:'÷',times:'×',le:'≤',ge:'≥',approx:'≈',Rightarrow:'⇒',to:'→',ldots:'…',cdots:'⋯',infty:'∞'};
const RELS='=≠≤≥≈⇒→<>',BINS='+−±∓·÷×';
function tex(src){
  let i=0,prev=false;const n=src.length;
  const atEnd=e=>e==='}'?src[i]==='}':e==='R'?src.startsWith('\\right',i):false;
  function seq(e){let h='';const s=prev;prev=false;while(i<n&&!atEnd(e))h+=atom();prev=s;return h}
  function grp(){while(src[i]===' ')i++;if(src[i]==='{'){i++;const h=seq('}');i++;return h}if(src[i]==='\\'){const s=prev;const h=atom();prev=s;return h}const c=src[i++]||'';return /[A-Za-z]/.test(c)?'<i>'+c+'</i>':c==='-'?'−':esc(c)}
  function op(s){const cls=RELS.includes(s)?'rel':BINS.includes(s)?(prev?'bin':'un'):'un';prev=false;return '<span class="'+cls+'">'+s+'</span>'}
  function atom(){
    const c=src[i];
    if(c===' '){i++;return ''}
    if(c==='\\'){
      i++;const d=src[i];
      if(d===','||d===';'||d===' '||d==='!'){i++;return d==='!'?'':'<span class="s'+(d===','?1:2)+'"></span>'}
      let j=i;while(j<n&&/[A-Za-z]/.test(src[j]))j++;
      const cmd=src.slice(i,j);i=j;
      if(cmd==='f'||cmd==='frac'){const a=grp(),b=grp();prev=true;return '<span class="fr"><span class="nu">'+a+'</span><span class="de">'+b+'</span></span>'}
      if(cmd==='sqrt'){const a=grp();prev=true;return '<span class="sq">√<span class="sqa">'+a+'</span></span>'}
      if(cmd==='text'){while(src[i]===' ')i++;const s0=i+1;let dep=1;i++;while(i<n&&dep){if(src[i]==='{')dep++;else if(src[i]==='}')dep--;i++}prev=true;return '<span class="tx">'+esc(src.slice(s0,i-1))+'</span>'}
      if(cmd==='left'){const o=src[i++];const inner=seq('R');i+=6;const cl=src[i++]||'';prev=true;return inner.includes('class="fr"')?'<span class="lr"><span class="dl">'+o+'</span>'+inner+'<span class="dl">'+cl+'</span></span>':o+inner+cl}
      if(cmd==='quad')return '<span class="s3"></span>';
      if(SYMS[cmd])return op(SYMS[cmd]);
      prev=true;return '<span class="tx">'+esc(cmd)+'</span>';
    }
    if(c==='^'||c==='_'){i++;const a=grp();prev=true;return c==='^'?'<sup>'+a+'</sup>':'<sub>'+a+'</sub>'}
    if(c==='{'){i++;const h=seq('}');i++;prev=true;return h}
    i++;
    if(c==='-')return op('−');
    if('+=<>'.includes(c))return op(c);
    if(c===','||c===';'){prev=false;return c+'<span class="s2"></span>'}
    if(c==='('||c==='['){prev=false;return c}
    if(c===')'||c===']'){prev=true;return c}
    if(/[A-Za-z]/.test(c)){prev=true;return '<i>'+c+'</i>'}
    prev=true;return esc(c);
  }
  let h='<span class="nb">';prev=false;
  while(i<n){const a=atom();h+=a;if(a.indexOf('<span class="rel">')===0||a.charAt(0)===',')h+='</span><wbr><span class="nb">'}
  return h+'</span>';
}
const R=s=>s?String(s).split('$').map((p,k)=>k%2?'<span class="m">'+tex(p)+'</span>':p).join(''):'';
const disp=s=>s.includes('$')?R(s):'<span class="m">'+tex(s)+'</span>';

/* ---------- graphs: y=a/(x-h)+k, with open circles for holes and dots for marked points ---------- */
let GID=0;
function graphSVG(g){
  const W=8,S=320,u=S/(2*W),X=v=>((v+W)*u).toFixed(1),Y=v=>((W-v)*u).toFixed(1),f=v=>g.a/(v-g.h)+g.k,id='gc'+(++GID);
  let s='<svg class="gph" viewBox="-14 -6 '+(S+20)+' '+(S+20)+'" role="img" aria-label="Graph of a rational function. Dashed lines are asymptotes; an open circle is a hole."><defs><clipPath id="'+id+'"><rect x="0" y="0" width="'+S+'" height="'+S+'"/></clipPath></defs>';
  for(let i=-W;i<=W;i++)s+='<line class="gg" x1="'+X(i)+'" y1="0" x2="'+X(i)+'" y2="'+S+'"/><line class="gg" x1="0" y1="'+Y(i)+'" x2="'+S+'" y2="'+Y(i)+'"/>';
  s+='<line class="ga" x1="0" y1="'+Y(0)+'" x2="'+S+'" y2="'+Y(0)+'"/><line class="ga" x1="'+X(0)+'" y1="0" x2="'+X(0)+'" y2="'+S+'"/>';
  for(let i=-W+2;i<W;i+=2){if(!i)continue;const t=i<0?'−'+(-i):String(i);s+='<text class="gt" x="'+X(i)+'" y="'+(+Y(0)+11)+'">'+t+'</text><text class="gt ge" x="'+(+X(0)-4)+'" y="'+(+Y(i)+3.5)+'">'+t+'</text>'}
  s+='<text class="gt gl" x="'+(S-4)+'" y="'+(+Y(0)-5)+'">x</text><text class="gt gl" x="'+(+X(0)+8)+'" y="10">y</text>';
  s+='<g clip-path="url(#'+id+')"><line class="gas" x1="'+X(g.h)+'" y1="0" x2="'+X(g.h)+'" y2="'+S+'"/><line class="gas" x1="0" y1="'+Y(g.k)+'" x2="'+S+'" y2="'+Y(g.k)+'"/>';
  const lo=Math.log(Math.abs(g.a)/(3*W)),hi=Math.log(2*W+Math.abs(g.h)+2);
  [-1,1].forEach(sg=>{let d='';for(let j=0;j<=240;j++){const xv=g.h+sg*Math.exp(lo+(hi-lo)*j/240);d+=(j?'L':'M')+X(xv)+' '+Y(f(xv))}s+='<path class="gcv" d="'+d+'"/>'});
  s+='</g>';
  (g.p||[]).forEach(p=>{s+='<circle class="gd" cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3.8"/>'});
  (g.o||[]).forEach(h=>{s+='<circle class="gh" cx="'+X(h)+'" cy="'+Y(f(h))+'" r="4.4"/>'});
  return s+'</svg>';
}

function sayMath(s){
  let t=s;
  for(let k=0;k<6;k++)t=t.replace(/\\f\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,' $1, over $2, ').replace(/\\f(\w)(\w)/g,' $1 over $2 ').replace(/\\sqrt\{([^{}]*)\}/g,' root $1 ').replace(/\\text\{([^{}]*)\}/g,' $1 ').replace(/\^\{([^{}]*)\}/g,' to the $1 ');
  t=t.replace(/\^2/g,' squared ').replace(/\^3/g,' cubed ').replace(/\^(\w)/g,' to the $1 ').replace(/\\ne/g,' is not ').replace(/\\pm/g,' plus or minus ').replace(/\\cdot|\\times/g,' times ').replace(/\\div/g,' divided by ').replace(/\\Rightarrow/g,', so ').replace(/\\approx/g,' about ').replace(/\\to/g,' to ').replace(/\\left|\\right/g,'').replace(/\\[a-zA-Z]+/g,' ').replace(/\\./g,' ');
  return t.replace(/-/g,' minus ').replace(/\+/g,' plus ').replace(/=/g,' equals ').replace(/[(){}\[\]]/g,' ').replace(/\s+/g,' ');
}
const sayText=s=>String(s).split('$').map((p,k)=>k%2?sayMath(p):p.replace(/<[^>]+>/g,'')).join('');
function speakLesson(k){
  const l=LES[k];const parts=[l.t+'.',l.hook,l.big,'Method.'].concat(l.how.map((h,i)=>'Step '+(i+1)+'. '+h));
  l.ex.forEach(e=>{parts.push('Example. '+e.q);e.s.forEach(s=>{parts.push('$'+s[0]+'$');if(s[1])parts.push(s[1])});parts.push('Answer: '+e.a)});
  parts.push('Traps.');l.traps.forEach(t=>parts.push(t));
  try{const ss=window.speechSynthesis;ss.cancel();parts.forEach(p=>{const u=new SpeechSynthesisUtterance(sayText(p));u.rate=.95;u.lang='en-US';ss.speak(u)})}catch(e){toast('Voice is not available here.')}
}

  step:t=>{const c=t.closest('.ex'),h=c.querySelector('.st[hidden]');if(h)h.hidden=false;const all=c.querySelectorAll('.st').length,lf=c.querySelectorAll('.st[hidden]').length;if(!lf){c.querySelector('.ans').hidden=false;c.querySelectorAll('[data-a=step],[data-a=allsteps]').forEach(b=>b.hidden=true)}else t.textContent='Show step '+(all-lf+1)+' of '+all},
  allsteps:t=>{const c=t.closest('.ex');c.querySelectorAll('.st').forEach(s=>s.hidden=false);c.querySelector('.ans').hidden=false;c.querySelectorAll('[data-a=step],[data-a=allsteps]').forEach(b=>b.hidden=true)},
  got:t=>{const n=t.dataset.n;if(ST.sh[n])delete ST.sh[n];else ST.sh[n]=1;save();const on=!!ST.sh[n];t.classList.toggle('gotit',on);t.setAttribute('aria-pressed',on);t.innerHTML=ic('check')+(on?'Got it':'I can do this');const gb=document.querySelector('.gotbar');if(gb)gb.innerHTML=gotHTML()},
  pchip:t=>{const p=poOpts(),k=t.dataset.k;if(k==='all')p.sk=[];else{const i=p.sk.indexOf(k);if(i>=0)p.sk.splice(i,1);else p.sk.push(k);if(p.sk.length===D.skills.length)p.sk=[]}save();vPractice()},
  pseg:t=>{const p=poOpts();p[t.dataset.n]=+t.dataset.v;save();vPractice()},
  pstart:()=>{const p=poOpts(),pool=poolFor(p);if(pool.length)startPractice(smartPick(pool,p.n))},
  pmissed:()=>startPractice(shuf(D.qs.filter(q=>ST.q[q.id]&&!ST.q[q.id].l))),
  pskill:t=>startPractice(smartPick(BYSK[t.dataset.k],10)),
  resume:()=>{quietHash('practice');vQ()},
  hint:t=>{const h=main.querySelector('.hint');if(h)h.hidden=!h.hidden},
  pnext:()=>{PS.i++;if(PS.i>=PS.list.length){PS.done=true;vPEnd()}else{vQ();window.scrollTo(0,0)}},
  pend:()=>{if(!Object.keys(PS.ans).length){PS=null;go('practice')}else{PS.done=true;vPEnd()}},
  predo:()=>startPractice(shuf((PS.missIds||[]).map(id=>QID[id]))),
  choose:t=>{const ci=+t.dataset.ci;
    if(curView==='prac'&&PS){const q=QID[PS.list[PS.i]];if(PS.ans[q.id]!==undefined)return;PS.ans[q.id]=ci;if(ci===0)PS.right++;record(q,ci===0);vQ()}
    else if(curView==='test'&&TS&&!TS.done){TS.ans[TS.list[TS.i]]=ci;vTest()}
    else if(curView==='speed')spChoose(ci)},
  tstart:()=>{quietHash('test');startTest();window.scrollTo(0,0)},
  tresume:()=>vTest(),
  tprev:()=>{if(TS.i>0){TS.i--;vTest()}},
  tnext:()=>{if(TS.i+1<TS.list.length){TS.i++;vTest()}else askSubmit()},
  tgo:t=>{TS.i=+t.dataset.i;vTest()},
  tflag:()=>{const id=TS.list[TS.i];TS.flag[id]=!TS.flag[id];vTest()},
  tsubmit:()=>askSubmit(),
  sfocus:t=>{ST.po.sf=t.dataset.k;save();vSpeed()},
  sstart:t=>{quietHash('speed');startSpeed(t.dataset.m);window.scrollTo(0,0)},
  sstop:()=>{if(SS&&SS.n)endSpeed();else{SS=null;go('speed')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=ACT[t.dataset.a];if(f){e.preventDefault();f(t)}});
addEventListener('keydown',e=>{
  if(modal.innerHTML){if(e.key==='Escape')ACT.mcancel();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();let i='1234'.indexOf(k);if(i<0&&k.length===1)i='abcd'.indexOf(k);
  if(k.length===1&&i>=0){const b=main.querySelectorAll('.choices .ch')[i];if(b&&!b.disabled&&b.dataset.a==='choose'){e.preventDefault();b.click()}return}
  if(k==='enter'){const n=main.querySelector('[data-a=pnext]');if(n){e.preventDefault();n.click()}}
  if(curView==='test'){if(k==='arrowright')ACT.tnext();if(k==='arrowleft')ACT.tprev()}
});
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude/i.test(location.hostname)){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{SWOK=true;const o=document.getElementById('offl');if(o)o.textContent=offText()}).catch(()=>{})}}catch(e){}
route(true);
}
